statement:
  informal: |
    ★ 观点提出者: 用户 (2026-08-13)。回顾之前证明, 用 R184 逻辑补全.

    ★ 唯一论点: R170/R172 的对称对基点只声明对称性, 未证基点唯一
       性 — R184 逻辑 (预言正确基点/召唤/定位错误基点) 补全:
       对称方程唯一解 ⟹ 正确基点唯一 ⟹ 无错误基点.

    ★ 回补内容:
       - R172 孪生对: 命题 P(b): b 是孪生对 (p, p+2) 的对称基点
         ((p+2)-b = -(p-b)). 预言正确基点: b = p+1 (中点). 定位
         错误基点: 对称方程 2b = 2p+2 唯一解 b = p+1 — 无错误基点.
         召唤: 中点对称 (R172 twin_pair_symmetric).
       - R170 哥德巴赫: 中心 n 满足 q-n = -(p-n) ⟺ 2n = p+q ⟺
         n = (p+q)/2 唯一 (center_fixed 已有; 补全唯一性).

    ★ 结论: R184 证明逻辑过程 (预言正确基点/召唤/定位错误基点) 可
       回补早期证明 — 对称对观测的基点唯一性.

  formal_math: |
    -- ★对称基点唯一 (预言+定位):
    theorem symmetric_basepoint_unique (p b : ℝ) :
      (p + 2) - b = -(p - b) ↔ b = p + 1
    -- 召唤正确基点 (中点对称):
    theorem symmetric_basepoint_summoned (p : ℝ) :
      (p + 2) - (p + 1) = -(p - (p + 1))
    -- ★哥德巴赫中心唯一:
    theorem goldbach_center_unique (p q n : ℝ) :
      q - n = -(p - n) ↔ 2 * n = p + q
    -- 全景:
    theorem basepoint_retrofit_perspective (p b : ℝ) :
      ((p + 2) - b = -(p - b) ↔ b = p + 1) ∧
      ((p + 2) - (p + 1) = -(p - (p + 1)))

