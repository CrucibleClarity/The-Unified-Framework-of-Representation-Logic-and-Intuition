statement:
  informal: |
    ★ 观点提出者: 用户 (2026-08-12)。基点0→1 路径不可数 ⟹ pat n 不可准确定义。

    ★ 洞察 (验证):
      ① 基点0 到基点1 的路径 = 相位差序列 {Δ₁, Δ₂, ...}
         单步 Δ 任意实数 (R130: 方向不可判定, 三趋势相容)
      ② 路径空间 = 相位差序列集 (不可数)
      ③ 无数路径 ⟹ 无数相位到达值 ⟹ 相位叠加
      ④ pat n 的相位 = 无数路径相位叠加 (模糊)
      ⑤ ⟹ 无法准确定义 pat n (相位不确定)

    ★ 验证结果:
      路径基数: 相位差序列集不可数 (每步 Δ 任意实数)
      相位叠加: 100 随机路径 → 100 不同相位 (全叠加)

    ★ 与既有 claim 的关系:
      - R130 (方向不可判定): 单步 Δ 任意 ⟹ 路径不可数
      - R124 (等价跳转): p1 = 跳转箭头 (路径的端点)
      - R122 (全坍缩): 无数路径汇聚?
      - R072 (声明): pat n 不可定义的声明化
      结论: 基点0→1 路径不可数 (相位差序列集), 无数路径 ⟹ 相位叠加
      ⟹ pat n 无法准确定义 (与 R130 呼应)。

  formal_math: |
    -- 路径 = 相位差序列 (每步 Δ ∈ ℝ)
    -- 路径空间 = 相位差序列集 (不可数)
    -- 相位叠加: 无数路径 ⟹ 无数相位
    -- pat n 相位模糊 ⟹ 不可准确定义

