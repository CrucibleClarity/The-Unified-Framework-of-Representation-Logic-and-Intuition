statement:
  informal: |
    ★ 观点提出者: 用户 (2026-08-12)。R118 的纠正: 互逆方法 vs 外部逆运算。

    ★ 纠正 (R118 错误):
      R118 引入 leftInv (外部逆运算) — 新方向/新对称性
      用户: inverse 完不一定回到基点 0!
      正确: 互逆方法 — 结构自身的互逆 (无外部算符)

    ★ 互逆构造 (验证):
      swapSlots (槽位互换) = app 结构的固有对称性 (非新算符)
      app(p0,p0) 参数重合 ⟹ 槽位互换不变:
        swapSlots(app(p0,p0)) = app(p0,p0) (自逆!)
      自应用 = 自逆结构 (互逆内部化)
      唯一参数 p0 ⟹ 互逆锚定在基点

    ★ 核心定理 (Lean 验收, SelfInverseBasepoint.lean, 无 sorry):
      ① swap_slots_self_app: 槽位互换自应用不变
      ② self_app_self_inverse: 自应用 = 自逆 (内部互逆)
      ③ reciprocity_anchored_basepoint: 互逆锚定基点 (双槽都 p0)
      ④ self_app_reciprocity_general: 一般自应用互逆 (参数重合)
      ⑤ reciprocity_internal: 互逆是结构固有 (非外部算符)

    ★ 与既有 claim 的关系:
      - R118 (奇异性-基点): 本 claim 纠正其 leftInv 错误
      - R113 (自应用构造): p1 = app(p0,p0)
      - R117 (相位重合): 基点 = 汇聚点
      - R072 (声明): 互逆方法的声明化
      结论: 返回基点 0 靠结构自身互逆 (槽位互换自逆), 非外部
      逆运算; 自应用参数重合 ⟹ 自逆 ⟹ 锚定基点。

    ★ 支撑 (Lean):
      - SelfInverseBasepoint.lean (5 定理, 0 sorry)
  formal_math: |
    -- 互逆: swapSlots(app a b) = app b a (结构固有)
    -- 自逆: swapSlots(app p0 p0) = app p0 p0 (参数重合)
    -- 锚定: 唯一参数 p0 ⟹ 互逆回到基点 (无外部逆)

