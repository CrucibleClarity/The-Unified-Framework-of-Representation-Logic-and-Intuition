statement:
  informal: |
    ★ 观点提出者: 用户 (2026-08-12)。投影源卡特兰计数。

    ★ 投影源计数 (验证):
      单相位 k 的投影源 = p_{k+1} 的全部自应用配对形式 (卡特兰 C_{k+1})
      单相位 0 (p1): C₁ = 1 个
      单相位 1 (p2): C₂ = 2 个 (p0(p0(p0)), (p0(p0))(p0))
      单相位 2 (p3): C₃ = 5 个 (全部配对)

    ★ 自然数 k ↔ 单相位 k 的变换:
      = p_{k+1} 的配对坍缩 (结合律下全部配对 = 同一规范形)
      可构造可定义 (卡特兰配对 + 结合律坍缩)

    ★ 下一步问题 (用户): 从任意 pat n 通过单相位逆运算返回基点 0?

    ★ 与既有 claim 的关系:
      - R113 (自应用构造): p 结构
      - R114 (p3 配对): 卡特兰配对
      - R067 (能指/所指): 多投影源
      - R072 (声明): 投影源计数声明化
      结论: 投影源数 = C_{k+1}; 变换 = 配对坍缩 (可构造)。

  formal_math: |
    -- 投影源: monophase k ← C_{k+1} 个配对 (卡特兰)
    -- 变换: 配对坍缩 (结合律)

