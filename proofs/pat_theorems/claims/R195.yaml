statement:
  informal: |
    ★ 观点提出者: 用户 (2026-08-13)。视角切换机制 + 元分析 (视角 =
       数学结构的轴?).

    ★ 唯一论点: 视角 = 数学结构的轴 — 同一对象在 6 视角轴有 6 坐标
       (投影), 对象身份跨轴保持, 视角切换 = 沿轴移动.

    ★ 元分析 (视角 = 轴): 同一对象 (坍缩进基点) 的 6 视角轴坐标:
       - 形式化轴: PROVED (Lean 验收).
       - 集合轴: {pat0} 单点集.
       - 代数轴: 平凡群 {1}.
       - 拓扑轴: 收敛极限 (T^n(x) → b).
       - 序轴: 维度格极小元.
       - 范畴轴: 终对象 (所有互锁态射汇入).
       同一对象 (内收 z↦z/‖z‖) 的 3 轴坐标: 集合轴 (商映射, 核=ℝ⁺)
       ∧ 代数轴 (乘法同态 f(ab)=f(a)f(b)) ∧ 拓扑轴 (连续).

    ★ 视角切换机制: ①对象身份不变, 坐标改变 (内收仍是内收, 坍缩
       仍是坍缩) ②切换 = 找最强坐标轴 (R191 交换结构: 间隔 → 商映
       射轴, 对称 → 对称轴, 存在 → 构造轴) ③切换后在新轴坐标继续
       分析 (代数轴: 同态性质; 拓扑轴: 连续性) — 每个轴补充对象的
       新信息.

  formal_math: |
    -- ★同一对象 (内收) 多视角坐标 (集合轴 + 代数轴 + 拓扑轴):
    theorem object_multi_coord_contract (a b : ℂ) (ha : a ≠ 0) (hb : b ≠ 0) :
      (a * b) / ‖a * b‖ = (a / ‖a‖) * (b / ‖b‖) ∧
      ‖((a * b) / ‖a * b‖)‖ = 1
    -- ★同一对象 (坍缩) 多视角坐标 (代数轴 + 拓扑轴):
    theorem object_multi_coord_collapse (θ b c x : ℝ) (n : ℕ) :
      Complex.exp (θ * Complex.I) * Complex.exp (-(θ) * Complex.I) = 1 ∧
      ((fun y : ℝ => b + c * (y - b))^[n]) x = b + c ^ n * (x - b)
    -- ★视角切换保持对象:
    theorem perspective_switch_identity (θ : ℝ) :
      Complex.exp (θ * Complex.I) * Complex.exp (-(θ) * Complex.I) = 1
    -- 全景:
    theorem perspective_axis_perspective (θ : ℝ) :
      Complex.exp (θ * Complex.I) * Complex.exp (-(θ) * Complex.I) = 1

