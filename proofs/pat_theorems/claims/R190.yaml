statement:
  informal: |
    ★ 观点提出者: 用户 (2026-08-13)。基点穿折越整体理论, 双视角
       证明 (形式化 + 代数).

    ★ 唯一论点: 统一 R184-R189 的散落结果为整体理论 (公理 + 7 定理),
       从代数视角 (恒等式链验证) 和形式化视角 (Lean) 双轨证明.

    ★ 公理 (定义层):
       - A1 折叠: F_N(n) = n mod N (商映射, R085/R183).
       - A2 基点: b 是折叠锚 (T_b(b) = b, R142/R188).
       - A3 穿折越: T_b(x) = b + c·(x-b), 0 < c < 1 (收缩, R181).

    ★ 定理 (证明层, 7 条核心恒等式):
       - T1 对称穿折越: (p+2)-(p+1) = -(p-(p+1)) — 对称对观测 (R186).
       - T2 基点不动: b + c·(b-b) = b — 基点是收缩锚 (R181).
       - T3 不动点唯一: T_b(x) = x ⟺ x = b (c ≠ 1) — 存在性在原点
         (R188).
       - T4 折叠核: (n+N) mod N = n mod N — 商映射核 (R183).
       - T5 折叠不变量: ((n+N) - n) mod N = 0 — 差 N 折叠到同槽
         (R183).
       - T6 奇步偶数: 3(2k+1)+1 = 2(3k+2) — σ 奇偶性折叠 (R180).
       - T7 一步解算: 2 mod 2 = 0 ∧ 2 mod 3 ≠ 0 — 预言/定位/解算
         (R184).

    ★ 双视角:
       - 代数视角: 7 条恒等式在 Z/N 枚举验证全过 (代数证明链).
       - 形式化视角: Lean 7 定理全证 (0 sorry), 只锚本框架.

  formal_math: |
    -- T1 对称穿折越:
    theorem t1_symmetric_fold_cross (p : ℝ) : (p+2) - (p+1) = -(p - (p+1))
    -- T2 基点不动:
    theorem t2_basepoint_anchor (b c : ℝ) : b + c * (b - b) = b
    -- T3 不动点唯一 (存在性在原点):
    theorem t3_fixed_unique (b c x : ℝ) (hc : c ≠ 1) : b + c*(x-b) = x ↔ x = b
    -- T4 折叠核:
    theorem t4_fold_kernel (n N : ℕ) : (n + N) % N = n % N
    -- T5 折叠不变量:
    theorem t5_fold_invariant (n N : ℕ) : ((n + N) - n) % N = 0
    -- T6 奇步偶数:
    theorem t6_odd_step_even (k : ℕ) : 3*(2*k+1)+1 = 2*(3*k+2)
    -- T7 一步解算:
    theorem t7_one_step_solve : 2 % 2 = 0 ∧ 2 % 3 ≠ 0

