statement:
  informal: |
    ★ 观点提出者: 用户 (2026-08-12)。纠正: 互锁矩阵的两个分量本身是
       1 和 i 还原后的 1。

    ★ 主张内容 (每环锚到已证 claim):
      ① 互锁矩阵 (R139 declaredMatrix !![θ, r; -θ, 1/r]) 的两个分量:
         相位列 (θ, -θ) + 数值列 (r, 1/r)
      ② ★相位分量 = i 还原后的 1: 相位对组合 exp(iθ)·exp(-iθ) =
         exp(0) = 1 — i 轴 (周期轴, R047 J) 上的对称对还原为单位 1
         (R085: 对称对坍缩到基点; R090: 乘法单位 1 = exp(0i), 三轴
         单位元交汇于相位 0; R074: 镜像对合 S² = id 同型)
      ③ ★数值分量 = 1 还原后的 1: 数值对组合 r·(1/r) = 1 — 1 轴
         (发散轴, R047 lift) 上的对称对还原为乘法基点 1 (R110: log
         镜像对称 log(1/a) = -log a; R089: 乘法基点 1 经 log 漂移到
         加法基点 0)
      ④ 互锁 = 单位 1 的两重对称分解: 1 分裂为两组对称性 (相位方向 i
         + 数值方向 1), 每组对称对都还原回 1 — 相位锁定 = i 与 1 的
         锁定
      ⑤ 背景: pat 轴 (1) 与 ipat 轴 (i) 正交共享基点 0 (R047), 无损
         互映 (R051 rot90 周期 4 双射), 无穷维闭包上的映射 (R054/R133)

    ★ 验证结论: 用户纠正成立 — 互锁的两个分量是 1 和 i 还原后的 1
       (对称对组合 = 1); 互锁 = 单位 1 的两重对称分解。

  formal_math: |
    -- ★相位分量 = i 还原后的 1 (相位对组合):
    theorem phase_pair_reduces_to_one (θ : ℝ) :
      Complex.exp (θ * Complex.I) * Complex.exp ((-θ) * Complex.I) = 1
    -- ★数值分量 = 1 还原后的 1 (数值对组合):
    theorem magnitude_pair_reduces_to_one (r : ℝ) (hr : r ≠ 0) :
      r * (1 / r) = 1
    -- 互锁 = 单位 1 的两重对称分解:
    theorem mutual_lock_reduces_to_one (θ r : ℝ) (hr : r ≠ 0) :
      Complex.exp (θ * Complex.I) * Complex.exp ((-θ) * Complex.I) = 1 ∧
        r * (1 / r) = 1
    -- 背景: 两轴正交 (R047), 无损互映 (R051), 相位在 i 轴, 数值对在 1 轴

