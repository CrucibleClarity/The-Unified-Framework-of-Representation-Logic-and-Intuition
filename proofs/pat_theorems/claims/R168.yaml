statement:
  informal: |
    ★ 观点提出者: 用户 (2026-08-13)。筑基篇课后习题 XI: 霍奇猜想的
       pat 重新观测.

    ★ 唯一论点: Hodge 分解 = 单位圆互锁对 (共轭成对); Hodge 类 =
       共轭不变 = 折叠类 {0, π}; 代数子簇 = 可构造锚点; 猜想 =
       折叠类点都可构造.

    ★ 结构对应 (mechanics-pat-observation skill):
       - Hodge 分解 H^k = ⊕ H^{p,q} = 互锁对 {exp(iθ), exp(-iθ)}
         (R161 pair_interlock_self_consistent; R136 ②③ 方向成对)
       - H^{p,q} ↔ H^{q,p} 复共轭 = 反向相位 (conj(exp(iθ)) =
         exp(-iθ), R165)
       - Hodge 类 (共轭不变, 实类) = 折叠类 {0, π}: conj z = z ⟹
         exp(-iθ) = exp(iθ) ⟹ exp(2iθ) = 1 ⟹ θ = π·n (Complex.
         exp_eq_one_iff) — 在 [0,2π) 中 = 0 或 π (R085: 折叠类;
         R138: 相位锁定)
       - 代数子簇 (可构造对象) = 对称对还原到锚点 1 (R143
         magnitude_pair_reduces_to_one: r·(1/r) = 1)
       - 折叠丢失: (p,q)/(q,p) 方向区分; 找回 = 单位圆模长
         ‖exp(iθ)‖ = 1 (R165 phaseRep_on_circle / 框架
         AxisComponent.norm_exp_I_eq_one) 折叠后不变

    ★ ★霍奇猜想 pat 转译 (CONJECTURE): 所有有理 Hodge 类 (折叠类
       点 {0, π}) 都是代数子簇 (可构造锚点) 的组合 — 折叠类点都
       可构造. 诚实边界: 千禧年问题, 未解 — 结构转译, 非证明.

  formal_math: |
    -- Hodge 共轭对 = 互锁对:
    theorem hodge_conjugate_pair_interlock (θ : ℝ) :
      conj(exp(θ·I)) = exp((-θ)·I) ∧ exp(θ·I)·exp((-θ)·I) = 1
    -- Hodge 类 = 折叠类:
    theorem hodge_class_fold_class (θ : ℝ) :
      conj(exp(θ·I)) = exp(θ·I) → ∃ n : ℤ, θ = (n : ℝ)·π
    -- 代数子簇 = 可构造锚点:
    theorem algebraic_cycle_anchor (r : ℝ) (hr : r ≠ 0) : r·(1/r) = 1
    -- 找回 = 单位圆模长:
    theorem fold_recovers_observable (θ : ℝ) : ‖exp(θ·I)‖ = 1
    -- ★霍奇猜想 (CONJECTURE):
    theorem hodge_conjecture_pat (θ : ℝ) :
      conj(exp(θ·I)) = exp(θ·I) →
      (∃ n : ℤ, θ = (n : ℝ)·π) ∧ (∀ r, r ≠ 0 → r·(1/r) = 1)

