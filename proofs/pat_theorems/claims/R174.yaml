statement:
  informal: |
    ★ 观点提出者: 用户 (2026-08-13)。轴修正: 孪生素数定理的间隔是
       实数轴上的间隔对.

    ★ 唯一论点: 素数间隔属于发散轴 (实数轴, R047: 实轴 = 发散轴
       lift t = ⟨t, 0⟩) — 间隔 2 = |(p+2) - p| 是实数轴上的欧氏
       距离. R172 的"间隔 2 = 临界线圆直径" (复数平面距离) 与
       R173 的"间隔 2 = 震荡周期" (exp(iπt)) 都是把发散轴距离
       搬到周期轴观测 = 选错轴.

    ★ 七扭八歪的素数轴投影到 pat:
       - 素数在实数轴上分布不规则 (间隔 2, 4, 2, 4, 6, 2, 6, ...)
         = 七扭八歪的轴 (非均匀刻度).
       - 投影到奇偶性 (模 2 折叠, R171/R141 2 槽环): 素数除 2 外
         全落 1 槽 (R171 primes_parity_collapse); 素数间隔全为
         偶数 (奇数 - 奇数 = 偶数, prime_gap_even) → 间隔投影全落
         0 槽 (prime_gap_two_slot) — 七扭八歪的间隔分布全部坍缩为
         0, 歪斜完全消失 (信息坍缩, 与 R171 同精神).
       - 孪生间隔在奇偶性下不可见: p 与 p+2 同为奇数 → 同槽 (1)
         (twin_gap_invisible_parity) — 周期轴区分不出 p 和 p+2.

    ★ 结论 (轴修正): 间隔属于发散轴 (实数轴), 投影到周期轴 (奇偶
       性折叠) 后坍缩不可见 — R172/R173 把发散轴距离搬到周期轴
       观测 = 选错轴; 正确的观测轴 = 实数轴 (发散轴) 本身:
       |(p+2) - p| = 2.

  formal_math: |
    -- 间隔 2 = 实数轴距离 (发散轴):
    theorem twin_gap_real_axis (p : ℝ) : |(p+2) - p| = 2
    -- 奇素数间隔是偶数 (投影到 0 槽):
    theorem prime_gap_even {p q : ℕ} (hp : Nat.Prime p) (hq : Nat.Prime q)
      (h2p : p ≠ 2) (h2q : q ≠ 2) : Even (q - p)
    theorem prime_gap_two_slot {p q : ℕ} (hp : Nat.Prime p) (hq : Nat.Prime q)
      (h2p : p ≠ 2) (h2q : q ≠ 2) : (q - p) % 2 = 0
    -- 孪生间隔在奇偶性下不可见:
    theorem twin_gap_invisible_parity {p : ℕ} (hp₁ : Nat.Prime p)
      (hp₂ : Nat.Prime (p + 2)) (h2 : p ≠ 2) : p % 2 = (p + 2) % 2
    -- 全景:
    theorem gap_axis_perspective (p : ℝ) :
      (|(p+2) - p| = 2) ∧ ((2 : ℕ) % 2 = 0)

