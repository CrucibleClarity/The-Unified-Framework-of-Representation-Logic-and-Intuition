statement:
  informal: |
    ★ 观点提出者: 用户 (2026-08-12)。log 双对称观测素数。

    ★ 修正 (用户批评):
      ① log 有两种对称变换: 层对称 + 镜像对称 (我漏了第二种)
      ② 不在 log 轴上做 0 点加减法 (log 非普通实数轴)
      ③ "奇异性"词弃用 (改用"无定义点")

    ★ log 双对称:
      ① 层对称: log(ab) = log a + log b (乘法 → 加法)
      ② 镜像对称: log(1/a) = -log a (倒数 → 取负)

    ★ 素数观测 (双对称视角):
      层: 素数比 log(q/p) = 层间隔 (波动)
        2→3: 0.4055 | 11→13: 0.1671 (孪生极小) | 29→31: 0.0667
      镜像: 1/p = 镜像对 (log(1/p) = -log p)
      层单位 (log 2): 素数相对 2 的层数 (3: 0.585, 5: 1.322)

    ★ 与既有 claim 的关系:
      - R089 (基点统一 log): log 双对称的源
      - R096 (log 计算逻辑): 观测须按工具自身逻辑
      - R107 (素数参照): log 视角的素数
      - R072 (声明): log 双对称的声明化
      结论: log 双对称 (层+镜像) 观测素数 — 层间隔 log(q/p)
      波动, 镜像对 1/p; 不用 0 点加减法。

  formal_math: |
    -- 层对称: log(ab) = log a + log b (比 → log 差)
    -- 镜像对称: log(1/a) = -log a (倒数 → 取负)
    -- 素数层间隔: log(q/p); 素数镜像对: 1/p

