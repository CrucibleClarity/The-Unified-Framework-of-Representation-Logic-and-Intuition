user_original_words: |
  ★★★ 用户原话 (2026-08-12, 原封不动保存, 未经改写):
  "这是因为你还在用指数去做计算。你该用单相位数去构造。"

statement:
  informal: |
    ★ 观点提出者: 用户 (2026-08-12)。用单相位数本身构造 (不用指数)。

    ★ 修正 (R112 批判):
      R112 用指数 (p^a·p^b = p^(a+b)) — 指数 ⟺ log (同一恒等式!)
      幂依赖乘法 (R097 循环) ⟹ R112 未逃出
      正确: 用单相位数本身构造 — 层不是指数, 是升层嵌套结构

    ★ 构造 (Layer 归纳类型):
      Layer := basepointLayer | layerUp Layer
      basepointLayer: 基点层 (生成的基, 非数字, R111)
      layerUp L: 升层 (×p 生成操作, 单相位链的纯粹后继, R099)
      单相位数 = (p, layer) — 层 = 嵌套升层结构

    ★ 核心定理 (Lean 验收, MonophaseConstruct.lean, 无 sorry):
      ① layer_up_generates: 链由 layerUp 生成 (非基点层)
      ② layer_up_injective: layerUp 单射 (链不塌缩)
      ③ layer_up_not_basepoint: 永不到达基点层 (链不回环)
      ④ monophase_depth: 层 = 结构深度 (非指数)

    ★ 与既有 claim 的关系:
      - R099 (升层/降层): 层 = 嵌套升层 (非指数)
      - R063 (每步重选): layerUp = 纯粹后继
      - R111 (定义不明): 基点层 = 生成的基
      - R112 (指数批判): 本 claim 的构造替代
      - R072 (声明): ℙ⟨φ_p⟩(p, layer) 声明化
      结论: 单相位数 = (p, layer), 层 = 嵌套 layerUp (无指数/
      无幂/无 log); 链由升层生成, 单射不回环。

    ★ 支撑 (Lean):
      - MonophaseConstruct.lean (4 定理, 0 sorry)
  formal_math: |
    -- 层 (归纳): Layer := basepointLayer | layerUp Layer
    -- 单相位数: (p, layer) — 层 = 嵌套升层结构
    -- 链: layerUp 生成, 单射, 不回基点层

