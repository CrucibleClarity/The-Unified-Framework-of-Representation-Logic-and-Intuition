id: R113
title: "R113 (user-proposed 2026-08-12): the monophase number is constructed FROM ITSELF — the layer is NOT an exponent (exponent ⟺ log, R112 critique) but the nested structure of layerUp (升层, R099): Layer := basepointLayer | layerUp Layer; the chain is generated by layerUp (pure successor, R063), injective, never cycling back; NO exponent, NO power, NO log"
