statement:
  informal: |
    ★ 观点提出者: 用户 (2026-08-13)。筑基篇课后习题 XX: 奇完全数
       存在性问题的 pat 重新观测.

    ★ 唯一论点: 奇完全数 = 素因子展开的奇偶性约束; σ = rad 对偶.

    ★ 结构对应 (mechanics-pat-observation skill):
       - σ = 素因子展开 (rad 的对偶): rad(n) 折叠重数到方向 (R179:
         rad(p^k) = p); σ(n) 展开重数到和 (σ₁(p^k) = 1+p+...+p^k)
         — 素因子重数折叠的两端.
       - ★σ₁(p^k) 奇偶性折叠: p 奇 ⟹ σ₁(p^k) = 1+p+...+p^k 有
         k+1 个奇数项 → 奇偶性 = 项数奇偶性 → σ₁(p^k) 奇 ⟺ k 偶
         (R171 奇偶性折叠在约数和上的投影).
       - 完全数 = σ 加倍: σ(n) = 2n — 约数和还原到 2n (对称对还原
         2n = n+n, R170/R085).
       - ★奇完全数 ⟹ n 非平方: σ(n) = 2n 偶; 若 n 平方 (所有指数
         偶) → σ(n) 奇 (可乘性 + 各因子奇) → 矛盾 — 至少一个奇
         指数素因子 (欧拉必要条件 n = q^α·m², α 奇, 的 pat 侧).
       - ★存在性 = CONJECTURE/OPEN: 未证 (下界 n > 10^1500; 欧拉
         必要条件 n = q^α·m², q ≡ 1 (mod 4), α ≡ 1 (mod 4), 外部
         文献对照).

  formal_math: |
    -- ★σ₁(p^k) 奇偶性折叠 (p 奇):
    theorem sigma_prime_pow_parity {p k : ℕ} (hp : Nat.Prime p) (hpodd : p ≠ 2) :
      (Odd (σ 1 (p ^ k)) ↔ Even k)
    -- ★奇完全数 ⟹ n 非平方:
    theorem odd_perfect_not_square {n : ℕ} (hnodd : Odd n)
      (hperfect : σ 1 n = 2 * n) : ¬ IsSquare n
    -- 奇完全数 ⟹ 存在奇指数素因子:
    theorem odd_perfect_has_odd_exponent_prime {n : ℕ} (hnodd : Odd n)
      (hperfect : σ 1 n = 2 * n) :
      ∃ p : ℕ, p ∣ n ∧ Odd (n.factorization p)
    -- 完全数 = σ 加倍 (对称对还原):
    theorem perfect_sigma_double_iff (n : ℕ) : σ 1 n = 2 * n ↔ σ 1 n - n = n
    -- 全景:
    theorem odd_perfect_pat_perspective (p : ℕ) (hp : Nat.Prime p) (hpodd : p ≠ 2) :
      (Odd (σ 1 (p ^ 2)) ∧ Even (σ 1 (p ^ 1)))

