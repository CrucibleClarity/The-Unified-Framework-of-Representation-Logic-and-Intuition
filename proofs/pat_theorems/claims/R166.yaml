statement:
  informal: |
    ★ 观点提出者: 用户 (2026-08-13)。筑基篇课后习题 IX: 物理空间的
       互锁结构.

    ★ 问题① (PROVED): 五大力是否共享某些结构? — 共享互锁对单元:
       每个力的基本结构都是成对的 {d, -d} (R136 ②③: 方向必须成对
       声明; R138: 相位差可加; R143: 对称对还原到 1):
       exp(iθ)·exp(-iθ) = 1 (R161 pair_interlock_self_consistent).
       力学 (作用-反作用成对 F+(-F)=0), 量子 (4 互锁 = S³), 电磁
       (E⊥B 正交), 强弱 (规范群 k 对), 引力 (脱离对逐对独立) —
       力 = 互锁对的破缺/组合/投影.

    ★ 问题② (PROVED): 丢失的结构中是否发生可观测数据? — 是:
       脱离保持互锁 (R161 pair_detachment_general: 逐对独立, 脱离
       某些对剩余对仍互锁 — 物理法则保持); 单位圆模长 ‖ρ(g)‖ = 1
       (R165 phaseRep_on_circle/R141) 是脱离后仍可观测的不变量 —
       丢失结构的可观测数据 = 相位表示的单位圆模长 (不随脱离改变);
       物理空间通过剩余结构"感知"丢失结构 (引力 = 脱离对耦合效应,
       R164 CONJECTURE).

    ★ 问题③ (CONJECTURE): 物理空间结构猜测 — 3 对共享互锁 = 3 节点
       K3 完全图 (3 边全互锁, R163 三体 3 节点全连接 = 三角形) = 3
       维 (3 方向自由度, R161: 3 对 = 6 相位 = ±x, ±y, ±z);
       可能收缩: 时间 (R147: 时间 = 对合对称对) 与引力高维方向
       (R164: 引力 = 脱离投影) — 完整结构可能 4 对 (3 空间 + 1
       时间/引力), 物理空间收缩到 3 对 (3 维).

    ★ 诚实边界: 问题①② (PROVED) 为形式化结论; 问题③ (CONJECTURE)
       为结构猜测 (3 节点 K3 3 维 + 收缩时间/引力对), 依据框架结构
       归纳 (R161/R163/R164/R147), 非物理证明. 全部新定理只锚本
       框架, 不用外部引理.

  formal_math: |
    -- ① 五大力共享互锁对单元:
    theorem forces_share_interlock_pair (θ : ℝ) :
      exp(θ·I)·exp((-θ)·I) = 1
    -- ② 脱离保持互锁 (逐对独立):
    theorem detachment_keeps_observable (k : ℕ) (θ : Fin k → ℝ) :
      ∀ j : Fin k, exp(θ j·I)·exp(-(θ j)·I) = 1
    -- ② 单位圆模长 = 脱离不变观测:
    theorem unit_circle_observable (θ : ℝ) : ‖exp(θ·I)‖ = 1
    -- ③ 物理空间 = 3 对共享互锁 (CONJECTURE 依据):
    theorem physical_space_three_pairs (θ₁ θ₂ θ₃ : ℝ) :
      exp(θ₁·I)·exp((-θ₁)·I) = 1 ∧ exp(θ₂·I)·exp((-θ₂)·I) = 1 ∧
      exp(θ₃·I)·exp((-θ₃)·I) = 1
    -- ③ K3 完全图 (3 节点 3 边全互锁):
    theorem physical_space_K3_complete (θ₁₂ θ₂₃ θ₃₁ : ℝ) :
      exp(θ₁₂·I)·exp((-θ₁₂)·I) = 1 ∧ exp(θ₂₃·I)·exp((-θ₂₃)·I) = 1 ∧
      exp(θ₃₁·I)·exp((-θ₃₁)·I) = 1
    -- ★全景:
    theorem physical_space_structure_perspective (θ₁ θ₂ θ₃ θ₁₂ θ₂₃ θ₃₁ : ℝ) :
      (3 对共享互锁) ∧ (K3 全互锁)

