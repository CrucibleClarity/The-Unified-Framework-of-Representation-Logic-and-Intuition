statement:
  informal: |
    ★ 观点提出者: 用户 (2026-08-12)。基点 0 视角的双向映射形式化。

    ★ 映射 (每环锚到已证 claim):
      ① 自然数 → 单相位 (φ): 自然数 n = 基点 0 出发、单位方向 d = 1 的
         单相位链第 n 层 — patChain 0 1 n = n (R137 pat_n_is_monophase;
         R091: 单相位 = {n·d}; R070: Nat = Chain(0); RulerDelta: 基点 =
         delta 的锚)
      ② 单相位 → 自然数, 发散映射 (ψ_div): 层数 = 值/d — (n·d)/d = n
         (R091: 标量列; R067: 数值 = 基点投影); log 版 (素数幂链):
         log(p^k) = k·log p (R097: 素数幂链 = 单相位; R089: log 把乘法
         基点 1 漂移到加法基点 0)
      ③ 单相位 → 自然数, 收敛映射 (ψ_conv): 相位蜷曲到圆 + 单位根量化 —
         自然数 n 的相位 2π·n/T 量化到单位根 n 槽环, 误差 ≤ π/N
         (R138/R055 蜷曲; R141 phase_quantizable: |x - round x| ≤ 1/2;
         R059: 单位根 n 槽环)
      ④ 素数环相同操作: 素数幂链 {p^k} 经 log 是单相位 (R097), 蜷曲到圆
         (R055); 素数圆 |z| = √p (C016/C017: 高斯整数/素数圆单轨道;
         R109: 折叠类 0 = 素数圆圆心); 合数 = 多相位 (R112: p^a·p^b =
         p^(a+b) 相位向量加法)

    ★ 验证结论: 用户要求成立 — 基点 0 视角双向映射: 自然数 = 单位方向
       单相位链 (φ), 发散映射 (层数提取 ψ_div) + 收敛映射 (蜷曲量化
       ψ_conv); 素数环相同操作 (素数幂链单相位 + 素数圆 + 合数多相位)。

  formal_math: |
    -- 自然数 = 基点 0 单位方向单相位链:
    theorem nat_is_monophase_chain (n : ℕ) :
      patChain 0 1 n = (n : ℝ)
    -- 发散映射 ψ_div: 层数 = 值/d:
    theorem monophase_layer_extract (n d : ℝ) (hd : d ≠ 0) :
      (n * d) / d = n
    -- 素数幂链 = 单相位 (log 视角):
    theorem prime_power_log_layer (p : ℝ) (k : ℕ) :
      Real.log (p ^ k) = (k : ℝ) * Real.log p
    -- 收敛映射 ψ_conv: 自然数相位量化到单位根格点:
    theorem nat_phase_quantized (T : ℝ) (N : ℕ) (hN : 0 < N) (n : ℕ)
      (hθ₁ : 0 ≤ 2 * Real.pi * (n : ℝ) / T)
      (hθ₂ : 2 * Real.pi * (n : ℝ) / T ≤ 2 * Real.pi) :
      ∃ j : ℕ, j ≤ N ∧
        |2 * Real.pi * (n : ℝ) / T - 2 * Real.pi * (j : ℝ) / N| ≤ Real.pi / N
    -- 素数环: 素数幂链蜷曲 (R055):
    theorem prime_power_curls (p T : ℝ) (hT : T ≠ 0) (k : ℕ) :
      Complex.exp (2 * Real.pi * ((((k : ℝ) * Real.log p) + T) / T) * Complex.I) =
        Complex.exp (2 * Real.pi * ((k : ℝ) * Real.log p / T) * Complex.I)
    -- 素数圆 |z| = √p:
    theorem prime_circle_norm (p θ : ℝ) (hp : 0 ≤ p) :
      ‖(Real.sqrt p : ℂ) * Complex.exp (θ * Complex.I)‖ = Real.sqrt p
    -- 合数 = 多相位 (R112):
    theorem composite_polyphase (p a b : ℕ) :
      (p ^ a) * (p ^ b) = p ^ (a + b)

