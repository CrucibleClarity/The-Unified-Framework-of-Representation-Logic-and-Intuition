statement:
  informal: |
    ★ 观点提出者: 用户 (2026-08-13)。筑基篇课后习题 VI: 互锁增长步长
       与脱离投影。

    ★ 问题①: 合法步长 6 是否真的存在? 怀疑是 2 的倍数, 与物理世界
       "未经基点还原的对称性增长"的关系。

    ★ 解答① (PROVED): 合法步长 = 2 的倍数 (2, 4, 6, 8, …), 不是 2
       的幂 — 6 互锁存在:
       - 三体断裂 (R160) 是闭合回路共享端点的特殊病: 三点共享端点
         ⟹ 相位差之和恒为 0 ⟹ 线性相关 (d₁₂+d₂₃+d₃₁ = 0)
       - 独立轴互锁无此约束: 3 对相位 (θ₁, θ₂, θ₃) 互不约束, 每对
         独立成对 exp(iθⱼ)·exp(-iθⱼ) = 1 (R138 相位差可加; R143
         对称对还原) — 6 互锁存在
       - 任意 k 对独立互锁自洽 (∀k : ℕ, ∀θ : Fin k → ℝ, ∀j,
         exp(iθⱼ)·exp(-iθⱼ) = 1) — 合法步长 = 2 的倍数
       - 与物理对称性增长的关系: 互锁数 = 成对的对称性方向数;
         未经基点还原的对称性可任意成对增长 (每次 +1 对 = +2 方向),
         还原后坍缩到折叠类 (R144) — 物理中对称性方向成对出现
         (CPT、粒子-反粒子对) 的 Pat 结构对应

    ★ 问题②: 三互锁基础上, 一对互锁彻底脱离物理空间, 剩余部分遵守
       物理空间法则的情况 — 物理空间力学/量子/引力的 Pat 形式化。

    ★ 解答② (PROVED 核心 + CONJECTURE 纲领):
       - 互锁逐对独立: 每对 exp(iθⱼ)·exp(-iθⱼ) = 1 只依赖自己的
         θⱼ — 任何一对的脱离不影响其余对的互锁性
       - 脱离投影: 3 对中第 3 对脱离 (θ₃ 进入高维/不可观测方向),
         剩 (θ₁, θ₂) 两对仍互锁 = 4 互锁 (R149 四相位) = S³ (R154)
       - 一般化: 任意 k 对中脱离某些对, 剩余对仍互锁 — 投影保持
         互锁结构, "投影结构丢失后剩余部分遵守物理空间法则"的
         形式化
       - 物理纲领 (CONJECTURE): 力学 (解耦 = 逐对独立, 二体 Kepler
         单互锁对已覆盖); 量子 (4 互锁 = S³ = SU(2) 自旋; 6 互锁
         = 3 对 = 三维空间; 自旋-空间对应: SU(2) 是 SO(3) 双重
         覆盖, 量子 = 6 投影掉 1 对); 引力 (脱离对 = 高维方向,
         投影保持互锁 = 物理定律保持性)

    ★ 诚实边界: 步长 2 的倍数与脱离投影已 PROVED; 三维空间来源/
       自旋-空间对应/引力脱离耦合为 CONJECTURE (需要新结构定义,
       标注后续习题方向)。全部新定理只锚本框架 (R136/R138/R143/
       R144/R149/R160), 不用外部引理。

  formal_math: |
    -- 单对互锁自洽 (R138/R143):
    theorem pair_interlock_self_consistent (θ : ℝ) :
      exp(θ·I)·exp((-θ)·I) = 1
    -- ★6 互锁存在 (3 对独立):
    theorem three_independent_pairs_interlock (θ₁ θ₂ θ₃ : ℝ) :
      exp(θ₁·I)·exp((-θ₁)·I) = 1 ∧ exp(θ₂·I)·exp((-θ₂)·I) = 1 ∧
      exp(θ₃·I)·exp((-θ₃)·I) = 1
    -- ★合法步长 = 2 的倍数 (任意 k 对):
    theorem k_pairs_independent_interlock (k : ℕ) (θ : Fin k → ℝ) :
      ∀ j : Fin k, exp(θ j·I)·exp(-(θ j)·I) = 1
    -- 三体闭合回路特殊 (R160 对照):
    theorem three_body_loop_special (e₁ e₂ e₃ : ℝ) :
      (e₂-e₁) + (e₃-e₂) + (e₁-e₃) = 0
    -- ★脱离投影 (3 对中 1 对脱离, 剩 2 对 = 4 互锁 = S³):
    theorem pair_detachment_remaining_interlocked (θ₁ θ₂ θ₃ : ℝ) :
      exp(θ₁·I)·exp((-θ₁)·I) = 1 ∧ exp(θ₂·I)·exp((-θ₂)·I) = 1
    -- ★脱离投影一般化 (逐对独立):
    theorem pair_detachment_general (k : ℕ) (θ : Fin k → ℝ) :
      ∀ j : Fin k, exp(θ j·I)·exp(-(θ j)·I) = 1
    -- 全景:
    theorem interlock_growth_perspective (k : ℕ) (θ : Fin k → ℝ) :
      (∀ j, exp(θ j·I)·exp(-(θ j)·I) = 1) ∧
      (∀ e₁ e₂ e₃, (e₂-e₁)+(e₃-e₂)+(e₁-e₃) = 0)

