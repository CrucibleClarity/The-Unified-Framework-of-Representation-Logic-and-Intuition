title: "R162 (筑基篇课后习题 VI 增补, 2026-08-13): ★互锁是本地操作 — 3 组互锁的最小锁定数量 = 12 — 用户修正: 互锁才是本地的 (每组的互锁只依赖自己的 (aⱼ, θⱼ), 不共享端点); 每组最少 4 互锁 (R160: 4 互锁最小自洽, < 4 被 R134 pat0 吸收); 3 组互锁的最小锁定数量 = 3 × 4 = 12 (12 = 6 对成对, 12 互锁自洽 R161); 三体 = 3 个本地 4 互锁单体 (12 互锁, 存在性由本地互锁保证), 三体不可解 (Poincaré) 是组间相互作用动力学非线性, 非单体互锁断裂 (R160 闭合回路是全局共享端点的特殊病, 本地互锁不受此限)"
