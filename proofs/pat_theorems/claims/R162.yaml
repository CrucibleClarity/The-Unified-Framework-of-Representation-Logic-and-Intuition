user_original_words: |
  ★★★ 用户原话 (2026-08-13, 原封不动保存, 未经改写):
  "或者本质上互锁才是本地，3组互锁的最小锁定数量是多少？"

statement:
  informal: |
    ★ 观点提出者: 用户 (2026-08-13)。筑基篇课后习题 VI 增补:
       互锁是本地操作, 3 组互锁的最小锁定数量。

    ★ 用户修正 (延续三体 6/12 互锁探索): 互锁才是本地的 — 每组的
       互锁只依赖自己的参数, 不与其他组共享. 3 组互锁的最小锁定
       数量是多少?

    ★ 解答 (PROVED):
      ① 互锁是本地操作: 每组的互锁只依赖自己的 (aⱼ, θⱼ) — R149
         quadriphase_interlock 逐组版: ∀ j, aⱼ·(1/aⱼ) = 1 ∧
         exp(iθⱼ)·exp(-iθⱼ) = 1 ∧ log aⱼ + log(1/aⱼ) = 0 ∧
         ‖exp(iθⱼ)‖ = 1 (R136 ②③: 方向成对声明只涉及自己的方向)
         — 各组互不依赖, 不共享端点 (无闭合回路病)
      ② 每组最少 4 互锁: R160 four_is_minimal_self_consistent
         (4 互锁最小自洽, 1 退化 R062, 3 断裂 R160) — < 4 的组被
         pat0 吸收 (R134: app pat0 pat0 = pat0, layerUp pat0 = pat0)
      ③ ★3 组互锁的最小锁定数量 = 3 × 4 = 12: 3 组 × 每组最少 4
         = 12 互锁; 12 = 6 对 (成对性满足, R136 ②③); 12 互锁自洽
         (R161 k_pairs_independent_interlock: 任意 k 对独立互锁
         自洽, 12 = 6 对)
      ④ 三体的本地图景: 三体 = 3 个本地 4 互锁单体 (S³, 各 4 互锁
         = 12 总互锁) — 存在性由本地互锁保证 (不被吸收); 三体
         不可解 (Poincaré) 是组间相互作用的动力学非线性, 不是
         单体互锁断裂 (R160 闭合回路是全局共享端点的特殊病,
         本地互锁不受此限)

    ★ 与全局计数的区分: R160 的"三互锁断裂"是 3 个互锁对共享 3
       端点的全局闭合回路 (线性相关); 本地视角下 3 组互锁 = 3 个
       独立的 4 互锁组 (每组自己的 (aⱼ, θⱼ)), 不共享端点 — 无
       闭合回路病.

    ★ 诚实边界: 三体不可解 (Poincaré) 的动力学非线性部分为
       CONJECTURE 层 (组间相互作用); 互锁本地性/最少 4/3 组 = 12
       已 PROVED. 全部新定理只锚本框架 (R149/R160/R161/R134),
       不用外部引理.

  formal_math: |
    -- ★互锁是本地操作 (R149 逐组版):
    theorem interlock_is_local (k : ℕ) (a θ : Fin k → ℝ)
      (ha : ∀ j : Fin k, 0 < a j) :
      ∀ j : Fin k,
        a j·(1/a j) = 1 ∧ exp(θ j·I)·exp(-(θ j)·I) = 1 ∧
        log (a j) + log (1/(a j)) = 0 ∧ ‖exp(θ j·I)‖ = 1
    -- 每组最少 4 (R160):
    theorem body_minimal_four (a θ : ℝ) (ha : 0 < a) :
      (a·(1/a) = 1 ∧ exp(θ·I)·exp(-(θ·I)) = 1 ∧ log a + log(1/a) = 0 ∧
       ‖exp(θ·I)‖ = 1) ∧ (∀ e₁ e₂ e₃, (e₂-e₁)+(e₃-e₂)+(e₁-e₃) = 0)
    -- ★3 组互锁的最小锁定数量 = 12:
    theorem three_groups_minimal_twelve : (3 * 4 : ℕ) = 12
    -- 12 互锁自洽 (6 对, R161):
    theorem twelve_interlock_self_consistent (θ : Fin 12 → ℝ) :
      ∀ j : Fin 12, exp(θ j·I)·exp(-(θ j)·I) = 1
    -- ★全景:
    theorem three_body_local_perspective (k : ℕ) (a θ : Fin k → ℝ)
      (ha : ∀ j : Fin k, 0 < a j) :
      (∀ j, a j·(1/a j) = 1 ∧ exp(θ j·I)·exp(-(θ j)·I) = 1 ∧
        log (a j) + log (1/(a j)) = 0 ∧ ‖exp(θ j·I)‖ = 1) ∧
      ((3 * 4 : ℕ) = 12)

