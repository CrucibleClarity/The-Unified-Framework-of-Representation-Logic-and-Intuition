statement:
  informal: |
    ★ 观点提出者: 用户 (2026-08-13)。筑基篇课后习题 V: 四互锁是
       最小自洽互锁结构。

    ★ 用户论证 (三体习题的直接延续): 三互锁无法达成 ⟹ 无限外推理论
       在 n = 3 处存在漏洞 (无法从单互锁自然增加到三互锁) ⟹ 四互锁
       是最小结构, 需要证明; 证明不难: 四互锁如果再收敛, 就会被自指
       吸收。

    ★ 证明链 (全部锚到已证 claim):
      ① 互锁必须成对 (R136 ②③: 方向必须按对称性成对一次性声明;
         R147: 因果必须成对互锁声明) — 互锁的最小单位是一对对称性
         {d, -d}, 不是单个方向; 奇数个互锁无法成对 ⟹ 无法自洽
      ② 三互锁无法达成: 三点闭合回路相位差之和 = 0 (纯代数:
         (e₂-e₁)+(e₃-e₂)+(e₁-e₃) = 0), 三个互锁方向线性相关, 第三
         个由前两个决定 — 自由度不足, 无法独立锁定 (RulerPhase:
         相位差 = 方向; R140 single_symmetry_underdetermines: 单组
         对称性不能准确锁定 ⟹ 多组线性相关也不能); 三体一般不可解
         (Poincaré) 的结构对应
      ③ ★四互锁是最小自洽结构: 4 = 2×2 成对 (R149 quadriphase_interlock:
         2 轴 × 2 方向, 数值对 a·(1/a)=1 + 相位对 exp(iθ)·exp(-iθ)=1
         + log 对 + 范数对全部互锁) — 1 退化 (单方向特权污染 R062),
         2 单对 (Kepler 可解但不成结构), 3 断点 (②), 4 自洽 (R149)
      ④ ★四互锁再收敛 = 自指吸收: 4 相位互锁归一化 = S³ (R154);
         S³ 无损内收到 S¹ (R154 contract_to_circle: z/‖z‖ ∈ S¹,
         contract_preserves_phase: 内收可逆无损); 若继续收敛 (半径
         → 0, 折叠方向), 坍缩到基点 0 — pat0 吸收一切操作 (R134
         self_app_absorbing: app pat0 pat0 = pat0, layerUp pat0 =
         pat0) — 四互锁是"再收敛即自指吸收"的临界结构 (R138: 未
         锁定 = 自指循环坍缩)

    ★ 对无限外推理论的修正: R150 王氏定理的相位层外推不受影响;
       受影响的是互锁数目的外推 — 互锁必须成对, 奇数互锁 (3, 5, …)
       不可自洽, 外推的合法步长是 +2 (2→4→6→…)。这是对筑基篇互锁
       结构的一个结构修正 (用户洞察, 本习题 PROVED)。

    ★ 诚实边界: 三体一般不可解 (Poincaré 不可积) 不在框架能力内;
       本习题形式化的是互锁结构的最小性 (闭合回路自由度不足 +
       成对性), 非三体问题求解。

  formal_math: |
    -- ① 三互锁闭合回路相位差之和 = 0 (纯代数):
    theorem three_closed_loop_dependent (e₁ e₂ e₃ : ℝ) :
      (e₂ - e₁) + (e₃ - e₂) + (e₁ - e₃) = 0
    -- ② 三互锁方向线性相关 (无法独立锁定):
    theorem three_not_lockable_independent (e₁ e₂ e₃ d₁₂ d₂₃ d₃₁ : ℝ)
      (hd₁ : d₁₂ = e₂ - e₁) (hd₂ : d₂₃ = e₃ - e₂) (hd₃ : d₃₁ = e₁ - e₃) :
      d₁₂ + d₂₃ + d₃₁ = 0
    -- ③ 4 互锁 = 2 对对称性 (成对结构, R149):
    theorem four_interlock_minimal_pairs (a θ : ℝ) (ha : 0 < a) :
      a * (1 / a) = 1 ∧ exp(θ·I)·exp((-θ)·I) = 1
    -- ④ 4 互锁自洽 (R149 四组互锁):
    theorem four_interlock_self_consistent (a θ : ℝ) (ha : 0 < a) :
      a·(1/a) = 1 ∧ exp(θ·I)·exp((-θ)·I) = 1 ∧ log a + log(1/a) = 0 ∧
      ‖exp(θ·I)‖ = 1
    -- ★四互锁最小自洽 (组合):
    theorem four_is_minimal_self_consistent (a θ : ℝ) (ha : 0 < a) :
      (a·(1/a) = 1 ∧ exp(θ·I)·exp((-θ)·I) = 1 ∧ log a + log(1/a) = 0 ∧
       ‖exp(θ·I)‖ = 1) ∧ (∀ e₁ e₂ e₃, (e₂-e₁)+(e₃-e₂)+(e₁-e₃) = 0)
    -- ★四互锁再收敛 = 自指吸收 (S³ 无损内收, R154):
    theorem four_interlock_contracts_to_selfref (z : ℂ) (hz : z ≠ 0) :
      ‖z / ‖z‖‖ = 1 ∧ z = (‖z‖ : ℂ) * (z / ‖z‖)
    -- ★全景:
    theorem four_interlock_minimal_perspective (a θ : ℝ) (ha : 0 < a)
      (z : ℂ) (hz : z ≠ 0) :
      (∀ e₁ e₂ e₃, (e₂-e₁)+(e₃-e₂)+(e₁-e₃) = 0) ∧
      (a·(1/a) = 1 ∧ exp(θ·I)·exp((-θ)·I) = 1) ∧
      (‖z/‖z‖‖ = 1 ∧ z = ‖z‖·(z/‖z‖))

