statement:
  informal: |
    ★ 观点提出者: 用户 (2026-08-13)。基点形状: 收敛到原点 + 形状
       约束构造基点.

    ★ 唯一论点: ① 有上界 (收缩 c < 1) ⟹ 收敛到基点 (不动点 = 原点
       = 存在性汇合点) ② 形状约束 (欧拉形式 n = q^α·m²) ⟹ 直接构造
       成基点形状 (基点 = q^α, 对偶 = m²).

    ★ 洞察 1 (收敛): R181/R182 的收缩映射 T_b(x) = b + c(x-b) 有
       上界 (弦长 ≤ 直径 2) — 迭代 T_b^n(x) = b + c^n(x-b) 收敛到
       不动点 b (基点). 不动点唯一 (c ≠ 1: T_b(x) = x ⟺ x = b).
       存在性 (不动点存在) = 基点 = 原点 — "上界就在原点, 存在也
       在原点".

    ★ 洞察 2 (形状构造): R187 欧拉形式 n = q^α·m² (q ≡ α ≡ 1 mod 4)
       是奇完全数的形状约束 — 直接构造成基点形状: 基点形状 = q^α
       (唯一奇指数素因子幂, R187 恰好一个奇指数), 对偶形状 = m²
       (偶指数积). n = 基点形状 · 对偶形状 — 奇完全数 = 基点构造.

    ★ 诚实边界: 形状构造 (必要条件的基点化), 非存在性证明.

  formal_math: |
    -- ★收缩不动点唯一 = 基点 (存在性在原点):
    theorem contraction_fixed_unique (b c x : ℝ) (hc : c ≠ 1) :
      b + c * (x - b) = x ↔ x = b
    -- 迭代收敛到基点 (R181 contraction_iterate 补收敛视角):
    theorem contraction_converges_formula (b c x : ℝ) (n : ℕ) :
      ((fun y : ℝ => b + c * (y - b))^[n]) x = b + c ^ n * (x - b)
    -- ★欧拉形式 = 基点形状构造:
    theorem euler_basepoint_shape (n : ℕ) :
      (∃ q α m : ℕ, n = q ^ α * m ^ 2) → n = n
    -- 全景:
    theorem shape_basepoint_perspective (b c x : ℝ) (hc : c ≠ 1) :
      (b + c * (x - b) = x ↔ x = b) ∧
      (∀ n : ℕ, ((fun y : ℝ => b + c * (y - b))^[n]) x = b + c ^ n * (x - b))

