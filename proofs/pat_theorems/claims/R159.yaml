statement:
  informal: |
    ★ 观点提出者: 用户 (2026-08-13)。筑基篇课后习题 III: pat 视角回顾
       黎曼猜想与孪生素数。

    ★ 习题定位: 筑基篇课后习题系列第三题 (exercise_i_2)。用筑基篇的
       几何/互锁结构 (素数圆/临界线圆/反演/log 对偶/基点漂移) 重述
       黎曼猜想与孪生素数的经典结构。

    ★ 唯一论点: 两个还原点 (0 与 1) 圆化出素数圆与临界线圆 (R144/
       R145), 黎曼与孪生的结构都在这两个圆上。

    ★ 三个层次 (每层锚到已证 claim):
      ① 黎曼 = 临界线圆的 pat 几何重述: 临界线 (Re(s)=1/2) ⟺ 共轭
         对称 (1-s = conj s, C019 critical_line_iff_conj_complex);
         反演下临界线 = 临界线圆 (圆心 1, 半径 1, 过 0 和 2, R145
         critical_circle_points); Re(s)=1/2 的 ζ 零点满足 ‖1/s-1‖ = 1
         (C022 zeta_zero_on_circle) — 零点落在临界线圆上; pat 视角:
         黎曼猜想 = "非平凡零点在乘法还原点 1 的圆上" (结构重述,
         非零点存在性断言)
      ② 素数 = 基点漂移后继: 素数圆 (圆心 0 = 折叠类/加法还原点,
         半径 √p, R145 prime_circle_center_zero); 素数幂链 = 单相位
         (log(p^k) = k·log p, R142 prime_power_log_layer); p ≡ 1
         (mod 4) ⟹ 两平方和 (C014 prime_two_axis); 用户洞察 (docs/
         关于黎曼猜想的思考.md): 素数 = 平移的真实后继迭代丢失结构
         后的投影 — pat 视角: 素数的 log 单相位 = 平移链的相位形式,
         丢失的是数值链的"层"结构
      ③ 孪生 = 间隔 2 的框架几何对应: 间隔 2 = 临界线圆直径端点
         0 与 2 的距离 (R145 critical_circle_points: 0 与 2 是直径
         端点); 反演 2 ↔ 1/2 = 乘法对称对 (R109/R145
         reciprocal_pair_reduces: r·(1/r) = 1 还原到圆心 1); pat
         视角: 孪生素数对 (p, p+2) 的间隔 2 = 临界线圆直径的实数
         对应, 与 1/2 (临界线位置) 反演对称 — 同一互锁对的两端
         (R147); 诚实边界: 孪生素数无穷性未证明

    ★ 诚实边界 (延续 C011-C025): 黎曼猜想 (非平凡零点全在 Re(s)=1/2)
       与孪生素数猜想 (无穷多间隔 2 素数对) 均未证明 — 本题交付的是
       pat 几何重述, 7 个新定理是结构事实的 Lean 验收, 非零点存在性/
       素数对无穷性断言。全部新定理只锚筑基篇定理与框架 C011-C025,
       不用外部引理 (R153 用户纠正精神延续)。

  formal_math: |
    -- ① 黎曼 = 临界线圆 (C019/C022 + R144/R145):
    theorem critical_line_pat_circle (s : ℂ) : s.re = 1 / 2 ↔ 1 - s = star s
    theorem zero_on_pat_circle (s : ℂ) (hs0 : s ≠ 0) (hz : riemannZeta s = 0)
      (h12 : s.re = 1 / 2) : ‖1 / s - 1‖ = 1
    -- ② 素数 = 基点漂移后继 (R142/R145 + C014):
    theorem prime_on_pat_circle (p θ : ℝ) (hp : 0 ≤ p) :
      ‖(Real.sqrt p : ℂ) * exp (θ·I) - 0‖ = Real.sqrt p
    theorem prime_log_monophase (p : ℝ) (k : ℕ) (hp : 0 < p) :
      Real.log (p ^ k) = (k : ℝ) * Real.log p
    -- ③ 孪生 = 间隔 2 直径 (R109/R145):
    theorem twin_gap_is_circle_diameter : ‖(2 : ℂ) - 0‖ = 2
    theorem twin_gap_inversion_symmetry : (2 : ℝ) * (1 / 2) = 1
    -- 全景:
    theorem pat_riemann_twin_perspective :
      (∀ s : ℂ, s.re = 1 / 2 ↔ 1 - s = star s) ∧
      (∀ p : ℝ, 0 ≤ p → ‖(Real.sqrt p : ℂ) - 0‖ = Real.sqrt p) ∧
      ‖(2 : ℂ) - 0‖ = 2 ∧ (2 : ℝ) * (1 / 2) = 1

