statement:
  informal: |
    ★ 观点提出者: 用户 (2026-08-12)。基点 0 = 闭包。

    ★ 洞察 (验证):
      ① 基点内部可数无穷: 空迭代家族 (R116: 0^0, 0!, 0↑↑0...)
         全投影到 pat0 (R122 全坍缩) ⟹ 收敛基点内部
      ② pat0(pat0) 定义错误: p0 原子 (R113 不可拆), pat0(pat0)
         假设"基点作用于基点" = 假设可拆
      ③ 外部自指 ≠ 内部自指: 外部定义 (pat0(pat0)) vs 基点闭包内
         自指 (不可观测) ⟹ 不可能完全等价
      ④ 塌缩: 外部 ≠ 内部 ⟹ 操作塌缩 (误差) ⟹ 返回 pat0 的
         路径永远有偏差 ⟹ 永远无法真正返回 pat0
      ⑤ 奇异性 + 闭包: 塌缩 = 奇异 (R118); 基点 0 = 闭包
         (外部操作收敛, 内部不可达)

    ★ 结论:
      基点 0 = 闭包 — 可数无穷收敛内部, pat0(pat0) 定义错误,
      外部自指塌缩, 永远无法真正返回 pat0 (奇异性)

    ★ 与既有 claim 的关系:
      - R122 (全坍缩): 本 claim 的"收敛内部"
      - R116 (空迭代家族): 可数无穷
      - R118 (奇异性): 塌缩 = 奇异
      - R113 (基点层原子): pat0(pat0) 错误依据
      - R117 (相位重合): 闭包内的汇聚
      - R072 (声明): 闭包性的声明化
      结论: 基点 0 = 闭包 (可数无穷收敛内部, 外部自指不可等价,
      塌缩奇异, 永远无法真正返回 pat0)。

  formal_math: |
    -- 可数无穷 (空迭代家族) → 收敛基点内部 (R122)
    -- pat0(pat0): 错误定义 (p0 原子, 不可拆)
    -- 外部自指 ≠ 内部自指 ⟹ 塌缩 ⟹ 无法真正返回 pat0
    -- 奇异性: 塌缩; 基点 0 = 闭包

