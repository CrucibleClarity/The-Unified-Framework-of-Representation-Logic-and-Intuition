statement:
  informal: |
    ★ 观点提出者: 用户 (2026-08-12)。层轴 vs 位序轴 + 手指/奇偶性洞察。

    ★ 层轴 vs 位序轴 (验证):
      层轴: {p^k} (单相位方向 p, log p 等差, 干净)
      位序轴: {10^k} (方向 10 = 2·5, 多相位, 污染)
      关系: 位序轴 = 层轴在多相位方向 10 上的投影
      位序进位 (×10) = 双相位升层 (×2 和 ×5)

    ★ 位序污染根源:
      方向 10 = 2·5 不是干净单相位 (多相位叠加)
      位序层结构 (10^k 的 k) 反映真实单相位层 (R099)
      位序方向 (10) 是污染的来源

    ★ 2 和 5 非偶然 (用户洞察):
      人类左右手各五指, 共十指 — 十进制源于手指数!
      2 和 5 不是偶然: 手指结构 (5 指/手, 2 手)
      2 不一定代表二进制正确: 2 的出现是手 (2 只手) 的结果

    ★ 奇偶性 = 震荡 (候选):
      奇偶性 (parity) 看起来像震荡 (R098: 简谐运动感)
      奇偶 = 震荡的极值 (±1)? 纳入候选范围

    ★ 机械验证 (R100_layer_positional.py, 枚举=证据):
      1. 位序 = 方向 10 的层轴 (log10 刻度): PASS
      2. 位序方向 10 = 2·5 (多相位): PASS
      3. 位序进位 (×10) = 双相位升层: PASS
      4. 关系: 位序轴 = 层轴在方向 10 的投影: PASS

    ★ 与既有 claim 的关系:
      - R099 (升层/降层): 位序层结构 = 真实层数
      - R097 (素数幂链): 方向 10 = 2·5 多相位
      - R098 (震荡/简谐运动): 奇偶性 = 震荡候选
      - R072 (声明): 位序轴的多相位声明
      结论: 位序轴 = 层轴在方向 10 (多相位 2·5) 上的投影; 位序污染
      源于方向 10 非单相位; 2 和 5 源于人类手指 (2 手 × 5 指);
      奇偶性 = 震荡候选。

    ★ 支撑 (Lean):
      - R099 / R097 / R098 [claim 级]
  formal_math: |
    -- 层轴: log(p^k) = k·log p (单相位方向 p)
    -- 位序轴: log10(n) = log(n)/(log2+log5) (方向 10 = 2·5, 多相位)
    -- 位序 = 层轴投影到方向 10
    -- 奇偶性: parity(n) = n mod 2 (震荡候选)

