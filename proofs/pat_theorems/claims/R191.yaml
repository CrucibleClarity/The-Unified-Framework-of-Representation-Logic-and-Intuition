statement:
  informal: |
    ★ 观点提出者: 用户 (2026-08-13)。设计交换结构: 每个问题选择
       最强的视角去解.

    ★ 唯一论点: 7 视角注册表 + 问题特征→最强视角映射 + 切换协议
       (卡住跳次强, 不暴力).

    ★ 视角注册表 (回测 R158-R190 提取):
       - 代数: 恒等式/等值 → heap_verify 先验 → ring/linarith.
       - 商映射: 模/槽位/折叠 → 模算术 → Nat.mod/padicValNat.
       - 对称: 对称/中点/镜像 → 镜像对合 S(x)=2b-x → ring.
       - 收缩: 收敛/不动点/上界 → 迭代公式 → contraction_iterate.
       - 几何: 距离/震荡/圆 → 弦长公式 → norm_exp_I_mul_ofReal_sub_one.
       - 构造: 存在/构造/形状 → ∃ 引入 → exists_intro_construction.
       - 形式化: 证明/验收 → Lean → lake build (最终一律过).

    ★ 问题特征 → 最强视角 (SELECTOR):
       - 间隔/距离/可见 → 商映射 (R184).
       - 对称/中点/成对 → 对称 (R170/R186).
       - 收敛/不动点/上界 → 收缩 (R188).
       - 震荡/圆/直径 → 几何 (R182).
       - 存在/构造/必要条件 → 构造 (R189).
       - 恒等式/等值 → 代数 (R190).
       - 证明/验收 → 形式化 (全部).

    ★ 切换协议 (卡住时, 基点跳跃的视角版):
       - 商映射缺奇偶性 → 跳几何 (4 次单位根, R175).
       - 构造缺验证 → 跳商映射 (v₂ 前提, R187).
       - 几何缺严格 → 跳形式化 (Lean 验收).

    ★ 原则: 每个问题选择最强的视角去解; 卡住跳次强, 不暴力.

