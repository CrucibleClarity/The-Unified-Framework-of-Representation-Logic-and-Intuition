statement:
  informal: |
    ★ 观点提出者: 用户 (2026-08-13)。R181 的深化: 距离 = 震荡, 上界
       = 周期圆直径, 度量可换.

    ★ 唯一论点: 距离 (度量) 在 pat 里 = 震荡 (相位差/弦长):
       |e^{iθ₁} - e^{iθ₂}| = 2|sin(Δθ/2)|; 上界 = 周期圆直径 (Δθ = π
       时 = 2); 度量泛化: 角度/弦长/任意结构, 收缩性质 (R048 单射
       无损) 是唯一要求.

    ★ 结构对应 (mechanics-pat-observation skill):
       - ★距离 = 震荡 (弦长): 单位圆上两点 exp(iθ₁), exp(iθ₂) 的
         弦长 = 2|sin((θ₁-θ₂)/2)| (mathlib norm_exp_I_mul_ofReal_
         sub_one) — 距离不是只有直线 |x-y|, 可以是圆上弦长 = 相位
         差震荡 (R175 4 次单位根投影; R047 周期轴).
       - ★上界 = 周期圆离轴最远点的距离: 弦长最大 = 2 (Δθ = π 半圈,
         直径) — 周期圆 (单位圆) 上离轴 (实轴/发散轴) 最远的点 ±I
         的距离 = 1, 弦长直径 = 2 — 震荡的上界 = 直径 (R159/R145
         临界线圆直径 2 同型; R172: 间隔 2 = 直径).
       - ★度量可换: 距离可以是角度 (相位差), 可以是弦长 (震荡),
         可以是任何"乱七八糟的奇怪东西" — 收缩映射 (R181) 的距离
         度量泛化: 只要满足收缩性质, 度量形式任意 (R048 无损:
         单射 ⟹ 无损不依赖度量形式).

  formal_math: |
    -- ★距离 = 震荡 (弦长 = 相位差震荡):
    theorem chord_length_oscillation (θ₁ θ₂ : ℝ) :
      ‖Complex.exp (Complex.I * θ₁) - Complex.exp (Complex.I * θ₂)‖ =
        2 * |Real.sin ((θ₁ - θ₂) / 2)|
    -- ★上界 = 周期圆直径:
    theorem chord_diameter_upper_bound (θ₁ θ₂ : ℝ) :
      ‖Complex.exp (Complex.I * θ₁) - Complex.exp (Complex.I * θ₂)‖ ≤ 2
    -- 上界可达 (半圈 = 直径):
    theorem chord_diameter_attained :
      ‖Complex.exp (Complex.I * 0) - Complex.exp (Complex.I * Real.pi)‖ = 2
    -- 度量泛化 (角度收缩, 换基点):
    theorem angle_contraction (θb c θ : ℝ) :
      θb + c * (θ - θb) = θb ↔ c * (θ - θb) = 0
    -- 全景:
    theorem oscillation_perspective (θ₁ θ₂ : ℝ) :
      (‖Complex.exp (Complex.I * θ₁) - Complex.exp (Complex.I * θ₂)‖ ≤ 2) ∧
      (‖Complex.exp (Complex.I * 0) - Complex.exp (Complex.I * Real.pi)‖ = 2)

