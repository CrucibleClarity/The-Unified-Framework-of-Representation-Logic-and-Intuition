user_original_words: |
  ★★★ 用户原话 (2026-08-13, 原封不动保存, 未经改写):
  "如何证明，能构造就等于存在？"

statement:
  informal: |
    ★ 观点提出者: 用户 (2026-08-13)。能构造 = 存在的证明机制.

    ★ 唯一论点: 能构造 = 存在是类型论内建规则 (∃ 引入: witness +
       验证), 定义级别等价; 需要区分完整构造 (形状 + 验证) 与形状
       约束 (部分构造).

    ★ 机制: ∃ x, P x 的证明 = 给出 witness w + 验证 P w — ⟨w, h⟩ :
       ∃ x, P x. 这不是需证明的定理, 而是类型论内建 (∃ 是 Σ 的命题
       截断) — 构造与存在证明是同一个东西.

    ★ 关键区分:
       - 完整构造 = 形状 + 性质验证: ⟨6, σ(6) = 12 = 2·6⟩ ⟹ ∃ n,
         σ(n) = 2n (偶完全数, Euclid-Euler p=2).
       - 形状约束 ≠ 存在: 45 = 5^1·3² 满足欧拉形状 (q = 5 ≡ 1 mod
         4, α = 1 ≡ 1 mod 4) 但 σ(45) = 78 ≠ 90 — 形状本身不含完全
         性. 欧拉形式 (R187/R188) 是必要条件, 形状构造 ≠ 存在构造.

    ★ 奇完全数存在性 OPEN 的原因: 欧拉形式 (必要条件) 可证, 但完整
       构造 (奇 n 满足 σ(n) = 2n) 未知 — "能构造 = 存在"成立, 但
       "形状约束"不是构造.

  formal_math: |
    -- ★构造性存在机制 (∃ 引入):
    theorem exists_intro_construction {P : ℕ → Prop} (w : ℕ) (h : P w) :
      ∃ x : ℕ, P x
    -- 完整构造实例 (6 是完全数):
    theorem six_is_perfect : σ 1 6 = 2 * 6
    theorem perfect_six_exists : ∃ n : ℕ, σ 1 n = 2 * n
    -- ★形状约束 ≠ 存在:
    theorem euler_shape_not_complete : σ 1 45 ≠ 2 * 45
    -- 全景:
    theorem construction_existence_perspective :
      (∃ n : ℕ, σ 1 n = 2 * n) ∧ (σ 1 45 ≠ 2 * 45)

objects:
