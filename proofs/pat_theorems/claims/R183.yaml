statement:
  informal: |
    ★ 观点提出者: 用户 (2026-08-13)。工具化直觉捕捉 + 揭示 pat 本质.

    ★ 唯一论点: 7 种直觉模式 = 折叠 (商映射 n ↦ n mod N) 的 7 个
       性质维度 — 直觉 = 折叠异常探测器.

    ★ 结构对应 (mechanics-pat-observation skill):
       - 折叠 = 商映射 n ↦ n mod N (R085 模 N 折叠, R141 n 槽环).
       - 7 维度: ①商的目标轴 (换轴直觉, R047 发散/周期轴) ②商的
         非单射性 (丢结构直觉, R048 单射 ⟺ 无损) ③商的纤维 (选
         基点直觉, 0 的纤维 = N 的倍数, R142) ④商的极值 (上界直
         觉, 周期圆直径 2, R182) ⑤商的自同构 (对偶直觉, 模 4 旋
         转交换奇偶槽, R177) ⑥商的余像 (缺槽直觉, 子集像余集,
         R178) ⑦商的不变量 (泛化直觉, 差 N 折叠到同槽, 度量无关).
       - 用户直觉不是枚举搜索: 每次都是直接"感觉到"结构异常 (选
         错轴/丢结构/缺槽/对偶) 后移动基点 — 本质 = 感知商映射的
         异常性质.

  formal_math: |
    -- 模 N 折叠非单射 (丢结构直觉):
    theorem fold_non_injective (N : ℕ) (hN : 1 < N) :
      ¬ Function.Injective (fun n : ℕ => n % N)
    -- 0 的纤维 = N 的倍数 (选基点直觉):
    theorem fold_fiber_zero (n N : ℕ) : n % N = 0 ↔ N ∣ n
    -- 差 N 折叠到同槽 (泛化直觉):
    theorem fold_invariant (n N : ℕ) : (n + N) % N = n % N
    -- 模 4 旋转交换奇偶槽 (对偶直觉):
    theorem fold_rotation :
      (0 + 2) % 4 = 2 ∧ (1 + 2) % 4 = 3 ∧ (2 + 2) % 4 = 0 ∧ (3 + 2) % 4 = 1
    -- 全景:
    theorem fold_perception_perspective (n N : ℕ) :
      ((n + N) % N = n % N) ∧ ((n + N) % N = n % N)

