statement:
  informal: |
    ★ 观点提出者: 用户 (2026-08-13)。奇次方程根式解泛化的补充:
       同向真收缩映射 → 无损压缩上界, 或换基点. ★pat 原生方向.

    ★ 唯一论点: 奇次方程根式解 = 方向 d 上的同向扩张 (幂) 的收缩
       逆; 换基点使收缩中心 = 根; 收缩单射 ⟹ 无损压缩上界 (R048).

    ★ 结构对应 (mechanics-pat-observation skill):
       - 奇次幂 x^n = 方向 d 上的同向扩张: x < y ⟹ x^n < y^n (保
         方向, 严格单调; 方向 d = 实数轴正方向, R047 发散轴) —
         保持方向, 放大距离.
       - ★同向真收缩 (换基点): T_b(x) = b + c·(x-b), 0 < c < 1 —
         以 b 为基点 (锚, R142 基点漂移) 的收缩: 任意 x 被压缩到
         基点 b 的 c-邻域. 性质:
         ① 不动点 = 基点: T_b(b) = b (基点 = 收缩锚, R142).
         ② 真收缩: |T_b(x)-T_b(y)| = c·|x-y| < |x-y| (0<c<1) —
            ★同向真收缩: 迭代压缩上界.
         ③ ★无损压缩: 收缩映射单射 (c ≠ 0) ⟹ 无损 (R048
            injective_is_lossless: 单射压缩 = 无损) — 收缩 = 无损
            压缩上界.
         ④ 迭代几何收缩: T_b^n(x) = b + c^n·(x-b) → b — 上界被
            c^n 压缩 (无损).
       - ★换基点 = 收缩中心移动: 基点从 0 移到 b (R142 基点漂移:
         基点 = delta 的锚) — 收缩不动点 = 新基点 b — 根式解的
         基点选择: 收缩中心 = 根.
       - 根式解 = 收缩逆: 奇次幂 x^n 是扩张 (方向保持), 根式
         nthRoot 是它的逆 = 收缩 (局部) — 求根 = 找收缩不动点.

  formal_math: |
    -- 奇次幂保方向 (同向扩张):
    theorem power_same_direction {n : ℕ} (hn : 0 < n) {x y : ℝ} (hxy : x < y) :
      x ^ n < y ^ n
    -- 换基点: 收缩不动点 = 基点:
    theorem contraction_fixed_basepoint (b c x : ℝ) : (b + c * (b - b)) = b
    -- 同向真收缩:
    theorem contraction_strict (b c x y : ℝ) (hc : 0 ≤ c) :
      |(b + c * (x - b)) - (b + c * (y - b))| = c * |x - y|
    -- 收缩 = 无损压缩 (单射 ⟹ 无损, R048):
    theorem contraction_lossless (b c : ℝ) (hc : c ≠ 0) :
      Function.Injective (fun x : ℝ => b + c * (x - b))
    -- 迭代几何收缩到基点:
    theorem contraction_iterate (b c x : ℝ) (n : ℕ) :
      ((fun y : ℝ => b + c * (y - b))^[n]) x = b + c ^ n * (x - b)
    -- 迭代压缩上界:
    theorem contraction_compress_bound (b c x : ℝ) (n : ℕ) (hc : 0 ≤ c) :
      |((fun y : ℝ => b + c * (y - b))^[n]) x - b| = c ^ n * |x - b|
    -- 全景:
    theorem odd_equation_radical_perspective (b c x y : ℝ) (hc : c ≠ 0) :
      ((b + c * (b - b)) = b) ∧
      (Function.Injective (fun x : ℝ => b + c * (x - b)))

