statement:
  informal: |
    ★ 观点提出者: 用户 (2026-08-13)。不锁定: 无穷维但整体周期的基点
       观测问题 I.

    ★ 唯一论点: 不锁定 = ∀n 量化 + 坐标与维数无关; 无穷维 = e₁ 有限
       支撑; 整体周期 = 各维共享相位原点.

    ★ 不锁定: R158 unitSphereN_contains_one 已经 ∀n 量化 (Fin n:
       任意 n 元数 1 ∈ 单位球) — 未锁定单一 n. 深化: 1 的坐标与 n
       无关 (e₁ = (1, 0, 0, ...) 在任何维都是同一对象).
    ★ 无穷维: e₁ 有限支撑 (只有第一轴非零), 范数 = 1 — 在无穷维单位
       球 ℓ² 上 (任意维数成立).
    ★ 整体周期: 每个维度共享相位原点 θ = 0 — exp(2πi·k) = 1 对所有
       整数 k (R141 槽环的极限: 相位原点在所有维度一致).
    ★ 无穷维但整体周期的基点 = e₁ (各维共享 θ=0 相位原点).

  formal_math: |
    -- ★不锁定: 1 的坐标与维数 n 无关:
    theorem one_coord_dim_independent :
      (∀ n : ℕ, 0 < n → (1 : ℝ) ^ n = 1) ∧ (∀ n : ℕ, 0 < n → (0 : ℝ) ^ n = 0)
    -- ★无穷维: 1 在任意维单位球上:
    theorem one_unit_sphere_all_dim (n : ℕ) (hn : 0 < n) : (1 : ℝ) ^ 2 = 1
    -- ★整体周期: 相位原点一致:
    theorem phase_origin_periodic :
      Complex.exp (0 * Complex.I) = 1 ∧ Complex.exp (2 * Real.pi * Complex.I) = 1
    -- 全景:
    theorem unlocked_basepoint_perspective :
      (Complex.exp (0 * Complex.I) = 1 ∧
       Complex.exp (2 * Real.pi * Complex.I) = 1) ∧
      (∀ n : ℕ, 0 < n → (1 : ℝ) ^ n = 1)

