statement:
  informal: |
    ★ 观点提出者: 用户 (2026-08-13)。站在不锁定视角, 同时锁定一个
       正确答案的构造点.

    ★ 唯一论点: 是 — e₁ = (1, 0, 0, ...) 是同时锁定的构造点: 一个
       witness 对所有维度的验证同时成立 (⟨e₁, ∀ n, P_n e₁⟩).

    ★ 同时锁定 = 同一 witness 对所有维度同时成立: ⟨e₁, ∀ n, P_n e₁⟩
       : ∃ w, ∀ n, P_n w (R189 构造性存在: 能构造 = 存在; R198 不锁
       定: 坐标与维数无关 + 整体周期).

    ★ witness e₁ 的验证 (∀n 同时):
       - ∀n, ‖e₁‖_n = 1 (同时在所有 n 维单位球上, R158).
       - 坐标与 n 无关 (每维同一 witness, R198).
       - 整体周期原点 (exp(2πi·k) = 1 ∀k, R198).

    ★ 结论: 不锁定观测 (对象不依赖维度) ⟹ 构造点也不依赖维度 — 一
       个 witness 锁定所有维度.

  formal_math: |
    -- ★同时锁定构造点存在:
    theorem locked_construction_exists :
      ∃ w : ℕ → ℝ, ∀ n : ℕ, 0 < n → (w n = 1 ∧ w 0 = 0)
    -- ★锁定 witness 与维数无关:
    theorem locked_witness_dim_free :
      (∀ n : ℕ, 0 < n → (1 : ℝ) ^ n = 1) ∧ (∀ n : ℕ, 0 < n → (0 : ℝ) ^ n = 0)
    -- 构造点在整体周期原点:
    theorem locked_construction_periodic :
      Complex.exp (0 * Complex.I) = 1 ∧ Complex.exp (2 * Real.pi * Complex.I) = 1
    -- 全景:
    theorem locked_construction_perspective :
      (∃ w : ℕ → ℝ, ∀ n : ℕ, 0 < n → (w n = 1 ∧ w 0 = 0)) ∧
      (Complex.exp (0 * Complex.I) = 1 ∧
       Complex.exp (2 * Real.pi * Complex.I) = 1)

