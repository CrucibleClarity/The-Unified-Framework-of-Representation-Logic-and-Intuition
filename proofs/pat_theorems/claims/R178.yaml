statement:
  informal: |
    ★ 观点提出者: 用户 (2026-08-13)。形式化实数轴在 pat 上的映射
       架构图景 — pat 上哪些位置实数轴 (的子集) 永远不出现.

    ★ 唯一论点: 4 次单位根投影 n ↦ I^n (R175: 奇偶 = 实/虚轴; R141:
       4 槽环) 下, 实数轴的不同子集覆盖不同槽位组合, 每个子集都
       有"永远不出现"的 pat 位置:

       | 实数轴子集 | 槽位 (n mod 4) | 缺失 |
       |---|---|---|
       | 自然数 ℕ | {0, 1, 2, 3} | 无 (全覆盖) |
       | 偶数 | {0, 2} | 实轴 (R175) |
       | 奇数 | {1, 3} | 虚轴 (R175) |
       | **素数** | {1, 2, 3} | **★0 槽 (+1)** |
       | **考拉兹循环 {1,4,2}** | {0, 1, 2} | **★3 槽 (-I)** |

    ★ 核心观测:
       1. **素数像永不落 0 槽** (prime_pow_I_never_one): p mod 4 = 0
          ⟺ 4 | p ⟺ p = 4k (k ≥ 1) 是合数 — 素数永不 ≡ 0 (mod 4),
          I^p ≠ 1 — **pat 的 +1 位置是素数永远不出现的位置** —
          素数是缺 0 槽的实数轴子集.
       2. **考拉兹循环 {1, 4, 2} 像缺 3 槽** (collatz_cycle_pow_
          never_neg_I): 1 ≡ 1, 4 ≡ 0, 2 ≡ 2 (mod 4) — 循环中永不
          出现 ≡ 3 (mod 4) 的数 — 循环 pat 像 {I, 1, -1} 缺 3 槽
          (-I, 虚轴负侧) — 循环相位 1 槽 → 0 槽 → 2 槽 → 1 槽,
          永远跳过 3 槽.
       3. **映射架构图景**: "实数轴视角下丢失的槽" = 其子集 (素数/
          轨道) 在 pat 投影下的空缺槽位 — 不是实数轴本身丢失,
          而是子集的像有结构性空缺.

  formal_math: |
    -- 素数永不 ≡ 0 (mod 4):
    theorem prime_mod_four_never_zero {p : ℕ} (hp : Nat.Prime p) : p % 4 ≠ 0
    -- ★素数像永不落 0 槽 (I^p ≠ 1):
    theorem prime_pow_I_never_one {p : ℕ} (hp : Nat.Prime p) : Complex.I ^ p ≠ 1
    -- 循环 {1, 4, 2} 槽位 = {0, 1, 2}:
    theorem collatz_cycle_mod_slots :
      1 % 4 = 1 ∧ 4 % 4 = 0 ∧ 2 % 4 = 2
    -- ★循环像永不落 3 槽 (无 -I):
    theorem collatz_cycle_pow_never_neg_I :
      Complex.I ^ 1 ≠ -Complex.I ∧
      Complex.I ^ 4 ≠ -Complex.I ∧
      Complex.I ^ 2 ≠ -Complex.I
    -- 全景:
    theorem real_axis_pat_mapping_perspective {p : ℕ} (hp : Nat.Prime p) :
      (Complex.I ^ p ≠ 1) ∧
      (1 % 4 = 1 ∧ 4 % 4 = 0 ∧ 2 % 4 = 2) ∧
      (Complex.I ^ 1 ≠ -Complex.I ∧
       Complex.I ^ 4 ≠ -Complex.I ∧
       Complex.I ^ 2 ≠ -Complex.I)

