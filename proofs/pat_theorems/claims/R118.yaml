  informal: |
    ★ 观点提出者: 用户 (2026-08-12)。奇异性与基点 0 的关系。

    ★ 等式: p0 = inverse(app(p0,p0))
      自应用 p1 = app(p0,p0) (参数重合) = 应用的奇异情形
      逆 (提取参数对) 无法区分相同参数 ⟹ 坍缩到 p0 (基点)

    ★ 数学内容 (验证):
      ① 左逆: leftInv(app(a,b)) = a (提取第一参数)
      ② 自应用: app(p0,p0) 参数重合 — 逆无法区分顺序 (奇异)
      ③ inverse(app(p0,p0)) = p0 (唯一可提取参数 = 基点)
      ④ 推广: inverse(app(pk,pk)) = pk (自应用逆 = 自身)
      ⑤ 闭环: app(p0,p0) → inverse → p0 (基点收束)

    ★ 核心定理 (Lean 验收, SingularityBasepoint.lean, 无 sorry):
      ① left_inverse_app: 左逆提取第一参数
      ② self_app_inverse_basepoint: inverse(app(p0,p0)) = p0
      ③ singular_anchor_basepoint: 奇异性锚定基点 (且 p1 ≠ p0)
      ④ self_app_inverse_general: 一般自应用逆 = 自身

    ★ 与既有 claim 的关系:
      - R117 (基点相位叠加重合): 基点 = 汇聚点 (相位 0)
      - R116 (空迭代家族): 基点层的无数投影
      - R114 (p3 配对): 自应用结构
      - R113 (基点层): p0 = basepointLayer
      - R072 (声明): 奇异性-基点关系的声明化
      结论: 自应用 (参数重合 = 奇异) 的逆 = 基点 0;
      奇异性锚定在基点 (闭环)。

    ★ 支撑 (Lean):
      - SingularityBasepoint.lean (4 定理, 0 sorry)
  formal_math: |
    -- 左逆: leftInv(app a b) = a
    -- 奇异: app(p0,p0) 参数重合, 逆坍缩到 p0
    -- inverse(app(p0,p0)) = p0 (基点闭环)
    -- 一般: inverse(app(pk,pk)) = pk

