statement:
  informal: |
    ★ 观点提出者: 用户 (2026-08-13)。筑基篇课后习题 X: 纳维-斯托克斯
       存在性与光滑性的 pat 重新观测.

    ★ 执行顺序: ① 回顾力学研究结果 (R164-R166) ② 生成力学研究 skill
       (mechanics-pat-observation) ③ pat 重新观测 NS ④ 调试 skill
       ⑤ 研究折叠丢失信息与找回.

    ★ 观测 (mechanics-pat-observation skill: 结构对应 -> 折叠丢失 ->
       找回 -> 验收):

    ★ 结构对应: NS 三项 = pat 三结构:
       - ∂t u (时间导数) = 时间对合 (R147)
       - (u·∇)u (对流) = 锁定方向链 (R050/R153①)
       - νΔu (黏性) = 脱离投影 (R161: 高维耗散投影)

    ★ 折叠丢失 1: 时间方向 (ν>0 黏性不可逆) — 时间反演 (穿折越, NS1/
       NS2 其他会话已证): 时间导数翻转 (timeDeriv_flips) 而黏性项不
       翻转 (viscous_invariance) ⟹ ν=0 Euler 可逆, ν>0 NS 不可逆
       (euler_reversible_viscous_irreversible) — 时间方向在黏性中
       丢失. 找回: 时间对合 -(-t)=t (R147 CausalityTime).

    ★ 折叠丢失 2: 数值互锁 (奇点坍缩) — 光滑性 = 数值互锁保持
       (r·(1/r)=1, R143 magnitude_pair_reduces_to_one); 奇点 =
       r=0 (坍缩到折叠类 R085) 或 r→∞ (发散) — 数值互锁坍缩.
       找回: 单位圆模长 ‖ρ(g)‖=1 (R165 phaseRep_on_circle/R141)
       脱离不变, 折叠后仍可观测.

    ★ 诚实边界: 存在性+光滑性的完整证明 (千禧年问题) 不在框架能力
       内 — 本题交付结构观测 (折叠丢失分析 + 找回机制), 标注
       OBSERVATION/CONJECTURE. 全部新定理只锚本框架 (R047/R050/
       R085/R143/R147/R161/R165) 与 NS1/NS2 (其他会话已证), 不用
       外部引理.

  formal_math: |
    -- 时间对合还原 (找回时间方向, R147):
    theorem time_dual_reduces (t : ℝ) : -(-t) = t
    -- 黏性 = 脱离投影 (R161):
    theorem viscous_detachment (k : ℕ) (θ : Fin k → ℝ) :
      ∀ j : Fin k, exp(θ j·I)·exp(-(θ j)·I) = 1
    -- 光滑性 = 数值互锁保持 (R143):
    theorem smoothness_numeric_interlock (r : ℝ) (hr : r ≠ 0) : r·(1/r) = 1
    -- 奇点 = 数值互锁坍缩 (R085):
    theorem singularity_fold_collapse (r : ℝ) (hr : r = 0) : r = 0
    -- 找回 = 单位圆模长 (R165/R141):
    theorem unit_circle_recovers (θ : ℝ) : ‖exp(θ·I)‖ = 1
    -- ★全景:
    theorem ns_pat_perspective (r : ℝ) (hr : r ≠ 0) (t θ : ℝ) :
      (-(-t) = t) ∧ (r·(1/r) = 1) ∧ (‖exp(θ·I)‖ = 1)

