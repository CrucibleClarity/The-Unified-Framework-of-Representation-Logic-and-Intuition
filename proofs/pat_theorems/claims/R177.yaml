statement:
  informal: |
    ★ 观点提出者: 用户 (2026-08-13)。R176 的补充观测: 找偶奇奇 的
       周期观测基点和轴.

    ★ 唯一论点: 旋转基点 I (90° 相位基点) 轴 = 奇偶互翻轴:
       R175 的 4 次单位根投影 (p ↦ I^p) 下奇偶 = 实/虚轴 (奇 →
       虚轴 ±I, 偶 → 实轴 ±1). 乘法基点取 I (90° 旋转): 观测
       (I·I^p) —
       - p 奇 → I^p = ±I → I·I^p = ∓1 (实轴 = 偶槽) — 奇数被观测
         为偶.
       - p 偶 → I^p = ±1 → I·I^p = ±I (虚轴 = 奇槽) — 偶数被观测
         为奇.
       即: 基点旋转 I 交换实/虚轴 = 交换奇偶槽.

    ★ 偶奇奇 循环观测: 考拉兹循环 1 → 4 → 2 → 1 (原轴观测为 奇偶偶,
       R176 collatz_cycle_142) 在旋转基点 I 下: I·I^1 = I·I = -1
       (实轴 = 偶槽), I·I^4 = I·1 = I (虚轴 = 奇槽), I·I^2 = I·(-1)
       = -I (虚轴 = 奇槽) — 观测序列 偶奇奇 循环 (再回到 1 → 偶).
       同一循环, 不同基点观测: 奇偶偶 ↔ 偶奇奇 — 奇偶模式是基点
       观测的函数 (R142/RulerDelta: 基点 = delta 的锚, 基点旋转
       改变观测).

    ★ 合并步补充: 单步视角奇数 → 3n+1 必偶 (R176 collatz_odd_step_
       even); 合并步视角 (奇数两步合并 = (3n+1)/2): n ≡ 3 (mod 4)
       → (3n+1)/2 = 6k+5 仍为奇数 — 合并步轨道上连续奇数可能出现
       ("奇数必落偶数槽"是单步 3n+1 的性质, 非合并步性质).

  formal_math: |
    -- 旋转基点 I 交换奇偶轴 (奇 → 实轴):
    theorem I_rot_swaps_axis {p : ℕ} (hp : Odd p) :
      Complex.im (Complex.I * Complex.I ^ p) = 0
    -- 旋转基点 I 下偶数被观测为奇 (偶 → 虚轴):
    theorem I_rot_swaps_axis_even {p : ℕ} (hp : Even p) :
      Complex.re (Complex.I * Complex.I ^ p) = 0
    -- 偶奇奇 循环观测:
    theorem collatz_cycle_even_odd_odd :
      Complex.I * Complex.I ^ 1 = -1 ∧
      Complex.I * Complex.I ^ 4 = Complex.I ∧
      Complex.I * Complex.I ^ 2 = -Complex.I
    -- 合并步可输出奇数:
    theorem odd_merged_step_parity (k : ℕ) :
      Odd (((3 * (4 * k + 3) + 1) / 2))
    -- 全景:
    theorem eoo_perspective (p : ℕ) (hp : Odd p) :
      (Complex.im (Complex.I * Complex.I ^ p) = 0) ∧
      (Complex.I * Complex.I ^ 1 = -1 ∧
       Complex.I * Complex.I ^ 4 = Complex.I ∧
       Complex.I * Complex.I ^ 2 = -Complex.I)

