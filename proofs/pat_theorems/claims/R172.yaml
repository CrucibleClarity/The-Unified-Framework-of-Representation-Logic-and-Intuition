statement:
  informal: |
    ★ 观点提出者: 用户 (2026-08-13)。筑基篇课后习题 XV: 孪生素数
       猜想的 pat 重新观测.

    ★ 唯一论点: 孪生素数对 = 间隔 2 的素数对称对 (关于中点 p+1
       对称, p + (p+2) = 2(p+1) 哥德巴赫分解); 间隔 2 = 临界线圆
       直径 (R159) = 奇偶性折叠周期 (R171); 猜想 = 无穷多间隔 2
       的素数对称对.

    ★ 结构对应 (mechanics-pat-observation skill):
       - (p, p+2) 关于 p+1 对称: (p+2)-(p+1) = -(p-(p+1)) (R170
         哥德巴赫对称对: p+q=2n ⟺ q-n = -(p-n); R085 折叠类)
       - p + (p+2) = 2(p+1): 孪生素数对之和 = 偶数 (哥德巴赫分解,
         R170)
       - 间隔 2 = 临界线圆直径: 0,2 ∈ 临界线圆 (R159 twin_gap_is_
         circle_diameter; R145 critical_circle_points: ‖2-1‖=‖0-1‖=1)
       - 间隔 2 = 奇偶性折叠周期: 模 2 折叠周期 = 2 (R171 even_is_
         symmetric_pair: 2n=n+n; R141 2 槽环)
       - 孪生素数对都是奇数: 素数奇偶性坍缩 (R171 primes_parity_
         collapse: Prime p → p≠2 → Odd p)

    ★ ★孪生素数猜想 pat 转译: 存在无穷多间隔 2 的素数对称对 {p,
       p+2} — 间隔 2 = 临界线圆直径 (R159) = 奇偶性折叠周期 (R171),
       素数对称对 (哥德巴赫结构, R170) 的无穷多存在性. 诚实边界:
       未证 (CONJECTURE; 张益唐 2013: 无穷多间隔 < 7×10^7 素数对,
       外部文献仅对照非证明).

  formal_math: |
    -- 孪生素数对 = 对称对 (关于 p+1):
    theorem twin_pair_symmetric (p : ℝ) : (p+2)-(p+1) = -(p-(p+1))
    -- 孪生素数对之和 = 偶数 (哥德巴赫分解):
    theorem twin_pair_sum_even (p : ℝ) : p + (p+2) = 2*(p+1)
    -- 间隔 2 = 临界线圆直径:
    theorem twin_gap_circle_diameter : ‖(2:ℂ)-1‖ = 1 ∧ ‖(0:ℂ)-1‖ = 1 ∧ ‖(2:ℂ)-0‖ = 2
    -- 间隔 2 = 奇偶性折叠周期:
    theorem twin_gap_parity_period (n : ℝ) : 2*n = n + n
    -- 孪生素数对都是奇数:
    theorem twin_primes_odd {p : ℕ} (hp₁ : Nat.Prime p) (hp₂ : Nat.Prime (p+2))
      (h2 : p ≠ 2) : Odd p
    -- ★猜想 = 无穷多间隔 2 素数对称对 (CONJECTURE):
    theorem twin_prime_conjecture_pat (p : ℝ) :
      ((p+2)-(p+1) = -(p-(p+1))) ∧ (p+(p+2) = 2*(p+1))
    -- ★全景:
    theorem twin_prime_pat_perspective (p n : ℝ) :
      ((p+2)-(p+1) = -(p-(p+1))) ∧ (p+(p+2) = 2*(p+1)) ∧
      (2*n = n+n) ∧ (‖(2:ℂ)-1‖ = 1)

