statement:
  informal: |
    ★ 观点提出者: 用户 (2026-08-13)。筑基篇课后习题 II (exercise_i_1):
       各数域的 1 的 pat 展开。

    ★ 习题定位: 筑基篇课后习题系列第二题。用户纠正②扩展: 不只 √2/2,
       还要复数、任意元数、超越数的展开。前置三节为固定格式 (用户指定,
       列在文章开始): ① pat 单相位数 1 的表达 ② 各数域 pat 构造 1 的
       对应点 ③ tokenizer 直觉数字/构造数字 token 列。

    ★ 唯一论点: 每个数域的 1 = 该数域对称对的还原锚点 (R144: 0 ↔ 1
       对偶; R143: 对称对还原到 1); 数值 1 不是预设, 从各数域自己的
       对称结构还原出来。

    ★ 四类数域展开 (每类锚到已证 claim):
      ① 无理数 √2/2: 单位 1 在 θ=45° (π/4) 格点投影位置 (R154 用户
         指示 ⑨⑩); sin²(π/4) = 1/2 由三角恒等式推出 (sin = cos at
         45° + sin²+cos²=1), 非手工开方; 进入 pat 展开规范化
         (sin_cos_three: ‖(sin(π/2)-i)(sin(π/4)+i)‖² = 3)
      ② 复数: 1 = θ=0 格点 (completePat1 0 0 1 = 1+0i, 相位0=数值1
         重合); i = θ=π/2 格点 (completePat1 0 (π/2) 1 = i); i² = -1
         = exp(π·I) (R146 pat_constructs_pi: π = 1 的镜像); 1 ∈
         四相位互锁 {1,-1,i,-i} (R149 quadriphase_interlock)
      ③ 任意元数: 4 相位互锁归一化 = S³ (R154 S3Point); 任意元数域
         的 1 = 单位球基点相位 S³ 点 (1,0) (数值 1 在 1 轴, i 轴分量
         为 0); 无损内收到单位圆 (R154 contract_to_circle: z/‖z‖ ∈ S¹,
         R048 无损, R147 收敛方向, R138 相位锁定) — 任意维数的 1
         还原到同一单位圆, pat 是通用表示
      ④ 超越数: π = 1 的镜像 (R146 pat_constructs_pi: exp(π·I) = -1,
         半圈旋转 1 → -1 → 1, R085 折叠类, R143 对称对还原); e =
         exp(1) 单位速度 (R146 开放点⑥: e 未单独构造, log 基点相位
         未对齐 RulerTernary 批判, 留待后续); e 是相位载体 (R154:
         sin/cos 是 e^{iθ} 分量, exp(i·π/4) = √2/2·(1+i) 连接无理数
         √2/2 与超越数 e^{iθ})

    ★ 组合: number_ones_pat_perspective — 无理数 ∧ 复数 ∧ 任意元数
       ∧ 超越数的 1 全部是"对称对还原锚点"。

    ★ tokenizer 节 (用户纠正③): 本节 token 列为临时稿, 肯定有错误
       的地方 (eid 对应关系/构造链细节), 用户日后会想办法纠正 —
       当前仅作方向性参考, 不视为最终规范。

    ★ 诚实边界: 全部为结构侧写; 新定理 8 个全部只锚本框架 (R146/
       R149/R154/R143/R144), 不用外部引理 (R153 用户纠正精神延续)。

  formal_math: |
    -- ① 无理数 √2/2 (R154 已证):
    theorem sin_cos_three : ‖((sin (π/2) : ℂ) - I) * ((sin (π/4) : ℂ) + I)‖^2 = 3
    -- ② 复数 (本文件新增):
    theorem complex_one_locked_form : completePat1 (0 : ℂ) 0 1 = 1
    theorem imaginary_one_quarter_turn : completePat1 (0 : ℂ) (π/2) 1 = I
    theorem i_sq_is_pi_mirror : I^2 = -1 ∧ exp (π·I) = -1
    theorem quadriphase_contains_one :
      1*(1/1)=1 ∧ exp(0)·exp(-0)=1 ∧ log 1 + log(1/1)=0 ∧ ‖exp(0)‖=1
    -- ③ 任意元数 (本文件新增 + R154 锚定):
    theorem s3_contains_numeric_one : ((1:ℂ),(0:ℂ)) ∈ S3Point
    theorem hypercomplex_one_contracts : ‖(1:ℂ)/‖(1:ℂ)‖‖ = 1
    -- ④ 超越数 (本文件新增 + R146 锚定):
    theorem pi_is_one_mirror : exp (π·I) = -1 ∧ -(-1) = 1
    -- 全景 (本文件新增):
    theorem number_ones_pat_perspective :
      sin²(π/4) = 1/2 ∧ completePat1 0 0 1 = 1 ∧ completePat1 0 (π/2) 1 = I
      ∧ ((1:ℂ),(0:ℂ)) ∈ S3Point ∧ exp (π·I) = -1

