id: R103
title: "R103 (user-proposed 2026-08-12): limb/fin structure does NOT determine number-sense ceiling (mosquitofish and guppy share 7 fins, Poeciliidae, yet ceilings 3 vs 4); no-fin undulating animals (snakes/cephalopods/worms) have NO direct numerosity studies found; the ratio 1:2 evidence must NOT be attributed to delta (杜鹃 counterexample refutes); OPEN: neural-system structure (sympathetic/parasympathetic/enteric) and attention mechanisms, single-cell/prokaryote/primitive-reflex studies"
