statement:
  informal: |
    ★ 观点提出者: 用户 (2026-08-12)。因果与时间 = 成对互锁的对称方向。

    ★ 主张内容 (每环锚到已证 claim):
      ① 因果是方向: 因果箭头 (因 e → 果 f) = 相位差 (RulerPhase: 相位差
         = 方向; R138: 相位关系锁定)
      ② 因果必须成对互锁声明: 单方向因果声明 = 特权方向污染 (R136 ②③:
         方向必须按对称性成对一次性声明; R062: 特权方向 = nat 污染) —
         因果对 {因→果, 果→因} 组合还原到折叠类 0 (R085: 0 = ±1 折叠
         类; R143: 对称对还原)
      ③ 因果有发散与收敛两个对称方向: 发散方向 (果展开, R047 发散轴) +
         收敛方向 (因还原/周期, R047 周期轴) — 同一共轭对称性的两个
         特征空间, 正交 (R047 orthogonal_axes)
      ④ 时间同样: 时间箭头 (过去→未来) 必须成对 — 未来/过去 = 对合
         对称对 (时间圆, RulerTimeCircle: 一半未来一半过去; R085 镜像
         对合 S² = id; RulerPT: T det=-1 单轴 π 相位; NS1:
         timeRev_timeRev)
      ⑤ 因果 × 时间联合互锁: 因果对与时间对都还原到折叠类 0 (R139/R144:
         对称对还原到锚点) — 表达因果/时间必须按形式化过程互锁相位
         (R136 ②③ 方法)
      ⑥ 单方向因果 = 未锁定: 只有因→果 (无果→因) = 位置不唯一 (R140
         single_symmetry_underdetermines: 单组对称性不能准确锁定; R130:
         剥离方向不可判定)

    ★ 验证结论: 用户断言成立 — 因果是方向, 必须成对互锁声明; 因果与
       时间都有发散与收敛两个对称方向 (R047 同一对称性); 表达因果/
       时间 = 形式化互锁相位。

  formal_math: |
    -- 因果 = 相位差方向 (RulerPhase):
    theorem causality_is_phase_direction (e f : ℝ) :
      phaseRelation e f = f - e
    -- 因果对还原到折叠类 0 (R085/R143):
    theorem causality_pair_reduces (e f : ℝ) :
      (f - e) + (e - f) = 0
    -- 因果发散/收敛双方向正交 (R047):
    theorem causality_dual_axes (t : ℝ) :
      proj (lift t * J) = 0
    -- 时间对合: 未来 ↔ 过去 (R085/RulerTimeCircle):
    theorem time_dual_directions (t : ℝ) : -(-t) = t
    -- 因果 × 时间联合互锁 (R139/R144):
    theorem causality_time_mutual_lock (c t : ℝ) :
      c + (-c) = 0 ∧ t + (-t) = 0
    -- 单方向因果 = 未锁定 (R140):
    theorem single_causality_underdetermines (e d : ℂ) (hd : d ≠ 0) :
      e + (0 : ℂ) * d ≠ e + (1 : ℂ) * d

