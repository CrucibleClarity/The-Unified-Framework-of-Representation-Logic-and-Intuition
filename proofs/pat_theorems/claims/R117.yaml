statement:
  informal: |
    ★ 观点提出者: 用户 (2026-08-12)。基点相位叠加重合定理。

    ★ 定理内容:
      所有空迭代结构 (0^0, 0!, 0↑↑0, 1^0, ...) 的相位 = 0
      (空操作 = 恒等 = 相位 0, 不转)
      在基点 0 (pat0/basepointLayer) 处全部重合 (同一相位 0)
      ⟹ 无数'1'在基点层相位叠加 = 同一相位

    ★ 验证:
      ① 空迭代家族全 = 1 (R116): 0^0, 0!, 0↑↑0, 1^0
      ② 空迭代相位 = 0 (不操作, 不转)
      ③ 卡特兰配对 → patk (k≥1, 非 pat0) (R115)
      ④ 重合: 所有空迭代在基点 0 相位重合

    ★ 分层规律 (R115+R116 统一):
      pat0 (基点层): 无数 (空迭代家族, 相位 0 重合)
      patk (k≥1): 卡特兰 C_{k+1} 个配对
      ⟹ 基点相位叠加重合: 空迭代在 pat0 重合, 配对在 patk

    ★ 与既有 claim 的关系:
      - R116 (空迭代家族): 本定理的相位视角
      - R115 (卡特兰计数): 分层规律的另一半
      - R113 (基点层): pat0 = basepointLayer
      - R072 (声明): 相位重合的声明化
      结论: 空迭代家族相位 0, 在基点 0 重合; 卡特兰配对投影 patk;
      基点相位叠加重合定理成立。

  formal_math: |
    -- 空操作 = 恒等 = 相位 0
    -- 空迭代家族 → pat0 (重合, 相位 0)
    -- 卡特兰配对 → patk (k≥1)

