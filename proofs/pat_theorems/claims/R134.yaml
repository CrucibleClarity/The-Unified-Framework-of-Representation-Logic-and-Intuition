statement:
  informal: |
    ★ 观点提出者: 用户 (2026-08-12)。pat0 吸收性 (防污染规则)。

    ★ 洞察 (验证):
      防止 pat0 自指定义的污染 ⟹ 对 pat0 的任何操作都必须等于 pat0:
      ① 自应用: pat0(pat0) = pat0 (R120)
      ② 折叠: S(pat0) = pat0 (R085: 镜像不动点)
      ③ 升层: layerUp(pat0) = pat0 ⟹ pat1 = pat0 (R122 全坍缩)
      ④ 吸收性 ⟹ 全坍缩 (R122)
      ⑤ 吸收性 = 闭包 (R123: 任何操作返回 pat0, 内部不可达)

    ★ 核心定理 (Lean 验收, Pat0Absorbing.lean, 0 sorry):
      吸收公理 (构造规则, 非自由结构等式):
      ① absorbing_axiom: 自应用+升层都吸收 (公理)
      ② self_app_absorbing: pat0(pat0) = pat0 (R120)
      ③ layer_absorbing: layerUp(pat0) = pat0 ⟹ pat1 = pat0 (R122)
      ④ absorbing_implies_collapse: 吸收 ⟹ 全坍缩
      ⑤ absorbing_is_closure: 吸收 = 闭包 (R123)

    ★ 与既有 claim 的关系:
      - R120 (p0(p0)=p0): 吸收性特例
      - R085 (镜像不动点): 折叠吸收
      - R122 (全坍缩): 吸收 ⟹ 坍缩
      - R123 (基点闭包): 吸收 = 闭包
      - R072 (声明): 吸收性的声明化
      结论: pat0 吸收性 (防污染构造规则) — 任何操作返回 pat0;
      全坍缩 (R122) + 闭包 (R123) 的根源。

  formal_math: |
    -- 吸收公理: app(pat0,pat0) = pat0 ∧ layerUp(pat0) = pat0
    -- 自应用吸收 (R120): pat0(pat0) = pat0
    -- 升层吸收 ⟹ 全坍缩 (R122): pat1 = pat0
    -- 吸收 = 闭包 (R123): 任何操作返回 pat0

