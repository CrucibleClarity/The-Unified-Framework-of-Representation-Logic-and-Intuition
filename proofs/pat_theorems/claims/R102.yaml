statement:
  informal: |
    ★ 观点提出者: 用户 (2026-08-12)。蝙蝠/水生/跨模态数感知检索。

    ★ 鱼类 (水生, 群居, 检索):
      ① 食蚊鱼 (mosquitofish): 区分数量 ≤3; 之后按比率 1:2 区分
         (两组数量比 1:2 才能分辨)
      ② 孔雀鱼 (guppies): 区分 ≤4; 之后按比率
      ③ ⟹ 鱼类数感知: 小量精确 (PIS), 大量按比率 (delta/log 相对)!
         — 比率 1:2 = log 差恒定 = delta 相对性!

    ★ 大鼠 (啮齿, 跨模态):
      ① 学会按指定次数压杠杆取食 (计数压杆次数)
      ② Church & Meck: 大鼠"加法"光闪数 + 音调数 = 期望压杆次数
         — 数感独立于模态 (跨视觉/听觉)!
      ③ ⟹ 数感是抽象结构, 非模态依赖

    ★ 杜鹃/鸟类 (用户纠正):
      宿主幼鸟活不活都没关系 ⟹ 宿主认知不是 delta 结构
      鸟类雏鸟掉出窝就不认识 (个体识别基于巢内位置, 非个体特征)
      — 位置识别, 非 delta 结构 (用户: 肯定不是 delta)

    ★ 论文引用价值 (用户: 目标是找回原生的数感):
      动物数感 = 相对性 (比率/delta) + 小量精确 (PIS) + 跨模态抽象
      — 支持"原生数感 = 相对性"假设 (RulerDrift 的生物学证据)

    ★ 与既有 claim 的关系:
      - RulerDrift (数值漂移位置不变): 比率感知 = delta 相对性
      - R101 (两大系统 ANS/PIS): 鱼类证据支持
      - R098 (震荡): 奇偶性候选 (未检索到直接证据)
      - R072 (声明): 原生数感的声明化
      结论: 鱼类按比率 (1:2) 感知 (delta 相对), 大鼠跨模态计数
      (抽象数感); 杜鹃宿主认知非 delta (用户纠正); 原生数感 =
      相对性 — 论文引用。

    ★ 支撑:
      - Wikipedia: Number sense in animals (Fish/Rats 段)
      - Church & Meck (1984) 跨模态加法
  formal_math: |
    -- 鱼类: 小量精确 (≤3-4, PIS); 大量按比率 1:2 (delta/log 相对)
    -- 大鼠: 计数压杆 + 跨模态加法 (光闪 + 音调)
    -- 杜鹃宿主: 非 delta 认知 (用户纠正)

