statement:
  informal: |
    ★ 观点提出者: 用户 (2026-08-12)。语言学证据 + 模糊 token 失败关联。

    ★ Pirahã 实验 (Frank, Everett et al., 决定性证据):
      ① 实验1 (逐个加线轴): hói=1, hoí=2, "many">2
      ② 实验2 (从 10 减): hói 在剩 6 个时就用, 剩 3 个时全用
      ③ 结论: hói/hoí 是相对比较词 ("few/fewer"), 非绝对数词 ("one/two")
      ④ ⟹ 数值漂移 (同一词, 情境决定) — RulerDrift 的语言学证据!
      ⑤ 无单复数语法区分 (代词也无)

    ★ 进制起源 (Numeral linguistics):
      十进制 = 数手指; 二十进制 = 手脚趾
      八进制 = 数指间空隙 (加州, attested!)
      十二进制 = 数指关节 (4指×3关节)
      ⟹ 离散化方案是构造选择 (手指/空隙/关节都可), 非结构必然

    ★ 模糊 token 实验失败关联 (用户):
      模拟模糊直觉的模糊 token 比较实验一直没训练成
      ⟹ 问题根源 = 数感污染 (R104): 相对量词被当绝对数, 模糊被当精确
      ⟹ 同 R065 (训练不稳): 监督缺相对性维度

    ★ 数值越小越精确越大越模糊 (用户):
      与注意力有关 — 人类注意力机制研究待检索

    ★ 与既有 claim 的关系:
      - RulerDrift (数值漂移): Pirahã hói 漂移 (1 vs ≤6)
      - R104 (数感污染): 相对量词被解释成绝对数
      - R065 (训练不稳): 模糊 token 失败同构
      - R059 (离散化选择): 进制起源 = 构造选择
      - R082 (预设概念): "1/2" 预设遮蔽相对性
      结论: Pirahã 相对量词 = 数感污染语言学证据; 进制起源 = 离散化
      构造选择; 模糊 token 失败 = 数感污染同构。

    ★ 支撑 (检索):
      - Wikipedia: Pirahã language (Frank, Everett et al. 实验)
      - Wikipedia: Numeral (linguistics) (进制起源)
  formal_math: |
    -- Pirahã: hói 加法情境=1, 减法情境=≤6 (相对词)
    -- 进制: 10=手指, 8=指间空隙, 12=指关节
    -- 离散化 = 构造选择

