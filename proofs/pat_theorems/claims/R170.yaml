statement:
  informal: |
    ★ 观点提出者: 用户 (2026-08-13)。筑基篇课后习题 XIII: 哥德巴赫
       猜想的 pat 重新观测.

    ★ 唯一论点: p + q = 2n ⟺ p, q 关于 n 对称 (q = 2n - p) —
       哥德巴赫分解 = 素数对称对, 关于偶数中心 n 折叠还原.

    ★ 结构对应 (mechanics-pat-observation skill):
       - 2n = p + q = 对称对 {p, q} = {p, 2n-p} 关于 n (R085: 折叠
         类; R136 ②③: 对称性成对声明) — 代数等价 q = 2n - p
       - 镜像对合: S(x) = 2n - x, S² = id (R085/R128: 任意基点镜像
         对合) — 素数对称对经两次镜像还原
       - 中心不动点: S(n) = n (R085: 折叠中心) — 对称对关于 n 折叠
       - 对称中点: q - n = -(p - n) (R085: 0 = ±1 折叠类; R143:
         对称对还原到中心)
       - 素数 = 方向 log p (R159 prime_log_monophase: log(p^k) =
         k·log p; R146 pat_constructs_prime)

    ★ ★哥德巴赫 pat 转译: 每个偶数 2n (n > 1) 存在素数对称对 {p, q}
       关于 n — 两个素数方向在中心 n 折叠还原 (R085). 诚实边界:
       强哥德巴赫未证 (CONJECTURE); 弱哥德巴赫已证 (Helfgott 2013,
       外部文献, 仅对照非证明).

  formal_math: |
    -- p + q = 2n ⟺ 对称对:
    theorem symmetric_pair_iff_sum (p q n : ℝ) : p + q = 2*n ↔ q = 2*n - p
    -- 镜像对合:
    theorem mirror_involution (n x : ℝ) : 2*n - (2*n - x) = x
    -- 中心不动点:
    theorem center_fixed (n : ℝ) : 2*n - n = n
    -- 对称中点:
    theorem symmetric_pair_midpoint (p q n : ℝ) :
      p + q = 2*n ↔ q - n = -(p - n)
    -- ★哥德巴赫 = 素数对称对 (CONJECTURE):
    theorem goldbach_symmetric_decomposition (p q n : ℝ) :
      p + q = 2*n ↔ q = 2*n - p
    -- ★全景:
    theorem goldbach_pat_perspective (p q n x : ℝ) (pk : ℕ) (hp : 0 < p) :
      (p + q = 2*n ↔ q = 2*n - p) ∧ (2*n - (2*n - x) = x) ∧
      (2*n - n = n) ∧ (log (p^pk) = (pk : ℝ)·log p)

