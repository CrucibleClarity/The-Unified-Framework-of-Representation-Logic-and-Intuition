- cos(π·0) = 1 (R143: 相位 0 = 数值 1)
- cos(π·1) = -1 (Real.cos_pi, 半圈)
- 发散轴 = 实轴, 周期轴 = 虚轴 (R047)
- 基点漂移值不变 (R142)
- ★自洽是结构发现, 非素数分布理论
