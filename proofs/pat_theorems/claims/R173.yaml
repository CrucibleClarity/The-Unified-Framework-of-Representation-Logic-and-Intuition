statement:
  informal: |
    ★ 观点提出者: 用户 (2026-08-13)。筑基篇课后习题 XVI: 孪生素数
       间隔作为震荡周期轴.

    ★ 唯一论点: 间隔 2 = 震荡周期 (osc(t)=exp(iπt): osc(t+2)=osc(t))
       = 发散轴最长震荡距离 (cos 投影从 +1 到 -1 = 2) — 周期与最长
       距离自洽, 间隔 2 是结构常数.

    ★ 结构对应 (mechanics-pat-observation skill):
       - 间隔 2 = 震荡周期: osc(t+2) = exp(i·π·(t+2)) =
         exp(i·π·t)·exp(2πi) = exp(i·π·t) (exp(2πi)=1,
         CompactToolkit.exp_two_pi_I_eq_one; 孪生素数对间隔 = 一个
         完整周期, R172/R171)
       - 发散轴投影 = cos(π·t): (exp(i·π·t)).re = cos(π·t) (R047:
         发散轴 = 实轴, 周期轴 = 虚轴; Complex.exp_ofReal_mul_I_re)
       - 投影范围 [-1,1]: cos(π·0) = 1 (t=0, 相位 0 = 数值 1, R143),
         cos(π·1) = -1 (t=1, 半圈, Real.cos_pi)
       - 基点移到震荡轴: 基点从 0 移到 t=1 中点 (投影 -1) (R142
         基点漂移; 新基点观测: 从 -1 到远端 +1 距离 = 2)
       - ★最长震荡距离 = 2 = 间隔 2: 1-(-1) = 2 — 周期 2 与最长
         距离 2 自洽 (结构常数, 既是周期又是最长距离)

    ★ 与孪生素数连接: 孪生素数对 (p, p+2) 的间隔 2 = 震荡周期 =
       发散轴最长震荡距离 — 间隔 2 是结构常数. 诚实边界: 结构观测
       (震荡周期/投影范围/最长距离), 非素数分布理论.

  formal_math: |
    -- 间隔 2 = 震荡周期:
    theorem oscillation_period_two (t : ℝ) :
      Complex.exp (Real.pi * (t + 2) * Complex.I) = Complex.exp (Real.pi * t * Complex.I)
    -- 发散轴投影 = cos(π·t):
    theorem oscillation_diverge_projection (t : ℝ) :
      (Complex.exp (Real.pi * t * Complex.I)).re = Real.cos (Real.pi * t)
    -- 投影范围 [-1,1]:
    theorem oscillation_projection_range :
      Real.cos (Real.pi * 0) = 1 ∧ Real.cos (Real.pi * 1) = -1
    -- 基点移到震荡轴:
    theorem basepoint_move_to_axis : Real.cos (Real.pi * 1) = -1
    -- ★最长震荡距离 = 2 = 间隔 2:
    theorem max_oscillation_distance : 1 - (-1) = 2
    -- ★全景:
    theorem twin_prime_oscillation_perspective (t : ℝ) :
      (Complex.exp (Real.pi * (t + 2) * Complex.I) = Complex.exp (Real.pi * t * Complex.I)) ∧
      (Real.cos (Real.pi * 0) = 1 ∧ Real.cos (Real.pi * 1) = -1) ∧ (1 - (-1) = 2)

objects:
- oscillation_period_two
- oscillation_diverge_projection
- oscillation_projection_range
- basepoint_move_to_axis
- max_oscillation_distance
- twin_prime_oscillation_perspective
