statement:
  informal: |
    ★ 观点提出者: 用户 (2026-08-12)。原点现象 ≡ 基点现象 (需要证明)。

    ★ 问题: 从原点剥离对称性 (S/R/T) 得到基点 0; 把原点观测到的现象
      应用到基点 0 阵列生成 — 需要证明: 原点现象等价于基点现象?

    ★ 证明 (Lean 验收, OriginBasepointEquivalence.lean, 0 sorry):
      ① fold_involution_origin: 原点镜像 S₀(x) = -x 是对合 (S₀² = id)
      ② fold_involution_any_basepoint: 任意基点 e 镜像 S_e(x) = 2e-x
         是对合 (S_e² = id) — 现象平移不变!
      ③ origin_basepoint_equivalent: S_e = T ∘ S₀ ∘ T⁻¹ (平移共轭)
         — 原点与基点现象等价 (可构造可定义)
      ④ fold_class_translation_invariant: ±1 折叠类在任意基点同样
         出现 (e±1 互换)

    ★ 关键差异 (诚实边界):
      原点: 可观测 (实数轴)
      基点 0: 闭包 (R123: 内部不可观测)
      现象等价 (平移不变), 但观测性不同!

    ★ 与既有 claim 的关系:
      - R085 (0 = ±1 折叠类): 原点现象
      - R054 (任意基点任意轴): 平移不变依据
      - R123 (基点闭包): 观测性差异
      - R127 (相位 = 剥离对称调制): 本 claim 的等价性
      - R072 (声明): 等价性的声明化
      结论: 原点现象 ≡ 基点现象 (平移共轭, Lean 证明);
      但观测性不同 (原点可观测, 基点闭包不可观测)。

    ★ 支撑 (Lean):
      - OriginBasepointEquivalence.lean (4 定理, 0 sorry)
  formal_math: |
    -- S₀(x) = -x (原点镜像, 对合)
    -- S_e(x) = 2e-x (基点镜像, 对合)
    -- S_e = T ∘ S₀ ∘ T⁻¹ (平移共轭, 等价)
    -- ±1 折叠类平移不变

