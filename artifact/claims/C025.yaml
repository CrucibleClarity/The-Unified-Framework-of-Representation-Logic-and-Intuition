id: C025
title: "Euler product convergence & zero relation — 欧拉乘积收敛 (Re s > 1): ∏_p(1-p⁻ˢ)⁻¹ = Σ 1/n^s; 与非平凡零点的关系 (Re ≥ 1 无零点)"
status: PROVED
novelty_status: KNOWN
zero_role:
  basepoint: false
  additive_identity: false
  bottom: false
  seed: false
branch: basepoint_relativity

statement:
  informal: |
    ζ(s) 的欧拉乘积表示 (KNOWN: 欧拉 1737), mathlib 组合:
    - zetaEulerF: f(n) = 1/n^s 完全乘法 (ℕ →*₀ ℂ);
    - zetaEulerF_norm: ‖f n‖ = n^(-Re s);
    - zeta_euler_product: 1 < re s ⟹ ∏'_p (1 - 1/p^s)⁻¹ = ∑'_n 1/n^s
      (EulerProduct.eulerProduct_completely_multiplicative_tprod +
      Complex.summable_one_div_nat_cpow)。
    与非平凡零点的关系 (KNOWN, 经典分析数论):
    - riemannZeta_euler_product: mathlib 官方 ζ (解析延拓) 与欧拉乘积
      拼接: riemannZeta s = ∏'_p (1-1/p^s)⁻¹ (Re > 1);
    - riemannZeta_ne_zero_of_one_le_re: Re ≥ 1 无零点 — 欧拉乘积域是
      零点的禁区, 非平凡零点被赶出 Re ≥ 1, 只能待在临界带
      0 < Re < 1;
    - mathlib 有完整黎曼 ζ (riemannZeta, RiemannHypothesis : Prop,
      riemannZetaZeros) — 黎曼猜想 = ∀ s, riemannZeta s = 0 → 非平凡
      → s ≠ 1 → s.re = 1/2 (C019-C022 的临界线位置的官方陈述, 未证)。
  formal_math: |
    ℂ 上 (mathlib):
    (1) zeta_euler_product: 1 < re s →
        ∏' p : Nat.Primes, (1 - 1/(p:ℂ)^s)⁻¹ = ∑' n, 1/(n:ℂ)^s
    (2) riemannZeta_euler_product: 1 < re s →
        riemannZeta s = ∏' p : Nat.Primes, (1 - 1/(p:ℂ)^s)⁻¹
    (3) riemannZeta_ne_zero_of_one_le_re: 1 ≤ s.re → riemannZeta s ≠ 0

