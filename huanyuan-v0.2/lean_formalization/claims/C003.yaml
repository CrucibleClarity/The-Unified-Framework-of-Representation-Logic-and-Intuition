  - "经典定理重复推导风险 (确认: 是, fixed-point fusion, novelty=KNOWN)"
  - "l 需保底? (证明只用伴随性, 不需 l⊥=⊥_f)"

evidence_for:
  - "枚举 196 实例零反例 (experiments/finite_models/C003_galois_insertion_lfp.py)"
  - "Lean 接受 lfp_of_galoisConnection_semiconj, 依赖链无 sorry"
  - "文献审计 (docs/其他AI评审/C003审查与研究重定向建议.md): 确认为经典 fixed-point fusion"
evidence_against: []

