id: C006
title: "Basepoint-relative step translation transports under basepoint change in any heap"
status: PROVED
novelty_status: DIRECT_COROLLARY
zero_role:
  basepoint: true
  additive_identity: true
  bottom: false
  seed: false
branch: basepoint_relativity

statement:
  informal: |
    在 heap H 中选基点 e, 得到群 G_e = (H, +_e, e) (C004)。basepoint-relative
    step TRANSLATION: 固定"端点" a ∈ H, 定义
      τ_{e,a}(x) := [x, e, a] = x +_e a   (retract 群中的平移 x ↦ x +_e a)
    换基点映射 T_{e→f}(x) := [x, e, f]。
    ★ 主定理 (transport, 任意 heap 成立, 不需 abelian):
      T_{e→f} (τ_{e,a} x) = τ_{f, T_{e→f}(a)} (T_{e→f} x)。
      证明只用 para-associativity + 左右 identity, 未用 commutation。
    ★ 反例 (同一端点不 transport): ℤ-heap [x,y,z]=x-y+z, e=0,f=1,a=2,x=0:
      [[0,0,2],0,1]=3 ≠ [[0,0,1],1,2]=2。
    解释 (评审修正): a 是"以 e 为原点表示某步长的端点", T_{e→f}(a) 是"以 f 为
    原点表示同一 步长的端点"; 真正不变的是 relative displacement (e,a), 不是
    a 本身, 也不是 T(a)。a 与 T(a) 都是点 (不是变化量)。
    术语: 这是 translation (可逆, 平移), 不是 Peano/NNO 的 successor。
    数学定位: heap translation 是 heap morphism (T_{e→f}(e)=f), 主定理是其
    naturality 的直接推论, 即 [T(x), f, T(a)] = T([x,e,a])。
  formal_math: |
    Let H : Type with [Heap H] (any heap, not necessarily abelian).
    τ_{e,a}(x) := [x,e,a],  T_{e→f}(x) := [x,e,f].
    Theorem: T_{e→f} (τ_{e,a} x) = τ_{f, T_{e→f}(a)} (T_{e→f} x).
    Counterexample (same endpoint): in ℤ-heap e=0,f=1,a=2,x=0, 3 ≠ 2.

objects: ["H : Type* [Heap H]", "e f a x : H", "τ_{e,a} : H → H", "T_{e→f} : H → H"]
definitions_used: ["Heap (普通 heap, 非 abelian)", "addAt (C004 retract)", "T_{e→f} = [·,e,f]"]

assumptions:
  - "[Heap H] (任意 heap, 不需 abelian)"
  - "e, f, a : H 为基点与端点"
conclusion: "T_{e→f} τ_{e,a} = τ_{f, T_{e→f}(a)} T_{e→f} (端点需 transport); 同端点反例"

known_special_cases:
  - "a = e: τ_{e,e}(x) = [x,e,e] = x = id, 平凡"
  - "f = e: T 恒等, 平凡"
closest_known_results:
  - "C004 (heap retract 恢复群; 普通 heap 恢复群, abelian heap 恢复 abelian 群)"
  - "C005 (torsor-heap correspondence; T_{e→f} 来自 C005 translation)"
  - "heap translation 是 heap morphism (标准); affinization 文献直接写 τ 作为不同 retract 间 translation isomorphism"
literature_queries:
  - "heap translation isomorphism retract"
  - "affinization translation map heap"

counterexample_search:
  status: done
  search_space: "有限群模型 Z/n (n=2..5) 枚举全部 e,f,a,x, 候选 '?' = {a, T(a), [f,e,a], a-e+f}"
  smallest_checked_size: "Z/2 (8 组合)"
  result: |
    '?' = a (同端点): 仅 e=f 时成立 → 反例
    '?' = T_{e→f}(a) = [a,e,f]: 全部成立
    '?' = [f,e,a] 与 a-e+f: 在 abelian 模型下与 T(a) 重合 (outer symmetry), 无法区分;
    需 non-abelian Heap (非交换群 [x,y,z]=xy⁻¹z) 才区分 [a,e,f] ≠ [f,e,a]
    → 这正是推广到 [Heap H] 而非 [AbelianHeap H] 的理由

formalization:
  prover: Lean4
  file: "formal/Formal/ZeroRelative/StepTranslation.lean"
  theorem_name: "ZeroRelative.step_transport (主定理, [Heap H]) / ZeroRelative.step_transport_same_endpoint_not_general (反例) / ZeroRelative.bpChange_basepoint (T(e)=f)"
  status: PROVED
  sorry_free: true

failure_modes:
  - "直接定义 τ_f := T τ_e T⁻¹ 会变成 tautology (评审 §6 警告) — 已避免, 从生成规则 τ_{e,a}=x+_e a 出发"
  - "必须先从生成规则出发, 再问 transport"
  - "不能把 translation 与 successor/recursion 混为一谈 (评审 §2) — 已改术语"
  - "AbelianHeap 中 [a,e,f]=[f,e,a] (outer symmetry), 无法区分候选 — 已推广到普通 Heap"

evidence_for:
  - "有限枚举: '?'=T(a) 100% 通过 (Z/2..5), '?'=a 仅 e=f (experiments/finite_models/C006_step_transport.py)"
  - "Lean: step_transport 证明只用 para-assoc + left_id (普通 [Heap H]), 无 sorry"
  - "Lean: step_transport_same_endpoint_not_general 反例 (ℤ-heap, 3≠2), 无 sorry"
  - "Lean: bpChange_basepoint — T_{e→f}(e)=f (heap morphism 性质)"
evidence_against: []

next_action: "C006 封存。下一步 C007: 研究 displacement equivalence (e,a)∼(f,b) ⟺ b=[a,e,f], 问是否 equivalence relation / 等价类是否形成独立于基点的'变化空间' / 选择任意 e 后该空间是否恢复 G_e (评审 §9 主线)"
notes: "评审 9 点已全部落实: (1) 主定理推广到普通 [Heap H] (证明只用 para-assoc+identity, AbelianHeap 仅作 corollary); (2) 术语从 successor 改为 step translation (可逆平移, 非 Peano successor); (3) 关键解释修正: a 与 T(a) 都是点, 真正不变的是 relative displacement (e,a); (4) 无基点表示: 步长应理解为 translation τ_{e,a}, 换基点 (e,a)↦(f,T(a)) 代表同一相对位移; (5) novelty 降为 DIRECT_COROLLARY (heap translation 是 heap morphism 的直接推论); (6) 删除'用非群 abelian heap 区分候选' (AbelianHeap 中 outer symmetry 使 [a,e,f]=[f,e,a], 需 non-abelian Heap 才区分); (7) 删除 a=f 特例 (无信息/错误); (8) zero_role: basepoint+additive_identity=true (e 即 G_e 的 0_e=e), seed=false (尚未定义迭代; 注意迭代定义不得用 Nat 索引 — 见 C008 内生生成); (9) C007 转向 displacement equivalence (e,a)∼(f,b)。核心价值: 单独'数值点'不是正确不变量候选, 点对 (e,a) 的相对变化或其诱导的 translation 才是。★ 后续禁止 δ,2δ,3δ / Church iteration (预设自然数, 循环论证)。"