failure_modes:
  - "投影视角是组织方式, 非新结构 — 复平面本身是标准 ℂ (KNOWN), 不冒充新颖"
  - "不得把'投影下不可观测'误读为'高维中不存在': 基点位置、线的位置在高维结构中是结构事实, 只有投影视图丢失"
  - "'实数轴是假复数轴'是投影视图下的陈述, 不涉及实数本身的构造"
  - "实数轴嵌入 lift 保加乘 (子代数) 不代表实数轴闭合于开方 — 轴内 -1 无平方根"

