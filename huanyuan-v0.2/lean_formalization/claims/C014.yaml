  - "不是'漂移命中的都是素数': 合数也被命中 (r²=10: n=2 → 6)"
  - "素数可达是'存在性配方' (每个素数可被打中), 不是'所有整数点漂移后素数'"
  - "p ≡ 3 (mod 4) 的素数无两轴分解 (高斯素数, 已知)"
  - "r 不必是整数 (Real.sqrt) — 半径是连续参数"

