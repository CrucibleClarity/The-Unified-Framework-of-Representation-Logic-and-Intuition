id: C021
title: "Nontrivial zero shape in both axes — 非平凡零点在两个轴视角下的形状: 假复数轴视角 = 竖直线, 反演轴视角 = 圆 (反演对合连接)"
status: PROVED
novelty_status: KNOWN
zero_role:
  basepoint: true
  additive_identity: false
  bottom: false
  seed: false
branch: basepoint_relativity

statement:
  informal: |
    非平凡零点 (黎曼猜想对象) 在两个轴视角下的形状 (OBSERVATION/KNOWN):
    一、假复数轴视角 (未蜷曲) = 竖直线 (临界线 x = 1/2):
    - critical_line_points: proj z = 1/2 ⟺ z = lift(1/2) + t·J —
      平行于真复数轴的竖线, 穿过假复数轴 1/2;
    - nontrivial_zero_position: 竖线上 t ≠ 0 的部分 (去实点)。
    二、反演轴视角 (蜷曲, 实数 0 点) = 圆 (圆心 (1,0) 半径 1):
    - critical_line_is_circle / critical_line_in_circle: 竖线 → 圆;
    - nontrivial_zero_on_circle / critical_line_image_subset_circle:
      零点 (猜想) 落入圆 (集合版);
    - circle_recip_proj: 反向 — 圆上非 0 点反演后回到竖线 (proj = 1/2);
    - recip_involutive: 反演对合 (recip² = id) — 两个形状是同一个
      对象 (零点位置) 的两面, 一一对应。
  formal_math: |
    ComplexAxis (C011) 上:
    (1) recip_involutive: z ≠ 0 → recip (recip z) = z
    (2) circle_recip_proj: norm (w - lift 1) = 1 → w ≠ 0 →
        proj (recip w) = 1/2
    (3) critical_line_image_subset_circle:
        recip '' {z | proj z = 1/2 ∧ z.b ≠ 0} ⊆ criticalCircle

objects:
  - "临界线 (竖直线 x = 1/2, 假复数轴视角形状)"
  - "临界线圆 (圆心 (1,0) 半径 1, 反演轴视角形状)"
  - "recip (反演对合, 两个形状的变换)"
objects_note: null
definitions_used: ["ComplexAxis (C011)", "critical_line_points (C019)", "nontrivial_zero_on_circle (C020)", "criticalCircle (C020)", "recip (C013)"]

assumptions:
  - "C011/C013/C019/C020 构造"
conclusion: "非平凡零点 (猜想) 的形状: 假复数轴视角 = 竖直线 x = 1/2; 反演轴视角 = 圆心 (1,0) 半径 1 的圆; 反演对合连接两个形状 (一一对应)"

known_special_cases:
  - "圆上 0 点对应 ∞ (不在临界线上): 反向映射需 w ≠ 0"
  - "圆上 2 点对应 t = 0 平凡点 (z = 1/2)"
closest_known_results:
