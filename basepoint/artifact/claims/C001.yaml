id: C001
title: "Semiconjugacy preserves iteration and basepoint orbits"
status: PROVED
novelty_status: KNOWN
zero_role:
  basepoint: true
  additive_identity: false
  bottom: false
  seed: false
branch: semiconjugacy_baseline

statement:
  informal: |
    若 T semiconjugates 两个 self-map S1 S2（T∘S1 = S2∘T），则 T 保持迭代
    T(S1^[n] x) = S2^[n] (T x)。若进一步 T e = f，则基点轨道也被保持。
  formal_math: |
    Let S1 : X → X, S2 : Y → Y, T : X → Y with T ∘ S1 = S2 ∘ T.
    Then for all n : ℕ, x : X: T ((S1^[n]) x) = (S2^[n]) (T x).
    If moreover T e = f, then T (S1^[n] e) = S2^[n] f.

objects: ["S1 : X → X", "S2 : Y → Y", "T : X → Y", "e : X", "f : Y"]
definitions_used: ["Function.Semiconj", "Function.iterate", "Function.IsFixedPt"]

assumptions:
  - "T ∘ S1 = S2 ∘ T  (semiconjugacy)"
  - "T e = f  (basepoint preservation)"
conclusion: "T (S1^[n] e) = S2^[n] f for all n : ℕ"

known_special_cases:
  - "S1 = S2 = S, T = id: 平凡"
  - "T 是双射: conjugacy 情形，轨道结构同构"
closest_known_results: []
literature_queries:
  - "mathlib Function.Semiconj iterate"
  - "semiconjugacy preserves orbits"

counterexample_search:
