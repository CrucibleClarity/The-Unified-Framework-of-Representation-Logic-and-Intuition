next_action: "C005 完成 (含两个 round-trip baseline)。下一步: C006 (basepoint-dependent successor S_e 的生成规则与换基点 semiconjugacy)"

notes: "评审修正已全部落实: (1) RoundTrip1 数学修正: H→G_e→induced heap 严格恢复原 heap (原 ledger 误写'仅 heap-isomorphic', 已改正, Lean 验证); (2) RoundTrip2: AddTorsor→heap→retract 得 canonically isomorphic 到 G 的群 (φ_e x = x-ᵥ e), 且措辞改为'相对于所选基点 e 的规范同构'——它依赖 e, 不是 torsor 无条件 canonical; (3) 方向A 记号修正: (x -ᵥ y) +ᵥ z (群元素在前, mathlib 记号), 类型用 [AddCommGroup G]; (4) 方向C formal statement 改为'定义候选 vadd/vsub 并证明两条 cancellation laws (可结合 C004 构造 self-torsor)', 与 Lean 实际检查一致 (不声称已验证完整 AddTorsor instance); (5) AddTorsor deprecated 表述精确化: typeclass 未 deprecated, 位于 Mathlib.Algebra.Torsor.*, 仅旧路径 deprecated。核心答案: 选择 e 没有创造 heap 的相对结构, 只是把相对结构 trivialize 成二元群 (control group for future research)。"
