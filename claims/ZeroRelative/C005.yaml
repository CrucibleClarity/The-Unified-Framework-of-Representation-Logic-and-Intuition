  file: "formal/Formal/ZeroRelative/TorsorHeap.lean"
  theorem_name: |
    ZeroRelative.torsor_induces_abelianHeap (DirA) /
    ZeroRelative.heap_retract_torsor_cancel (DirC 消去律) /
    ZeroRelative.heap_retract_induced_heap_eq (RoundTrip1) /
    ZeroRelative.torsor_retract_group_iso (RoundTrip2)
  status: PROVED
  sorry_free: true

failure_modes:
  - "mathlib 用 Mathlib.Algebra.Torsor.* (AddTorsor typeclass 未 deprecated, 位于此; 仅旧路径 Mathlib.Algebra.AddTorsor.* deprecated)"
  - "方向A abelian heap 需 [AddCommGroup G] (vsub_vadd_comm 依赖加法交换性) — 数学上正确: heap 交换性 ⇔ 群交换性"
  - "Torsor outParam G 需显式绑定 (instance 推断失败已解决)"
  - "方向C 用 Prop 型 cancellation 律而非完整 AddTorsor instance (需 AddAction+VSub+Nonempty); formal statement 与 Lean 实际检查强度一致"

evidence_for:
  - "DirA: torsor_induces_abelianHeap — (x -ᵥ y) +ᵥ z (additive) / (x/ₛ y)•z (multiplicative) 满足 heap 4 公理"
  - "DirC: heap_retract_torsor_cancel — retract 群 vsub/vadd 满足 AddTorsor 两条消去律"
  - "RoundTrip1: heap_retract_induced_heap_eq — retract_sub_eq ([x,e,[e,y,e]]=[x,y,e]) 后 (x-_e y)+_e z = [x,y,z] 精确恢复原 heap"
  - "RoundTrip2: torsor_retract_group_iso — φ_e x = x -ᵥ e 保持 retract 加法且为双射 (右逆 g ↦ g +ᵥ e)"
  - "Lean 接受全部, 依赖链无 sorry (649 jobs 全构建通过)"
  - "已用 Mathlib.Algebra.Torsor.*"
