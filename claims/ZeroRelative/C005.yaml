id: C005
title: "Torsor-heap correspondence: directed constructions and exact round trips"
status: PROVED
novelty_status: KNOWN
zero_role:
  basepoint: true
  additive_identity: false
  bottom: false
  seed: false
term_ref: "R072 (前置术语总纲): 表述待按单相位数/多相位数前缀声明式梳理"
branch: basepoint_relativity

statement:
  informal: |
    Heap 与 AddTorsor 之间有两条定向构造 + 两个 object-level round trip:
    (方向 A) 给定 [AddCommGroup G] [AddTorsor G P]: 定义 P 上 heap
    [x,y,z] := (x -ᵥ y) +ᵥ z。验证 [_,_,_] 满足 abelian heap 公理。
    (方向 B) 给定 AbelianHeap H 与选点 e: C004 已得 (H, +_e, e) 是 abelian group
    G_e，其中 x +_e y = [x,e,y]，逆 -_e y = [e,y,e]。
    (方向 C) 定义候选 vadd/vsub (g +ᵥ x := g +_e x, x -ᵥ y := x +_e -_e y) 并证明其
      满足 AddTorsor 的两条核心 cancellation laws (heap_retract_torsor_cancel);
      结合 C004 的 group action laws, 可构造 self-torsor。
      注: 未实际构造完整 AddTorsor G_e H instance (需 AddAction+VSub+Nonempty),
      仅验证核心 cancellation laws; ledger 声明与 Lean 实际检查强度一致。
    ★ Round-trip 1 (C005a): H → G_e → induced heap 严格恢复原 heap，
      [x,y,z]' = (x -_e y) +_e z = [x,y,z]（三元运算相等，非仅同构）。
      key: x -_e y = [x,e,[e,y,e]] = [x,y,e]，再 [x,y,e]+_e z = [[x,y,e],e,z] = [x,y,z]。
    ★ Round-trip 2 (C005b): AddTorsor G P → Heap → retract at e 得到的群
      经 φ_e x := x -ᵥ e 规范同构于 G（carrier 可能不同, 仅 canonical iso）。
      ★ 严格说: φ_e 是"相对于所选基点 e 的规范同构" (canonical relative to e)——
      它依赖 e∈P, 不是 torsor P 无条件 canonical 给出 P≅G。这正表达:
      torsor 本身没有 origin; 选 origin 后才得到与作用群的具体 identification。
  formal_math: |
    (DirA) Let [AddCommGroup G] [AddTorsor G P]. Define heapH : P → P → P → P by
    heapH x y z := (x -ᵥ y) +ᵥ z   [additive form of x·y⁻¹·z].
    Claim: heapH satisfies AbelianHeap axioms.
    (DirB) Let H : Type with [AbelianHeap H], e : H. x +_e y := [x,e,y],
    -_e y := [e,y,e]. Claim: (H, +_e, e) is AddCommGroup (C004).
    (RoundTrip1) [x,y,z]' := (x -_e y) +_e z = [x,y,z].  (exact recovery)
    (RoundTrip2) φ_e : P → G, φ_e x := x -ᵥ e, gives G_e ≅ G (φ_e (x +_e y) = φ_e x + φ_e y).

objects: ["G : Type* [AddCommGroup]", "P : Type* [AddTorsor G P]", "H : Type* [AbelianHeap H]", "e : H"]
definitions_used: ["AddTorsor", "AbelianHeap", "AddCommGroup"]

assumptions:
  - "方向A: [AddCommGroup G] [AddTorsor G P]"
  - "方向B/C + RoundTrip1: [AbelianHeap H] 且 e : H"
  - "RoundTrip2: [AddCommGroup G] [AddTorsor G P] 且 e : P"
conclusion: "两方向分别成立；RoundTrip1 精确恢复原 heap；RoundTrip2 得规范同构（非相等）"

known_special_cases:
  - "方向A 特例: P = G (群自身 torsor), heap 操作 x - y + z 即标准 heap of group"
  - "方向B 特例: H 来自群 (H,+), 选 e=0 恢复原群 G_0 = H"
  - "RoundTrip1: 验证精确恢复 (Lean: heap_retract_induced_heap_eq)"
  - "RoundTrip2: φ_e x = x -ᵥ e 是 G_e ≅ G 的规范同构 (Lean: torsor_retract_group_iso)"
closest_known_results:
  - "C004 (heap retract 恢复群)"
  - "经典: heap of a group (Wagner); 固定一点 e 后 [x,e,y] 恢复 group"
  - "mathlib Mathlib.Algebra.Torsor.Basic (AddTorsor typeclass 正式 API; 旧路径 Mathlib.Algebra.AddTorsor.* deprecated)"
literature_queries:
  - "torsor induces heap ternary operation"
  - "heap retract recovers group exactly"

