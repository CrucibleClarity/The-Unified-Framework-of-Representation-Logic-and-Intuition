id: C032
title: "零点阶翻转方向 — 反射对称 + 乘除法对消: u(σ(t))/u(t) → (-1)^m, 翻转 ⟺ m 奇"
status: PROVED
novelty_status: KNOWN
zero_role:
  basepoint: false
  additive_identity: false
  bottom: false
  seed: false
term_ref: "R072; 观测 AR"
branch: basepoint_relativity

statement:
  informal: |
    ζ 在零点 s₀ 的 m 阶局部展开 ζ(s) = (s-s₀)^m·g(s), g(s₀) ≠ 0 下,
    反射对称 σ(t) = 2t₀-t (t₀ 的反射, 对合) 给出翻转比值:
      u(σ(t))/u(t) → (-1)^m  (t → t₀⁺)
    两个对称方向的相位贡献 ((t-t₀)^m·i^m 因子与 g/|g| 相位因子) 在
    比值中乘除对消, 只剩符号 (-1)^m。翻转 (u(t₀⁻) = -u(t₀⁺)) ⟺
    (-1)^m = -1 ⟺ m 奇。m = 1 (单零点, RH 预期) 时翻转 = -1 = i²
    (pat ±1 最小步: 符号改变, 位置不变)。
  formal_math: |
    ℂ 上 (s₀ = 1/2 + t₀i, 零点阶 m):
    (1) ζ(z) = (z-s₀)^m·g(z) 于 𝓝 s₀, g(s₀) ≠ 0 (p.order/dslope 展开)
    (2) u(t) = ζ(1/2+it)/|ζ(1/2+it)|, σ(t) = 2t₀-t
    (3) u(σ(t))/u(t) → (-1)^m (t → t₀⁺) — 乘除法对消 (比值)
    (4) 翻转 ⟺ (-1)^m = -1 ⟺ Odd m

objects:
  - "zetaLine (t ↦ 1/2+it 临界线参数化)"
  - "zetaUnit (u = ζ/|ζ| 单位化)"
  - "σ (t ↦ 2t₀-t 反射对称, 对合)"
objects_note: "翻转方向 = (-1)^m = i 的 m 次迭代符号"
definitions_used: ["zeta_local_expansion", "flip_ratio_reflection", "flip_ratio_iff_odd", "flip_of_odd_order"]

assumptions:
  - "s₀ = 1/2+t₀i 是 ζ 的零点 (ζ(s₀) = 0)"
  - "局部展开 ζ = (z-s₀)^m·g, g(s₀) ≠ 0, g 连续 (mathlib eq_pow_order_mul_iterate_dslope)"
conclusion: "翻转 ⟺ m 奇; 翻转方向 = (-1)^m (乘除法对消后的符号)"

known_special_cases: "m = 1: 翻转 = -1 = i² (pat ±1 最小步, RH 预期)"

