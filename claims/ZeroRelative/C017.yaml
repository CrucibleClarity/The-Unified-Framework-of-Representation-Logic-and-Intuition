id: C017
title: "Prime circle single-orbit uniqueness — 素数圆上单轨道: 两平方和分解唯一 (高斯整数 UFD)"
status: PROVED
novelty_status: KNOWN
zero_role:
  basepoint: true
  additive_identity: false
  bottom: false
  seed: false
term_ref: "R072 (前置术语总纲): 表述待按单相位数/多相位数前缀声明式梳理"
branch: basepoint_relativity

statement:
  informal: |
    素数 p ≡ 1 (mod 4) 的圆 x²+y² = p 上恰好只有一条轨道 (8 个符号×顺序
    变体) — 两平方和表示唯一 (不计符号与顺序)。证明用高斯整数 Z[i] 的
    唯一分解 (EuclideanDomain ⟹ UFD, mathlib):
    - gauss_unit_of_norm_one: 高斯整数单位 = {±1, ±i} (norm=1 ⟹ 枚举
      re, im ∈ {±1,0});
    - gauss_irreducible_of_norm_prime: norm = p 素数 ⟹ 元素不可约
      (norm 分解 p = ny·nz + 素数整除 ⟹ 单位);
    - prime_sq_add_sq_unique: p 素数 ∧ p = a²+b² = c²+d² ⟹ (c,d) 是
      (a,b) 的符号/顺序变体。
    证明链: norm α = p ⟹ α, β 不可约; β·star β = p = α·star α ⟹
    β | α·star α; UFD 中 Prime 的 Euclid 引理 ⟹ β | α 或 β | star α;
    相伴 ⟹ β = α·u 或 star α·u, u ∈ {±1, ±i}; 展开 ⟹ 8 个变体。
    结论: 素数圆上只有锁定的那条轨道 — 之前抓到的 8 个整点就是全部;
    合数圆 (65) 有多条轨道, 素数圆单轨道。
  formal_math: |
    GaussianInt (ℤ[i], Zsqrtd (-1)):
    (1) gauss_unit_of_norm_one: x.norm = 1 → x = 1 ∨ x = -1 ∨ x = ⟨0,1⟩ ∨ x = ⟨0,-1⟩
    (2) gauss_irreducible_of_norm_prime: Nat.Prime p → x.norm = (p : ℤ) → Irreducible x
    (3) prime_sq_add_sq_unique: Nat.Prime p → a²+b² = p → c²+d² = p →
        (|c| = |a| ∧ |d| = |b|) ∨ (|c| = |b| ∧ |d| = |a|)
        其中 a b c d : ℤ, 等式在 ℤ 层 (cast)

objects:
