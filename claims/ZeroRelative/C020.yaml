id: C020
title: "Two circles & their intersections — 素数圆与临界线圆: 反演关系与交叉位置 (实轴∩临界线圆 = {0,2}; 素数 2 的交点 = 高斯分解点 1±i)"
status: PROVED
novelty_status: KNOWN
zero_role:
  basepoint: true
  additive_identity: false
  bottom: false
  seed: false
term_ref: "R072 (前置术语总纲): 表述待按单相位数/多相位数前缀声明式梳理"
branch: basepoint_relativity

statement:
  informal: |
    用户洞察: 假复数轴是 i 的后继 (打转), 蜷曲视角下"圆"不止一个
    (OBSERVATION/KNOWN):
    一、两个圆:
    - primeCircle p: 素数圆, 圆心真 0 点半径 √p (素数 p 的整点所在);
    - criticalCircle: 临界线圆, 圆心 (1,0) 半径 1 (临界线蜷曲的像);
    - 临界线圆经过真 0 点 (zero_in_criticalCircle: 0 ∈ criticalCircle,
      ∞ 卷回的位置); 素数圆围绕 0。
    - 反演关系: 临界线 → 临界线圆 (critical_line_in_circle);
      素数圆 → 同心圆半径 1/√p (primeCircle_recip)。
    二、交叉位置:
    - 实轴 ∩ 临界线圆 = {0, 2} (realAxis_inter_criticalCircle):
      0 是 ∞ 卷回点, 2 是 1/2 的反演像;
    - 素数圆 ∩ 临界线圆: 交点满足 Re(z) = p/2 (inter_proj);
      相交当且仅当 p ≤ 4 (素数 p = 2, 3);
    - 素数 2 的特殊性: prime2Circle_inter_criticalCircle — p = 2 时
      交点 = 1 ± i, 恰好是素数 2 的高斯分解点 (2 = |1+i|²):
      两个圆的交点精确捕捉 2 的分解。
    三、假复数轴 1/2 位置的圆 (对偶):
    - halfCircle_recip: 圆心 (1/2,0) 半径 1/2 的圆 (经过真 0 点) 在
      反演下 = 竖直线 x = 1;
    - 对偶: 竖直线 x = 1 ⇄ 圆心 (1/2,0) 的圆; 竖直线 x = 1/2 (临界线)
      ⇄ 圆心 (1,0) 的圆 — 两个圆在真 0 点内切 (|1-1/2|+1/2 = 1),
      切点 = 0 = ∞ 卷回点 (平行线反演成内切圆)。
  formal_math: |
    ComplexAxis (C011) 上:
    (1) primeCircle p := {z | norm z = (p : ℝ)}
    (2) criticalCircle := {w | norm (w - lift 1) = 1}
    (3) zero_in_criticalCircle: (0 : ComplexAxis) ∈ criticalCircle
    (4) primeCircle_recip: norm z = p → norm (recip z) = 1 / p
    (5) critical_line_in_circle: proj z = 1/2 → recip z ∈ criticalCircle
    (6) realAxis_inter_criticalCircle: lift r ∈ criticalCircle ↔ r = 0 ∨ r = 2
    (7) inter_proj: z ∈ primeCircle p → z ∈ criticalCircle → proj z = (p : ℝ)/2
    (8) prime2Circle_inter_criticalCircle:
        z ∈ primeCircle 2 ∧ z ∈ criticalCircle ↔ z = ⟨1,1⟩ ∨ z = ⟨1,-1⟩
    (9) halfCircle_recip: z ≠ 0 → (norm (z - lift (1/2)) = (1/2)² ↔ proj (recip z) = 1)

objects:
  - "primeCircle (素数圆, 圆心真 0 点)"
  - "criticalCircle (临界线圆, 圆心 (1,0))"
  - "实轴 (假复数轴, 蜷曲下也是圆)"
objects_note: null
definitions_used: ["ComplexAxis (C011)", "norm (C014)", "recip (C013)", "lift", "J", "critical_line_points (C019)"]

assumptions:
  - "C011/C013/C014/C015/C019 构造"
conclusion: "素数圆 (围绕真 0 点) 与临界线圆 (经过真 0 点) 是两个不同的圆; 实轴∩临界线圆 = {0,2}; 素数圆∩临界线圆 交点 Re = p/2, p = 2 时交点恰为高斯分解点 1±i"

known_special_cases:
  - "p = 2: 素数圆与临界线圆交于 1±i (高斯整点, 2 的分解)"
  - "p = 3: 交点 3/2 ± (√3/2)i (非整点)"
  - "p > 4: 两圆不相交 (√p > 2)"
