id: C024
title: "Geometric splitting — 分裂结构的几何版: 8 点 = 高斯素数 π 的 4 伴随 ∪ π̄ 的 4 伴随 (复平面欧拉乘积构件)"
status: PROVED
novelty_status: KNOWN
zero_role:
  basepoint: true
  additive_identity: false
  bottom: false
  seed: false
term_ref: "R072 (前置术语总纲): 表述待按单相位数/多相位数前缀声明式梳理"
branch: basepoint_relativity

statement:
  informal: |
    p ≡ 1 (mod 4) 素数在高斯整数中分裂: p = π·π̄ (π = a+bi 高斯素数,
    prime_conj_pair)。8 个整点 = π 的 4 个伴随 (乘乘性单位 {±1, ±J})
    ∪ π̄ 的 4 个伴随:
      {±z, ±J·z} ∪ {±conj z, ±J·conj z}
    - isUnit4: 乘性单位 {±1, ±J} (i 的后继表);
    - associates z: 伴随集 {z·u : u ∈ {±1, ±J}};
    - norm_unit4: 单位范数 = 1;
    - associates_norm: 伴随保范数 — 每个伴随仍在圆上;
    - variants_are_associates: 8 变体 = 伴随并集。
    这是复平面 (高斯数域 ℚ(i)) 欧拉乘积的构件: p 分裂为一对共轭
    高斯素数, 在 ζ_{ℚ(i)}(s) = ζ(s)·L(s,χ₄) 中贡献 (1-p⁻ˢ)⁻²。
  formal_math: |
    ComplexAxis (C011) 上:
    (1) isUnit4 u := u = 1 ∨ u = -1 ∨ u = J ∨ u = -J
    (2) associates z := {w | ∃ u, isUnit4 u ∧ w = z * u}
    (3) norm_unit4: isUnit4 u → norm u = 1
    (4) associates_norm: w ∈ associates z → norm w = norm z
    (5) variants_are_associates: ⟨a,-b⟩, ⟨-a,b⟩, ⟨b,a⟩, ⟨-b,-a⟩ ∈
        associates (conj ⟨a,b⟩); ⟨-a,-b⟩, ⟨b,-a⟩, ⟨-b,a⟩ ∈ associates ⟨a,b⟩
    (6) prime_conj_pair (C023): norm z = p → z * conj z = lift p

