statement:
  informal: |
    用户洞察: "1/2 是复数的开方" — 精确形式: 以 1/2 为中心的反射
    s ↦ 1-s (180° 对称, 函数方程 ξ(s)=ξ(1-s) 的对称轴) 是变换的平方:
    φ(z) = i·z + (1-i)/2 满足 φ∘φ = 反射 (另一个平方根
    ψ(z) = -i·z + (1+i)/2 同样)。
    - 180° 对称的开方 = 90° 旋转 (i, C011 的 J) — 反射是 i 打转的平方;
    - 平方根变换的系数 (1-i)/2 = 1/(1+i) — 反演对偶的分母, 2 = |1+i|²;
    - 1/2 作为对称中心 = 反射不动点 = 开方结构的轴 (C013 衔接)。
    (KNOWN: 仿射变换群中反射的平方根, 标准事实。)
  formal_math: |
    ComplexAxis (C011) 上:
    (1) reflectSqrt z := ⟨-z.b + 1/2, z.a - 1/2⟩  [= i·z + (1-i)/2]
    (2) reflectSqrt' z := ⟨z.b + 1/2, -z.a + 1/2⟩  [= -i·z + (1+i)/2]
    (3) reflectSqrt_sq: reflectSqrt (reflectSqrt z) = 1 - z
    (4) reflectSqrt'_sq: reflectSqrt' (reflectSqrt' z) = 1 - z

