statement:
  informal: |
    参数原理 = 对消法的积分形式 (L 闭合对称): 绕闭合路径一圈, 连续相位
    完全对消, 剩下的整数 = 内部零点数。单简单零点情形:
      f 在开球可导, 唯一简单零点 z₀ (f(z₀) = 0, f'(z₀) ≠ 0), 去心非零
      ⟹ ∮_{C(z₀,R/2)} f'/f = 2πi, 即 (∮ f'/f)/(2πi) = 1
    证明: g := dslope f z₀ 解析延拓 (f = (z-z₀)·g, g(z₀) = f'(z₀) ≠ 0);
      f'/f = 1/(z-z₀) + g'/g (乘积求导);
      ∮ 1/(z-z₀) = 2πi (柯西积分公式);
      ∮ g'/g = 0 (Goursat: g 解析且非零 ⟹ g'/g 解析于闭圆盘)。
  formal_math: |
    ℂ 上 (0 < R, f : ℂ → ℂ):
    (1) f = (z-z₀)·g 处处, g = dslope f z₀, g(z₀) = deriv f z₀ ≠ 0
    (2) f'/f = (z-z₀)⁻¹ + g'/g (z ≠ z₀)
    (3) ∮_{C(z₀,R/2)} f'/f = ∮ (z-z₀)⁻¹ + ∮ g'/g = 2πi + 0

objects:
  - "f (圆盘内解析, 唯一简单零点)"
  - "g = dslope f z₀ (除零点因子后的解析延拓)"
