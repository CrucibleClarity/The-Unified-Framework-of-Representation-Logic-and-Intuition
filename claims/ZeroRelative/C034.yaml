  - "f(z₀) = 0, deriv f z₀ ≠ 0 (简单零点)"
  - "∀ z ∈ ball z₀ R, z ≠ z₀ → f z ≠ 0 (去心非零)"
conclusion: "∮_{C(z₀,R/2)} f'/f = 2πi — 单零点计数 = 1 (相位对消剩整数)"

