statement:
  informal: |
    相位调制存在映射相位关系: u² = χ (T5, 精确等式, u = ζ/|ζ|)。
    在无零点区间 [0,T] 上 u 连续非零, 经覆盖映射 exp 提升为 θ_ζ (uLift);
    χ 的连续提升为 θ_χ (thetaLift)。由 exp(2θ_ζ) = u² = χ = exp(θ_χ):
      f = 2θ_ζ - θ_χ 的像 ⊆ expKernel = exp⁻¹{1} (离散, 2πiℤ)
      f 连续 ⟹ f 常数 (IsPreconnected.constant) ⟹
      **2·(θ_ζ(T) - θ_ζ(0)) = θ_χ(T) - θ_χ(0)** (端点差)
    这是"召唤"的对称映射 (对照 pat 一步穿折越 PatOneStepCross):
    起点 (显式 χ 相位) 与终点 (θ_ζ 端点差) 之间的映射相位关系直接
    锁定, 不需要迭代逼近。翻转 (跨零点) 是 2π 整数层差, 见 T6c 计数。
  formal_math: |
    ℂ 上 (s = 1/2+it, u = ζ(s)/|ζ(s)|, 无零点区间 [0,T]):
    (1) uPath : C(I, ℂ\{0}),  uLift := liftPath uPath (θ_ζ: exp(θ_ζ) = u)
    (2) expKernel := {z | exp z = 1} = 2πiℤ, 离散 (间距 2π)
    (3) exp(2θ_ζ) = u² = χ = exp(θ_χ) (T5 + 提升性质)
    (4) 2θ_ζ - θ_χ 的像 ⊆ expKernel, 连续 ⟹ 常数 (IsPreconnected.constant)
    (5) 2·(θ_ζ(T) - θ_ζ(0)) = θ_χ(T) - θ_χ(0)

objects:
  - "u(s) = ζ(s)/‖ζ(s)‖ (单位圆投影)"
  - "uPath / uLift (u 的连续幅角提升, 覆盖映射)"
  - "thetaLift (χ 的连续幅角提升, T6c)"
  - "expKernel = exp⁻¹{1} = 2πiℤ (离散, DiscreteTopology 实例)"
objects_note: "expKernel 离散性: 间距 2π > 半径 π 的开球; DiscreteTopology 实例机证"
