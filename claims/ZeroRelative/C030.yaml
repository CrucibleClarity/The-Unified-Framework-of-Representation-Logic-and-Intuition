  - "T5 (u²=χ) 与 T6c (thetaLift) 作为前件"
conclusion: "无零点区间上 2·Δθ_ζ = Δθ_χ — 相位调制的对称映射直接锁定端点差, 不需要迭代逼近; 翻转 (跨零点) 是 2π 整数层差"

