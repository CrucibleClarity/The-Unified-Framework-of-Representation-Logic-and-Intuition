id: C009
title: "Nat-source representation theorem via minimal S-closed substructure (Dedekind chain); finite-reachability version reclassified as baseline"
status: CONJECTURE
novelty_status: KNOWN
zero_role:
  basepoint: true
  additive_identity: false
  bottom: false
  seed: false
term_ref: "R072 (前置术语总纲): 表述待按单相位数/多相位数前缀声明式梳理"
branch: basepoint_relativity

statement:
  informal: |
    ★ 用户根本性修正的终点 + 评审修正: 自然数应是表示定理的结论, 不是生成规则的输入。
    ★★ 版本 1 (TransGen, 已重新分类): Relation.TransGen 的归纳深度 = 有限步数 n ∈ ℕ
    (mathlib: TransGen r a b ↔ ∃ x₀...xₙ)。它已引入 finitary 结构, 且排除极限节点。
    故版本 1 降级为 finite-reachability graph baseline (C008 覆盖), 不再是 Nat-source 结果。
    ★★ 版本 2 (本 claim 主版本, Dedekind chain / minimal closure):
    不用 Function.iterate / orbit : ℕ → H / Relation.TransGen 定义生成对象。
    设 σ : H → H 为生成律 (确定性)。定义包含 e 的 σ-封闭子结构族:
      Closed(C) :⟺ e ∈ C ∧ ∀ x ∈ C, σ(x) ∈ C。
    生成对象 = 最小 S-closed 子结构: 所有 σ-封闭集的交集
      Chain(e) := ⋂ {C | e ∈ C ∧ ∀ x∈C, σ x∈C}  (对象层定义无迭代计数)。
    表示定理 (Dedekind, KNOWN baseline): 若 σ 在 Chain(e) 上单射且 e ∉ σ(Chain(e)),
    则 (Chain(e), σ) ≅ (N, S) 为简单无穷系统。此时 N 是表示定理结论。
    ★ 对象层纪律 (评审修正): Nat-independence = 生成对象定义不依赖 Nat; 不意味着
    消除 Lean 元层 Nat 或同构证明中禁止提到 N (否则无法证明"同构于 N")。
    Chain(e) 用交集定义只是其中一种干净方法 (least fixed point / initial subalgebra /
    universal property / impredicative closure 亦可); 关键是生成定义不以"第 n 次"为
    primitive, 而非必须用 sInf。
    ★★ ordinal-like 修正 (评审): 纯 unary successor-closure 不会产生极限节点 —
    即使 H=Ord, σ(α)=α+1, e=0, Chain(0) 仍只是 0,1,2,... 不含 ω (minimal closure
    不要求极限封闭)。ordinal-like 需**增强生成律**含 limit constructor (L(C)) 或
    supremum closure (C directed ⟹ sup C ∈ C)。故失败情况改为: "ordinal-like structures
    require an enriched generation law with a limit rule; unary successor closure alone
    does not generate limit stages"。
    ★ 后续研究问题 (评审 §9-10): basepoint-dependent generation law Γ : e ↦ σ_e,
    即每个基点 e 产生自己的 σ_e : H → H, Chain_e := ⋂{C | e∈C, σ_e(C)⊆C},
    比较 (Chain_e, e, σ_e) 与 (Chain_f, f, σ_f)。
    不先假设 semiconjugacy (会走回老路); 先问: 哪些 Γ 由 heap 内生定义? 换基点后
    Γ(e) 与 Γ(f) 满足什么关系? 是定理还是须额外假设 equivariance? 生成结构类型
    Type(C_e, σ_e) 是否依赖 e?
  formal_math: |
    Let H : Type, σ : H → H, e : H.
    Closed(C) := e ∈ C ∧ ∀ x ∈ C, σ x ∈ C  (σ-closed subset containing e).
    Chain(e) := ⋂ {C : Set H | Closed C}   (minimal σ-closed substructure).
    Representation theorem (Dedekind, KNOWN): if σ : Chain(e) → Chain(e) is
    injective and e ∉ σ(Chain(e)), then (Chain(e), σ) ≅ (N, S) as a simple
    infinite system. N is the representation result, not a parameter of the
    generated object's definition.
    NOTE: (a) Nat-independence = object-level definitional independence; it does
    NOT mean eliminating Nat from Lean's metatheory or from the proof of a
    representation theorem (which must mention N). (b) version 1 (TransGen) is a
    finite-reachability baseline. (c) unary successor closure generates ω-type
    only; ordinal-like stages require an enriched law with a limit/supremum rule.

objects: ["H : Type", "σ : H → H (generation law)", "e : H", "Chain(e) := ⋂{C | Closed C}", "N, S (表示定理结论)"]
definitions_used: ["Set (交/闭包)", "Dedekind 简单无穷系统", "sInf"]

assumptions:
  - "σ : H → H"
  - "Chain(e) 非空且 σ 限制在其上单射, e 不在 σ(Chain(e)) 像中"
conclusion: "(Chain(e), σ) ≅ (N, S) 为简单无穷系统 (Dedekind 表示定理, KNOWN)"

known_special_cases:
  - "H = ℤ, σ(x)=x+1, e=0: Chain(0) = {0,1,2,...} = N (经典)"
  - "σ 有环: Chain(e) 有限或含环, 非 N 型 (允许失败)"
  - "σ 非单射: 折叠, 非 N 型"
  - "极限节点 (如序数 ω): 纯 unary successor-closure 不产生极限 — 即使 H=Ord, σ(α)=α+1, e=0, Chain(0) 仍只是 0,1,2,... 不含 ω (minimal closure 不要求极限封闭)。ordinal-like 需增强生成律含 limit rule (L(C)) 或 supremum closure"
