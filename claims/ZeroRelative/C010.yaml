id: C010
title: "Basepoint-dependent generation law Γ : e ↦ σ_e — pure-heap terms are teleport-covariant; closure types are e-independent (R011: general theorem)"
status: PROVED
novelty_status: KNOWN
zero_role:
  basepoint: true
  additive_identity: false
  bottom: false
  seed: false
term_ref: "R072 (前置术语总纲): 表述待按单相位数/多相位数前缀声明式梳理"
branch: basepoint_relativity

statement:
  informal: |
    ★ 真正研究起点 (VISION §9-13): 生成律为什么会随基点改变, 如何改变?
    Γ : H → (H → H), Γ(e) = σ_e。Chain_e := ⋂ {C | e∈C, σ_e(C)⊆C} (C009 v2, 无 Nat)。
    ★★ 一般定理 (R011, 已证明): 纯 heap 内生生成律 (σ_e 只用 [·,·,·], 叶子 ∈ {e,x},
    无字面量 0) 的最小闭包结构**不依赖基点 e**。机制:
    T_{e→f}(x) := [x,e,f] 是任意 heap 上的自同构 (middle para-assoc 形式保证
    translation 是同态), 故任意 pure-heap term t(e,x) 满足
      T_{e→f}(t(e,x)) = t(f, T_{e→f}(x)),
    由此 Chain(σ_f,f) = T_{e→f}(Chain(σ_e,e)) (exact teleport), 生成结构同构。
    这是 universal-algebraic 原理 "homomorphism preserves evaluation of terms",
    非新现象。
    ★ 此前 (含 0 的表达式) 的分岔发现无效: σ_e(x)=[x,x,[x,e,0]]=x-e 含字面量 0,
    而 0 在纯 heap 中非内生 (0 本身就是基点选择) — 用 0 即偷偷选定基点, 违反
    "无特权基点"。故该分岔不是纯 heap 现象。
    ★★ 撤回 (此前过强结论): 见 failure_modes — "产生结构类型分岔 ⟺ 使用超出
    pure heap 的常数/结构" 过强。正确表述: pure heap terms 在基点变换下一般
    协变; 结构分岔需要破坏该协变性; 额外常数/结构是可能的破坏来源之一, 但
    非充分条件, 也非唯一机制。
  formal_math: |
    Let H : Type with [Heap H] (ternary op [x,y,z], para-assoc both forms +
    identity laws). Let T_{e→f}(x) := [x,e,f]. Let PureGen be terms built from
    [·,·,·] with leaves {x, e} only (no literal). Let eval t e x be the value of
    term t at basepoint e, running point x. Let
      Chain(σ,e) := ⋂ {C | e ∈ C ∧ σ(C) ⊆ C}.
    Theorem (Lean-verified, no sorry):
      (1) teleport_heap: T([x,y,z]) = [T x, T y, T z]
      (2) eval_teleport:  T(eval t e x) = eval t f (T(x))   ∀ pure term t
      (3) teleport_bijective: T_{e→f} bijective, inverse T_{f→e}
      (4) chain_teleport_eq: Chain(σ_f, f) = T_{e→f}(Chain(σ_e, e))
      (5) generatedStructureEquiv: Chain(σ_e,e) ≃ Chain(σ_f,f)
    Hence the closure structure type does not depend on the basepoint e.

objects: ["H : Type [Heap H]", "T_{e→f}(x) = [x,e,f]", "PureGen terms (leaves {e,x})", "Chain(σ,e) (C009 v2)"]
definitions_used: ["Heap (with middle para-assoc form)", "PureGen", "Chain (C009 v2)", "teleport"]

assumptions:
  - "[Heap H] (任意 heap, 非仅 abelian)"
  - "σ_e 由 [·,·,·] 构造, 叶子 ∈ {e,x}, 任意有限深度, 无字面量"
conclusion: "纯 heap 内生 σ_e 的 Chain_e 结构类型与基点无关 (general invariance baseline)"

known_special_cases:
  - "σ_e(x) = [x,e,e] = x (identity): Chain_e = {e}, 类型 e 不变 (trivial)"
  - "σ_e(x) = [x,e,x] = x - e + x = 2x - e (reflection): 类型 e 不变"
  - "含 0 的 σ_e(x)=[x,x,[x,e,0]]=x-e: 分岔, 但 0 非纯 heap 内生 (用特权基点)"
