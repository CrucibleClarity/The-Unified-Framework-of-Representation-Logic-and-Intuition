  prover: Lean4
  file: "formal/Formal/ZeroRelative/BasepointGen.lean"
  theorem_name: |
    PureGen.teleport_heap, PureGen.eval_teleport (协变),
    PureGen.teleport_inv / teleport_inv' / teleport_bijective,
    PureGen.chain_teleport_subset → chain_teleport_eq (exact teleport),
    PureGen.generatedStructureEquiv / generated_structure_iso (结构同构)
  status: proved
  sorry_free: true

failure_modes:
  - "【撤回】'产生基点分岔 ⇔ 使用超出 pure heap 的常数/结构' — 过强: 加常数不一定产生分岔 (枚举 72% 非 100%); 常数若随基点 teleport 仍可保持不变性"
  - "【撤回】'任何外部常数破坏基点不变性' — 应为: 固定在 observer/frame 中而不随基点 teleport 的常数可能破坏 equivariance; 常数自身正确 teleport 则不一定分岔"
  - "不得先假设 semiconjugacy (VISION §13 Step 4) — 本证明是定理 (由 heap 律 + 项纯性推出), 非假设"
  - "含 0 表达式不是纯 heap 内生 — 需严格区分 (0 是特权基点)"
  - "novelty: term naturality / homomorphism preservation 是标准 universal algebra, 不以 Lean 证明冒充新颖"

evidence_for:
  - "Lean: eval_teleport / chain_teleport_eq / generatedStructureEquiv 全证 (任意 Heap, 无 sorry)"
  - "枚举: 810 纯 heap 表达式 (深度≤3) 0 个 e-dependent (与定理一致)"
  - "非 abelian S3/D4 群验证 teleport 保运算全成立"
  - "对照: 含 0/1 常数 72% e-dependent, 但非纯 heap 内生"
