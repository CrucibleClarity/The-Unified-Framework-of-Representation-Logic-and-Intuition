  - "C006 (step translation teleport: 与 teleport 协变一致)"
  - "C007 (displacement equivalence)"
  - "C009 (Chain 构造, Dedekind baseline)"
literature_queries:
  - "heap term operations universal algebra homomorphism"
  - "translation automorphism torsor naturality"

counterexample_search:
  status: done
  search_space: "纯 heap 表达式 (叶子 {e,x}, 无 0) 枚举 (H=Z/5, Z/7); 含 0/1 表达式对照; 非 abelian S3/D4 验证"
  smallest_checked_size: "Z/7 (810 纯表达式深度≤3), S3/D4 (非 abelian 群 heap)"
  result: |
    纯 heap (无 0): 深度≤3 810 表达式, 0 个 e-dependent 闭包类型 (枚举一致);
    S3/D4 非 abelian 群验证 teleport 保运算/cancel/互逆全成立 (确认任意 heap 有效)。
    含 0 或 1 表达式: 24330 表达式 17580 (72%) e-dependent, 但常数非纯 heap 内生。
    (experiments/finite_models/C010_heap_endogenous.py, C010_audit_split_primitives.py)

