statement:
  informal: |
    N₀(T) = N(T) 的命题形式与连续幅角的对称延拓 (0pat, 无 Stirling):
    - T0: ζ(-n) ≠ 0 (n 奇) — 函数方程 + cos(π(n+1)/2) = ±1 + Γ(n+1) 无零点
      + ζ(n+1) ≠ 0 (Re > 1)。Re ≤ 0 无零点定理的负整数补丁。
    - T1: 等价框架 — RH ⟺ ∀T, 全带 [0,1]×[0,T] 内零点都在临界线上。
      ⟸: 反证离线零点 → 临界带 (Re≤0/Re≥1 无零点 + T0) → 取 T = |Im ρ|
      落入带内。"有限→无限": 每个零点落在有限带, ∀T 带内性质 = 全域。
    - T2: 轨道 — 离线零点 ⟹ 左半带 (Re<1/2) 同高度零点
      (轨道 {ρ, conj ρ, 1-ρ, 1-conj ρ}, 反射+共轭)。
    - T3: 对称延拓 — s = 1/2+it 时 1-s = conj s, 函数方程 + 共轭穿透
      ⟹ ζ(s) = χ(s)·conj ζ(s) ⟹ 2·arg ζ(1/2+it) = arg χ(1/2+it) (模 2π)。
      连续幅角 = 相位: arg ζ 的连续分支 = (1/2)·arg χ + π·零点计数,
      arg χ 全显式 (幂/sin/Γ 相位, C026 构件)。
  formal_math: |
    ℂ 上 (mathlib + 本库):
    (1) n 奇 ⟹ riemannZeta (-(n : ℂ)) ≠ 0
    (2) RiemannHypothesis ↔ ∀ T ≥ 0, ∀ z, riemannZeta z = 0 →
        0 ≤ z.re → z.re ≤ 1 → |z.im| ≤ T → z.re = 1/2
    (3) riemannZeta z = 0 → 0 < z.re → z.re < 1 → z.re ≠ 1/2 →
        ∃ w, riemannZeta w = 0 ∧ 0 < w.re ∧ w.re < 1 ∧
          |w.im| = |z.im| ∧ w.re < 1/2
    (4) riemannZeta s ≠ 0 (s = 1/2+it) ⟹
        (2·arg ζ(s) : Real.Angle) = arg(2·(2π)^{s-1}) + arg Γ(1-s) + arg sin(πs/2)

