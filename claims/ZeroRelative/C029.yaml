  - "chi(s) = 2(2π)^{s-1}·Γ(1-s)·sin(πs/2) (函数方程乘子, 临界线连续非零)"
  - "isCoveringMap_exp / IsCoveringMap.liftPath (mathlib 覆盖映射路径提升)"
