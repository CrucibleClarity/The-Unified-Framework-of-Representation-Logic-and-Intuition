statement:
  informal: |
    翻转计数 (u → -u 的跳变次数 = N₀(T)) 的连续基础, 全部 0pat (mathlib):
    - (T6a) 零点集离散且闭 (mathlib riemannZetaZeros 官方定理), 带内
      [0,1]×[-T,T] 零点有限 (带 ⊆ 闭球, 紧致 ∩ 离散 = 有限);
    - (T6b) u(s) = ζ(s)/‖ζ(s)‖ 在 ζ ≠ 0 且 s ≠ 1 处连续 (ζ 在 {1}ᶜ 可微
      differentiableOn_riemannZeta, 除法分母非零); χ 沿临界线连续
      (幂/Γ/sin 逐项: 底 2π ∈ slitPlane, Γ(1-s) 无极点 re=1/2, sin 全局连续);
    - (T6c) χ 沿临界线非零 (2 非零 / (2π)^{s-1} 底非零 / Γ re>0 / sin 零点在
      πℤ 之外 — π 的超越性 Lindemann 保证相位跳变是精确 π 量子), 故 χ 本身是
      基空间 ℂ\{0} 中的路径, 经覆盖映射 exp : ℂ → ℂ\{0}
      (isCoveringMap_exp, mathlib) 提升为连续幅角 θ
      (IsCoveringMap.liftPath, mathlib): exp(θ(s)) = χ(1/2+T·s·i), θ(0) = log χ(1/2)。
    翻转 (u → -u) ⟺ χ 转一整圈 (u²=χ, T5): 翻转次数 = (θ(1)-θ(0)) 虚部差/2π。
    连续 = 无数离散相位点的投影: χ 的相位场 (连续) 的整数圈数 = 离散翻转计数;
    直径投影 (方波 σ) 见 π 跳变, 连续提升见 2π 圈数 — 两者互补 (Backlund 两半)。
  formal_math: |
    ℂ 上 (s = 1/2+it):
    (1) riemannZetaZeros 离散闭;  ∀T, {z | ζ z = 0 ∧ 0≤re z≤1 ∧ |im z|≤T} 有限
    (2) ContinuousOn (fun s => ζ s / ‖ζ s‖) ({1}ᶜ ∩ {ζ≠0})
    (3) ContinuousOn chi {s | s.re = 1/2}, chi(s) = 2(2π)^{s-1}Γ(1-s)sin(πs/2)
    (4) chi(1/2+it) ≠ 0;  chiPath : C(unitInterval, ℂ\{0}),  chiPath s = χ(1/2+T·s·i)
    (5) thetaLift := isCoveringMap_exp.liftPath chiPath (log χ(1/2)) γ₀
        exp(θ(s)) = χ(1/2+T·s·i),  θ(0) = log χ(1/2)

