statement:
  informal: |
    **翻转次数 = N₀(T) 的两个缺失环 (0pat 补齐, 工具清洁)**:
    Z(t) = χ(1/2+it)^{-1/2}·ζ(1/2+it) (Hardy Z, 相位基点投影)。

    **缺口 1 — Z 实值性 (对称路径, 非代数方法)**:
    用共轭反射对称 conj(Z) = Z, 不用 Z² = |ζ|² 的 ring 重组/re-im 分析:
    (1) χ 共轭保持: conj(χ(1/2+it)) = χ(1/2-it) (逐项共轭: cpow 实底
        经 exp_conj, sin_conj, Gamma_conj)
    (2) |χ(1/2+it)| = 1 (相位对乘积 χ(s)·χ(1-s) = 1 ∧ 共轭保持
        ⟹ normSq = 1; Γ 反射 + sin 倍角, 标准)
    (3) conj(χ^z) = conj(χ)^(conj z) (conj_cpow, χ ∈ slitPlane)
    (4) 临界线函数方程: ζ(s) = χ(s)·conj(ζ(s)) (s = 1/2+it 时 1-s = conj s)
    (5) conj(Z) = Z: conj 反射穿透 Z 的每个因子后, 用 χ(1/2-it) = χ^{-1}
        (单位模) 与幂法则收拢 (对称可消)
    ⟹ Z 实值 (conj(Z) = Z 即 im = 0, 反射对称一步)。

    **缺口 1b — 翻转 = 零点 (中间值定理)**:
    (1) Z = 0 ⟺ ζ(1/2+it) = 0 (χ ≠ 0 ⟹ χ^{-1/2} ≠ 0)
    (2) Z 连续 (χ 临界线连续: cpow 底 2π ∈ slitPlane / Γ 在 re>0 /
        sin; ζ 在 {1}ᶜ 可导; cpow 连续: χ ∈ slitPlane; ContinuousAt.cpow)
    (3) Z(a) < 0 < Z(b) (两端符号相反 = 一次翻转) ⟹ ∃t ∈ (a,b), Z(t) = 0
        (中间值定理 intermediate_value_Icc; Z 实值)
    ⟹ 每次翻转对应一个临界线零点 — 翻转计数 = N₀(T) 的缺失环闭合。

    **对称性本质 (用户洞察)**: Hardy Z = 相位对齐的代数投影 —
    Z 的相位 = arg ζ − θ_χ/2 (χ 单位模); Z 实值 ⟺ θ_ζ − θ_χ/2 ∈ πℤ
    = T6e 整数层结构; 等号 (=) 在对称工具族里的对应物 = 相位对齐
    (T6d: 2Δθ_ζ = Δθ_χ)。

    English: **Two missing rings of "flip count = N₀(T)" (0pat,
    tool-clean)**: Gap 1 — Z real-valued by conjugation-reflection
    symmetry conj(Z) = Z (not the algebraic Z² = |ζ|² route): χ
    conjugation preservation, unit modulus |χ(1/2+it)| = 1 (phase-pair
    product 1 + conjugation), conj_cpow in slitPlane, the critical-line
    functional equation ζ(s) = χ(s)·conj(ζ(s)), and symmetric
    cancellation. Gap 1b — flip = zero: Z = 0 ⟺ ζ = 0 (χ ≠ 0),
    Z continuous (χ continuous on the line, ζ differentiable off 1,
    cpow continuous), and Z(a) < 0 < Z(b) forces a zero by the
    intermediate value theorem. Every flip (sign change) yields a
    zero of ζ on the critical line.
  formal_math: |
    ℂ 上 (s = 1/2+it, χ(s) = 2^s·π^(s-1)·sin(πs/2)·Γ(1-s)):
    (1) chi_pair_product: χ(s)·χ(1-s) = 1 (sin(πs) ≠ 0)
    (2) chi_conj_symm: conj(χ(1/2+it)) = χ(1/2-it)
    (3) chi_unit_modulus: ‖χ(1/2+it)‖ = 1
    (4) zeta_eq_chi_conj_on_line: ζ(s) = χ(s)·conj(ζ(s))
    (5) hardyZ_conj: conj(Z(t)) = Z(t) (hchi: χ ≠ -1)
    (6) hardyZ_im_zero: (Z(t)).im = 0
    (7) chi_continuousOn_line: ContinuousOn chi {s | s.re = 1/2}
    (8) hardyZ_eq_zero_iff: Z(t) = 0 ↔ ζ(1/2+it) = 0
    (9) hardyZ_continuousOn: ContinuousOn hardyZ (Icc a b) (∀t∈Icc, χ ≠ -1)
    (10) hardyZ_zero_between: (Z a).re < 0 < (Z b).re ⟹ ∃t ∈ (a,b), Z(t) = 0

