statement:
  informal: |
    χ(s) = 2(2π)^{s-1}·Γ(1-s)·sin(πs/2) 是函数方程乘子。函数方程对称
    (s → 1-s, 对合) 下乘子自反:
      χ(s)·χ(1-s) = 1  (s ∉ ℤ)
    沿临界线 s = 1/2+it (自动非整数), 由共轭对称 conj χ = χ(s̄) 得:
      |χ(1/2+it)| = 1  (χ 临界线 = 单位圆路径)
    乘除法对消: χ 的共轭 = 倒数 (模恒 1), 函数方程两端的相位贡献相乘
    对消为 1。χ 的相位 θ_χ(T) = arg χ(1/2+iT) 是显式相位刻度
    (圈数 = θ_χ/2π), 用于对消 ζ 的隐式相位 (整数层 S(T), C031)。
  formal_math: |
    ℂ 上:
    (1) χ(s)·χ(1-s) = 4(2π)^{-1}·Γ(1-s)Γ(s)·sin(πs/2)sin(π(1-s)/2)
        = 4(2π)^{-1}·(π/sin πs)·(1/2)sin πs = 1
        (反射公式 Gamma_mul_Gamma_one_sub + 积化和差; s ∉ ℤ ⟺ sin(πs)≠0)
    (2) |χ(1/2+it)|² = χ(s)·conj χ(s) = χ(s)·χ(1-s) = 1 (s = 1/2+it, conj s = 1-s)

