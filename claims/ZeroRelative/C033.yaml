id: C033
title: "χ 乘子自反 + 临界线模恒 1 — 乘除法对消: χ(s)χ(1-s) = 1, |χ(1/2+it)| = 1"
status: PROVED
novelty_status: KNOWN
zero_role:
  basepoint: false
