statement:
  informal: |
    素数圆 (圆心 0, 半径 √p) 的乘法结构 (OBSERVATION/KNOWN):
    一、8 整点乘积 = p⁴:
    - 8 个整点 {±z, ±z̄, ±iz, ±iz̄} 两两共轭配对;
    - mul_conj: z·conj z = lift (norm z) — 共轭对乘积 = 范数;
    - prime_conj_pair: norm z = p ⟹ z·conj z = lift p;
    - rotated_conj_pair: (rot90 z)·conj(rot90 z) = lift p —
      旋转不破坏配对;
    - 4 对 × p = p⁴, 与方向无关。
    二、i 的后继乘法表 (每两个 = -1):
    - J_pow_two: i² = -1 — 每两个后继乘出 -1 (半圈, 180°);
    - J_pow_four: i⁴ = 1 — 4 循环闭合;
    - rotate_two_neg: rot90² = -z — 旋转两步 = ×(-1)。
    乘法表: 1 → i → -1 → -i → 1, 相邻 ×i, 隔一个 ×(-1) —
    C011 J² = -1 (高维中 -1 的平方根) 的迭代展开。
  formal_math: |
    ComplexAxis (C011) 上:
    (1) mul_conj: z * conj z = lift (norm z)
    (2) prime_conj_pair: norm z = p → z * conj z = lift p
    (3) rotated_conj_pair: norm z = p → (rot90 z) * conj (rot90 z) = lift p
    (4) J_pow_two: npow J 2 = -1
    (5) J_pow_four: npow J 4 = 1
    (6) rotate_two_neg: rot90 (rot90 z) = -z

