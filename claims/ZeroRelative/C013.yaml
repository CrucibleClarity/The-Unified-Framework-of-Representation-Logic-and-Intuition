id: C013
title: "Riemann direction in the projection frame — 反演漂移轴上黎曼部分和的构造, 临界线 1/2 = 反演-平移对偶中心"
status: PROVED
novelty_status: KNOWN
zero_role:
  basepoint: true
  additive_identity: false
  bottom: false
  seed: false
term_ref: "R072 (前置术语总纲): 表述待按单相位数/多相位数前缀声明式梳理"
branch: basepoint_relativity

statement:
  informal: |
    docs/关于黎曼猜想的思考.md: 黎曼函数有反演结构 (ζ(s) = Σ 1/n^s 每项
    取倒数)。在 C011 的真复数轴 (ComplexAxis 投影构造) 上形式化黎曼方向
    (OBSERVATION/KNOWN):
    一、反演的基点漂移 (复平面内):
    - recip z = conj z / |z|² 是乘法逆 (z ≠ 0); 实轴上 = 实数倒数。
    - 反演不保投影 (基点不漂移视角): π(recip z) ≠ 1/π(z) — 投影下反演
      信息丢失。
    - circleInv_{c,r}(z) = c + r²·recip(conj z - c): 基点漂移反演 (球心 c
      半径 r)。球面 |z-c| = r 上的点在反演下不动 ⟹ 投影保持 (球心在
      实轴时) — 漂移视角下反演保投影又保对称。
    - 平移 = 基点漂移: circleInv_translate — 平移共轭移动反演球心
      (平移向量需在实轴: 共轭破坏复数平移不变性, 轴蜷曲痕迹)。
    - ★ 蜷曲性: 以上都在 ComplexAxis (假复数轴, 基点不漂移简化视角)
      内部, 是"假复数轴的反演漂移", 同样蜷曲; 真正的保投影反演需要
      穿出复平面 (球心 (1,0) 球面) 的高维构造。
    二、黎曼部分和 = 反演轴上整数位求和:
    - npow (z^s 递归), zetaTerm n s = 1/(n+1)^s (漂移分量),
      zetaPartial N s = Σ_{k=1}^{N+1} 1/k^s — 沿反演漂移轴数整数位
      1,2,3,..., 每位取反演分量求和; "级数收敛" = 数到无穷时和停住
      (Re(s) > 1)。ζ_0(s) = 1; ζ_1(1) = 1/1 + 1/2 ("1/a + 1/b" 是
      s=1 两分量情形)。
    - zetaTerm_lift: 分量是实轴位置 1/(n+1)^s = lift(1/(n+1)^s) —
      每个漂移分量投影下可观测。
    三、临界线: 非平凡零点 Re(s) = 1/2 的 1/2 是映射 s ↦ 1-s 的
    唯一不动点 — "平移-反演对偶" a + b = 1 的对称中心 (C012
    inversion_dual_position 在临界条件 x+y=1 的特例):
    - one_minus_fixed: s = 1-s ⟺ s = 1/2; 复平面版 z = 1-z ⟺ z = lift(1/2)。
    - critical_line_iff_conj: Re(s) = 1/2 ⟺ 1-s = conj s — 临界线上
      1-s 与 s 互为共轭 (函数方程 ξ(s)=ξ(1-s) 与实系数共轭对称的组合)。
    - dual_center_self: 1/(1/(1/2) + 1/(1/2)) = (1/2)·(1/2) — 反演对偶
      在中心 1/2 处自闭合。
    零点位置映射: 假复数轴 (实部轴) = 1/2, 真复数轴 (虚部轴) = 非零
    位置 t (非平凡零点虚部非零; 平凡零点在假复数轴负偶整数, 真复数轴
    为零)。
  formal_math: |
    ComplexAxis (C011) 上:
    (1) recip z := ⟨z.a/(z.a²+z.b²), -z.b/(z.a²+z.b²)⟩; z ≠ 0 → z·recip z = 1
        (recip_mul_self); recip (lift a) = lift (1/a) (recip_lift);
        proj (recip ⟨1,1⟩) ≠ 1/proj ⟨1,1⟩ (proj_recip_lost)
    (2) circleInv c r z := c + lift(r²)·recip(conj z - c);
        |w|² = r² → lift(r²)·recip(conj w) = w (circleInv_core);
        c.b = 0 ∧ |z-c|² = r² → circleInv c r z = z (circleInv_fixed);
        ⟹ proj (circleInv c r z) = proj z (circleInv_proj_preserved);
        d.b = 0 → circleInv (c+d) r z = circleInv c r (z-d) + d
        (circleInv_translate)
    (3) npow z 0 = 1, npow z (s+1) = npow z s · z; (lift n)^s = lift(n^s);
        zetaTerm n s := recip (npow (lift (n+1)) s);
        zetaPartial 0 s = zetaTerm 0 s, zetaPartial (N+1) s =
        zetaPartial N s + zetaTerm (N+1) s;
        zetaTerm n s = lift (1/((n+1)^s)) (zetaTerm_lift);
        zetaPartial 0 s = 1; zetaPartial 1 1 = 1/1 + 1/2
    (4) one_minus_fixed_cplx: z = 1-z ⟺ z = lift(1/2);
        critical_line_iff_conj: proj z = 1/2 ⟺ 1-z = conj z;
        one_minus_proj: proj (1-z) = 1 - proj z;
        dual_center_self: recip (recip(1/2) + recip(1/2)) = (1/2)·(1/2)

