id: C016
title: "Full circle-lattice structure — 圆上整点的完整结构: 范数乘性 (圆间乘法链接), 整点环 (高斯整数), 旋转×共轭轨道"
status: PROVED
novelty_status: KNOWN
zero_role:
  basepoint: true
  additive_identity: false
  bottom: false
  seed: false
term_ref: "R072 (前置术语总纲): 表述待按单相位数/多相位数前缀声明式梳理"
branch: basepoint_relativity

statement:
  informal: |
    不局限于素数, 对任意半径的圆 x²+y² = n, 抓圆上所有整点的完整结构
    (OBSERVATION/KNOWN):
    - isLattice: 整点 (两轴坐标都是整数);
    - norm_mul: 范数乘性 norm (z·w) = norm z · norm w — 圆的乘法链接:
      圆 n 与圆 m 的整点乘出圆 nm 的整点 (合数 65 = 5·13 的 16 个整点
      = 5 和 13 的分解组合; 圆上整点数由半径的素数分解决定);
    - lattice_mul: 整点乘法封闭 — 圆上整点构成环 (高斯整数 Z[i]);
    - orbit_closed: 旋转 4 循环 × 共轭镜像 (最多 8 点) 全在同一圆上 —
      圆上整点的轨道结构: 整点 = 若干 8 点轨道, 圆间由乘法链接。
    这给出了"所有能抓的整点"的结构: 素圆的整点轨道经乘法组合生成合数
    圆的整点 (高斯整数环的乘法结构)。65 例: 16 个整点 = 4 种轨道组合。
  formal_math: |
    ComplexAxis (C011) 上:
    (1) isLattice z := ∃ a b : ℤ, z = ⟨(a:ℝ), (b:ℝ)⟩
    (2) norm_mul: norm (z·w) = norm z · norm w
    (3) lattice_mul: isLattice z → isLattice w → isLattice (z·w)
    (4) orbit_closed: norm z = norm (rot90 z) ∧ norm z = norm (conj z) ∧
        norm z = norm (rot90 (conj z))

objects:
  - "isLattice (整点)"
  - "norm (范数, 半径平方)"
  - "rot90 / conj (轨道生成: 旋转 4 循环 × 镜像)"
objects_note: null
definitions_used: ["ComplexAxis (C011)", "norm (C014)", "rot90 (C015)", "conj (C013)"]

assumptions:
