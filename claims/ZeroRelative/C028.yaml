statement:
  informal: |
    交换对称延拓 (用户方向): 每个对称点都是以延拓点为对称点的延拓点,
    无固定中心 — χ 的平移递推 (T4):
    - χ(s+2) = -4π²/(s(s+1))·χ(s), 相位版 arg χ(s+2) - arg χ(s) = π - arg(s(s+1));
    - 两步: χ(s+4) = 16π⁴/(s(s+1)(s+2)(s+3))·χ(s), 相位差分 = -arg(∏(s+2k)(s+2k+1))
      (π+π 抵消, 偶数步纯显式)。
    三角函数累积 (用户方向): u(t) = ζ(1/2+it)/|ζ(1/2+it)| = e^{i·arg ζ}
    良定义连续 (无分支), 且 (T5):
    - ζ(s) = χ(s)·conj ζ(s) (s = 1/2+it, 函数方程 + mathlib riemannZeta_conj 全域共轭);
    - u(t)² = χ(1/2+it) — u 是 χ 的连续平方根。
    沿 t 累积延拓: 每跨零点 u → -u (符号翻转 = arg 跳 π = 一个零点),
    翻转次数 = N₀(T), 整数计数由累积自动给出 (相位校准)。
  formal_math: |
    ℂ 上 (s = 1/2+it, u = ζ(s)/|ζ(s)|):
    (1) χ(s+2) = -4π²/(s(s+1))·χ(s)   (s ≠ 0, -1)
    (2) arg χ(s+2) - arg χ(s) = π - arg(s(s+1))  (Real.Angle)
    (3) χ(s+4) = 16π⁴/(s(s+1)(s+2)(s+3))·χ(s)   (s ≠ 0,-1,-2,-3)
    (4) arg χ(s+4) - arg χ(s) = -arg(s(s+1)(s+2)(s+3))  (Real.Angle)
    (5) ζ(s) = 2(2π)^{s-1}Γ(1-s)sin(πs/2)·conj ζ(s)
    (6) u² = 2(2π)^{s-1}Γ(1-s)sin(πs/2)  (ζ ≠ 0 处)

