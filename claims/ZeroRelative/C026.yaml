statement:
  informal: |
    ζ 零点计数 N(T) 的 Γ 相位部分用三个对称操作完全约化 (模 2π),
    全程不出现 Stirling 展开 (pat0: 对称操作得到的结果, 非差分链):
    - A 共轭: arg Γ(conj s) = -arg Γ(s) — 无条件 (arg_conj_coe_angle
      是 Real.Angle 层恒等式, π 分支在模 2π 下自动消失);
    - B 倍增 (Legendre): arg Γ(1/4+it/2) + arg Γ(3/4+it/2)
      = arg Γ(1/2+it) + (log 2^{1/2-it}).im — 乘子相位 -t·ln2 (线性);
    - C 反射 (Euler): arg Γ(3/4+it/2) + arg Γ(1/4-it/2)
      = -(log sin(π(3/4+it/2))).im — sin 非零由左侧 Γ(z)Γ(1-z) ≠ 0
      (re > 0) 经反射公式推出, 免整数/无理数论证;
    - D 组合: 2·arg Γ(1/4+it/2) = arg Γ(1/2+it) + (log 2^{1/2-it}).im
      + (log sin(π(3/4+it/2))).im — Γ 完全消去, 全显式。
    ⟹ G(t) = (1/2)arg Γ(1/2-it) + arg Γ(1/4+it/2) 约化为
    2G = -t·ln2 + (log sin(...)).im: 只剩线性项 + 显式 sin 对数相位。
  formal_math: |
    全部在 Real.Angle (ℝ/2πℤ) 中, s, z : ℂ:
    (A) (arg (Γ (conj s)) : Real.Angle) = -arg (Γ s)
    (B) (arg Γ(1/4+it/2) : Real.Angle) + arg Γ(3/4+it/2)
        = arg Γ(1/2+it) + (log (2 : ℂ)^(1/2-it)).im
    (C) (arg Γ(3/4+it/2) : Real.Angle) + arg Γ(1/4-it/2)
        = -(log (sin (π·(3/4+it/2)))).im
    (D) (2·arg Γ(1/4+it/2) : Real.Angle)
        = arg Γ(1/2+it) + (log 2^{1/2-it}).im + (log (sin (π(3/4+it/2)))).im

