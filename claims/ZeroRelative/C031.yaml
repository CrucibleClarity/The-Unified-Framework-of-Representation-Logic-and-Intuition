id: C031
title: "S(T) 整数层结构 — θ_ζ - θ_χ/2 ∈ πiℤ (pat ±1 过程): 符号改变位置不变, 整数层 = i 的迭代计数"
status: PROVED
novelty_status: KNOWN
zero_role:
  basepoint: false
  additive_identity: false
  bottom: false
  seed: false
term_ref: "R072; 观测 AO"
branch: basepoint_relativity

statement:
  informal: |
    S(T) 的振荡 = 符号翻转序列 (pat 正负 1 过程): 由 T6d (2θ_ζ - θ_χ ∈
    expKernel = 2πiℤ 逐点) 除以 2 得:
      θ_ζ(s) - θ_χ(s)/2 ∈ πiℤ  (整数层)
    S(T) = (1/(πi))·(θ_ζ - θ_χ/2) 是分段常数整数函数, 每跨零点跳 ±1 —
    符号改变, 位置 (零点) 不变。翻转 = 乘 -1 = i² (i 的迭代, 四次单位根
    {1,i,-1,-i}); 整数层 = 2πi 的迭代计数。θ_χ 显式 (快路径), 整数层 =
    翻转计数 — 全部快路径, 无迭代逼近。
  formal_math: |
    ℂ 上 (无零点区间 [0,T]):
    (1) 2θ_ζ - θ_χ ∈ expKernel = 2πiℤ (T6d hk)
    (2) θ_ζ - θ_χ/2 = n·πi, n ∈ ℤ (逐点, 整数层)
    (3) S(T) = (θ_ζ - θ_χ/2)/(πi) ∈ ℤ 的分段常数结构 (翻转计数)

