statement:
  informal: |
    一、蜷曲性 (用户洞察: 复数轴无论真假都是蜷曲的, 无限与有限无差别):
    - norm (recip z) = 1/norm z — 反演把远离的点卷回原点附近;
    - recip_vanishes_at_infinity: ∀ε>0, ∃R, norm z > R ⟹ norm (recip z) < ε
      — 无限远被卷回 0;
    - circleInv_vanishes_at_infinity: 反演漂移把无限远卷回球心 c 的 ε 邻域
      (球心在实轴, 共轭破坏范数故需此假设)。
    - 意义: 平坦轴上 1+2+3+... 发散 (无限≠有限); 蜷曲后 ζ(-1) = -1/12
      (无限=有限) — 解析延拓 = 把平坦轴上的发散识别为蜷曲结构里的有限对象。
    二、圆上整点与 90° 循环 (素数分裂的几何判据):
    - rot90 z := ⟨-z.b, z.a⟩ (乘 J 的 90° 旋转); 保持范数 (圆上点在圆上);
      R² = -z (半圈); R⁴ = id (4 循环, 周期性穿越);
      rot90_keeps_lattice: 整数格点旋转后仍是格点。
    - 符号变体 (norm_neg_b) 与顺序变体 (norm_swap) 同圆: 素数 p = a²+b²
      的 8 个整点 (符号×顺序) 全在半径 √p 的圆上, 90° 循环在它们之间跳。
    - 模 4 判别的几何版: 平方模 4 ∈ {0,1} (sq_mod_four);
      两平方和永不 ≡ 3 mod 4 (sq_add_sq_not_three_mod_four);
      p ≡ 3 (mod 4) ⟹ 圆 x²+y² = p 上无整点 (prime_not_sq_add_sq_three_mod_four)
      — 素数不分裂 ⟺ 圆空。
  formal_math: |
    ComplexAxis (C011) 上:
    (1) norm_recip: norm (recip z) = 1 / norm z
    (2) recip_vanishes_at_infinity: ∀ε > 0, ∃R, ∀z, norm z > R → norm (recip z) < ε
    (3) circleInv_vanishes_at_infinity: c.b = 0 → ∀ε > 0, ∃R, ∀z,
        norm (z - c) > R → norm (circleInv c 1 z - c) < ε
    (4) rot90 z := ⟨-z.b, z.a⟩; rot90_norm: norm (rot90 z) = norm z;
        rot90_sq: rot90 (rot90 z) = -z; rot90_four: rot90⁴ z = z;
        rot90_eq_J_mul: rot90 z = J * z; rot90_keeps_lattice
    (5) norm_neg_b: norm ⟨a,-b⟩ = norm ⟨a,b⟩; norm_swap: norm ⟨b,a⟩ = norm ⟨a,b⟩
    (6) sq_mod_four: (x²) % 4 = 0 ∨ (x²) % 4 = 1
    (7) sq_add_sq_not_three_mod_four: (a²+b²) % 4 ≠ 3
    (8) prime_not_sq_add_sq_three_mod_four: p.Prime → p % 4 = 3 →
        ¬ ∃ a b, a² + b² = p

