conclusion: "用户断言成立 (2026-08-12): 迭代方向轴 (发散轴) 与其共轭轴 (周期轴),
  经共轭映射关系 (conj_add/conj_preserves_iterate), 共享基点的同方向轴的
  任意迭代之间都可无损压缩 — 迭代映射单射 (R048) + 共轭保持迭代方向。"

