  "你不把单相位搞清楚，怎么定义乘法。"

statement:
  informal: |
    ★ 观点提出者: 用户 (2026-08-12)。单相位数的完整定义 (乘法定义的前提)。

    ★ 单相位完整定义 (验证结果):
      ① 单相位数 = 方向 d 上的标量列 {n·d : n ∈ ℕ}
      ② 每步位移 d 相同 (相位恒定): 链 e → e+d → e+2d → ...
      ③ 点列等差: |(n+1)d - nd| = |d| 恒定
      ④ 终点位移 = n·d (相位 = phase(d) 恒定, 长度缩放)
      ⑤ 单相位链含乘法结构: n·d (n 标量 × d 方向)

    ★ 乘法定义 (单相位前提):
      乘法 = 单相位链的标量作用 (n·d)
      乘法链 (等比 ×2): d → 2d → 4d → 8d
      log 表 = 单相位链的加法表示: log(n·d) = log n + log d
      乘法链 --log--> 加法链 (等比 ×2 → 等差 +log2)

    ★ 机械验证 (R091_monophase_definition.py, 枚举=证据):
      1. 单相位 = 每步位移 d 相同 (相位恒定): PASS
      2. 单相位链: 终点位移 = n·d (相位恒定, 长度缩放): PASS
      3. 单相位点列 = 等差 (间隙 |d| 恒定): PASS
      4. 乘法链 (等比×2) --log--> 加法链 (等差+log2): PASS
      5. 单相位完整: {n·d}; 乘法 = 标量作用; log = 加法表示: PASS

    ★ 与既有 claim 的关系:
      - R071 (单相位数定义): 本 claim 的完整化 (同轴同向 → {n·d})
      - R090 (log 表 = 单相位怀疑): 本 claim 确认 log 表 = 加法表示
      - R087 (乘法重定义): 乘法 = 单相位标量作用
      - R089 (基点统一): log/exp 穿折越 (乘法链 ↔ 加法链)
      - R072 (声明): ℙ⟨φ⟩ 的完整语义
      结论: 单相位数 = {n·d} (方向 d 上标量列); 乘法 = 标量作用;
      log 表 = 加法表示 — 搞清单相位 ⟹ 乘法可定义。

    ★ 支撑 (Lean):
      - R071 / R090 / R089 / R087 / R072 [claim 级]
  formal_math: |
    -- 单相位数: {n·d : n ∈ ℕ} (方向 d 上标量列, 相位恒定)
    -- 等差: |(n+1)d - nd| = |d|
    -- 乘法 = 标量作用: n·d
    -- log 表示: log(n·d) = log n + log d (等比 → 等差)

