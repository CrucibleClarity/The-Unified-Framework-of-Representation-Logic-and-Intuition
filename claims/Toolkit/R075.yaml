statement:
  informal: |
    ★ 观点提出者: 用户 (2026-08-12)。R074 与既有理论的归并确认。

    ★ 主张内容:
      R074 的"半圈+phi"结构 (环: 对称性 S + 半圈) 本质上是之前说的
      "phi/2 + 0-phi" — 即 RulerFoldCircle (0-π 折叠) 与 C013 (临界线
      1/2 = phi/2 对偶中心)。同一结构的两个表述。

    ★ 数学内容 (验证):
      ① 0-phi 折叠: 全相位 [0,2π) 压进 [0,π] (RulerFoldCircle)
      ② 半圈 π = 折叠固定点 (fold_fixed_at_pi: π = 2π-π)
      ③ 折叠对合: θ 与 2π-θ 折叠同点 (方向消失, fold_kills_direction)
      ④ 半圈在折叠下: fold(θ+π) 与 fold(θ) 镜像关系 (半圈 = 对偶)
      ⑤ 归并: 环 (2π) 的 S (镜像) + 半圈 (π) = 折叠 (0-phi) + 对偶中心
         (π = phi 的一半)

    ★ 机械验证 (R075_half_phi_fold.py, 枚举=证据):
      1. 0-phi 折叠: 全相位 ∈ [0,π]: PASS
      2. 半圈 π = 折叠固定点: PASS
      3. 折叠对合: θ 与 2π-θ 同点: PASS
      4. 半圈在折叠下 (镜像): PASS
      5. 归并: 同一结构: PASS

    ★ 归并的意义 (用户: "问题更严峻"):
      周期性 (R074: 基点 = 环) ⟹ 折叠 (0-π) 是必然, 非巧合:
      环的对称性 S (镜像) 折叠后 = 0-π 段的对合; 半圈 π = phi/2 对偶中心。
      R074 不是新结构, 是 RulerFoldCircle/C013 在"基点 = 环"视角的再发现;
      反向也确认折叠理论正确 (从周期本质推出的环折叠正是 0-π)。
      落 R072 符号: Pat (ℙ⟨φ⟩) 的相位环折叠后 = 0-π 段, 对偶中心 = φ/2 —
      单相位数的相位结构内部就有折叠/对偶, 无需外部引入。

    ★ 与既有 claim 的关系:
      - R074 (基点 = 环): 本 claim 的归并对象
      - RulerFoldCircle (0-π 折叠): 折叠表述
      - C013 (临界线 1/2 = phi/2 对偶中心): 对偶中心表述
      - R072 (单相位数 Pat): ℙ⟨φ⟩ 的相位环折叠 = 0-π
      - RulerCycle (对称性 = 相位周期函数): 环的周期性
      结论: 半圈+phi = phi/2 + 0-phi — 周期 ⟹ 折叠必然; 归并确认。

    ★ 支撑 (Lean):
      - fold_fixed_at_pi / fold_kills_direction / fold_finite
        [CircleFold.lean]
      - R074 (环结构) [claim 级]
  formal_math: |
    -- 折叠 (0-phi): foldAngle θ = min(θ mod 2π, 2π - θ mod 2π) ∈ [0, π]
    -- 半圈 = 固定点: foldAngle π = π (π = 2π - π)
    -- 折叠对合: foldAngle θ = foldAngle (2π - θ) (方向消失)
    -- 归并: 环的对称性 S + 半圈 π = 折叠 (0-π) + 对偶中心 (φ/2)

