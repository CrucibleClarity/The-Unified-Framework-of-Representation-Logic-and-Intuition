id: R144
title: "R144 (user-proposed 2026-08-12): ★0 与 1 = 对称对还原点 (R085 + R143 统一) — 0 = 加法对称对还原点 (t+(-t) = 0, R085 折叠类), 1 = 乘法/相位对称对还原点 (r·(1/r) = 1, exp(iθ)·exp(-iθ) = 1, R143); log 把乘法对映到加法对 (log r + log(1/r) = 0, 还原点 1→0, R110/R089); 还原点对偶: log 1 = 0 且 exp 0 = 1 (0 ↔ 1 穿折越, R089/R090)"
