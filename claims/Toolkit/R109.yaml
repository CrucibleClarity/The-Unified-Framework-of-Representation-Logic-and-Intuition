      - R085 (0 = ±1 折叠类): 观测视角
      - C017 (素数圆): 圆心 0
      - C022 (临界线圆): 过 0 和 2
      - C021 (零点形状): 反演视角
      结论: 折叠类 0 = 素数圆圆心 ∩ 临界线圆直径端点;
      反演 0↔∞, 2↔1/2; 公共锚。

    ★ 支撑 (Lean):
