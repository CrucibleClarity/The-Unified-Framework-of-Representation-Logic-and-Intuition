    - formal/Formal/ZeroRelative/ComplexAxis.lean
    - formal/Formal/Toolkit/Compactification.lean
    - formal/Formal/Toolkit/SymmetryRecovery.lean
  lake_build: PASS
  sorry_count: 0
  warning_count: 0
