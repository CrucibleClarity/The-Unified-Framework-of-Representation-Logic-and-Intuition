statement:
  informal: |
    ★ 观点提出者: 用户 (2026-08-12)。确认 pat n 的有限离散构造 + 圆上映射。

    ★ 验证 (链条已闭环, 每环锚到已证 claim):
      ① 有限离散构造: pat n = pat0 + n·d (R137 pat_n_is_monophase:
         每步声明相同方向 ⟹ 等差单相位链 {n·d}); 每步 = 完整互锁单元
         (相位 θ, 距离 r) (R140 completePat1: 两组对称性联合锁定);
         层结构 = 有限归纳 Layer (R113: basepointLayer | layerUp Layer);
         可数 (R116: 空迭代家族可数无穷)
      ② 映射到圆上: pat n 蜷曲到相位环 (R138 pat_chain_curls_to_circle:
         R055 时间轴蜷曲保映射机制); 相位在单位圆上 (R138
         pat_chain_phase_finite: ‖exp(2π·(pat n/T)·I)‖ = 1)
      ③ ★单位根量化 (新): 任意相位 θ ∈ [0, 2π] 可量化到单位根
         {exp(2π·j/n)} 格点, 误差 ≤ π/n (R059: 0-π 双倍角自变圆 +
         单位根 n 槽环; R060: 离散⟷连续互逆) — 证明: x = θ·n/(2π),
         r = round x (|x - r| ≤ 1/2, Mathlib round 最近整数),
         0 ≤ r ≤ n (θ ∈ [0,2π]) ⟹ 格点 2πr/n 与 θ 角距 ≤ π/n
      ④ 结论: pat n 同时有限离散构造 (互锁单元有限序列) 且映射到圆上
         (相位蜷曲 + 单位根量化) — 有限离散的圆上表示

    ★ 验证结论: 用户断言成立 — pat n 有限离散构造 (①) + 映射到圆上
       (②) + 量化到单位根 n 槽环 (③, 误差 ≤ π/n)。

  formal_math: |
    -- pat n 的相位在单位圆上 (R138):
    theorem pat_n_phase_on_circle (pat0 d T : ℝ) (hT : T ≠ 0) (n : ℕ) :
      ‖Complex.exp (2 * Real.pi * (patChain pat0 d n / T) * Complex.I)‖ = 1
    -- ★单位根量化: 任意相位 θ 量化到单位根格点, 误差 ≤ π/n:
    theorem phase_quantizable (θ : ℝ) (n : ℕ) (hn : 0 < n)
      (hθ₁ : 0 ≤ θ) (hθ₂ : θ ≤ 2 * Real.pi) :
      ∃ j : ℕ, j ≤ n ∧ |θ - 2 * Real.pi * (j : ℝ) / n| ≤ Real.pi / n
    -- pat n 的相位量化到 n 槽环 (组合):
    theorem pat_n_quantized (θ : ℝ) (n : ℕ) (hn : 0 < n)
      (hθ₁ : 0 ≤ θ) (hθ₂ : θ ≤ 2 * Real.pi) :
      ∃ j : ℕ, j ≤ n ∧ |θ - 2 * Real.pi * (j : ℝ) / n| ≤ Real.pi / n
    -- pat n 有限离散构造 (R137):
    theorem pat_n_finite_construction (pat0 d : ℝ) (n : ℕ) :
      patChain pat0 d n = pat0 + (n : ℝ) * d

objects:
- pat_n_phase_on_circle
- phase_quantizable
- pat_n_quantized
- pat_n_finite_construction

