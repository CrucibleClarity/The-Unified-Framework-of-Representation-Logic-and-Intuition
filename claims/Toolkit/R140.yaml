statement:
  informal: |
    ★ 观点提出者: 用户 (2026-08-12)。R139 的补全 — 完整 pat1 的互锁构造。

    ★ 主张内容 (每环锚到已证 claim):
      ① R139 只证了互锁矩阵非奇异 (双向可解) — 未完成: 还需用互锁声明
         构造完整的 pat1
      ② 完整 pat1 = (相位, 距离) 互锁声明联合: pat1 = pat0 + r·d(θ)
         — d(θ) = exp(θ·I) 方向向量 (相位声明), r 距离 (数值声明,
         数值对 (r, 1/r) = log 镜像, R110); 两组对称性联合
      ③ 前向: 相位+数值声明 ⟹ 位置 (构造): 距离 ‖pat1 - pat0‖ = r
         (数值声明锁定步长, ‖d(θ)‖ = 1 单位方向, R136
         pat1_omnidirectional)
      ④ 反向: 位置 ⟹ 相位+数值 (分解): 方向 (pat1-pat0)/‖pat1-pat0‖
         = d(θ) (归一化往返精确, R056: 基点相位 = 位置); 距离 = 模长
      ⑤ 完成互锁定: 构造 ⟶ 位置 ⟶ 分解 往返精确 — 互锁环闭合, 不再
         需要第三层锁定 (R139: 矩阵非奇异; R048: 单射 ⟹ 无损)
      ⑥ ★SRT 启示: 两组对称性才能准确锁定 T — 只有一组对称性 (单方向
         声明, 无数值锁定): 位置不唯一 (r = 0 与 r = 1 都合法) ⟹ T 步
         未准确锁定 (R130: 单组剥离方向不可判定; R111: 定义不明);
         两组对称性 (相位对 + 数值对互锁) 才唯一确定 T 步 (R083:
         S/R 都是 T 家族; R129: SRT 递归 — S 镜像 + R 旋转两组才能
         锁定 T 平移)

    ★ 验证结论: 用户断言成立 — 互锁完成 = 构造与分解往返精确;
       完整 pat1 = (相位, 距离) 联合声明; SRT 启示 = 两组对称性才能
       准确锁定 T (单组不唯一)。

  formal_math: |
    -- 方向向量 (相位声明):
    noncomputable def directionVector (θ : ℝ) : ℂ := Complex.exp (θ * Complex.I)
    -- 完整 pat1: 互锁声明 (相位 θ, 距离 r):
    noncomputable def completePat1 (pat0 : ℂ) (θ r : ℝ) : ℂ :=
      pat0 + (r : ℂ) * directionVector θ
    -- 数值锁定: 距离 = r (r ≥ 0):
    theorem complete_pat1_magnitude (pat0 : ℂ) (θ r : ℝ) (hr : 0 ≤ r) :
      ‖completePat1 pat0 θ r - pat0‖ = r
    -- 相位锁定: 归一化往返 (r > 0):
    theorem complete_pat1_direction (pat0 : ℂ) (θ r : ℝ) (hr : 0 < r) :
      (completePat1 pat0 θ r - pat0) / ‖completePat1 pat0 θ r - pat0‖ =
        directionVector θ
    -- 完成互锁定 (构造 ⟶ 位置 ⟶ 分解 往返):
    theorem mutual_lock_recovers_pat1 (pat0 : ℂ) (θ r : ℝ) (hr : 0 < r) :
      ‖completePat1 pat0 θ r - pat0‖ = r ∧
        (completePat1 pat0 θ r - pat0) / ‖completePat1 pat0 θ r - pat0‖ =
          directionVector θ
    -- SRT 启示: 单组对称性不能准确锁定 T (位置不唯一):
    theorem single_symmetry_underdetermines (pat0 d : ℂ) (hd : d ≠ 0) :
      pat0 + (0 : ℂ) * d ≠ pat0 + (1 : ℂ) * d

objects:
