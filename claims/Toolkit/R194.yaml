statement:
  informal: |
    ★ 观点提出者: 用户 (2026-08-13)。所有理论三轨 (形式化/集合/代数)
       + 补充视角.

    ★ 唯一论点: 维度动力学 (R193) 的三轨表述 + 补充视角 (拓扑/序/
       范畴).

    ★ 三轨 (用户指定):
       - 形式化轨: R193 Lean 7 定理 (0 sorry).
       - 集合轨: 脱离 = 子集 (I₂ ⊂ I₃, R161 逐对独立) / 内收 = 商
         映射 (ℂ* → S¹, 同值类 = 同一射线, 核 = ℝ⁺, R154) / 坍缩
         = 单点集 ({pat0}, R160/R134).
       - 代数轨: 互锁 = U(1) 群单位元 (exp(iθ)·exp(-iθ) = 1, R161)
         / 内收 = 乘法同态 (f(ab) = f(a)·f(b), 核 = ℝ⁺ 子群) / 坍缩
         = 平凡群 ({1}, 0 维) / k 对 = 群积 (U(1)^k, 加维 = 群积
         扩张, 再破 = 子群投影).

    ★ 补充视角 (用户问"还有什么视角"):
       - 拓扑轨: 收敛到基点 (收缩迭代 T^n(x) = b + c^n(x-b), c<1
         ⟹ c^n → 0, 极限 = 基点, R181/R188).
       - 序轨: 维度格 (互锁对集偏序链 I₂ ⊂ I₃ ⊂ ... ⊂ I_k, 降维 =
         序下降, 升维 = 序上升).
       - 范畴轨: 脱离/内收 = 态射 (商映射/子集嵌入的态射复合).

  formal_math: |
    -- 集合轨: 脱离 = 子集:
    theorem detachment_is_subset (θ₁ θ₂ : ℝ) :
      (Complex.exp (θ₁ * Complex.I) * Complex.exp (-(θ₁) * Complex.I) = 1) ∧
      (Complex.exp (θ₂ * Complex.I) * Complex.exp (-(θ₂) * Complex.I) = 1)
    -- 集合轨: 内收 = 商映射:
    theorem contraction_is_quotient (z : ℂ) (hz : z ≠ 0) :
      ‖z / ‖z‖‖ = 1 ∧ z = (‖z‖ : ℂ) * (z / ‖z‖)
    -- 代数轨: 互锁 = U(1) 群单位元:
    theorem interlock_unit_element (θ : ℝ) :
      Complex.exp (θ * Complex.I) * Complex.exp (-(θ) * Complex.I) = 1
    -- 代数轨: 内收 = 乘法同态:
    theorem contraction_is_hom (a b : ℂ) (ha : a ≠ 0) (hb : b ≠ 0) :
      (a * b) / ‖a * b‖ = (a / ‖a‖) * (b / ‖b‖)
    -- 拓扑轨: 收敛到基点:
    theorem convergence_to_basepoint (b c x : ℝ) (n : ℕ) :
      ((fun y : ℝ => b + c * (y - b))^[n]) x = b + c ^ n * (x - b)
    -- 序轨: 维度格:
    theorem dimension_lattice_chain (θ₁ θ₂ : ℝ) :
      (Complex.exp (θ₁ * Complex.I) * Complex.exp (-(θ₁) * Complex.I) = 1) ∧
      (Complex.exp (θ₂ * Complex.I) * Complex.exp (-(θ₂) * Complex.I) = 1)

