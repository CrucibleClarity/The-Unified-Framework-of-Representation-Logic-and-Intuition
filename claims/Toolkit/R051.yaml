id: R051
title: "R051 (user-proposed 2026-08-12): ANY pair of orthogonal axes sharing a basepoint maps losslessly — orthogonality is exactly the condition that makes the conjugation/reflection structure lossless"
status: PROVED
novelty_status: NOVELTY_UNASSESSED
