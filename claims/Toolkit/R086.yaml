statement:
  informal: |
    ★ 观点提出者: 用户 (2026-08-12)。在"0 = ±1 折叠类" (R085) 视角下
       重新审视自然数与素数。

    ★ 自然数域是什么 (R085 视角):
      ① 每个非零 n 在 S (镜像) 下有两态对 {+n, -n} (镜像交换)
      ② 自然数 N = {Tⁿ(0)} = 从折叠中心出发的后继迭代, 每步只选正半边
      ③ 完整对称 = 整数 Z (含 ±n); 自然数 = 破缺 (只留正半边)
      ④ ⟹ 自然数域 = 镜像对称破缺的选择产物 (RulerAsym: 方向选择)
      ⑤ 0 = 唯一不动点 (折叠中心) = 破缺的锚

    ★ 素数是否更干净:
      ① 不更干净: 素数 p 与合数一样是 S 两态对 {+p, -p} 的一半
         (镜像/折叠视角无差别)
      ② 但特殊: 素数 = 乘法轴原子 (不可分解) — 干净属于乘法轴,
         与加法/后继轴正交
      ③ 素数圆结构 (C011-C025): 高斯整数、素数圆单轨道 (C017),
         圆上整点 — 合数没有的特殊性

    ★ 机械验证 (R086_naturals_primes.py, 枚举=证据):
      1. 每个非零 n 是 S 两态对 {+n,-n} 的一半; 0 是不动点: PASS
      2. 自然数 = 两态对的正半边选择 (Tⁿ(0)): PASS
      3. 自然数 = 镜像对称的破缺选择 (RulerAsym): PASS
      4. 素数是乘法轴原子, 但同样是 S 两态对一半: PASS
      5. 素数/合数在 S 视角无差别: PASS
      6. 素数特殊: 乘法轴原子 + 圆上整点 (C016): PASS

    ★ 总结表:
      | 视角 | 自然数 | 素数 |
      |---|---|---|
      | 镜像 S (折叠) | 两态对半边 (破缺) | 同样半边 (无差别) |
      | 后继 T (加法轴) | Tⁿ(0) 迭代 | 同样迭代 (无差别) |
      | 乘法轴 | — | 原子 (不可分解) |
      | 圆结构 | — | 整点/单轨道 (C017) |
      素数的干净是乘法轴的 + 圆上的, 不是折叠意义上的干净。

    ★ 与既有 claim 的关系:
      - R085 (0 = ±1 折叠类): 本 claim 的视角基础
      - RulerAsym (方向选择破缺): 自然数 = 破缺半边
      - C011-C025 (素数圆): 素数特殊性的来源
      - R063 (每步重选): 自然数 = Tⁿ 迭代
      - R072 (声明): 自然数/素数的相位声明
      结论: 自然数 = 镜像破缺的半边选择; 素数不更干净但更特殊
      (乘法原子 + 圆整点)。

    ★ 支撑 (Lean):
      - R085 (0 折叠类) / RulerAsym / C011-C025 [claim 级]
  formal_math: |
    -- 两态对: S(n) = -n (每个非零 n)
    -- 自然数: N = {Tⁿ(0)} (正半边选择, 破缺)
    -- 素数: 乘法轴原子 (无真因子) + 圆上整点 (C016)

