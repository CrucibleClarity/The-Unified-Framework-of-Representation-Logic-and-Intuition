title: "R077 (user-proposed 2026-08-12): the basepoint structure phase and the successor phase are DIFFERENT phases — the basepoint is a ring (R074: symmetry S + self-referential iteration T); successor walks the ring (T: translation, θ→θ+Δ), structure is the ring's mirror (S: θ→-θ); T and S anti-commute (direction duality) ⟹ ℙ⟨φ⟩ must declare the phase type (φ_T successor-phase / φ_S structure-phase)"
