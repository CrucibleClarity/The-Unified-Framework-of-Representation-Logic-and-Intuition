statement:
  informal: |
    ★ 观点提出者: 用户 (2026-08-13)。金丹篇完整论文核对后的不完备点
        pat 重形式化。

    ★ 核对发现的不完备点 (原表述 → pat 重形式化):
      ① 折叠镜像的无损性 (RulerProphecy mirror_at_pi / RulerFreeTime
         fold_kills_direction): 原 Lean 用 exp(i(θ-2π)) = exp(iθ) (2π 周期
         平移, 与"对折"语义不符)。pat 重形式化: 折叠 = 共轭
         (conj_reflects_J: 周期轴 J 取反, det=-1 反射), 共轭 = 无损映射
         (conj_preserves_norm 保范 + conj_bijective 双射, R047/R048) —
         折叠不丢信息, 只翻相位方向
      ② 折叠类 = pat 格点上的等价类 (RulerFreeTime: 未来 30° ↔ 过去
         330° 折叠后同点): 折叠类 {θ, 2π-θ} 对折后同点 ⟺ foldAngle
         相等 (foldAngle (2π-θ) = foldAngle θ) — "折叠区域 = 未来/过去
         相位差 0" 的精确语义
      ③ 收敛结构的 pat 量化 (RulerErrorSeq 与 R146 同型): 预言误差
         e(n) = C·n^(1-s) 是"提前截断"的误差界; pat 量化误差 ≤ π/N
         同样是"提前截断"的误差界 (pat_quantization_converges: 任意
         相位被 pat 格点任意精度逼近) — 两者同型
      ④ Richardson 外推参数必须匹配误差阶 (RulerErrorIter): 误差序列
         比率 polyError (2n)/polyError n = 2^(1-s), 外推公式的 k 必须
         等于真实误差阶 (s-1), 否则外推差一个量级 (2026-08-13 审查注)

    ★ 命名纪律 (用户指令): 尽可能不用开方和无声明的 i — i 必须声明为
        周期轴 J (R047: i = 周期轴, 90° 旋转, J⁴ = 1, 不是"负数开方"的
        代号); 开方收缩向基点 (R069)。本重形式化全部用 ComplexAxis
        (声明的 J) + 实数, 无 sqrt, 无裸 Complex.I。

  formal_math: |
    -- 折叠 = 共轭反射 (周期轴取反):
    theorem fold_is_conjugate : ComplexAxis.conj ComplexAxis.J = -ComplexAxis.J
    -- 共轭折叠无损 (保范等距):
    theorem conjugate_is_lossless_fold (z : ComplexAxis) :
      ComplexAxis.norm (ComplexAxis.conj z) = ComplexAxis.norm z
    -- 共轭双射 = 无损往返:
    theorem conjugate_bijective_lossless :
      Function.Bijective (ComplexAxis.conj : ComplexAxis → ComplexAxis)
    -- 折叠类同点 = foldAngle 相等 (未来 30° ↔ 过去 330°):
    theorem fold_class_eq_foldAngle (θ : ℝ) (hθ₁ : 0 ≤ θ) (hθ₂ : θ ≤ 2 * Real.pi) :
      foldAngle (2 * Real.pi - θ) = foldAngle θ
    -- 收敛结构 pat 量化 = 任意精度截断预言:
    theorem quantization_pat_converges (θ : ℝ) (hθ₁ : 0 ≤ θ) (hθ₂ : θ ≤ 2 * Real.pi) :
      ∀ ε : ℝ, 0 < ε → ∃ N : ℕ, 0 < N ∧ ∃ j : ℕ, j ≤ N ∧
        |θ - 2 * Real.pi * (j : ℝ) / N| ≤ ε

objects:
- fold_is_conjugate
- conjugate_is_lossless_fold
- conjugate_bijective_lossless
- fold_class_eq_foldAngle
- quantization_pat_converges

definitions_used:
- R047 (共轭对称性 S, 周期轴 J) / R048 (无损 = 往返精确, 单射 ⟹ 无损) / R146 (pat 量化收敛: 误差 ≤ π/N) / R069 (开方收缩向基点) / R154 (数值-相位互锁) / CircleFold (foldAngle = min θ (2π-θ)) / ComplexAxis (声明的 J, J² = -1 高维构造) / RulerFreeTime (折叠区域时间对称) / RulerErrorSeq (误差序列) / RulerErrorIter (Richardson 外推 k 须匹配误差阶)

assumptions:
- "折叠 = 共轭反射 (R047: 周期轴 J 是 S 的 -1 特征空间)"
- "共轭 = 无损 (R048: conj_bijective 单射 ⟹ 无损; conj_preserves_norm 保范)"
- "折叠类同点 = foldAngle 相等 (foldAngle = min θ (2π-θ))"
- "收敛结构 = pat 量化可逼近 (R146 pat_quantization_converges)"
- "不用开方和无声明的 i: i 声明为周期轴 J (R047), 开方收缩向基点 (R069)"

conclusion: "用户指令成立 (2026-08-13): 金丹篇不完备点全部 pat 重形式化 —
  ① 折叠 = 共轭反射 (conj_reflects_J), 共轭折叠 = 无损 (保范 + 双射,
  R047/R048) — 修复 mirror_at_pi/fold_kills_direction 原 2π 周期平移语义
  与'对折'不符的缺陷; ② 折叠类同点 = foldAngle 相等 (未来 30° ↔ 过去
  330° 折叠后同一点, RulerFreeTime 相位差 0 的精确语义); ③ 收敛结构
  pat 量化 = 任意精度截断预言 (pat_quantization_converges, R146);
  ④ Richardson 外推 k 须匹配误差阶 (RulerErrorIter)。命名纪律: 不用开方,
  i 声明为周期轴 J (R047/R069)。"

