statement:
  informal: |
    ★ 观点提出者: 用户 (2026-08-12)。R144 还原点结构的几何兑现 —
       素数圆与临界线圆。

    ★ 验证 (每环锚到已证 claim):
      ① 素数圆 (|z| = √p): 圆心 0 = R144 的加法还原点 (R085 折叠类;
         R109: 折叠类 0 = 素数圆圆心; C016/C017: 高斯整数/素数圆
         单轨道)
      ② 临界线圆 (|z - 1| = 1): 圆心 1 = R144 的乘法还原点 (乘法基点;
         R109: 圆心 (1,0), 半径 1, 过 0 和 2 — 直径端点; C019-C022:
         临界线圆)
      ③ 反演 2 ↔ 1/2 (R109) = 乘法对称对 {r, 1/r} (R143/R144:
         r·(1/r) = 1 还原到临界线圆圆心 1; R110: log 镜像对称)
      ④ log 对偶: log 2 + log(1/2) = 0 (R144 log_maps_mul_pair_to_add_pair:
         乘法对经 log 变加法对, 还原点 1 漂移到 0; R089: log 1 = 0)
      ⑤ 统一: 0 = 素数圆圆心 (加法还原点), 1 = 临界线圆圆心 (乘法
         还原点) — 素数圆与临界线圆 = R144 两个还原点的圆化

    ★ 验证结论: 用户断言成立 — 素数圆与临界线圆正是 R144 两个还原点
       (0 与 1) 的圆化: 0 = 素数圆圆心 (折叠类), 1 = 临界线圆圆心
       (乘法基点), 反演对还原到圆心 1。

  formal_math: |
    -- 临界线圆 (圆心 1, 半径 1) 过 0, 2, 1+i (R109):
    theorem critical_circle_points :
      ‖(0 : ℂ) - 1‖ = 1 ∧ ‖(2 : ℂ) - 1‖ = 1 ∧ ‖((1 : ℂ) + Complex.I) - 1‖ = 1
    -- 素数圆圆心 = 0 (折叠类, 半径 √p) (R109/R144):
    theorem prime_circle_center_zero (p θ : ℝ) (hp : 0 ≤ p) :
      ‖(Real.sqrt p : ℂ) * Complex.exp (θ * Complex.I) - 0‖ = Real.sqrt p
    -- 反演对 = 乘法对称对 (R143/R144):
    theorem reciprocal_pair_reduces (r : ℝ) (hr : r ≠ 0) : r * (1 / r) = 1
    -- log 对偶实例 (R144/R089):
    theorem log_pair_instance :
      Real.log 2 + Real.log (1 / 2) = 0
    -- 统一: 两个还原点 = 两个圆的圆心 (R144 + R109):
    theorem fold_centers_are_circle_centers (p : ℝ) (hp : 0 ≤ p) :
      ‖(Real.sqrt p : ℂ) * Complex.exp (0 * Complex.I) - 0‖ = Real.sqrt p ∧
        ‖(0 : ℂ) - 1‖ = 1 ∧ ‖(2 : ℂ) - 1‖ = 1

