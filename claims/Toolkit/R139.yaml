conclusion: "用户断言成立 (2026-08-12): 相位-数值互锁 — 相位锁定需要相位
  锁定 (回归) ⟹ 用已锁定的数值 (pat1) 反向锁定相位; 声明 = 两组对称性
  (相位/方向对 + 数值/距离对); 成对向量 = 矩阵; 互锁 ⟺ 矩阵非奇异
  (det = θ(r+1/r) ≠ 0) ⟺ 双向可解 (R048 无损); 数值对 (r,1/r) = log
  镜像对称 (R110)。"

known_special_cases:
  - "前向: 相位声明 ⟹ pat1 = pat0 + d (数值位置, R137)"
  - "反向: (pat1-pat0)/‖pat1-pat0‖ = d (归一化往返, ‖d‖=1)"
  - "矩阵: !![θ, r; -θ, 1/r], det = θ(r+1/r) ≠ 0 (θ≠0, r>0)"
  - "数值对: log(1/r) = -log r (R110 镜像)"
  - "退化: θ=0 或 r≤0 ⟹ 互锁失效 (单方向声明污染, R062)"

