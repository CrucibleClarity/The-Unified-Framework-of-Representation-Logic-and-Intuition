  - "素数轴 (C012-C014): 素数的发散性在实轴上 (投影), 素数圆周期在 J 轴上 — 同一 S 分解的两个分量"
  - "NS3 时间反演: T = diag(-1,1,...) 与 S = conj 同为 det=-1 反射"

