id: R047
title: "R047 (user-proposed 2026-08-12): divergence and periodicity are the eigenspace decomposition of ONE conjugation symmetry — a divergence axis and its complex axis share a basepoint, are orthogonal, and differ only in direction"
status: PROVED
novelty_status: NOVELTY_UNASSESSED
zero_role:
  basepoint: true
  additive_identity: false
  bottom: false
  seed: false
