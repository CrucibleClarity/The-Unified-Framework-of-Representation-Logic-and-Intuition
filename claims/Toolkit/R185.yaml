statement:
  informal: |
    ★ 观点提出者: 用户 (2026-08-13)。R184 证明逻辑过程的实例化验证.

    ★ 唯一论点: R184 的 5 步证明逻辑过程可实例化到任意间隔 k —
       正确基点 = 最小非整除模, 错误基点 = 整除间隔的模.

    ★ 实例 1: 间隔 4 (de Polignac 特例):
       命题 P(N): 模 N 折叠下间隔 4 可见 (4 mod N ≠ 0).
       - 定位错误基点: 4 mod N = 0 ⟺ N | 4 ⟺ N ∈ {1, 2, 4}.
       - 预言正确基点: N = 3 (4 mod 3 = 1 ≠ 0, 最小非整除模).
       - 一步解算: 4 mod 2 = 0 (错误) → 4 mod 3 = 1 (正确).
       - 召唤: 4 槽环观测: 4 mod 4 = 0 → 间隔 4 在 4 槽环坍缩
         (对比间隔 2 半圈可见 R175; R178 gap_two_vs_four_distinct).

    ★ 实例 2: 间隔 6 (三胞胎结构):
       - 定位错误基点: 6 mod N = 0 ⟺ N | 6 ⟺ N ∈ {1, 2, 3, 6}.
       - 预言正确基点: N = 4 (6 mod 4 = 2 ≠ 0).
       - 一步解算: 6 mod 2 = 0 (错误) → 6 mod 4 = 2 (正确).

    ★ 泛化规律: 正确基点 = 最小非整除模 (2 整除偶数 k 恒成立 → 最小
       正确模 ≥ 3; k=6 时 3 也整除 → 最小正确 = 4), 错误基点 = 整除
       间隔的模 (k 的因子).

  formal_math: |
    -- 定位间隔 4 的错误基点:
    theorem gap_four_wrong_located (N : ℕ) (h : 4 % N = 0) :
      N = 1 ∨ N = 2 ∨ N = 4
    -- 预言间隔 4 的正确基点:
    theorem gap_four_correct_exists : 4 % 3 ≠ 0
    -- 一步解算 (间隔 4):
    theorem gap_four_solver : 4 % 2 = 0 ∧ 4 % 3 ≠ 0
    -- 定位间隔 6 的错误基点:
    theorem gap_six_wrong_located (N : ℕ) (h : 6 % N = 0) :
      N = 1 ∨ N = 2 ∨ N = 3 ∨ N = 6
    -- 预言间隔 6 的正确基点:
    theorem gap_six_correct_exists : 6 % 4 ≠ 0
    -- 全景:
    theorem basepoint_proof_instances_perspective :
      (4 % 3 ≠ 0) ∧ (4 % 2 = 0 ∧ 4 % 3 ≠ 0) ∧ (6 % 4 ≠ 0)

