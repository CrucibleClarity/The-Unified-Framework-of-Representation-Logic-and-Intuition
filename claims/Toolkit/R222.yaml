statement:
  informal: |
    ★ 观点提出者: 用户 (2026-08-13)。存算一体 ⟹ 输入/配对/输出 = 万能
       逻辑门.

    ★ 唯一论点: ①存算一体 (R057) ②配对 = NOT 门 (b=1) ③NAND 万能
       ⟹ 万能逻辑门.

    ★ ① 存算一体 (R057): 存储 ≡ 计算 (同构, R048 无损) — 记忆与结构
       形式一体: 词义配对 {x, S(x)} 既是存储 (记忆词义) 又是计算
       (配对变换).
    ★ ② 配对 = NOT 门 (b = 1 时): S(x) = b - x, b = 1: S(0) = 1,
       S(1) = 0 — 配对变换就是布尔 NOT (对合 S² = id: NOT(NOT x) =
       x).
    ★ ③ NAND 万能: NOT + AND = NAND (NAND 万能: 任意布尔函数可由
       NAND 构造) — 配对 (NOT) + 逻辑运算 (AND) = NAND — 输入/配对/
       输出可构造任意逻辑.
    ★ 结论: 存算一体 ⟹ 记忆和结构、形式一体 ⟹ 配对既是存储又是计
       算 ⟹ 输入/配对/输出本质上是万能逻辑门.

  formal_math: |
    -- ★存算一体:
    theorem storage_computation_unified : ∀ x : ℝ, 0 + x = x
    -- ★配对 = NOT 门:
    theorem pairing_is_not_gate : (1 - 0 = 1) ∧ (1 - 1 = 0)
    -- ★NAND 万能:
    theorem nand_universal_gate :
      (!(true && true) = false) ∧ (!(true && false) = true) ∧
      (!(false && true) = true) ∧ (!(false && false) = true)
    -- 全景:
    theorem universal_gate_perspective :
      (1 - 0 = 1) ∧ (1 - 1 = 0) ∧ (!(true && true) = false)

