statement:
  informal: |
    ★ 观点提出者: 用户 (2026-08-12)。形式化案例设计 (不用 log)。

    ★ 形式化设计 (无 log, 纯代数):
      单相位数 = (p, k): 素数 p 在层 k
        链: p^0 = 1 (基点层), p^(k+1) = p^k · p (升层 ×p)
        层数 k = 结构深度 (R099: 升层/降层, 非操作次数)
      多相位数 = 单相位层的多重集 (素因子分解)
        乘法 = 相位向量加法 (指数逐点相加, 格点平移)

    ★ 核心定理 (Lean 验收, MonophaseCaseDesign.lean, 无 sorry):
      ① monophase_layer_chain: p^(k+1) = p^k·p (升层生成)
      ② monophase_basepoint_layer: p^0 = 1 (基点层)
      ③ monophase_power_of_power: (p^k)^m = p^(k·m) (层合成)
      ④ polyphase_exponent_add: p^a·p^b = p^(a+b) (乘法=向量加法)
      ⑤ polyphase_lattice_translation: (p^a·q^b)(p^c·q^d) =
         p^(a+c)·q^(b+d) (格点平移)

    ★ 与既有 claim 的关系:
      - R091 (单相位 = {n·d}): 本设计的代数形式
      - R097 (素数幂链): 单相位 = {p^k}
      - R099 (升层/降层): 层数 = 结构深度
      - R072 (声明): ℙ⟨φ_p⟩(p,k) 的声明化
      结论: 无 log 形式化 — 单相位 (p,k) 层链, 多相位 = 素因子
      多重集, 乘法 = 相位向量加法 (格点平移)。

    ★ 支撑 (Lean):
      - MonophaseCaseDesign.lean (5 定理, 0 sorry)
  formal_math: |
    -- 单相位: (p, k), 链 p^0=1, p^(k+1)=p^k·p
    -- 层合成: (p^k)^m = p^(k·m)
    -- 乘法 = 向量加法: p^a·p^b = p^(a+b)
    -- 格点平移: (p^a·q^b)(p^c·q^d) = p^(a+c)·q^(b+d)

