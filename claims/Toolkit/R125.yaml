statement:
  informal: |
    ★ 观点提出者: 用户 (2026-08-12)。箭头连续接通 = 围棋棋盘。

    ★ 洞察 (验证):
      ① 连续跳转: p0→p0→p0→... (每步等价, R054)
         箭头可迭代 (链)
      ② 棋盘需要二维: 一维 = 链, 二维 = 棋盘
         基点等价 (R054: 任意轴) ⟹ 多方向跳转可能
      ③ 二维跳转: 34 个不同交叉点可达 (棋盘格)
      ④ 连通性: 任意交叉点可达 (曼哈顿路径) — 围棋"气"相邻
      ⑤ ⟹ 箭头像围棋棋盘: 交叉点 = p0, 边 = 跳转箭头

    ★ 围棋对应:
      围棋: 交叉点 (格点), 边 = 气 (相邻), 连通性
      我们的: 交叉点 = p0 (等价基点), 边 = 跳转箭头 (p1)
      连续接通 = 任意 p0 经箭头路径可达

    ★ 与既有 claim 的关系:
      - R124 (跳转箭头): 本 claim 的连续性
      - R054 (任意基点任意轴): 多方向跳转依据
      - R123 (基点闭包): 棋盘 = 闭包内的网格?
      - R072 (声明): 棋盘结构的声明化
      结论: p1 跳转箭头可连续接通 — 链 (一维) + 棋盘 (二维,
      多方向), 任意交叉点可达 (围棋"气"结构)。

  formal_math: |
    -- 连续跳转: p0 → p0 → ... (链)
    -- 棋盘: 多方向 (R054 任意轴) ⟹ 二维格
    -- 连通: 任意交叉点可达 (曼哈顿路径, 围棋气)

