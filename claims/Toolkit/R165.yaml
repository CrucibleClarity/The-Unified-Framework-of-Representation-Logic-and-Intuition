statement:
  informal: |
    ★ 观点提出者: 用户 (2026-08-13)。筑基篇课后习题 VIII: pat 原生
       群表示理论.

    ★ 用户纠正: 不抄 mathlib RepresentationTheory (G →* V →ₗ V),
       自己形式化, pat 原生.

    ★ pat 原生表示定义: 群的相位表示 — 每个群元素 g 映射到单位圆
       上的相位 exp(i·θ(g)) (RulerPhase: 相位差 = 方向), 保持群结构:
       - 同态性: θ(gh) = θ(g) + θ(h) ⟹ ρ(gh) = ρ(g)·ρ(h) (R138:
         相位差可加; exp_add)
       - 单位元: ρ(1) = exp(0) = 1 (exp_zero; R143: 对称对还原到 1)
       - ★互锁对: ρ(g⁻¹) = ρ(g)⁻¹ = exp(-i·θ(g)) (逆元 = 反向相位;
         R136 ②③: 方向必须成对声明), ρ(g)·ρ(g⁻¹) = 1 (R143: 对称对
         还原) — 每个群元素与其逆元构成互锁对
       - 单位圆: ‖ρ(g)‖ = 1 (R141: 单位根相位圆)

    ★ 物理解读 (R164 强弱力观测支撑):
       - U(1) 电磁 = 1 相位参数 (单相位圆 R138, 1 对互锁)
       - SU(2) 弱 = 2 相位参数 (2 对 = 4 互锁 = S³, R149/R154)
       - SU(3) 强 = 4 相位参数 (4 对 = 8 互锁) — k 对独立互锁自洽
         (R161 k_pairs_independent_interlock)

    ★ 诚实边界: 生成元与互锁对的精确对应需群表示理论 (CONJECTURE
       层); 本习题锚定的是 k 对独立互锁自洽 (R161) 与相位表示
       结构 (R138/R141/R143). 全部新定理只锚本框架, 不用外部引理,
       不 import mathlib RepresentationTheory.

  formal_math: |
    -- 相位表示值: ρ(g) = exp(i·θ(g)):
    noncomputable def phaseRepValue (θ : G → ℝ) (g : G) : ℂ :=
      exp (θ g · I)
    -- 值在单位圆:
    theorem phaseRep_on_circle (θ : G → ℝ) (g : G) : ‖phaseRepValue θ g‖ = 1
    -- 单位元 = 相位 0:
    theorem phaseRep_one (θ : G → ℝ) : phaseRepValue θ 1 = 1
    -- 同态性:
    theorem phaseRep_mul (θ : G → ℝ) (g h : G) (hθ : θ (g*h) = θ g + θ h) :
      phaseRepValue θ (g*h) = phaseRepValue θ g * phaseRepValue θ h
    -- 逆元 = 反向相位:
    theorem phaseRep_inv (θ : G → ℝ) (g : G) (hθ : θ (g⁻¹) = -θ g) :
      phaseRepValue θ (g⁻¹) = (phaseRepValue θ g)⁻¹
    -- ★互锁对还原:
    theorem phaseRep_pair_reduces (θ : G → ℝ) (g : G) (hθ : θ (g⁻¹) = -θ g) :
      phaseRepValue θ g * phaseRepValue θ (g⁻¹) = 1
    -- 规范群 = k 独立相位参数:
    theorem gauge_k_phase_params (k : ℕ) (θ : Fin k → ℝ) :
      ∀ j : Fin k, exp (θ j·I)·exp (-(θ j)·I) = 1
    -- 全景:
    theorem phaseRep_perspective (θ : G → ℝ) (g h : G)
      (hθ₁ : θ (g*h) = θ g + θ h) (hθ₂ : θ (g⁻¹) = -θ g) :
      (‖phaseRepValue θ g‖ = 1) ∧
      (phaseRepValue θ (g*h) = phaseRepValue θ g * phaseRepValue θ h) ∧
      (phaseRepValue θ g * phaseRepValue θ (g⁻¹) = 1)

objects:
