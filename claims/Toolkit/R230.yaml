statement:
  informal: |
    ★ 用户指令 (2026-08-14): 结果时序竞争风险 — 不做实验结果, 不放实验,
    改用原生推理结构。语义闭包不变性 (P2 G5 / EXP-52 设计命题) 本质是
    纯推理定理, 不需要训练实验:

    编译 (快路径) 是语义保持变换 ⟹ 快路径可执行集 ⊆ 慢路径可执行集 (闭包不扩)。

    形式化:
    - f = 慢路径 (构造, 定义驱动, 语义基准)
    - g = 快路径 (编译/蒸馏后的执行)
    - 语义保持: ∀ x, g x = f x (三通道等价已由 exp50 验证, 此处为抽象定理)
    - 结论: range g ⊆ range f (闭包不扩) ∧ range f ⊆ range g (闭包不缩)
      ⟹ range f = range g (可执行集不变)

    推论 (蒸馏深度无关): 编译是传递的 — 多次编译 (1/10/15 epochs) 仍保持
    语义 ⟹ 可执行集逐次不变。编译 = 执行优化, 非新语义 (P2: 编译 ≠ 学习)。

formal_math: |
    theorem semantic_preservation_closure {A B} (f g : A → B) :
      (∀ x, g x = f x) → Set.range g ⊆ Set.range f
    theorem semantic_preservation_anti {A B} (f g : A → B) :
      (∀ x, g x = f x) → Set.range f ⊆ Set.range g
    theorem closure_unchanged {A B} (f g : A → B) :
      (∀ x, g x = f x) → Set.range f = Set.range g
    theorem compile_composition {A B} (f g h : A → B) :
      (∀ x, g x = f x) → (∀ x, h x = g x) → ∀ x, h x = f x
    theorem compile_composition_closure {A B} (f g h : A → B) :
      (∀ x, g x = f x) → (∀ x, h x = g x) → range f = range g ∧ range g = range h
    theorem compile_is_optimization_not_learning {A B} (f g : A → B) :
      (∀ x, g x = f x) → range g ⊆ range f ∧ range f ⊆ range g ∧ range f = range g

