statement:
  informal: |
    ★ 观点提出者: 用户 (2026-08-13)。筑基篇课后习题 XIV: 奇偶性的
       本质与素数的奇偶性观测.

    ★ 唯一论点: 奇偶性 = 模 2 折叠 (2 槽环, 偶 = 对称对还原, 奇 =
       对称对 + 1); 素数在奇偶性投影下坍缩 (除 2 外全奇数); ★二者
       共享基点 = 2 (模 2 折叠的周期 = 素数域的唯一例外 = 临界线圆
       上的点).

    ★ 奇偶性的本质 (pat 视角):
       - 偶数 = 对称对之和: 2n = n + n (R170 哥德巴赫对称对; R085
         折叠类 0) — 偶数 = 对称对折叠还原
       - 奇数 = 对称对 + 1: 2n + 1 = n + (n+1) — 奇数 = 相邻对称对
       - 奇偶性 = 模 2 投影: n ↦ n mod 2 ∈ {0, 1} (R141: 单位根
         2 槽环的两个槽) — 数轴折叠到两个类 {偶, 奇} (R085)

    ★ 从奇偶性观测素数:
       - ★2 是唯一偶素数 (mathlib Prime.eq_two_or_odd: 素数 p ⟹
         p = 2 ∨ Odd p) — 素数集合在奇偶性投影下坍缩: 除 2 外全部
         落在奇数类 (奇偶性"看不出"素数分布, 信息坍缩)
       - 素数奇偶性坍缩: 素数 p ≠ 2 ⟹ p 奇数 (≡ 1 mod 2)

    ★ ★共享基点: 2 — 奇偶性侧 = 2 槽环的周期 (模 2 折叠由 2 定义,
       R141 n=2); 素数侧 = 2 是唯一偶素数 (two_unique_even_prime),
       且 2 在临界线圆上 (R145 critical_circle_points: ‖2-1‖ = 1)
       — 二者在 2 处交汇 (共享基点: 奇偶性周期 = 素数唯一例外).

    ★ 诚实边界: 结构观测 (奇偶性 = 模 2 折叠, 共享基点 2), 非素数
       分布理论. 全部新定理只锚本框架 + mathlib 数论基础
       (Prime.eq_two_or_odd), 不用外部引理.

  formal_math: |
    -- 偶数 = 对称对还原:
    theorem even_is_symmetric_pair (n : ℝ) : 2*n = n + n
    -- 奇数 = 对称对 + 1:
    theorem odd_is_symmetric_pair_plus_one (n : ℝ) : 2*n + 1 = n + (n+1)
    -- 偶数的 2 槽环 0 槽:
    theorem even_two_slot (n : ℕ) (h : Even n) : n % 2 = 0
    -- 奇数的 2 槽环 1 槽:
    theorem odd_two_slot (n : ℕ) (h : Odd n) : n % 2 = 1
    -- ★2 = 唯一偶素数:
    theorem two_unique_even_prime {p : ℕ} (hp : Nat.Prime p) : p = 2 ∨ Odd p
    -- 素数奇偶性坍缩:
    theorem primes_parity_collapse {p : ℕ} (hp : Nat.Prime p) (h2 : p ≠ 2) : Odd p
    -- ★共享基点 2:
    theorem two_shared_basepoint :
      (∀ p : ℕ, Nat.Prime p → p = 2 ∨ Odd p) ∧ (‖(2 : ℂ) - 1‖ = 1)
    -- ★全景:
    theorem parity_prime_perspective (n : ℝ) :
      (2*n = n + n) ∧ (2*n + 1 = n + (n+1)) ∧ (‖(2 : ℂ) - 1‖ = 1)

