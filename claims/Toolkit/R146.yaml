statement:
  informal: |
    ★ 观点提出者: 用户 (2026-08-12)。用 pat 构造所有数域 + 单相位数的
       a+bi 互锁表示 (因果勿反)。

    ★ pat 构造数域 (每环锚到已证 claim):
      ① 自然数 = pat 单相位链: patChain 0 1 n = n (R137 pat_n_is_monophase;
         R142: 基点 0, 方向 d = 1)
      ② 整数 = pat 链方向取反: patChain 0 (-d) n = -(n·d) — 镜像对称对
         {n·d, -n·d} (R085: 0 = ±1 折叠类; R143: 对称对还原)
      ③ 有理数 = pat 链的商: n·(1/m) = n/m — 倒数对称对 (R143:
         r·(1/r) = 1; R110: log 镜像)
      ④ π = pat 链蜷曲半圈的相位: exp(π·I) = -1 — pat 链蜷曲到圆
         (R141/R055), 半圈相位 = π (TK3: 欧拉恒等式, π 与 e 在圆上合一)
      ⑤ 素数 = pat 方向 log p 的幂链: log(p^k) = k·log p (R097: 素数幂链
         = 单相位; R089: log 基点漂移)
      ⑥ 实数 = pat 圆上量化极限: 任意相位 θ 被 n 槽环量化到任意精度 ε
         (R141 phase_quantizable: 误差 ≤ π/N, 取 N ≥ π/ε; R059: 单位根
         n 槽环; R060: 离散⟷连续互逆)
      ⑦ ★单相位数 = 成对相位互锁的 a+bi 表示 (用户提醒②):
         单相位数是成对相位互锁的 (相位对 θ,-θ + 数值对 r,1/r, R136 ②③/
         R139 互锁); 用 a+bi 表达: a = r·cosθ (1 轴/数值分量), b =
         r·sinθ (i 轴/相位分量) (R143: 1 和 i 还原后的 1; R140:
         completePat1)
      ⑧ ★因果勿反 (用户提醒②): 单相位数 (成对互锁构造) ⟹ a+bi 表示
         ⟹ 有限化: 相位 θ = 2πk/N 格点 (R141 单位根量化) ⟹ a, b =
         cos/sin 格点值 ⟹ 三角函数收敛到 π (cos π = -1, sin π = 0) —
         π 是有限化圆上的相位结构常数, 不是单相位数的输入

    ★ 验证结论: 用户指令成立 — pat 构造全部数域 (自然数/整数/有理数/π/
       素数/实数); 单相位数 = 成对互锁的 a+bi, 有限化收敛到三角函数/π
       (因果勿反)。

  formal_math: |
    -- 自然数 = pat 单相位链 (R137/R142):
    theorem pat_constructs_nat (n : ℕ) : patChain 0 1 n = (n : ℝ)
    -- 整数 = pat 链方向取反 (R085/R143):
    theorem pat_constructs_int (n : ℕ) (d : ℝ) :
      patChain 0 (-d) n = -((n : ℝ) * d)
    -- 有理数 = pat 链的商 (R143/R110):
    theorem pat_constructs_rational (n m : ℝ) (hm : m ≠ 0) :
      n * (1 / m) = n / m
    -- π = pat 链蜷曲半圈相位 (TK3/R141):
    theorem pat_constructs_pi : Complex.exp (Real.pi * Complex.I) = -1
    theorem pat_chain_half_turn (T : ℝ) (hT : T ≠ 0) :
      Complex.exp ((2 * Real.pi * (T / 2 / T) : ℝ) * Complex.I) = -1
    -- 素数 = pat 方向 log p 的幂链 (R097/R142):
    theorem pat_constructs_prime (p : ℝ) (k : ℕ) :
      Real.log (p ^ k) = (k : ℝ) * Real.log p
    -- 实数 = pat 圆上量化极限 (R141/R059/R060):
    theorem pat_quantization_converges (θ : ℝ) (hθ₁ : 0 ≤ θ) (hθ₂ : θ ≤ 2 * Real.pi) :
      ∀ ε : ℝ, 0 < ε → ∃ N : ℕ, 0 < N ∧ ∃ j : ℕ, j ≤ N ∧
        |θ - 2 * Real.pi * (j : ℝ) / N| ≤ ε
    -- ★单相位数 = 成对互锁 a+bi (a = r·cosθ, b = r·sinθ):
    theorem monophase_pair_locked_form (pat0 : ℂ) (θ r : ℝ) :
      completePat1 pat0 θ r = pat0 + (r * Real.cos θ) + Complex.I * (r * Real.sin θ)
    -- ★有限化 ⟹ a, b 收敛到三角函数格点:
    theorem monophase_finite_coords (pat0 : ℂ) (r k N : ℝ) :
      completePat1 pat0 (2 * Real.pi * k / N) r =
        pat0 + (r * Real.cos (2 * Real.pi * k / N)) + Complex.I * (r * Real.sin (2 * Real.pi * k / N))
    -- ★三角函数收敛到 π (因果勿反):
    theorem trig_converges_to_pi :
      Real.cos Real.pi = -1 ∧ Real.sin Real.pi = 0

