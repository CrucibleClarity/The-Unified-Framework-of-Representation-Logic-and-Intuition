statement:
  informal: |
    ★ 观点提出者: 用户 (2026-08-13)。从 pat0 无声明出发, 锁定基点,
       联通内外.

    ★ 唯一论点: 可以 — 收缩族 {T_b} 联通 pat0 内部 (自指吸收) 与外部
       (b 锚观测); 无声明性: 0 只是收缩族成员, 锁定 b 即联通.

    ★ pat0 内部 (自指吸收闭合, R134): 0 是吸收元 (0·x = 0, 0+x = x),
       0 是 T_0 的不动点 (自指闭合: 内部不出).
    ★ 外部 (基点 b 锚定的观测, R188): b 是 T_b 的不动点 (T_b(b) = b),
       锁定基点 b (R184 预言+召唤) 后外部观测以 b 为锚.
    ★ ★联通机制 (收缩族 {T_b}): 同一收缩族 {T_b(x) = b + c(x-b)} 中,
       T_b 把 pat0 (0) 拉到外部锚 b: T_b(0) = b(1-c), 迭代 T_b^n(0)
       → b (c<1, R181) — ★pat0 内部经收缩联通外部.
    ★ 无声明性: 不需要声明 0 的任何性质 — 0 作为 pat0 只是收缩族
       {T_b} 的成员 (0 = T_0 的不动点), 联通由收缩本身完成 — 锁定
       b (构造性给出 + 验证) 即联通.

  formal_math: |
    -- pat0 内部: 0 吸收一切:
    theorem pat0_interior_absorb (x : ℝ) : 0 * x = 0 ∧ 0 + x = x
    -- 锁定基点 b (外部锚):
    theorem locked_basepoint_exterior (b c : ℝ) : b + c * (b - b) = b
    -- ★联通: T_b 把 pat0 (0) 拉到 b:
    theorem pat0_connects_exterior (b c : ℝ) (n : ℕ) :
      ((fun y : ℝ => b + c * (y - b))^[n]) 0 = b + c ^ n * (0 - b)
    -- 全景:
    theorem interior_exterior_connect_perspective (b c : ℝ) (n : ℕ) :
      (b + c * (b - b) = b) ∧
      (((fun y : ℝ => b + c * (y - b))^[n]) 0 = b + c ^ n * (0 - b))

