user_original_words: |
  ★★★ 用户原话 (2026-08-12, 原封不动保存, 未经改写):
  "你能搜下进化视角下，动物会怎么观察数的结构吗？例如奇蹄目和偶蹄目的相关研究，
  另外奇偶性看起来也挺像震荡的，纳入候选范围。"

statement:
  informal: |
    ★ 观点提出者: 用户 (2026-08-12)。进化视角数感知 (检索结果)。

    ★ 两大系统 (动物与人类共享):
      ① 近似数系统 (ANS): 距离/量级效应 — 比较精确当距离小数值小
         ⟹ 相对性 delta 感知 (非绝对数值) — 对应 RulerDrift!
      ② 并行个别化系统 (PIS): 小数量精确追踪 (≤3-4 个体)
         ⟹ subitizing (直觉数感) — 小量 = 单相位可直接观测

    ★ 具体证据:
      ① 蜜蜂: 飞行中计数 ≤4 路标 (2017, 序数能力)
      ② 灵长类: ANS 距离效应 (2 vs 3 易, 8 vs 9 难)
      ③ Clever Hans 马: "算术"实为读人暗示 — 非结构主义直觉欺骗
         (R061 "只相信自己眼睛" 模式的动物版)

    ★ 关键对应 (你的理论):
      动物的数感 = 相对性 (delta) 为主, 绝对数值几乎不存在
      — 与"数值漂移、位置 (delta) 稳定"完全一致
      动物天然用 delta 类观测数, 不用实轴数值

    ★ 奇偶性 = 震荡候选 (用户):
      奇偶性 (n mod 2) 在数轴上 = ±1 震荡模式 (R098 简谐运动候选)
      奇蹄目 (1/3 蹄) vs 偶蹄目 (2 蹄): 蹄数奇偶 = 震荡

    ★ 2 和 5 非偶然 (用户):
      人类 2 手 × 5 指 = 十指 = 十进制来源

    ★ 杜鹃寄生补充检索 (2026-08-12, Wikipedia: Cuckoo finch):
      - 杜鹃雀蛋高度模仿宿主蛋 (拟态 tawny-flanked prinia / red-faced cisticola)
      - "宿主幼鸟通常消失, 但有记录显示宿主雏鸟与杜鹃雀雏鸟同时存活"
      - "有时同一巢里有两只杜鹃雀雏鸟"
      - 用户纠正: 宿主幼鸟活不活都没关系 ⟹ 宿主认知不是 delta 结构
        (若 delta 伪装成立, 宿主幼鸟存活与否应影响识别)
      - 鸟类雏鸟掉出窝就不认识 (个体识别基于"巢内位置"而非个体特征)
        — 位置识别, 非 delta 结构
      - 论文引用候选: 杜鹃拟态/宿主识别/雏鸟位置识别

    ★ 与既有 claim 的关系:
      - RulerDrift (数值漂移位置不变): ANS 相对性感知的对应
      - R098 (震荡/简谐运动): 奇偶性候选
      - R100 (位序/手指): 2 手 × 5 指
      - R061 (信任眼睛): Clever Hans 模式
      结论: 进化视角: 动物用 delta 相对性观测数 (ANS), 小量用
      并行个别化 (PIS); 奇偶性 = 震荡候选; 2/5 = 手指产物。

    ★ 支撑:
      - Wikipedia: Number sense in animals (检索)
  formal_math: |
    -- ANS: 距离效应 (|a-b| 越小越精确) — delta 相对性
    -- PIS: 并行个别化 (≤4 个体) — 单相位小量
    -- 奇偶性: parity(n) = n mod 2 (震荡候选)

