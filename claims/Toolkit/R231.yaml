  informal: |
    ★ 用户提问 (2026-08-14): 对称性破损导致 0 的产生 / 对称性修复让基点稳定 /
    对称性破损让维度收缩 / 内穿外穿的升维降维 (穿折越) — 四结论是否可靠?

    ★ 审查结论 (全部 Lean 验收):
    ① **破损 → 0 的产生: 可靠** — 0 = 实轴 (S 固定) ∩ 虚轴 (S 取反) 的交点
       (特征空间相交的唯一元素); 无对称性 S 则特征空间不存在, 0 无法产生
       (R085: 0 = ±1 折叠类; R228 同源)
    ② **修复 → 基点稳定: 可靠** — 成对往返 (x+d)+(-d) = x: 互逆箭头对
       同时存在时移动可逆, 基点稳定; 单向 (破损) 则漂移不可回返 (R063)
    ③ **破损 → 维度收缩: 可靠** — 特征空间退化 (固定分量 = 取反分量,
       ±1 不可区分) ⟹ 虚轴 (周期维度) 坍缩, 维度 2→1; 完全退化 ⟹ 1=-1
       矛盾 (结构消失, R228 id_symmetry_contradicts)
    ④ **穿折越升维降维: 可靠** — 升维 (lift, 内穿) 单射无损; 降维 (proj,
       外穿) 有损 (虚轴整体投影为 0, R047 周期不可观测); 升降维往返精确
       proj(lift t) = t; 穿折越 (基点平移 teleport) 往返精确

formal_math: |
    -- ① 0 = 特征空间交点
    theorem eigenspace_intersection_zero (v) : S v = v → S v = -v → v = (0, 0)
    -- ② 修复往返 (基点稳定)
    theorem repair_round_trip (x d : ℝ) : (x + d) + (-d) = x
    -- ③ 破损 ⟹ 维度收缩
    theorem fixed_flipped_degenerate (v) : fixedPart v = flippedPart v → v.2 = 0
    -- ④ 穿折越升降维
    theorem lift_injective : Function.Injective lift
    theorem proj_loses_imag (y) : proj (imagAxis y) = 0
    theorem lift_proj_round_trip (t) : proj (lift t) = t
    theorem teleport_round_trip (e f v) : teleport f e (teleport e f v) = v
    -- 核心合成
    theorem dimension_symmetry_synthesis : (四结论合取)

