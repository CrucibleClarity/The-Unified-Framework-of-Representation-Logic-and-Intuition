statement:
  informal: |
    ★ 观点提出者: 用户 (2026-08-12)。对角线互锁引理 + S³ 几何路线。

    ★ 主张内容 (每环锚到已证 claim):
      ① ★数值-相位可交换: a + bi = (-ai + b)·i — 数值就是相位, 相位
         就是数值 (交换 = 乘 i 旋转 90°; R051 rot90 同型)
      ② ★r ≠ 0 / r > 0 前提 = 未经声明锁定相位的原点 0: 基点 0 在锁定
         结构下可实现除 0 — Pat 除 0 的本质 = 拨开一层互锁的相位, 但
         下一层的相位还是互锁的 (R129: SRT 递归); Pat 无限外推 ⟺ 无限
         可数内收 (R147: 发散与收敛对称方向)
      ③ ★两组够的本质原因: 任意发散和收敛轴可无损映射 (R054) ⟹ 双
         相位互锁存在四组锁定 (R149: 2 轴 × 2 方向), 任意连续/离散
         轴向对可加入互锁结构两两互锁
      ④ ★对角线互锁引理 (专门符号 diagonalExpansion): 两对互锁相位在
         pat 锁定状态下展开为对角线形式; √2/2 = 单位 1 在 θ = 45° (π/4)
         格点的投影位置 (R146: a = r·cosθ, b = r·sinθ; 45° 处数值 =
         相位 = 可交换性实例), 涉及 e (exp: 相位本质是 e^{iθ}, sin/cos
         是 exp 的分量)
      ⑤ pat 展开规范化: i 还原为 1, 0, 2, 1+i → 0, (sin ae - i)²,
         (sin be + i)²; |(sinx-i)(siny+i)|² = (sin²x+1)(sin²y+1) = 3
         当 sin²ae = 1 (ae = π/2), sin²be = 1/2 (be = π/4)
      ⑥ ★任意实数无需取模: 相位互锁是对角线两两互锁对称 (数独式) —
         任意两个相位数值都锁定了, 不存在"未锁定落入区间"的问题
         (R150/R151 的取模表述修正)
      ⑦ ★S³ 几何路线 (用户纠正: 别用代数方法): 4 相位互锁本质上 =
         4 维球 (S³), 可以无损内收映射到 4 个基点 0 出发并锁定相位的
         正交的二维圆 (1 轴圆 ⊥ i 轴圆, R047), 并且可以任意旋转
         (SO(2), R078)

  formal_math: |
    -- 数值-相位可交换 (乘 i 旋转 90°):
    theorem numeric_phase_commute (a b : ℂ) :
      a + b * Complex.I = (-a * Complex.I + b) * Complex.I
    -- 交换 = 共轭 + 90° 旋转:
    theorem exchange_is_rotation (a b : ℂ) :
      b + a * Complex.I = (a - b * Complex.I) * Complex.I
    -- 0 拨开一层 = 折叠类 (除 0 本质 = 拨开一层互锁):
    theorem zero_unlock_pair (t : ℝ) : (0 : ℝ) = t + (-t)
    -- 拨开后下一层仍互锁 (R129 递归, 无限可数内收):
    theorem next_layer_locked (t : ℝ) : (-t) + (-(-t)) = (0 : ℝ)
    -- 任意轴对可加入互锁结构 (R054):
    theorem any_axes_pair_addable (e u f : ℝ × ℝ) (hu : u.1 ^ 2 + u.2 ^ 2 ≠ 0) :
      ∃ d : ℝ × ℝ → ℝ × ℝ, ∀ x : ℝ × ℝ, d (composedMap e u f x) = x
    -- 对角线展开 (专门符号, 两个分量相等):
    def diagonalExpansion (a b : ℂ) : ℂ × ℂ :=
      ((a + b * Complex.I), (-a * Complex.I + b) * Complex.I)
    theorem diagonal_expansion_normal (a b : ℂ) :
      (diagonalExpansion a b).1 = (diagonalExpansion a b).2
    -- pat 展开规范化 (sin±i 形式, 3 的出现):
    theorem sin_cos_norm_sq (x y : ℝ) :
      ‖((Real.sin x : ℂ) - Complex.I) * ((Real.sin y : ℂ) + Complex.I)‖ ^ 2 =
        (Real.sin x ^ 2 + 1) * (Real.sin y ^ 2 + 1)
    theorem sin_cos_three :
      ‖((Real.sin (Real.pi / 2) : ℂ) - Complex.I) *
        ((Real.sin (Real.pi / 4) : ℂ) + Complex.I)‖ ^ 2 = 3
    -- ★S³ 几何: 4 相位互锁 = 4 维球:
    def S3Point : Set (ℂ × ℂ) := {p | ‖p.1‖ ^ 2 + ‖p.2‖ ^ 2 = 1}
    -- 无损内收: 分量归一化到单位圆 (S¹):
    theorem contract_to_circle (z : ℂ) (hz : z ≠ 0) : ‖z / ‖z‖‖ = 1
    -- 内收可逆 (无损, R048):
    theorem contract_preserves_phase (z : ℂ) (hz : z ≠ 0) :
      z = (‖z‖ : ℂ) * (z / ‖z‖)
    -- 正交双圆 (1 轴 ⊥ i 轴, R047):
    theorem orthogonal_circles (t : ℝ) : proj (lift t * J) = 0
    -- 任意旋转 (SO(2), R078):
    theorem circle_rotation (z : ℂ) (φ : ℝ) :
      ‖Complex.exp (φ * Complex.I) * z‖ = ‖z‖
    -- S³ 无损内收组合:
    theorem s3_contract_orthogonal_circles (z₁ z₂ : ℂ) (hz₁ : z₁ ≠ 0) (hz₂ : z₂ ≠ 0) :
      ‖z₁ / ‖z₁‖‖ = 1 ∧ ‖z₂ / ‖z₂‖‖ = 1 ∧
      (∀ φ : ℝ, ‖Complex.exp (φ * Complex.I) * (z₁ / ‖z₁‖)‖ = 1)

