statement:
  informal: |
    ★ 观点提出者: 用户 (2026-08-12)。从 0 构造单相位数的准确方法。

    ★ 问题: 找到的 0 点不一定干净 (R085: ±1 折叠类); 只要不干净,
      用相位做出来的就是不干净的扭曲轴。

    ★ 解决 (验证):
      ① 单相位链结构 (等差/相位恒定/delta 类) 独立于基点 e:
         从任意基点 (含 0 与脏基点) 出发, 链结构相同
      ② 从 0 与从脏基点 e: delta 类相同 (chain0[k]-0 = chaine[k]-e = k·d)
      ③ 链相位 = phase(d) 独立于基点
      ④ 准确构造法: 单相位数 = delta 类 {n·d} (基点无关, RulerDrift)
      ⑤ 0 不干净只影响表示, 不影响结构

    ★ 准确构造方法 (从 0 构造单相位数):
      用 delta 类 (位移类), 不用绝对坐标:
      单相位数 = {n·d} (delta 类, 基点无关)
      0 是折叠类 (表示), delta 是干净结构

    ★ 机械验证 (R093_monophase_construction.py, 枚举=证据):
      1. 0 是折叠类 (S 不动点, ±1 混合): PASS
      2. 单相位链结构 (等差/相位/delta类) 独立于基点 e: PASS
      3. 从 0 与从脏基点 e: delta 类相同: PASS
      4. 准确构造法: delta 类 {n·d}: PASS
      5. 链相位 = phase(d) 独立于基点: PASS

    ★ 与既有 claim 的关系:
      - R085 (0 = ±1 折叠类): 0 不干净的来源
      - RulerDrift (数值漂移位置不变): delta 类基点无关 (机制)
      - R091 (单相位 = {n·d}): 构造目标
      - C007 (位移空间基点无关): delta 类独立性
      - R072 (声明): 单相位数的准确声明
      结论: 0 不干净不阻碍单相位数构造 — 用 delta 类 {n·d} (基点无关),
      0 只影响表示不影响结构。

    ★ 支撑 (Lean):
      - R085 / RulerDrift / R091 / C007 [claim 级]
  formal_math: |
    -- 单相位链: {e + n·d} (任意基点 e)
    -- delta 类: chain[k] - e = k·d (独立于 e)
    -- 准确构造: 单相位数 = delta 类 {n·d} (基点无关)
    -- 0 不干净 ⟹ 表示含折叠; delta 干净 ⟹ 结构准确

