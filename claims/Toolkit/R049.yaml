id: R049
title: "R049 (user-proposed 2026-08-12): any pair of directions maps losslessly — the Householder reflection S_u(x) = x - 2·⟨x,u⟩/‖u‖²·u is an involution, norm-preserving, and decomposes v into its u-component (negated) and u⊥-component (fixed); injective hence lossless (R048)"
status: PROVED
novelty_status: NOVELTY_UNASSESSED
branch: toolkit
term_ref: "R072 (前置术语总纲): 表述待按单相位数/多相位数前缀声明式梳理"
proposed_by: user (anonymous, 2026-08-12)

statement:
  informal: |
    ★ 观点提出者: 用户 (2026-08-12)。断言原文: "既然我们能无损的在一对轴上映射,
       这也就意味着, 所有成对的方向, 都可以无损映射, 对吧?"

    ★ 断言内容:
      所有成对的方向 (任意方向对, 不需正交), 可无损映射。

    ★ 机制 (Householder 反射, 全部 Lean 验收):
      S_u(x) = x - 2·⟨x,u⟩/‖u‖²·u 对任意方向 u:
      ① 对合: S_u(S_u(x)) = x — 反射是自身逆, 双向无损
      ② 保模: ‖S_u(x)‖ = ‖x‖ — 正交对称 (det=-1 型, NS3)
      ③ 特征分解: S_u(x) = (u 分量取反) + (u⊥ 分量固定) — 任意方向 v 分解
         为 u 方向部分 (取反) + 正交部分 (固定)
      ④ 双射 (对合) ⟹ 单射 ⟹ R048 无损
      ⑤ R047 特例 (u=实轴, v=J, S=conj) 包含于一般构造

    ★ 核心定理 (Lean 验收, PairwiseDirection.lean, 无 sorry):
      ① projCoeff_reflect: 投影系数在 S_u 下取反 — S_u(v) 的 u 分量系数 =
         -v 的 u 分量系数 (方向分量取反)
      ② reflect_involutive: S_u 对合 — S_u(S_u(x)) = x (双向无损)
      ③ reflect_preserves_sq: S_u 保模 — ‖S_u(x)‖² = ‖x‖² (等距, det=-1)
      ④ reflect_injective: S_u 单射 (对合 ⟹ 单射) — R048 无损前提
      ⑤ pairwise_lossless: 任意方向对无损往返 — S_u(S_u(v)) = v

    ★ 机械验证 (R049_pairwise_lossless.py, 枚举=证据):
      1. S 对合+保模 (任意 u, 任意维 2,3,5): PASS
      2. 特征分解 (任意方向对 u,v): PASS
      3. 任意方向对 (u,v) 经 S 往返无损: PASS
      4. 单射编码 ⟹ 无损往返: PASS
      5. 碰撞编码 (模7): 有损 (对照): PASS

    ★ 与既有 claim 的关系:
      - R047 (S 特征空间): 本 claim 是方向对的泛化 — S_u 对任意方向 u 成立
      - R048 (单射 ⟹ 无损): 无损机制
      - NS3 (det=±1): S_u 是 det=-1 反射 (NS3 时间反演同型)
      - R051 (正交轴对): 正交特例 — 正交 ⟹ S_u 固定 v (零信息变化)
      - R052 (同一基点任意方向): 本 claim 的直接应用
      结论: 任意方向对无损 = Householder 反射对合 (R049) — 反射/旋转/单射
      编码三机制之一。

    ★ 支撑 (Lean):
      - projCoeff_reflect / reflect_involutive / reflect_preserves_sq /
        reflect_injective / pairwise_lossless [PairwiseDirection.lean]
  formal_math: |
    -- 投影系数取反 (方向分量取反):
    theorem projCoeff_reflect (u x : ℝ × ℝ) (hu : u.1 ^ 2 + u.2 ^ 2 ≠ 0) :
      projCoeff u (reflect u x) = -projCoeff u x
    -- 对合 (双向无损):
    theorem reflect_involutive (u x : ℝ × ℝ) (hu : u.1 ^ 2 + u.2 ^ 2 ≠ 0) :
      reflect u (reflect u x) = x
    -- 保模 (等距):
    theorem reflect_preserves_sq (u x : ℝ × ℝ) (hu : u.1 ^ 2 + u.2 ^ 2 ≠ 0) :
      (reflect u x).1 ^ 2 + (reflect u x).2 ^ 2 = x.1 ^ 2 + x.2 ^ 2
    -- 单射 (R048 前提):
    theorem reflect_injective (u : ℝ × ℝ) (hu : u.1 ^ 2 + u.2 ^ 2 ≠ 0) :
      Function.Injective (fun x => reflect u x)
    -- 任意方向对无损:
    theorem pairwise_lossless (u v : ℝ × ℝ) (hu : u.1 ^ 2 + u.2 ^ 2 ≠ 0) :
      reflect u (reflect u v) = v

objects:
