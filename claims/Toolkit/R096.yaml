statement:
  informal: |
    ★ 观点提出者: 用户 (2026-08-12)。log 观测的修正 (delta 单位选择错误)。

    ★ 修正内容:
      ① 错误: 第一版观测用加法单位 (+1) 做 delta — log(n+1)-log(n)
         间隔递减 ⟹ 误判"正整数在 log 视角非单相位"
      ② 正确: 观测 log 必须按 log 的计算逻辑 (乘法 → 加法):
         delta 单位 = 乘法单位 (×2 ⟹ delta = log 2)
      ③ 乘法链 {1, 2, 4, 8, ...} 在 log 下: log 链 {0, log2, 2·log2, ...}
         等差 = 单相位!
      ④ 正整数链 {1, 2, 3, ...} 在 log 下: 间隔递减 (非单相位) —
         它是加法链, 不是 log 的单相位链

    ★ 观测原则 (用户方法纪律):
      每有一种算符, 就把该算符还原到 0 点, 按该算符自身的计算逻辑观测:
      - 观测 log: delta 用乘法单位 (log 2), 不用加法单位 (+1)
      - 观测加法: delta 用加法单位 (+1)
      - 算符的计算逻辑决定 delta 单位

    ★ 与既有 claim 的关系:
      - R091 (单相位 = {n·d}): 乘法链 log 等差 = 单相位实例
      - R092 (正整数落投影位): 正整数是加法链, log 下非单相位
      - R093 (delta 类构造): delta 单位须按算符逻辑
      - R090 (log 表 = 单相位): 乘法链 (log 等差) 才是单相位
      结论: log 观测的 delta 单位 = 乘法单位 (log 2); 乘法链 log 等差
      = 单相位; 正整数链非 (加法链); 观测须按算符自身逻辑。

    ★ 支撑 (Lean):
      - R091 / R090 / R092 / R093 [claim 级]
  formal_math: |
    -- 乘法链 log: log(2^k) = k·log 2 (等差, 单相位)
    -- 正整数链 log: log(n+1) - log n 递减 (非单相位)
    -- delta 单位: 观测 log 用 log 2 (乘法单位), 非 +1

