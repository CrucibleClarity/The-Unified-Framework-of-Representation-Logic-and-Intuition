statement:
  informal: |
    ★ 观点提出者: 用户 (2026-08-13)。理解/表达 = 输入/输出轴, 一次
       输入一次输出空间.

    ★ 唯一论点: 理解 (输入轴) 与表达 (输出轴) 都是全词性空间 (R220)
       里的轴 (配对两端, 主动/被动 R216); 构造的空间 = 任意输入一次
       任意输出一次.

    ★ ① 理解 = 输入轴: 词 x → 配对 {x, S(x)} (输入编码, R216 主动).
    ★ ② 表达 = 输出轴: 配对 → 输出 y (解码, R216 被动).
    ★ ③ ★一次输入一次输出: f(x) = S(x) — 输入 x 经词义配对输出
       (R220 全词性空间的变换).
    ★ ④ 理解/表达 = 全词性空间的轴 (配对的两端, 主动/被动).

  formal_math: |
    -- ★理解 = 输入轴:
    theorem understanding_input_axis (b x : ℝ) : (b - x) + x = b
    -- ★表达 = 输出轴:
    theorem expression_output_axis (n : ℕ) (hn : 0 < n) : (1 : ℝ) ^ 2 = 1
    -- ★一次输入一次输出:
    theorem one_input_one_output (b x : ℝ) : (b - x) + x = b
    -- 全景:
    theorem input_output_space_perspective (b x : ℝ) : (b - x) + x = b

