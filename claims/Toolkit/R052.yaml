id: R052
title: "R052 (user-proposed 2026-08-12): ANY pair of direction axes from the SAME basepoint maps AND compresses losslessly — the reflection S_u works for every pair (orthogonality not required), and injective encoding along any axis is lossless (R048)"
status: PROVED
novelty_status: NOVELTY_UNASSESSED
zero_role:
  basepoint: true
  additive_identity: false
  bottom: false
  seed: false
branch: toolkit
term_ref: "R072 (前置术语总纲): 表述待按单相位数/多相位数前缀声明式梳理"
proposed_by: user (anonymous, 2026-08-12)

statement:
  informal: |
    ★ 观点提出者: 用户 (2026-08-12)。断言原文: "同一个基点出发的任意方向轴间
       可以任意的无损映射、无损压缩。"

    ★ 断言内容:
      从同一基点 0 出发的任意方向轴对 (正交与否), 轴间可任意无损映射 +
      无损压缩。

    ★ 机制 (全部为已证理论的直接应用, 无新机制):
      ① 反射机制 (R049): 任意方向 v (不需正交), Householder 反射 S_u 把 v
         分解为 u 分量 (取反) + u⊥ 分量 (固定), S_u 对合 ⟹ S_u(S_u(v)) = v
         往返精确 — 同一基点出发的任意方向对都成立。
      ② 旋转机制 (R051): ComplexAxis 上 rot90 (×J) 把发散轴 lift 映到周期轴
         (rot90 (lift t) = ⟨0, t⟩), 保模 (rot90_norm), 周期 4 (rot90_four)
         ⟹ 双射 ⟹ 双向无损。任意方向 = 另一方向的角度旋转 (方向角 = 相位)。
      ③ 压缩机制 (R048): 沿任意方向的单射编码无损 — 方向轴上的值 t 压缩到
         相位槽, 精确还原。压缩方向任意: 每个从基点 0 出发的轴都可无损压缩。

    ★ 核心定理 (Lean 验收, AnyDirectionAxes.lean, 无 sorry):
      ① reflect_lossless_any_direction: 任意方向对 (u,v) (含非正交), S_u 对合
         ⟹ S_u(S_u(v)) = v 往返精确 (R049 应用到任意对)
      ② reflect_flips_coeff: 任意方向 v, S_u 把 v 的 u 分量系数取反 (方向分量
         取反, 正交分量固定) — 一般方向分解
      ③ rot90_maps_any_axis: rot90 (lift t) = ⟨0, t⟩ — 发散轴映到周期轴
         (同一基点 0 出发)
      ④ rot90_bijective: rot90⁴ = id ⟹ 双射 — 轴间映射双向无损
      ⑤ axis_compression_lossless: 沿方向轴的任意单射编码无损 (R048) — 压缩
         方向任意
      ⑥ same_basepoint_lossless: 同一基点出发的方向轴无损映射 (核心结论)

    ★ 机械验证 (枚举=证据):
      1. 任意方向对 (含非正交) 从基点 0 出发 S_u 无损往返 (300 组): PASS
      2. 任意角度旋转连接任意两方向 + 可逆保模 (500 组): PASS
      3. 沿任意方向单射编码无损压缩 (200 组): PASS
      4. 任意方向轴坐标变换无损往返 (200 组): PASS

    ★ 与既有 claim 的关系 (链条闭合):
      - R047 (发散/周期 = S 特征空间): 轴对的基础
      - R048 (单射 ⟹ 无损): 压缩机制
      - R049 (任意方向对无损): 反射机制 — 本 claim 的映射部分
      - R050 (同方向迭代无损): 同方向的迭代差
      - R051 (正交轴对无损): 正交特例 — 本 claim 推广到任意方向 (含非正交)
      结论: R047-R052 链条: 轴对 (特征分解) → 无损 (单射) → 任意方向对 →
      同方向迭代 → 正交轴对 → 同一基点任意方向轴对 — 无损映射/压缩的普适性
      由反射对合 + 旋转周期 + 单射编码三机制闭合。

    ★ 支撑 (Lean):
      - reflect_lossless_any_direction / reflect_flips_coeff /
        rot90_maps_any_axis / rot90_bijective / axis_compression_lossless /
        same_basepoint_lossless [AnyDirectionAxes.lean]
      - reflect_involutive / projCoeff_reflect [PairwiseDirection.lean]
      - rot90_norm / rot90_four / lift [ComplexAxis.lean]
      - rot90_lift_to_period / rot90_bijective [OrthogonalAxes.lean]
  formal_math: |
    -- 任意方向对 (含非正交) 无损往返:
    theorem reflect_lossless_any_direction (u v : ℝ × ℝ)
        (hu : u.1 ^ 2 + u.2 ^ 2 ≠ 0) :
        PairwiseDirection.reflect u (PairwiseDirection.reflect u v) = v
    -- 一般方向分解 (u 分量取反, ⊥ 固定):
    theorem reflect_flips_coeff (u v : ℝ × ℝ) (hu : u.1 ^ 2 + u.2 ^ 2 ≠ 0) :
        PairwiseDirection.projCoeff u (PairwiseDirection.reflect u v) =
          -PairwiseDirection.projCoeff u v
    -- 发散轴 → 周期轴 (同一基点 0):
    theorem rot90_maps_any_axis (t : ℝ) : rot90 (lift t) = (⟨0, t⟩ : ComplexAxis)
    -- 双射 (周期 4):
    theorem rot90_bijective : Function.Bijective rot90
    -- 沿任意方向单射编码无损 (R048):
    theorem axis_compression_lossless {D P : Type} [Nonempty D]
        (c : D → P) (hc : Function.Injective c) :
        ∃ d : P → D, ∀ x : D, d (c x) = x
    -- 同一基点出发方向轴无损 (核心):
    theorem same_basepoint_lossless (u v : ℝ × ℝ) (hu : u.1 ^ 2 + u.2 ^ 2 ≠ 0) :
        PairwiseDirection.reflect u (PairwiseDirection.reflect u v) = v

