user_original_words: |
  ★★★ 用户原话 (2026-08-12, 原封不动保存, 未经改写):
  "牛逼，我们把混了正负1的一个0点给拆出来了？"

statement:
  informal: |
    ★ 观点提出者: 用户 (2026-08-12)。R083 (T 家族拆解) 的直接推论。

    ★ 拆解内容:
      T₂ (镜像 S(θ) = -θ) 的不动点: θ = -θ ⟹ θ = 0。
      但 S(+1) = -1, S(-1) = +1 — 镜像把 ±1 混在一起 (同一两态轨道)。
      ⟹ 不动点 0 = "±1 的混合类" (折叠 ±1 得到的折叠中心),
      不是干净的点!

    ★ 数学内容 (验证):
      ① T₂ 不动点: S(0) = 0; S 交换 ±1 (S(1)=-1, S(-1)=1)
      ② ±1 是 S 的同一两态轨道 ({+1,-1}, S²=id)
      ③ S 的轨道结构: 不动点 {0} + 两态对 {t,-t}
      ④ 0 = ±t 折叠中心 (轨道 {t,-t} 的平均值 = 0)
      ⑤ 结论: 0 是 T₂ (镜像) 的不动点 = ±1 折叠类 — 非干净基点

    ★ 意义 (C010 深化):
      0 的特权性根源: 0 = 镜像对合 S 的不动点 (混 ±1 的折叠类)。
      没有 S (镜像), 就没有"0"的特殊地位 — 0 是 S 结构的选择产物,
      不是结构必然 (呼应 C010: 0 是基点选择; R069: ±1 自逆对)。

    ★ 机械验证 (R085_mixed_zero.py, 枚举=证据):
      1. T₂ 不动点 θ=0; S 交换 ±1: PASS
      2. ±1 是 S 的同一个两态轨道: PASS
      3. S 的轨道: 不动点 {0} + 两态对 {t,-t}: PASS
      4. 0 = ±t 折叠中心: PASS
      5. 拆解: 0 = T₂ 不动点 = ±1 折叠类: PASS

    ★ 与既有 claim 的关系:
      - R083 (T 家族拆解): 本 claim 的起点 (T₂ = 镜像)
      - C010 (0 非内生): 本 claim 深化其根源 (0 = S 不动点)
      - R069 (±1 自逆对分岔): ±1 的对称性 (镜像混合)
      - R074 (对称性 = 自指): 0 是自指 (S²=id) 的不动点
      - R072 (声明): 0 的声明 (混 ±1 的折叠类)
      结论: 拆出的"0 点" = T₂ 不动点 = ±1 折叠类 (混正负1) —
      0 是镜像对合的选择产物, 非干净基点。

    ★ 支撑 (Lean):
      - S_is_period_two_iteration [MirrorRotationDecomposition.lean]
      - C010 (0 非内生) [ZeroRelative]
  formal_math: |
    -- T₂ 不动点: S(θ) = θ ⟹ θ = 0 (唯一)
    -- S 交换 ±1: S(1) = -1, S(-1) = 1 (同一两态轨道)
    -- 0 = ±t 折叠中心: (t + (-t))/2 = 0
    -- 结论: 0 = 镜像对合的不动点 = ±1 折叠类 (混正负1)

