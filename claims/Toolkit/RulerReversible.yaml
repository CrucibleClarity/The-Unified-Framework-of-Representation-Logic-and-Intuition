id: RulerReversible
title: "RulerReversible: CPU running on the full time direction = reversible computing — self-inverse gates (Toffoli/CNOT) are time-reversal symmetric, the folded region where forward=backward is the free-time zone"
status: PROVED
novelty_status: KNOWN
zero_role:
  basepoint: true
  additive_identity: false
  bottom: false
  seed: false
branch: toolkit

statement:
  informal: |
    RulerReversible: CPU 全量时间方向 = 可逆计算 (用户指令 2026-08-12).

    ★ 核心转换: 全量时间方向 = 可逆计算
      传统门: AND/OR (不可逆, 丢信息, Landauer 擦除耗能)
      可逆门: Toffoli/CNOT (可逆, 不丢信息)
      可逆电路时间反演 (逆电路) 合法: 前向后向完整还原

    ★ 自逆验证 (恒等式先验):
      Toffoli (a,b,c) → (a, b, c⊕(a∧b)): 全部 8 输入自逆 ✓
      CNOT (a,b) → (a, b⊕a): 全部 4 输入自逆 ✓
      ⟹ 自逆 = 时间反演对称 (可逆门)
      ⟹ 前向计算 = 后向还原 (同一门)

    ★ 算法 (Reversible+Folded, 三步):
      phase1 前向: 输入 → 中间态 → 输出 (保存全部中间态, 零擦除)
      phase2 折叠: 前后向等价区域并行验证 (白嫖时间对称)
      phase3 后向: 输出 → 输入 (逆电路还原, 信息守恒)

    ★ 复杂度对比:
      传统: O(n) 时间, 信息擦除 (耗能)
      可逆: O(n) 时间 + O(n) 空间 (不擦除)
      折叠: 等价区域省验证时间

    ★ 连接 RulerFreeTime (量子退火落地):
      量子退火隧穿 = 时间折叠区域穿越 (理论)
      可逆计算 = 时间折叠区域 = 前向后向等价 (工程)
      ⟹ CPU 全量时间方向 = 可逆电路 + 折叠区域利用
      ⟹ 白嫖时间 = 前向计算时后向验证免费 (时间对称)

    ★ 支撑 (Lean): 家用量子退火 (HouseholdQuantumAnnealing.lean)
      - toffoli_self_inverse: Toffoli 自逆
      - cnot_self_inverse: CNOT 自逆
      - reversible_preserves_info: 可逆门不丢信息 (双射)
  formal_math: |
    -- Toffoli 自逆 (时间反演对称):
    lemma toffoli_self_inverse (a b c : Bool) :
      toffoli (toffoli a b c) = (a, b, c)
    -- CNOT 自逆:
    lemma cnot_self_inverse (a b : Bool) : cnot (cnot a b) = (a, b)
    -- 可逆 = 双射 (不丢信息):
    lemma toffoli_bijective : Function.Bijective toffoli

objects:
- toffoli_self_inverse
- cnot_self_inverse
- toffoli_bijective

definitions_used:
- HouseholdQuantumAnnealing (家用量子退火) 模块

assumptions:
- 自包含: 仅 import mathlib
- Toffoli/CNOT 可逆性 KNOWN (量子计算标准)

conclusion: 'CPU 全量时间方向 = 可逆计算: 自逆门 (Toffoli/CNOT) 时间反演
  对称, 前向后向等价 = 折叠区域 = 白嫖时间. 量子退火隧穿的工程落地.'

