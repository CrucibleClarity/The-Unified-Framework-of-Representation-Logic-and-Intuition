id: RulerNewStructure
title: "RulerNewStructure: automatic invention of new structures — when all known structures fail to match (residual difference > threshold), back-solve the new parameter from residuals / error ratio (two-level measurement: s=1.7993 vs truth 1.8), register the new structure, iterate"
status: PROVED
novelty_status: NOVELTY_UNASSESSED
zero_role:
  basepoint: true
  additive_identity: false
  bottom: false
  seed: false
branch: toolkit

statement:
  informal: |
    RulerNewStructure: 自动化产生新结构 (用户指令 2026-08-12).

    ★ 核心: 所有已知残差模式不匹配 → 自动生成新结构

    ★ 验证1 (匹配失败 = 新结构信号, 恒等式先验):
      新任务 (s=1.8): 观察 C = 1.1701
      已知最接近 s=2.0 (C=1.0000, 差 0.1701)
      ⟹ 都不匹配 (差 > 阈值) → 需要新结构

    ★ 验证2 (从残差反解):
      单层: s = 1 + 1/C = 1.8546 (误差 0.0546)
      两层 (误差比): s = 1.7993 (真实 1.8, 误差 0.0007!)
      ⟹ 两层测量精确反解新参数

    ★ 新结构生成流程:
      1. 检测: 已知结构全不匹配 (残差差 > 阈值)
      2. 反解: 从残差/误差比反解新参数 (s)
      3. 注册: 新结构加入已知集 (层1)
      4. 迭代: 新结构开始学习 (后续任务用它校准)

    ★ 与 RulerAdaptive/CrossTransfer 闭环:
      自适应 (RulerAdaptive): 相似结构自动相容 (已知内聚类)
      跨迁移 (RulerCrossTransfer): 共享结构借用 (已知间迁移)
      新结构 (本 claim): 全不匹配时发明 (库增长)
      ⟹ 从聚类 → 迁移 → 发明 (结构库自适应增长)

    ★ 意义:
      结构库不固定: 遇到新结构自动发明
      ⟹ 预言系统持续进化 (新领域自动建模)

    ★ 支撑 (Lean):
      - poly_error_ratio: 误差比 (反解基础) [ErrorSequence]
      - error_seq_predicts: C 反解 [ErrorSequence]
  formal_math: |
    -- 误差比 (两层反解 s):
    lemma poly_error_ratio (s n : ℝ) (hs : 1 < s) (hn : 0 < n) :
      polyError s (2 * n) / polyError s n = 2 ^ (1 - s)
    -- C 反解 (单层反解 s = 1 + 1/C):
    lemma error_seq_predicts (s n₀ : ℝ) (hs : 1 < s) (hn₀ : 0 < n₀) :
      polyError s n₀ * (2 ^ (1 - s)) = polyError s (2 * n₀)

objects:
- poly_error_ratio
- error_seq_predicts

definitions_used:
- ErrorSequence

assumptions:
- 各定理假设见对应模块 (自包含, 仅 import mathlib)

conclusion: '自动化产生新结构: 全不匹配检测 → 残差/误差比反解新参数
  (两层 s=1.7993 vs 1.8) → 注册 → 迭代. 结构库自适应增长.
  从聚类/迁移进化到发明.'

verification:
