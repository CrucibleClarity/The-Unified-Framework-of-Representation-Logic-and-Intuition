statement:
  informal: |
    ★ 观点提出者: 用户 (2026-08-12)。两组自指的 Lean 复原。

    ★ 复原目标:
      组1 (R074): S = T 的自指迭代的自指迭代 — S∘T ≠ T∘S (反交换,
         方向对偶)
      组2 (R078): R = T 的自指 — R 与 T 同族 (旋转 = 连续平移)

    ★ 核心定理 (Lean 验收, SelfReferenceRestoration.lean, 无 sorry):
      组1:
      ① S_self_reference: 镜像自指 — -(-θ) = θ (S² = id)
      ② T_self_reference: 平移自指迭代 — (θ+Δ)+Δ = θ+2Δ
      ③ S_anti_commutes_T: 反交换 — -(θ+Δ) ≠ -θ+Δ (Δ≠0) —
         S 是 T 的自指迭代的自指迭代 (方向对偶, R074)
      组2:
      ④ R_same_family_T: R 与 T 同族 — (θ+α)+(θ+Δ) = θ+θ+α+Δ
         (旋转 = 连续平移, R078)
      ⑤ R_self_reference: 旋转自指迭代 — (θ+α)+α = θ+2α

    ★ 机械验证 (R081 方向验证, 枚举=证据):
      组1: S∘T ≠ T∘S (反交换): PASS
      组1b: S²=id (S 自指), T 迭代 (T 自指): PASS
      组2: R 与 T 同族 (都是平移 θ+常数): PASS
      组2b: R 迭代周期回 (自指): PASS

    ★ 与既有 claim 的关系:
      - R074 (S = T 的自指的自指): 组1 的复原
      - R078 (R = T 的自指): 组2 的复原
      - R080 (5 次自指): 本 claim 复原其中两组 (S/T 对偶 + R/T 同族)
      - R072 (声明): 复原后可用 ℙ⟨φ_S⟩/ℙ⟨φ_T⟩ 表述
      结论: 两组自指 Lean 复原 — S∘T≠T∘S (方向对偶) + R=T (同族)。

    ★ 支撑 (Lean):
      - S_self_reference / T_self_reference / S_anti_commutes_T /
        R_same_family_T / R_self_reference [SelfReferenceRestoration.lean]
  formal_math: |
    -- 组1: S 自指 (S²=id), T 自指迭代, S∘T ≠ T∘S (反交换)
    theorem S_self_reference (θ : ℝ) : -(-θ) = θ
    theorem T_self_reference (θ Δ : ℝ) : (θ + Δ) + Δ = θ + 2 * Δ
    theorem S_anti_commutes_T (θ Δ : ℝ) (hΔ : Δ ≠ 0) :
      - (θ + Δ) ≠ -θ + Δ
    -- 组2: R 与 T 同族, R 自指迭代
    theorem R_same_family_T (θ α Δ : ℝ) : (θ + α) + (θ + Δ) = θ + θ + α + Δ
    theorem R_self_reference (θ α : ℝ) : (θ + α) + α = θ + 2 * α

