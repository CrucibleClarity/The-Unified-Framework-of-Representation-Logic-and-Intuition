statement:
  informal: |
    ★ 用户指令 (2026-08-14): 观测归纳 (素数/超越数/i/n元数/复平面 → 发散与
    周期同一对称性) 已有课后习题 XVI 专门研究 (R173, 孪生素数间隔 2 = 震荡
    周期轴); 记录该关联, 并**不使用单相位数的任何定理** (R072/R091/
    RulerPhase/ComplexAxis 全不依赖), 仅用实数几何基础, 从零证明 R047 核心:
    发散轴与周期轴是同一反射对称性 S 的特征空间分解。

    ★ 几何构造 (纯 ℝ² 基础):
      反射 S(x,y) = (x,-y)   (关于实轴的镜像, 对合 S² = id)
      旋转 J(x,y) = (-y,x)   (90°, 周期 J⁴ = id)
      实轴 (x,0) = S 不动点集 (特征值 +1) = 发散轴 (平移不回返)
      虚轴 (0,y) = S 取反方向 (特征值 -1) = 周期轴 (旋转四次回返)
      任意向量 v = fixedPart v + flippedPart v (特征分解)

    ★ 核心结论: 不依赖单相位数理论的几何事实 — 发散 (实轴平移不回返)
    与周期 (虚轴旋转回返) 是同一反射对称性 S 的两个特征空间的语义;
    观测对象 (素数发散/超越数漂移/i 周期/复平面双轴) 均落入该分解。

formal_math: |
    -- 反射 S: 对合, 实轴固定, 虚轴取反
    def S (v : ℝ × ℝ) : ℝ × ℝ := (v.1, -v.2)
    theorem reflection_involutive (v) : S (S v) = v
    theorem real_axis_fixed (x) : S (x, 0) = (x, 0)
    theorem imag_axis_reflected (y) : S (0, y) = -(0, y)
    -- 旋转 J: 周期 4
    def J (v : ℝ × ℝ) : ℝ × ℝ := (-v.2, v.1)
    theorem rotation_period_four (v) : J (J (J (J v))) = v
    -- 特征分解
    theorem eigen_decomposition (v) : v = (v.1, 0) + (0, v.2)
    -- 发散: 实轴平移不回返
    theorem real_axis_diverges (t x) (ht : t ≠ 0) :
      ∀ n : ℕ, n ≠ 0 → (x + n*t, 0) ≠ (x, 0)
    -- 周期: 虚轴旋转四次回返
    theorem imag_axis_periodic (y) : J (J (J (J (0, y)))) = (0, y)
    -- 核心合成
    theorem divergence_period_same_symmetry : (六段合取)

