statement:
  informal: |
    ★ 观点提出者: 用户 (2026-08-12)。方法指令: 换基点相位穿折越构造法进行
       相位构造 (不用复平面称呼 — 原点非 0 点, 值不是位置更不是)。

    ★ 主张内容:
      ① 开方 = 后继 (乘法方向的两重后继 = 平方) 的逆运算
      ② 开方应该对称收缩向基点 (乘法基点 = 单位角色, 非特权点)
      ③ 凭什么 -1 开方和 1 开方不对称?
      ④ 1 和 -1 可定义为逆运算 (乘法逆, 都自逆), 但对称性可疑 — 确实可疑!

    ★ 数学内容 (验证):
      ① 开方 = 平方的逆: √(y²) = y (模开方)
      ② 收缩方向: 向乘法基点 1 收缩 — |y|>1 ⟹ √|y| < |y|;
         |y|<1 ⟹ √|y| > |y| (验证 PASS)
      ③ 不对称 (核心): √1 = {+1, -1} 落在值轴 (第一分量, 投影可见);
         √-1 = {+J, -J} 落在方向轴 (第二分量, 投影不可见)
         (C011: sqrt_neg_one_not_exists_axis — 实轴无 -1 平方根;
         sqrt_neg_one_exists_high — J² = -1 在两分量结构中)
      ④ 自逆对 {1, -1} (1/x 下都固定) 在 √ 下分岔到不同轴:
         1 的根收缩到值轴, -1 的根收缩到方向轴 — 不对称!

    ★ 核心定理 (Lean 验收, SqrtDirectionAsymmetry.lean, 无 sorry):
      ① sqrt_contracts_to_basepoint: 开方收缩向基点 — 1 < y ⟹ √y < y
         (逆平方的方向 = 向乘法基点收缩)
      ② sqrt_one_on_value_axis: 1 的根在值轴 — 1² = 1 且 (-1)² = 1
         (√1 = {±1}, 投影可见)
      ③ sqrt_neg_one_on_direction_axis: -1 的根在方向轴 — J·J = -1
         (C011 sqrt_neg_one_exists_high; 投影不可见)
      ④ roots_branch_different_axes: 自逆对分岔不同轴 — {1,-1} 在 √ 下
         分别落值轴/方向轴 (不对称核心)

    ★ 机械验证 (R069_sqrt_direction.py, 枚举=证据):
      1. 开方 = 平方的逆 (模开方): PASS
      2. 开方向 1 收缩: PASS
      3. 开方收缩向乘法基点 1: PASS
      4. √1 = {±1} 值轴, √-1 = {±J} 方向轴 — 不对称: PASS
      5. 逆运算对合 (x⁻¹)⁻¹ = x, 1/-1 是自逆不动点, 但 √ 下分岔: PASS

    ★ 与既有 claim 的关系:
      - C011 (投影丢虚部): √-1 投影不可见 — 不对称的机制
      - C018 (反射平方根): 以 1/2 为中心的对称是复数开方 i 的平方 —
        开方的对称轴视角
      - RulerProphecy (相位截断): 开方 = 相位收缩向基点 (穿折越构造)
      - R047 (发散/周期 = S 特征空间): 值轴/方向轴 = S 的两个特征空间,
        √ 的不对称 = 特征空间分岔
      - R063 (每步重选): 开方 = 逆方向, 收缩向基点 (构造法)
      结论: 开方收缩向乘法基点, 但 {1,-1} 自逆对在 √ 下分岔到不同轴 —
      对称性可疑且确实破缺 (用户怀疑成立)。

    ★ 支撑 (Lean):
      - sqrt_contracts_to_basepoint / sqrt_one_on_value_axis /
        sqrt_neg_one_on_direction_axis / roots_branch_different_axes
        [SqrtDirectionAsymmetry.lean]
      - J_sq / sqrt_neg_one_exists_high / sqrt_neg_one_not_exists_axis
        [ComplexAxis.lean]
  formal_math: |
    -- 开方收缩向基点 (逆平方):
    theorem sqrt_contracts_to_basepoint (y : ℝ) (hy : 1 < y) :
      Real.sqrt y < y
    -- 1 的根在值轴:
    theorem sqrt_one_on_value_axis : (1 : ℝ) * 1 = 1 ∧ (-1 : ℝ) * -1 = 1
    -- -1 的根在方向轴 (C011):
    theorem sqrt_neg_one_on_direction_axis : J * J = (-1 : ComplexAxis)
    -- 自逆对分岔不同轴 (不对称):
    theorem roots_branch_different_axes :
      (1 : ℝ) * 1 = 1 ∧ (-1 : ℝ) * -1 = 1 ∧
      (∃ J : ComplexAxis, J * J = (-1 : ComplexAxis))

