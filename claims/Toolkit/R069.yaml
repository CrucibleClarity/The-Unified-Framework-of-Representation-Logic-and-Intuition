id: R069
title: "R069 (user-proposed 2026-08-12): the square root as the inverse of the successor-direction operation contracts toward the multiplicative basepoint; √1 and √-1 are NOT symmetric — 1's roots ±1 land on the value axis (visible), -1's roots ±J land on the direction axis (invisible in projection, C011); the self-inverse pair {1,-1} branches into different axes under √ — the symmetry is suspect, and it is broken"
