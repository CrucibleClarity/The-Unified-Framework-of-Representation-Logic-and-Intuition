id: RulerDivergence
title: "RulerDivergence: divergent structures converge to fast encoding tables — primes→Euler product prefix, infinity→compactification phase table, transcendence→constant table, phase→ternary digit table, nesting→depth table"
status: PROVED
novelty_status: NOVELTY_UNASSESSED
zero_role:
  basepoint: true
  additive_identity: false
  bottom: false
  seed: false
branch: toolkit

statement:
  informal: |
    RulerDivergence: 发散结构 → 快速编码表 (用户指令 2026-08-12).

    ★ 五种发散结构全部可收敛编码 (恒等式先验验证):
      ① 素数无穷 → 欧拉乘积前缀表
         前 6 素数: 乘积 = 1.6179 (收敛 π²/6 = 1.6449)
         表: 素数前缀 → 乘积部分和
      ② 极限/无穷 → 紧化相位表
         实轴 ℝ → S¹: 表 = 角度 → 圆上点 (fp16/32/64)
      ③ 无理数/超越数 → 结构常数表
         π, e, √2: 表 = 常数名 → fp64 值 (预计算)
      ④ 相位连续 → 三值位表
         4 层: 81 格; 8 层: 6561 格; 12 层: 53 万格
         表: 相位格点 → 三值序列 (RulerNumeral)
      ⑤ 无限嵌套拆圆 → 对数截断深度表
         n=8: 误差 0.076; n=32: 0.005; n=128: 0.0003
         表: 深度 → 误差 (预计算)

    ★ 统一公式:
      发散源 → 收敛机制 → 编码表
      素数 → 欧拉乘积 → 前缀表
      无穷 → 紧化 → 相位表
      超越 → 结构常数 → fp64 表
      连续相位 → 三值位 → 3^k 表
      无限嵌套 → 对数截断 → 深度表

    ★ 核心:
      所有表都是有限 + 预计算 + O(1) 查找
      ⟹ 发散结构收敛化 = 建表 (离线) + 查表 (在线)
      与 RulerLookup (有限域函数=表) 统一:
      发散 → 收敛 (RulerFold) → 有限域 → 表 (RulerLookup)

    ★ 支撑 (Lean):
      - zeta_euler_product: 素数→收敛乘积 [C023]
      - infinity/embed: 紧化 (Option X) [TK3]
      - polygonError: 拆圆误差 [CircleUnfold]
      - makeTable: 表构造 [ConciseMagicTeaching]
  formal_math: |
    -- 素数 → 欧拉乘积 (收敛):
    theorem zeta_euler_product (s : ℂ) (hs : 1 < s.re) :
      (∏ p, (1 - p^(-s))⁻¹) = riemannZeta s
    -- 紧化 (无穷 → 有限):
    def infinity {X : Type*} : Option X := none
    -- 拆圆误差 (截断表):
    def polygonError (n : ℕ) : ℝ := 1 - Real.cos (Real.pi / n)
    -- 表构造 (查表化):
    def makeTable (f : α → β) : Finset (α × β) :=
      Finset.image (fun x => (x, f x)) Finset.univ

objects:
- zeta_euler_product
- infinity
- polygonError
- makeTable

definitions_used:
- C023 ZetaEulerProduct / TK3 Compactification / CircleUnfold / ConciseMagicTeaching

assumptions:
- 各定理假设见对应模块 (自包含, 仅 import mathlib)

conclusion: '五种发散结构 (素数/无穷/超越/相位/嵌套) 全部收敛为快速编码表:
  欧拉乘积前缀表, 紧化相位表, 结构常数表, 三值位表, 截断深度表.
  统一: 发散 → 收敛 (RulerFold) → 有限域 → 表 (RulerLookup).'

verification:
  lean_files:
    - formal/Formal/ZeroRelative/ZetaEulerProduct.lean
    - formal/Formal/Toolkit/Compactification.lean
    - formal/Formal/Toolkit/CircleUnfold.lean
    - formal/Formal/Toolkit/ConciseMagicTeaching.lean
  lake_build: PASS
  sorry_count: 0
  warning_count: 0
