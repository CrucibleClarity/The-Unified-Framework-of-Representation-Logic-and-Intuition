statement:
  informal: |
    ★ 观点提出者: 用户 (2026-08-12)。R059 桶状基点 → 第二组对称性的发现。

    ★ 主张内容:
      桶状基点 (R059: 单位圆柱面, |z|=1 等距面) 揭示: 基点除了
      ① 环 (平移 T, 后继) ② 对称性 S (镜像) 之外, 还有
      ③ 第二组对称性 = 旋转 R (桶的旋转不变性)。

    ★ 数学内容 (验证):
      ① 桶的旋转对称: 绕轴旋转任意角度仍在桶上 (|z·e^{iα}| = 1)
      ② 旋转 R 与镜像 S 反交换: R∘S ≠ S∘R (不同对称性组)
      ③ T/S/R 全在桶上 (环+镜像+旋转)
      ④ R 与 T 同族 (环的平移群: R(θ)=θ+α, T(θ)=θ+Δ)
      ⑤ 第二组对称性 = R (旋转) vs S (镜像) — 反交换

    ★ 机械验证 (R078_barrel_symmetry.py, 枚举=证据):
      1. 桶的旋转对称: 绕轴旋转仍在桶上: PASS
      2. 旋转 R 与镜像 S 反交换 (不同对称性组): PASS
      3. T/S/R 都在桶上: PASS
      4. R 与 T 同族 (环的平移群): PASS
      5. 第二组对称性 = 旋转: PASS

    ★ 与既有 claim 的关系:
      - R059 (桶状基点): 旋转对称的来源 (圆柱面)
      - R074 (基点=环): 本 claim 补第二组对称性 (旋转)
      - R077 (φ_T/φ_S): 结构相位 φ_S 现在含 镜像 S + 旋转 R (两组!)
      - R072 (单相位数 Pat): ℙ⟨φ_S⟩ 结构相位需细分 (镜像/旋转)
      结论: 基点结构 = 环 (T) + 镜像 (S) + 旋转 (R) — 三组结构;
      第二组对称性 = 旋转 (桶的旋转不变性)。

    ★ 支撑 (Lean):
      - R059 barrel_equidistance / double_angle_on_circle
        [ZeroPiBarrel.lean]
      - R074 (环结构) / R077 (相位类型) [claim 级]
  formal_math: |
    -- 桶 (圆柱面): |z| = 1 (R059 barrel_equidistance)
    -- 旋转对称: |z · e^{iα}| = 1 (旋转仍在桶上)
    -- 反交换: R∘S ≠ S∘R (旋转与镜像不同组)
    -- 结构: 环 T (平移) + 镜像 S + 旋转 R

