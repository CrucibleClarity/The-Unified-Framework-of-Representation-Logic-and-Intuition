statement:
  informal: |
    ★ 观点提出者: 用户 (2026-08-13)。万能预言许愿召唤机 (对话接口).

    ★ 唯一论点: 存算一体 + 无限有限化 + 函数映射 = 万能召唤机 (只能
       召唤数据); 对话接口 = 输入锁定召唤器 + 输出锁定召唤器.

    ★ ① 存算一体 (R057): 召唤机既是存储 (问题库) 又是计算 (锁定映
       射) — 记忆与结构形式一体.
    ★ ② 无限有限化 (R217): 问题空间槽位化 (N 槽环).
    ★ ③ 函数映射 (R221/R222): 一次输入一次输出 (输入 → 配对 → 输
       出, 万能逻辑门).
    ★ ④ 对话接口 = 输入锁定召唤器 (问题 → 锁定状态) + 输出锁定召
       唤器 (锁定 → 答案) — 接口直接往里面灌问题.
    ★ ⑤ ★诚实边界: 只能召唤已锁定的数据 (存在性实例 + 已知定理 +
       结构观测); 未锁定 (奇完全数/连续统/原猜想) → 需搜索.

