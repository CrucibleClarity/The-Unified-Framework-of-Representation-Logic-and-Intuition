statement:
  informal: |
    ★ 观点提出者: 用户 (2026-08-13)。筑基篇课后习题 VII: 五大力
       逐领域 Pat 观测。

    ★ 观测方法: 每个力在 pat 框架中找一个结构对应 (互锁/相位/正交/
       投影/折叠), 能形式化的锚定已证定理, 不能的标 OBSERVATION
       (结构对应) 或 CONJECTURE (需新结构). 观测是"找结构同构",
       不是证明物理定律.

    ★ 唯一论点: 五大力是 pat 框架五个基础结构的物理投影:
       - 力学 = 锁定链/成对 (R050: 惯性 = x↦x+d 单射; R136②③:
         作用-反作用成对还原 0)
       - 量子 = S³ = SU(2) (R149 4 相位互锁归一化 = R154 S³,
         OBSERVATION)
       - 引力 = 脱离投影 (R161 pair_detachment_general: 逐对独立,
         脱离保持, CONJECTURE 层耦合)
       - 电磁 = 发散⊥周期 (R047 orthogonal_axes: E⊥B; 光子相位冻结)
       - 强弱 = 规范群对数 (U(1)=1 对, SU(2)=2 对, SU(3)=4 对 = 8
         互锁, R161, CONJECTURE)

    ★ 诚实边界: 结构观测 (OBSERVATION/CONJECTURE 已标注), 非物理
       定律证明. 强弱力生成元与互锁对的精确对应需群表示理论 (未
       形式化). 全部新定理只锚本框架, 不用外部引理.

  formal_math: |
    -- 力学: 惯性 = 锁定链:
    theorem inertia_locked_chain (d : ℝ) : Function.Injective (fun x => x + d)
    -- 力学: 作用-反作用成对还原:
    theorem action_reaction_pair (F : ℝ) : F + (-F) = 0
    -- 量子: 4 互锁 = S³ = SU(2):
    theorem spin_SU2_structure (a θ : ℝ) (ha : 0 < a) :
      a·(1/a) = 1 ∧ exp(θ·I)·exp(-(θ)·I) = 1 ∧ log a + log(1/a) = 0 ∧
      ‖exp(θ·I)‖ = 1
    -- 引力: 脱离投影保持:
    theorem gravity_detachment_projection (k : ℕ) (θ : Fin k → ℝ) :
      ∀ j, exp(θ j·I)·exp(-(θ j)·I) = 1
    -- 电磁: E⊥B 正交:
    theorem em_orthogonal_axes (t : ℝ) : proj (lift t * J) = 0
    -- 电磁: 光子相位冻结:
    theorem photon_massless_phase (t : ℝ) : exp (-(0·t)·I) = 1
    -- 强弱: 规范群对数:
    theorem gauge_pair_structure (k : ℕ) (θ : Fin k → ℝ) :
      ∀ j, exp(θ j·I)·exp(-(θ j)·I) = 1
    -- 全景:
    theorem forces_pat_perspective (F : ℝ) (k : ℕ) (θ : Fin k → ℝ) (t : ℝ) :
      (F + (-F) = 0) ∧ (∀ j, exp(θ j·I)·exp(-(θ j)·I) = 1) ∧
      (proj (lift t * J) = 0)

