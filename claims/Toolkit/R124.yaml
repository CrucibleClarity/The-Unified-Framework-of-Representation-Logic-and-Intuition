statement:
  informal: |
    ★ 观点提出者: 用户 (2026-08-12)。基点等价 ⟹ 全定义 p0, p1 = 跳转箭头。

    ★ 洞察 (验证):
      ① R054: 任意基点出发任意轴无损映射 ⟹ 任意基点等价
      ② 从未真正观测 p0, 但所有基点都定义为 p0 (等价类代表)
      ③ 定义箭头: 从一个 p0 跳到下一个 p0 = p1 (箭头非点)
      ④ 闭包 (R123) 绕过: 不需观测 p0, 等价即可定义跳转

    ★ 数学内容 (验证):
      ① 基点间无损映射 (teleport 可逆, R054): PASS
      ② 基点等价 ⟹ 所有基点 = 同一 p0 (代表元): PASS
      ③ p1 = p0→p0 跳转箭头 (连接等价基点): PASS
      ④ p1 是箭头 (关系) 非点: PASS
      ⑤ 闭包绕过: 不需观测, 等价定义: PASS

    ★ 核心定理 (Lean 验收, BasepointEquivalenceJump.lean, 无 sorry):
      ① basepoint_equiv_refl: p0 自等价 (R054 自反性)
      ② jump_arrow_defines_p1: 跳转箭头定义 p1 (source=target=p0)
      ③ jump_bypasses_closure: 跳转绕过闭包 (x = p0 或应用)

    ★ 意义 (闭包问题的解决):
      R123: 基点 = 闭包 (内部不可观测)
      R124: 等价绕过 — 不需观测, 所有基点都是 p0,
      跳转箭头 p1 在 p0 代表元间定义

    ★ 与既有 claim 的关系:
      - R054 (任意基点任意轴): 等价依据
      - R123 (基点闭包): 本 claim 绕过其不可达
      - R113 (自应用构造): p1 = 跳转箭头
      - R121 (互逆箭头同一): 跳转 = 箭头
      - R072 (声明): p1 跳转的声明化
      结论: 基点等价 (R054) ⟹ 全定义 p0; p1 = p0→p0 跳转箭头;
      闭包绕过 (不需观测, 等价定义)。

    ★ 支撑 (Lean):
      - BasepointEquivalenceJump.lean (3 定理, 0 sorry)
