statement:
  informal: |
    ★ 观点提出者: 用户 (2026-08-12)。R061 Q1 的回答: 自然数域不是干净的轴。
    ★ 批判延伸 (用户, 原话): "自然数还不是最干净的轴！！！！" — 对"自然数是
      最干净基础"这一数学共识的批判: 若连自然数都不干净 (预设特权基点 0 +
      方向 + 步长 + 代数结构), 则结构主义数学的基础本身建立在选择之上, 而非
      必然结构。

    ★ 主张内容:
      自然数轴不是最干净的轴 — 它预设了四个"选择" (全部非结构必然):
      ① 特权基点 0: C010 已证 0 在纯结构中非内生 (0 本身就是基点选择,
         违反"无特权基点"纪律) — 自然数 = 挂载在特权基点 0 上的后继链
      ② 后继方向: σ(x)=x+1 vs σ⁻¹(x)=x-1 — 方向选择打破对称 (RulerAsym:
         方向选择 = 对称性破缺; 链本身对称, 方向是选择)
      ③ 单位步长 1: 度量约定 (可换任何步长)
      ④ 加法/乘法: 额外结构 (非后继本身)
      最干净的对象 = delta (位移, RulerDelta: delta 是基点的原始身份, 基点
      只是锚/投影) — 无基点、无方向、无步长约定的纯位移。

    ★ 论证 (全部为已证理论):
      - C010: 0 非纯 heap 内生 (用 0 即偷偷选定特权基点) ⟹ 自然数的 0 是选择
      - RulerAsym: 方向选择打破对称 (±1 由基点定) ⟹ 后继方向是选择
      - RulerDelta: delta 是基点的原始身份 (基点 = delta 的投影/锚) ⟹
        delta 优先于基点
      - C007: 位移空间基点无关 ⟹ delta 类独立于基点
      ⟹ 自然数轴 = delta 结构 + 特权基点 0 + 方向选择 + 步长约定 + 额外
      代数结构 — 层层都是选择, 不是最干净。

    ★ 机械验证 (R062_naturals_not_clean.py, 枚举=证据):
      1. delta 独立于基点 (基点只是锚, C007/RulerDelta): PASS
      2. 后继链可挂在任意基点 e 上 (0 无特权): PASS
      3. 链本身对称, 后继方向是选择 (RulerAsym 对称破缺): PASS
      4. 自然数轴预设: 基点 0 (特权) + 方向 + 步长 + 代数结构 — 全是选择: PASS

    ★ 与既有 claim 的关系:
      - C010 (0 非内生): 特权基点论据
      - RulerAsym (方向打破对称): 方向选择论据
      - RulerDelta (delta 优先): 最干净对象 = delta
      - C007 (位移空间基点无关): delta 类独立性
      - R061 (自然数域是干净的轴吗?): 本 claim 回答 — 不是
      - R050 (迭代轴 = 发散轴): 自然数 = 迭代轴, 但迭代轴不干净 (需基点+方向)
      结论: 最干净的轴不存在于"轴" (轴必有基点/方向), 存在于 delta (纯位移)。

    ★ 支撑 (Lean):
      - C010 (0 非内生) [ZeroRelative]
      - RulerAsym (sign_is_pm_one) [TK2 SymmetryRecovery]
      - RulerDelta (teleport) [TK1 BasepointGen]
  formal_math: |
    -- delta 独立于基点 (C007): 位移类不依赖基点选择
    -- 0 非内生 (C010): 纯 heap 无字面量 0, 用 0 = 选特权基点
    -- 方向选择 (RulerAsym): sign 投影 ±1 由基点定

