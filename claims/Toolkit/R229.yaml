statement:
  informal: |
    ★ 用户提问 (2026-08-14): R228 的归纳 (结构与信息对称性) 是否可支撑
    "方向需要重新声明" (R136/R063)? 答案: 可支撑, 三环链。

    ★ 支撑链:
    1. 信息需要区分结构 (R228): 数字 (新信息) 必须可区分 ⟹ 需要非平凡
       区分结构: 1 ≠ -1 (折叠类 ±1 非退化)。
    2. 区分 = 成对声明方向 (R136): 区分 d 与 -d 需要成对声明 (d,-d);
       单方向声明 ⟹ 无区分 ⟹ 退化 (d = -d ⟹ d = 0)。
    3. 未锁定 ⟹ 坍缩 (R138): 相位差不可区分 (Δθ ≡ -Δθ) ⟹ 折叠类 {0,π}。

    ★ 结论: 新数字 (数值变化) 需要非零方向 (新区分结构); 方向未声明/
    未成对 ⟹ 无区分 ⟹ 坍缩; 每步基点漂移后旧区分失效 ⟹ 必须重新声明
    方向 (R063: 每步重新锚定)。

formal_math: |
    -- ① 数值变化需要非零方向 (新数字 = 新方向)
    theorem new_value_requires_direction (x d : ℝ) : x + d = x → d = 0
    -- ② 未声明方向无新数值
    theorem no_direction_no_new_value (x : ℝ) : x + 0 = x
    -- ③ 方向必须成对声明
    theorem pair_declaration_for_distinction (d : ℝ) : d ≠ 0 → d ≠ -d
    -- ④ 核心组合 (R228 支撑 R136/R138)
    theorem direction_redeclaration_supported :
      ((1 : ℝ) ≠ -1) ∧ (∀ x d, x + d = x → d = 0) ∧
      (∀ d, d ≠ 0 → d ≠ -d) ∧
      (∀ Δθ, exp(Δθ·I) = exp(-Δθ·I) → exp(2Δθ·I) = 1)

