statement:
  informal: |
    ★ 观点提出者: 用户 (2026-08-13)。筑基篇课后习题 XIX: ABC 猜想
       的 pat 重新观测.

    ★ 唯一论点: rad(n) = 素因子折叠; ABC 猜想 = 加法被素因子折叠
       控制.

    ★ 结构对应 (mechanics-pat-observation skill):
       - rad(n) = 素因子折叠: n 的互不相同素因子之积 (无平方因子
         部分) — 素因子重数 (指数) 被折叠: p^k 折叠到 p. R097
         素数幂链单相位 (log 视角): 幂链 p^k (k·log p) 折叠到方向
         p (log p) — 重数 k 是相位 (被折叠), 素因子 p 是方向
         (保留). R085 折叠类: rad(n) = n 在素因子方向上的折叠像.
       - rad 性质: ① rad(p^k) = p (素数幂链折叠到方向) ② rad(n) |
         n (折叠像整除原数) ③ 互素时 rad(a·b) = rad(a)·rad(b)
         (折叠对互素乘法可分配, 无共享方向) ④ rad(1) = 1 (空折叠).
       - abc 三元组 = 加法分解: a + b = c (加法还原点 0, R144;
         R170 哥德巴赫对称对结构) — 互素 = 无共享素因子 (折叠类
         互不重叠).
       - ★ABC 猜想 = 加法被素因子折叠控制: c (加法结果) ≤ K(ε)·
         rad(abc)^(1+ε) — 加法的量级被乘法结构 (素因子方向折叠)
         约束 — R144 加法/乘法还原点对偶的边界断言.

    ★ 诚实边界: 猜想本身未证 (CONJECTURE; 望月新一 2012 IUT 声称
       证明, 未被普遍接受 — 外部文献仅对照).

  formal_math: |
    -- rad(n) = 素因子折叠:
    def rad (n : ℕ) : ℕ := n.factorization.support.prod (fun p => p)
    -- rad(p^k) = p (素数幂链折叠到方向):
    theorem rad_prime_pow {p k : ℕ} (hp : Nat.Prime p) : rad (p ^ k) = p
    -- rad(n) | n (折叠像整除原数):
    theorem rad_dvd_self (n : ℕ) : rad n ∣ n
    -- 互素可分配:
    theorem rad_coprime_mul {a b : ℕ} (hcop : Nat.Coprime a b) :
      rad (a * b) = rad a * rad b
    -- rad(1) = 1 (空折叠):
    theorem rad_one : rad 1 = 1
    -- abc 加法对称对还原:
    theorem abc_add_reduce (a b c : ℝ) : c = a + b → a + b - c = 0
    -- 全景:
    theorem abc_pat_perspective (p : ℕ) (hp : Nat.Prime p) :
      (rad (p ^ 2) = p) ∧ (rad 1 = 1) ∧ (rad 2 ∣ 2)

