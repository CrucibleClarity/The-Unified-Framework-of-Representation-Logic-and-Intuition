statement:
  informal: |
    ★ 观点提出者: 用户 (2026-08-13)。筑基篇课后习题 XVII: 考拉兹
       猜想的 pat 重新观测.

    ★ 唯一论点: 考拉兹 = 奇偶性折叠 (模 2 折叠, R171/R141 2 槽环)
       驱动的轨道.

    ★ 结构对应 (mechanics-pat-observation skill):
       - 考拉兹单步 f(n) = n/2 (偶) / 3n+1 (奇) = 奇偶性折叠决策:
         偶数 (0 槽) → 取消一个 2 因子 (n/2, 折叠类还原 R085;
         除以 2 幂 = 沿素数 2 折叠类下降, R097); 奇数 (1 槽) →
         3n+1.
       - ★奇数步必落偶数槽: Odd n → Even (3n+1) — 3·奇 = 奇,
         奇+1 = 偶 — 轨道奇偶性序列中奇数后面永远是偶数 (无连续
         奇数) — 奇偶性折叠 (R171 坍缩) 的轨道约束.
       - 偶数步还原: Even n → 2·(n/2) = n — 消 2 因子可逆 (折叠
         类下降可逆, R085).
       - 奇数两步合并: collatzStep (collatzStep n) = (3n+1)/2 —
         奇数步输出是偶数 → 下一步必除 2 — 奇数的有效推进 =
         (3n+1)/2, 中间偶数步只消因子 2.
       - 循环 1 → 4 → 2 → 1: 1 奇 → 4 偶 → 2 偶 → 1 — 奇偶性模式
         奇偶偶 循环 (周期 3 的奇偶性折叠模式).

    ★ ★考拉兹猜想 pat 转译: 任意正整数 n 的轨道最终落入奇偶性折叠
       模式 奇偶偶 (1 → 4 → 2 → 1 循环): 奇数步必落偶数槽, 偶数步
       消 2 因子 — 轨道 = 奇偶性折叠驱动的收缩过程. 诚实边界:
       未证 (CONJECTURE; 已验证到极大范围无反例 = 枚举证据, 非
       证明).

  formal_math: |
    -- 考拉兹单步 (偶 → n/2, 奇 → 3n+1):
    def collatzStep (n : ℕ) : ℕ := if Even n then n / 2 else 3 * n + 1
    -- 偶数步 = 折叠类还原:
    theorem collatz_even_step {n : ℕ} (hn : Even n) : collatzStep n = n / 2
    -- 奇数步 = 3n+1:
    theorem collatz_odd_step {n : ℕ} (hn : Odd n) : collatzStep n = 3 * n + 1
    -- ★奇数步输出必为偶数:
    theorem collatz_odd_step_even {n : ℕ} (hn : Odd n) : Even (3 * n + 1)
    -- 偶数步还原 (消 2 因子可逆):
    theorem even_half_restore {n : ℕ} (hn : Even n) : 2 * (n / 2) = n
    -- 奇数两步合并 = (3n+1)/2:
    theorem collatz_odd_merged_step {n : ℕ} (hn : Odd n) :
      collatzStep (collatzStep n) = (3 * n + 1) / 2
    -- 循环 1 → 4 → 2 → 1 (奇偶偶 模式):
    theorem collatz_cycle_142 :
      collatzStep 1 = 4 ∧ collatzStep 4 = 2 ∧ collatzStep 2 = 1
    -- 全景:
    theorem collatz_pat_perspective (n : ℕ) (hn : Odd n) :
      (Even (3 * n + 1)) ∧ (2 * ((3 * n + 1) / 2) = 3 * n + 1) ∧
      (collatzStep 1 = 4 ∧ collatzStep 4 = 2 ∧ collatzStep 2 = 1)

