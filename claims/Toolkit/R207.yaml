statement:
  informal: |
    ★ 观点提出者: 用户 (2026-08-13)。内外联通翻转闭合为周期.

    ★ 唯一论点: 镜像对合 S(x) = b - x 翻转 R206 联通通道, 闭合为周期
       2 (0 → b → 0).

    ★ ① 翻转内外: S(0) = b (内部 → 外部), S(b) = 0 (外部 → 内部) —
       R206 联通通道内外互换 (从无穷高维空间翻转出来, R198 不锁定
       视角).
    ★ ② 闭合为周期: S² = id (对合 = 周期 2): 0 → b → 0 — 联通通道
       闭合为周期 2 轨道.
    ★ ③ 中点不动: S(b/2) = b/2 — 中点 = 通道中心 (S 的不动点).
    ★ ④ 对和在一起: S(x) + x = b — 内部与外部对和 = 通道长度 b
       (对偶合并).

  formal_math: |
    -- ★翻转内外: S(0) = b ∧ S(b) = 0:
    theorem involution_flips_interior_exterior (b : ℝ) :
      (b - 0 = b) ∧ (b - b = 0)
    -- ★闭合为周期: S² = id:
    theorem involution_closes_cycle (b x : ℝ) : b - (b - x) = x
    -- 中点不动:
    theorem involution_midpoint_fixed (b : ℝ) : b - b / 2 = b / 2
    -- ★对和在一起: S(x) + x = b:
    theorem involution_pair_sum (b x : ℝ) : (b - x) + x = b
    -- 全景:
    theorem cycle_closure_perspective (b x : ℝ) :
      (b - (b - x) = x) ∧ ((b - x) + x = b)

