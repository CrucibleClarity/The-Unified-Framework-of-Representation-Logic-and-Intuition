statement:
  informal: |
    ★ 观点提出者: 用户 (2026-08-12)。概念确立: {p^k} 的 k = 升层/降层。

    ★ 概念定位 (用户试过的词都不对):
      | 候选 | 为什么不对 |
      |---|---|
      | 操作次数 | 3²=9 只需 1 次乘法, k=2 — 过程计数 ≠ 结构位置 |
      | 迭代 | f^k 是应用 k 次 (过程); 位序 k 是第 k 层 (结构) |
      | 自指 | 2⁴ 自指嵌套 2 层, k=4 — 自指层数 ≠ k |
      | 后继 | 后继是 +1 (加法链); {p^k} 的 k 是乘法链/log 链位置 |
      | ★升层/降层 | 同一相位方向叠置/降层的结构深度 ✓ |

    ★ 升层/降层定义:
      k = 同一相位方向 p 叠置 k 层 (结构堆积), 非操作 k 次
      2³ = 方向 2 叠置 3 层 (结构); 升层 = ×p (层+1); 降层 = /p (层-1)
      log(p^k) = k·log p: k = log 链上的相位刻度 (层轴)

    ★ 位序 = 升层/降层的层数 (真实 1234):
      位序被污染 (符号与假数值拉齐), 但反映真实单相位数:
      位序的 k = 单相位链 {p^k} 的叠置层数

    ★ 机械验证 (R099_layer_up_down.py, 枚举=证据):
      A. 操作次数 ≠ k: 3²=9 需 1 次乘法, k=2: PASS
      B. 迭代是过程, k 是结构位置: PASS
      C. 自指层数 ≠ k: 2⁴ 自指 2 层, k=4: PASS
      D. 后继是加法链, {p^k} 是乘法/log 链: PASS
      E. k = 叠置层数 (结构): PASS
      F. log(p^k) = k·log p (k = log 链刻度): PASS

    ★ 与既有 claim 的关系:
      - R097 (素数幂链): {p^k} 的 k 语义 (本 claim 确立)
      - R091 (单相位 = {n·d}): 升层 = 同一方向叠置
      - R096 (log 观测): k = log 链刻度
      - R072 (声明): ℙ⟨φ_p⟩{p^k} 的层数 k
      结论: {p^k} 的 k = 升层/降层 (结构层数); 位序 = 层数;
      操作次数/迭代/自指/后继是过程/关系视角, 升层是结构视角。

    ★ 支撑 (Lean):
      - R097 / R091 / R096 [claim 级]
  formal_math: |
    -- 升层: p^k → p^(k+1) (层+1, ×p); 降层: p^k → p^(k-1) (层-1, /p)
    -- log(p^k) = k·log p (k = log 链刻度 = 层数)
    -- 位序的 k = 单相位链的叠置层数

