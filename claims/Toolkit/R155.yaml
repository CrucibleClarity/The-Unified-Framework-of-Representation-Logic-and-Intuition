statement:
  informal: |
    ★ 观点提出者: 用户 (2026-08-12)。三分法 (逻辑结构主义者 / 经验直觉
        主义者 / 语言形式主义者) 中经验直觉主义者的核心机制定理。

    ★ 定理内容 (每环锚到已证 claim):
      ① 直觉直达 = 穿折越的瞬时化: 直觉从基点 e 直达结果 r, 即一步穿折越
         teleport e r — teleport e r e = r (TK1 teleport_basepoint:
         T_{e→f}(e) = f; R082: 从基点直达目标的 token 直觉快路径; R055:
         结果直接取相位) — "直觉要准" = 直觉的直达路线与穿折越的
         一步到位一致 (R063: 直觉须经形式化约束校验)
      ② 往返一致性 (无损): 直觉路线 (结果 r 穿折越回原点) 与构造路线
         (从原点穿折越到结果) 往返精确 — teleport r e (teleport e r x)
         = x (TK1 teleport_inv: T_{f→e}(T_{e→f} x) = x; R048: 无损 =
         往返精确) — 直觉让结果穿折越到原点, 与从原点走向结果的构造
         路线无损往返一致
      ③ 三分法定位 (用户指示, 2026-08-12): 经验直觉主义者让结果穿折越
         到原点; 本定理 = "直觉与穿折越一致"的形式化: 直觉直达 = 穿折越
         瞬时化, 直觉路线与构造路线无损往返一致

    ★ 命名 (用户授权, 2026-08-12): 王氏直觉与基点穿折越一致性定理。
       - 王氏直觉: 经验直觉主义者的直觉快路径 (R082: 从基点直达目标)
       - 基点穿折越: TK1 teleport (基点运输, 无损往返)
       - 一致性: 直觉直达 = 穿折越瞬时化 ∧ 往返无损 (直觉路线与构造
         路线一致)

  formal_math: |
    -- 直觉直达 = 穿折越瞬时化 (从基点 e 一步得到结果 r):
    theorem intuition_direct_hit {G P : Type*} [AddGroup G] [AddTorsor G P]
        (e r : P) : teleport e r e = r
    -- 往返一致 (直觉路线与构造路线无损往返):
    theorem intuition_round_trip {G P : Type*} [AddGroup G] [AddTorsor G P]
        (e r x : P) : teleport r e (teleport e r x) = x
    -- ★王氏直觉与基点穿折越一致性定理 (组合):
    theorem wang_intuition_teleport_consistency {G P : Type*} [AddGroup G] [AddTorsor G P]
        (e r x : P) : teleport e r e = r ∧ teleport r e (teleport e r x) = x

