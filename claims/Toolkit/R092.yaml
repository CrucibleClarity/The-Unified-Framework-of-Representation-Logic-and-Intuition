statement:
  informal: |
    ★ 观点提出者: 用户 (2026-08-12)。log 表 = 单相位数的深层原因。

    ★ 主张内容:
      ① log 表本质是单相位数 (R090/R091)
      ② 核心原因: 实数轴混了太多投影, 是七扭八歪的各种轴拼出来的
      ③ 为了让投影看起来整齐, 特意把大量正整数落在投影位 (等距),
         就像乘法从基点 1 出发一样
      ④ 原本有正确的定义 (乘法链 = 等比, 单相位), 为直觉抛弃
      ⑤ 又用 log 去拟合直觉 (等比 → 等差)

    ★ 数学内容 (验证):
      ① 实数轴 = 投影混合 (C011: proj 丢方向分量)
      ② 正整数在 log 轴间隔不均 (log(n+1)-log n 递减)
      ③ 正整数: 实轴等距 (投影整齐) vs log 不等距 (真实结构)
      ④ 乘法链 --log--> 等差 (拟合实轴等距直觉)
      ⑤ log 拟合: 乘法 (真实等比结构) 映到加法 (实轴直觉)

    ★ 机械验证 (R092_log_fitting.py, 枚举=证据):
      1. 实数轴 = 投影混合 (C011): PASS
      2. 正整数在 log 轴间隔不均 (递减): PASS
      3. 正整数: 实轴等距 vs log 不等距: PASS
      4. 乘法链 --log--> 等差: PASS
      5. log 拟合: 乘法映到加法: PASS

    ★ 与既有 claim 的关系:
      - R090 (log 表 = 单相位数怀疑): 本 claim 的深层原因
      - R091 (单相位 = {n·d}): 乘法链 = 等比 (真实结构)
      - C011 (投影丢方向): 实数轴 = 投影混合
      - R089 (基点统一): 乘法从 1 出发
      - R072 (声明): 投影整齐的声明化批判
      结论: log 表 = 单相位数的原因: 实数轴投影混合, 正整数落等距
      投影位 (乘法从 1 出发), 正确等比定义被投影掩盖, log 拟合直觉。

    ★ 支撑 (Lean):
      - R090 / R091 / C011 / R089 [claim 级]
  formal_math: |
    -- 投影混合: 同投影值多方向分量 (C011)
    -- 正整数 log 间隔: log(n+1) - log n 递减 (非等距)
    -- 实轴等距: 2-1 = 3-2 (投影整齐)
    -- 乘法链 --log--> 等差: log(2^k) = k·log 2

