statement:
  informal: |
    ★ 观点提出者: 用户 (2026-08-13)。log 下不重合: 离散偏移满轴,
       每种一起多相位重合.

    ★ 唯一论点: 偏移乘性配对 c^k·b/x (每种 k 一个偏移 k·log c) →
       离散等差格满轴 → 联合多相位重合.

    ★ ① 偏移乘性配对: S_mul,k(x) = c^k·b/x — log 后: log(c^k·b/x)
       = log b - log x + k·log c — 每种 k 一个偏移 (k·log c), 不重合
       于单点 (R210 log_unifies_pairs 的偏移推广).
    ★ ② 离散偏移格满轴: {k·log c : k ∈ ℤ} — 等差格 (步长 log c),
       满轴均匀分布.
    ★ ③ ★联合多相位重合: 所有偏移族 {S_mul,k : k ∈ ℤ} 一起 —
       {log b - log x + k·log c} 是以 (log b - log x) 为中心的等差格,
       满轴多相位重合.

  formal_math: |
    -- ★偏移乘性配对: 每种 k 一个偏移:
    theorem shifted_log_pair (b x c : ℝ) (k : ℤ) (hb : 0 < b)
      (hx : 0 < x) (hc : 0 < c) :
      Real.log (c ^ k * b / x) = Real.log b - Real.log x + k * Real.log c
    -- ★离散偏移格 (等差):
    theorem offset_grid_arithmetic (c : ℝ) (k : ℤ) :
      (k + 1) * Real.log c - k * Real.log c = Real.log c
    -- ★联合多相位重合:
    theorem joint_polyphase_overlap (b x c : ℝ) (k : ℤ) (hb : 0 < b)
      (hx : 0 < x) (hc : 0 < c) :
      Real.log (c ^ k * b / x) = Real.log b - Real.log x + k * Real.log c
    -- 全景:
    theorem pair_axis_shifted_perspective (c : ℝ) (k : ℤ) :
      (k + 1) * Real.log c - k * Real.log c = Real.log c

