statement:
  informal: |
    ★ 观点提出者: 用户 (2026-08-13)。任意阶谓词逻辑的轴 (配对算子
       递归).

    ★ 唯一论点: 配对算子 T 的递归 = 谓词阶的递归 — 第 1 次产生 (R208
       一阶) → 第 2 次产生 (R212 二阶) → 第 n 次产生 (T^n 任意阶),
       对合不变式保持.

    ★ 第 1 次产生 (R208): T(x) = {x, S(x)} — 一阶谓词轴 (配对, 对和
       = b, S² = id).
    ★ 第 2 次产生 (R209-R212): T² = 组合/多相位/偏移/双重配对 — 二
       阶 (配对的配对: 每点 x 双重配对 — 对和 ∧ 对积同时守恒).
    ★ 第 n 次产生: T^n — n 阶 (配对算子迭代, 2^n 标量展开).
    ★ ★对合不变式保持: 每阶配对仍是 S² = id (周期 2 闭合递归不变).

  formal_math: |
    -- ★第 1 次产生 (一阶谓词轴):
    theorem first_order_pair_axis (b x : ℝ) : (b - x) + x = b
    -- ★第 2 次产生 (二阶谓词轴, 双重守恒):
    theorem second_order_pair_axis (b c : ℝ) (k : ℤ) (x : ℝ)
      (hx : x ≠ 0) :
      ((b - x) + x = b) ∧ ((c ^ k * b / x) * x = c ^ k * b)
    -- 配对算子保持对合 (递归不变):
    theorem pair_operator_preserves_involution (b x : ℝ) : b - (b - x) = x
    -- 全景:
    theorem predicate_axis_order_perspective (b x : ℝ) :
      ((b - x) + x = b) ∧ (b - (b - x) = x)

