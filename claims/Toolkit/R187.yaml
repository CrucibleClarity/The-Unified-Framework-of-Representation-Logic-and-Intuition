statement:
  informal: |
    ★ 观点提出者: 用户 (2026-08-13)。欧拉形式的 pat 原生证明 (基点
       跳跃策略).

    ★ 唯一论点: 欧拉形式必要条件 (n = q^α·m², q ≡ α ≡ 1 mod 4) 可用
       pat 原生结构证明: 基点跳跃链 (无穷 → 有穷 → 周期轴), 不暴力
       穷举.

    ★ 基点跳跃链:
       1. **基点 0: 奇完全数存在性 (无穷)**: ∃ n 奇, σ(n) = 2n —
          无穷搜索, 不可暴力穷举 (下界 n > 10^1500).
       2. **基点跳跃 1: v₂(σ(n)) = 1 (有穷 2-adic)**: n 奇 ⟹ 2n
          恰有一个因子 2 ⟹ v₂(2n) = v₂(2) + v₂(n) = 1 + 0 = 1 ⟹
          v₂(σ(n)) = 1 (padicValNat.mul 加性 + n 奇 ⟹ 2 ∤ n).
       3. **基点跳跃 2: 恰好一个奇指数 (欧拉 q^α)**: σ 可乘 + v₂
          加性 + σ(p^偶) 奇 (R180 sigma_prime_pow_parity) ⟹ v₂(σ(n))
          = Σ v₂(σ(p^α)) = 1 ⟹ 恰好一个素因子指数 α 为奇 (q^α),
          其余偶 (m²) — n = q^α·m².
       4. **基点跳跃 3: 模 4 周期轴 (q ≡ 1 mod 4)**: σ(q^α) =
          1+q+...+q^α 的 v₂ = 1 约束槽位: 若 q ≡ 3 (mod 4) 则
          1+q+...+q^α ≡ 1+3+1+3+... (α+1 偶项, 每对 1+3 ≡ 0 mod 4)
          ≡ 0 (mod 4) ⟹ v₂ ≥ 2 矛盾 ⟹ q ≡ 1 (mod 4). 同理 α ≡ 1
          (mod 4).

    ★ 诚实边界: 欧拉形式是必要条件 (若存在则必有此形状), 存在性
       本身未证 (OPEN) — 本文件用 pat 原生结构证明必要条件.

  formal_math: |
    -- 基点跳跃 1: v₂(σ(n)) = 1:
    theorem odd_perfect_v2_sigma_eq_one {n : ℕ} (hnodd : Odd n)
      (hperfect : σ 1 n = 2 * n) : padicValNat 2 (σ 1 n) = 1
    -- σ(p^偶) 的 v₂ = 0:
    theorem sigma_prime_pow_v2_zero_of_even {p α : ℕ} (hp : Nat.Prime p)
      (hpodd : p ≠ 2) (hαeven : Even α) : padicValNat 2 (σ 1 (p ^ α)) = 0
    -- 基点跳跃 3: q ≡ 1 (mod 4):
    theorem euler_q_mod_four {q α : ℕ} (hq : Nat.Prime q) (hqodd : q ≠ 2)
      (hαodd : Odd α) (hv2 : padicValNat 2 (σ 1 (q ^ α)) = 1) : q % 4 = 1
    -- 全景:
    theorem euler_form_pat_perspective {n : ℕ} (hnodd : Odd n)
      (hperfect : σ 1 n = 2 * n) : padicValNat 2 (σ 1 n) = 1

