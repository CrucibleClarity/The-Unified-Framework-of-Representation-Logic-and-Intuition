statement:
  informal: |
    ★ 观点提出者: 用户 (2026-08-12)。断言原文: "让我们能够无损的共轭对称一个
       周期轴和一个发散轴的时候, 压缩将永远获得无损的效果。"

    ★ 断言内容:
      设 c : D → P 是把发散轴 D 编码进周期轴 P 的压缩。若 c 是无损共轭对称
      (injective — 不同发散值映射到不同相位, 信息不合并), 则压缩永远无损:
      存在解压 d : P → D 满足 d (c x) = x (精确还原)。

    ★ 为什么共轭对称 (R047) 是正确的设置:
      在 ComplexAxis 上, 发散轴 (lift t) 与周期轴 (J) 是共轭对称
      S(z) = conj z 的两个特征空间 (R047: conj_fixes_lift 特征值 +1 /
      conj_reflects_J 特征值 -1)。S 保结构的编码 injective 恰好当它保持
      S-分解 (symmetry_decomposition) — 两轴共享基点 0 且正交
      (orthogonal_axes), 故保结构编码不会混淆两个不同的发散值。

    ★ 核心定理 (Lean 验收, LosslessCompression.lean, 无 sorry):
      ① injective_is_lossless (★核心): 任意 injective 压缩 c : D → P 无损 —
         存在解压 d : P → D, ∀ x, d (c x) = x (mathlib leftInverse_invFun:
         单射 ⟹ invFun 是左逆 ⟹ 压缩-解压往返精确)
      ② conj_bijective: 共轭对称 S 本身是双射 (involutive, 双向无损) —
         S 是联系两轴的对称, 两个方向都无损
      ③ conj_preserves_divergence: 发散分量在 S 往返中精确存活
         (proj (conj (lift (proj z))) = proj z) — 发散轴 S 不变
         (R047 conj_fixes_lift), 共轭永不损伤发散轴
      ④ compression_injective_iff_lossless (有限域锐化): 有限发散域上
         压缩无损 ⟺ 压缩 injective — 无损共轭对称恰是使压缩永远无损的条件

    ★ 机械验证 (R048_lossless_compression.py, 枚举=证据):
      1. 单射压缩 (域=相位空间): 100% 无损往返 (PASS)
      2. 碰撞压缩 (相位空间 < 域): 有损 (对照, 反例确认单射必要性)
      3. 共轭对称交换 (c∘S_D = S_P∘c): 编码保结构 (PASS)
      4. 200 组随机单射: 全部可逆 (PASS)

    ★ 与既有 claim 的关系:
      - R047 (S 特征分解): 本 claim 的前提 — 无损共轭对称 = R047 的 S 结构
      - RulerLoss (发散 = 结构丢失): 本 claim 的边界 — 压缩有损当且仅当
        编码非单射 (信息合并), 恰是结构丢失
      - RulerFold (投影/锚定): 有损 vs 无损 = 投影的选择 (R047 正交性)
      - RulerLookup (有限域函数 = 表): 有限域版本 injective ⟺ 无损 = 查表
        可逆 (表 = 双射 ⟺ 无碰撞)
      - RulerDivergence (发散 → 编码表): 表的无损性由单射保证
      结论: 压缩无损性不是魔法 — 是编码的单射性; 而单射性由 R047 的
      共轭对称特征分解保证 (两轴正交, 保结构编码不合并信息)。

    ★ 支撑 (Lean):
      - injective_is_lossless / conj_bijective / conj_preserves_divergence /
        compression_injective_iff_lossless [LosslessCompression.lean]
      - conj_involutive / conj_fixes_lift / conj_reflects_J /
        symmetry_decomposition / orthogonal_axes [DivergencePeriodSymmetry.lean]
  formal_math: |
    -- 核心定理: 单射压缩 ⟹ 无损 (存在精确解压)
    theorem injective_is_lossless {D P : Type} [Nonempty D] (c : D → P)
        (hc : Function.Injective c) :
        ∃ d : P → D, ∀ x : D, d (c x) = x
    -- S 是双射 (双向无损):
    theorem conj_bijective : Function.Bijective conj
    -- 发散分量在 S 往返中精确存活:
    theorem conj_preserves_divergence (z : ComplexAxis) :
        proj (conj (lift (proj z))) = proj z
    -- 有限域锐化: 无损 ⟺ 单射
    theorem compression_injective_iff_lossless {D P : Type} [Fintype D]
        [Fintype P] [Nonempty D] (c : D → P) :
        Function.Injective c ↔ ∃ d : P → D, ∀ x : D, d (c x) = x

