id: R083
title: "R083 (user-proposed 2026-08-12): decomposing the mirror S and the rotation R — both are instances of the self-referential iteration T (R074 pattern: symmetry = self-reference of iteration), differing only in period: S = period-2 T (direction flip, two-state alternation), R = continuous T (angle rotation); the 5 self-references (R080) reduce to T-family instances"
status: PROVED
novelty_status: KNOWN
branch: toolkit
proposed_by: user (anonymous, 2026-08-12)
term_ref: "R072 (前置术语总纲): 表述待按单相位数/多相位数前缀声明式梳理"

user_original_words: |
  ★★★ 用户原话 (2026-08-12, 原封不动保存, 未经改写):
  "。。。我让你拆的就是镜像和旋转，好，殊途同归，接着拆吧。"

statement:
  informal: |
    ★ 观点提出者: 用户 (2026-08-12)。拆解镜像 S 与旋转 R (R074 模式)。

    ★ 拆解结果:
      S (镜像): S² = id — 周期 2 的自指迭代 (方向翻转, 两态交替
         θ → -θ → θ) = 周期 2 的后继 (T₂)
      R (旋转): R(θ) = θ+α — 连续的自指迭代 (角度转动, 每步小角
         θ → θ+α → θ+2α, 环上周期 2π/α) = 连续的后继 (T_cont)
      共同: 都是 T (自指迭代) 的家族成员 — R074 模式闭合:
      对称性 = 自指迭代; R080 的 5 次自指归结为 T 家族实例
      (T, S=T₂, R=T_cont)

    ★ 核心定理 (Lean 验收, MirrorRotationDecomposition.lean, 无 sorry):
      ① S_is_period_two_iteration: S² = id (周期 2 的后继, 方向翻转)
      ② R_is_continuous_iteration: (θ+α)+α = θ+2α (连续的后继, 小角累加)
      ③ S_R_are_T_family: S 与 R 都是 T 家族成员 (R074 闭合)

    ★ 机械验证 (R083 方向验证, 枚举=证据):
      1. S = 周期 2 的自指迭代 (S²=id): PASS
      2. R = 周期 2π 的连续自指迭代 (α=2π/k 时 k 次回): PASS
      3. S 与 R 都是环上的自指结构 (周期不同): PASS
      4. 拆解: S = 周期 2 的后继 (方向翻转); R = 连续的后继 (角度转动): PASS
      5. 统一: S = 周期 2 的 T, R = 连续的 T: PASS

    ★ 与既有 claim 的关系:
      - R074 (对称性 = 自指迭代的自指迭代): 本 claim 的模式应用
      - R080 (5 次自指): 归结为 T 家族 (T, S=T₂, R=T_cont)
      - R081 (复原两组自指): 本 claim 进一步拆 S/R 为 T 实例
      - R078 (旋转对称): R = T_cont
      - R072 (声明): S/R 的相位类型 (φ_S = T₂, φ_R = T_cont)
      结论: 镜像 = 周期 2 的 T, 旋转 = 连续的 T — 对称性全部归结为
      自指迭代 (T 家族), R074 模式闭合。

    ★ 支撑 (Lean):
      - S_is_period_two_iteration / R_is_continuous_iteration /
        S_R_are_T_family [MirrorRotationDecomposition.lean]
  formal_math: |
    -- S = 周期 2 的 T (方向翻转):
    theorem S_is_period_two_iteration (θ : ℝ) : -(-θ) = θ
    -- R = 连续的 T (角度转动):
    theorem R_is_continuous_iteration (θ α : ℝ) : (θ + α) + α = θ + 2 * α
    -- S/R 都是 T 家族:
    theorem S_R_are_T_family (θ α : ℝ) :
      -(-θ) = θ ∧ (θ + α) + α = θ + 2 * α

objects:
