statement:
  informal: |
    ★ 观点提出者: 用户 (2026-08-12)。断言原文: "同一根轴, 基点在任意其他方向轴
       上移动, 无损映射、无损压缩。"

    ★ 断言内容:
      保持同一根轴 A (如发散轴 lift), 把基点从 0 移到 f — f 在任意其他方向轴
      w 上 (f = t·w, 如周期轴 J 或任意斜方向) — 轴本身的映射与压缩无损。

    ★ 机制 (全部为已证理论的直接应用):
      ① 基点移动 = 穿折越 teleport T(x) = x + (f - 0) = x + f (TK1:
         teleport e f x = (f -ᵥ e) +ᵥ x)
      ② T 双射 (逆 T⁻¹(x) = x - f) ⟹ 无损映射 — 移动后的轴与原轴同构
         (同结构, 新基点)
      ③ 移动量 Δ = f 单射编码 ⟹ 无损压缩 (R048)
      ④ 移动保轴结构: T(a₂) - T(a₁) = a₂ - a₁ (TK1: teleport 保位移)

    ★ 核心定理 (Lean 验收, BasepointMove.lean, 无 sorry):
      ① teleport_bijective: T(x) = x + f 双射 (逆 x - f) — 基点移动双向无损,
         移动后轴与原轴同构
      ② teleport_lossless: T 无损 — ∃ d, d (z + f) = z (R048 应用)
      ③ basepoint_move_preserves_structure: 移动保轴结构 — T(a₂) - T(a₁) =
         a₂ - a₁ (位移不变, 轴结构存活, 只换基点)
      ④ move_amount_lossless: 移动量 Δ 单射编码无损 (R048)
      ⑤ basepoint_move_lossless: 同一根轴基点沿任意方向轴移动无损 (核心)

    ★ 机械验证 (枚举=证据):
      1. 基点沿任意方向轴移动: teleport 可逆无损 (500 组): PASS
      2. 基点移动后相对位移保持, (基点,位移) 无损还原 (500 组): PASS
      3. 基点移动量单射编码无损: PASS
      4. 基点移动保轴结构 (差不变, 300 组): PASS

    ★ 与既有 claim 的关系:
      - TK1 (基点穿折越 teleport): 本 claim 的机制 — T 双射已证
      - R048 (单射 ⟹ 无损): 压缩机制
      - R047 (发散/周期轴对): 基点可移到周期轴 J 上 (w = J)
      - R050 (同方向迭代): 迭代差 = 基点移动的特例 (w 沿迭代方向)
      - R052 (同一基点任意方向轴): 本 claim 是"基点移动"版本 — 轴固定, 基点动
      结论: 轴固定基点动 = teleport 双射 (无损映射) + 移动量单射 (无损压缩)
      — 与 R052 (基点固定轴动) 对偶, 链条 R047-R053 全部闭合。

    ★ 支撑 (Lean):
      - teleport_bijective / teleport_lossless /
        basepoint_move_preserves_structure / move_amount_lossless /
        basepoint_move_lossless [BasepointMove.lean]
      - teleport [TK1 BasepointGen.lean]
      - injective_is_lossless [LosslessCompression.lean]
  formal_math: |
    -- teleport 双射 (基点移动可逆):
    theorem teleport_bijective (f : ComplexAxis) :
      Function.Bijective (fun z : ComplexAxis => z + f)
    -- 基点移动无损 (R048):
    theorem teleport_lossless (f : ComplexAxis) :
      ∃ d : ComplexAxis → ComplexAxis, ∀ z, d (z + f) = z
    -- 移动保轴结构 (位移不变):
    theorem basepoint_move_preserves_structure (f a₁ a₂ : ComplexAxis) :
      (a₂ + f) - (a₁ + f) = a₂ - a₁
    -- 移动量无损压缩:
    theorem move_amount_lossless {P : Type} [Nonempty ComplexAxis]
      (c : ComplexAxis → P) (hc : Function.Injective c) :
      ∃ d : P → ComplexAxis, ∀ f, d (c f) = f
    -- 核心: 同一根轴基点沿任意方向轴移动无损:
    theorem basepoint_move_lossless (f : ComplexAxis) :
      ∃ d : ComplexAxis → ComplexAxis, ∀ z, d (z + f) = z

