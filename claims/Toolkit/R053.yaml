conclusion: "用户断言成立 (2026-08-12): 同一根轴, 基点在任意其他方向轴上移动,
  无损映射 (teleport 双射, 轴与原轴同构) + 无损压缩 (移动量单射编码, R048)
  — 轴固定基点动与 R052 基点固定轴动对偶, 链条闭合。"

