    ★ 唯一论点: 对和空间 (R207) = 谓词轴空间 — 每点 x 配对 {x, S(x)},
       pat0 (0) 对偶 = b, 对合 S 联通两端 (0 ↔ b).

    ★ ① 配对结构: 每点 x 配对 {x, S(x)} (对和恒 = b, R207) — 配对
       = 谓词实例 (x 与 S(x) 是同一谓词的两端).
    ★ ② pat0 (0) 的对偶 = b: S(0) = b — {0, b} 是配对 (内部 ↔ 外部)
       — 在配对空间中, pat0 内部 (0) 的对偶 = 外部锚 (b).
    ★ ③ ★谓词轴联通: 配对结构的轴 — 轴上每点 x 与对偶 S(x) 成对,
       0 与 b 是轴的两端 (内部/外部), S² = id 闭合 (0 → b → 0) —
       重新联通 pat0 内外: 在配对空间中, 联通 = 配对关系 (对合 S).

  formal_math: |
    -- ★对和空间配对: 对和恒 = b:
    theorem pair_sum_axis (b x : ℝ) : (b - x) + x = b
    -- ★pat0 (0) 的对偶 = b:
    theorem pat0_pair_exterior (b : ℝ) : b - 0 = b
    -- ★谓词轴联通: S² = id:
    theorem predicate_axis_connect (b x : ℝ) : b - (b - x) = x
    -- 全景:
    theorem predicate_axis_perspective (b x : ℝ) :
      ((b - x) + x = b) ∧ (b - (b - x) = x)

