statement:
  informal: |
    ★ 观点提出者: 用户 (2026-08-12)。自指 = pat n, 全坍缩到 pat0。

    ★ 洞察 (验证):
      ① 自指 = pat n: p1 = p0(p0), p2 = p0(p1), ... 自指构造 = pat 序列
      ② 方向 = 互逆方向 (R121: 升/降同一箭头)
         ⟹ 循环相位无净移动 (返回 = 前进)
      ③ 归纳坍缩: p1 ≈ p0 (R120), p2 = p0(p1) ≈ p0(p0) ≈ p0, ...
         ⟹ ∀n, pat n ≈ pat 0
      ④ 嵌套自应用: pat1(pat1) ≈ p0(p0) ≈ p0, ...
         ⟹ 所有嵌套自应用投影到 pat0

    ★ 结论:
      所有 pat n 及嵌套自应用都投影到 pat0
      (基点相位叠加重合 R117 的彻底化)

    ★ 与既有 claim 的关系:
      - R121 (互逆箭头同一): 方向 = 互逆 (核心前提)
      - R120 (p0(p0)=p0): 归纳基始
      - R117 (相位重合): 彻底化 (所有 pat 投影到基点)
      - R113 (自应用构造): pat = 自指
      - R072 (声明): 全坍缩的声明化
      结论: 自指 = pat n; 方向 = 互逆 ⟹ 循环相位无净移动 ⟹
      所有 pat n 及嵌套都投影到 pat0。

  formal_math: |
    -- 自指 = pat n (p1 = p0(p0), p2 = p0(p1), ...)
    -- 方向 = 互逆 (R121) ⟹ 循环无净移动
    -- 归纳: p_{n+1} = p0(p_n) ≈ p0 ⟹ ∀n, pat n ≈ pat 0
    -- 嵌套: pat n (pat n ...) ≈ pat0 (全坍缩)

