statement:
  informal: |
    ★ 观点提出者: 用户 (2026-08-12)。Pat N 的构造定义 — R091 单相位链的
       构造性实现。

    ★ 构造 (每环锚到已证 claim):
      ① pat0 = 全向 0: 无限维基点 (R133: p0 无限维, 3 维是感知投影;
         R123: 基点 = 闭包)
      ② 每步: 从全向 0 出发, 完成一次全向 1 的构造 — 单位 1 = 全向高维球
         (R136: unit_on_surface — 单位 1 = 无限维结构表面的点, 半径 1;
         pat1_omnidirectional: ‖exp(θ·I)‖ = 1, 全向无限)
      ③ 声明相同的方向 (相位): 声明方向 (d, -d) 一次性成对 (R136 ②③);
         锁定相位 ⟹ 诱导全向 0 收敛向声明方向 (RulerPhase: 相位 = 方向;
         R132: 声明 = 选择方向)
      ④ 得到 pat2 = pat1 + d: 声明相同方向 ⟹ 链前进 (R050: 锁定方向迭代
         单射 ⟹ 不坍缩)
      ⑤ 全向 0 产生全向 0: 每个 pat n 都是全向 0 点; 相邻全向 0 之间的
         距离 = 单位 1 的全向高维球 (步长恒 = 1: ‖pat_{n+1} - pat_n‖ = 1,
         ‖d‖ = 1)
      ⑥ 声明方向 (相位) → pat1: 在单位球面上声明方向 = 跳转箭头
         (R124: p1 = p0→p0 跳转箭头; R125: 连续接通)
      ⑦ 重复 ⟹ Pat N = 等距链 (步长 1, 方向相同) = 单相位链 {n·d}
         (R091: 单相位数 = 方向 d 上标量列; R071/R072: ℙ⟨φ_T⟩ Pat)

    ★ 验证结论: Pat N 是 R091 单相位链的构造性定义 — 等距 (全向球面半径
       1) + 同向 (声明相同方向) ⟹ 等差 ⟹ 单相位; 方向锁定 ⟹ R050 单射
       ⟹ 链不坍缩 (对比 R122: 无声明 ⟹ 全坍缩到 pat0)。"声明相同的方向"
       是每步重新锚定 (R063) 的声明式选择: 每步完整构造 (全向 0 → 全向 1
       → 声明), 方向选择保持一致 — 与 R064 的"加法轴"区分: 加法轴 = 一步
       合成位移 (无中间构造), Pat N = 每步独立构造 (有中间锚)。

  formal_math: |
    -- Pat N 链: 每步声明相同方向 d (pat0 全向 0 → 全向 1 单位球面 → 声明锁定)
    def patChain (pat0 d : ℝ) : ℕ → ℝ
      | 0 => pat0
      | n + 1 => declaredSuccessor d (patChain pat0 d n)
    -- Pat n = pat0 + n·d (单相位链, R091):
    theorem pat_n_is_monophase (pat0 d : ℝ) (n : ℕ) :
      patChain pat0 d n = pat0 + (n : ℝ) * d
    -- 步长 = 单位 1 全向高维球 (‖d‖ = 1):
    theorem pat_step_unit_sphere (x d : ℝ) (hd : ‖d‖ = 1) :
      ‖(x + d) - x‖ = 1
    -- 等距链 (任意两步同长, R091 等差):
    theorem pat_chain_equidistant (x y d : ℝ) :
      ‖(x + d) - x‖ = ‖(y + d) - y‖
    -- 不坍缩 (R050 机制):
    theorem pat_chain_injective (d : ℝ) :
      Function.Injective (declaredSuccessor d)

