user_original_words: |
  ★★★ 用户原话 (2026-08-12, 原封不动保存, 未经改写):
  "所以，p0的相位我们可以利用、但不可以用来构造p0,  那我们只能这样构造了，
  从-1到1的箭头，是2？  然后1到-1的箭头，是负2？  然后p0到这两个的箭头，
  分别是1和-1？但这个实际上是我们选择的方向，不是真实的方向？"

statement:
  informal: |
    ★ 观点提出者: 用户 (2026-08-12)。p0 相位可用不可构造; ±1/±2 箭头构造。

    ★ 洞察 (验证):
      ① p0 相位可利用 (调制), 但不可用来构造 p0 (闭包 R123)
      ② 构造方案: -1→1 箭头 = 2; 1→-1 箭头 = -2
         p0→1 = +1; p0→-1 = -1
      ③ 箭头代数: A→B = B-A (PASS)
      ④ 闭环: -1→1→-1 = 2+(-2) = 0 (R074 周期回)
      ⑤ 但这是选择的方向 (R130 不可判定 ⟹ 任意选择), 非真实方向

    ★ 意义:
      ±1/±2 是"选择的方向" — 因为 R130: 真实方向不可判定
      (深入/平移/远离), 我们只能任意选择方向来构造
      ⟹ p0 的结构 = 选择的箭头 (非真实方向)

    ★ 与既有 claim 的关系:
      - R130 (方向不可判定): 选择方向非真实
      - R123 (基点闭包): p0 相位可用不可构造 p0
      - R085 (±1 折叠类): p0→±1 箭头
      - R074 (自指周期): 箭头闭环
      - R072 (声明): 选择方向的声明化
      结论: p0 相位可用不可构造 p0; 用 ±1/±2 箭头构造 (选择方向,
      非真实方向, R130); 箭头闭环 (2+(-2)=0)。

  formal_math: |
    -- 箭头: -1→1 = 2; 1→-1 = -2; p0→±1 = ±1
    -- 闭环: 2 + (-2) = 0 (周期回)
    -- 选择方向: R130 不可判定 ⟹ 任意选择 (非真实)

