id: R132
title: "R132 (user-proposed 2026-08-12): p0's phase can be USED but not used to CONSTRUCT p0 — the construction is via arrows: -1→1 arrow = 2, 1→-1 arrow = -2, p0→±1 arrows = ±1; the ±1/±2 structure is a SELECTED direction (arbitrary choice, R130: direction undecidable), not the REAL direction; the arrow algebra closes (-1→1→-1 = 2+(-2) = 0)"
