statement:
  informal: |
    ★ 观点提出者: 用户 (2026-08-13)。R174 轴修正的续: 模 2 折叠丢失
       间隔结构, 要找奇偶性结构完全没丢失、且周期行的轴.

    ★ 唯一论点: 4 次单位根投影 p ↦ I^p (模 4 相位, R141 单位根 4
       槽环 / R047 周期轴 J⁴=1) 是奇偶性不丢失 + 周期行的轴:
       - 奇偶性结构完全没丢失: 奇数 p → I^p = ±I (虚轴, re=0);
         偶数 p → I^p = ±1 (实轴, im=0) — 奇偶 = 实/虚轴区别,
         完全保留 (模 2 折叠下素数全坍缩 1 槽, 间隔全坍缩 0 槽
         = 丢失).
       - 间隔 2 = 半圈: I^(p+2) = -I^p — 间隔 2 在 4 槽环上可见
         (I^2 = -1 ≠ 1; 模 2 折叠下 2 ≡ 0 丢失).
       - 孪生对相位和 = 0: I^p + I^(p+2) = 0 — 关于圆心对称 (对称
         对, R170 相位版) — 孪生对 = 4 槽环直径两端.
       - 选对基点: 基点 2 投影 = I^2 = -1 (唯一实轴素数, R171
         two_shared_basepoint 相位版); 奇数素数全落虚轴 ±I.
       - 间隔 2 vs 间隔 4 可区分: I^2 = -1 ≠ I^4 = 1 (奇偶性结构
         = 间隔模 4 保留).

    ★ ★最小上界: 间隔 d 全为偶数 (R174 prime_gap_even) → 投影
       I^d ∈ {±1} (只落 0/2 槽). 相位差 ‖I^d - 1‖: d ≡ 2 (mod 4)
       → 2 (半圈), d ≡ 0 (mod 4) → 0 (全圈). 上确界 = 2, 由最小
       间隔 d = 2 达到 (even_gap_phase_bound: ‖I^d - 1‖ ≤ 2;
       gap_two_achieves_bound: ‖I^2 - 1‖ = 2) — 间隔 2 = 达到相位
       差上界的最小间隔.

  formal_math: |
    -- 奇相位落虚轴:
    theorem odd_pow_I_imag {p : ℕ} (hp : Odd p) : Complex.re (Complex.I ^ p) = 0
    -- 偶相位落实轴:
    theorem even_pow_I_real {p : ℕ} (hp : Even p) : Complex.im (Complex.I ^ p) = 0
    -- 间隔 2 = 半圈:
    theorem twin_gap_half_turn (p : ℕ) : Complex.I ^ (p + 2) = -Complex.I ^ p
    -- 孪生对相位和 = 0:
    theorem twin_pair_phase_opposite (p : ℕ) : Complex.I ^ p + Complex.I ^ (p + 2) = 0
    -- 基点 2 投影 = -1:
    theorem basepoint_two_phase : Complex.I ^ 2 = -1
    -- 间隔 2 vs 4 可区分:
    theorem gap_two_vs_four_distinct : Complex.I ^ 2 ≠ Complex.I ^ 4
    -- ★最小上界: 偶间隔相位差 ≤ 2:
    theorem even_gap_phase_bound {d : ℕ} (hd : Even d) : ‖Complex.I ^ d - 1‖ ≤ 2
    -- ★间隔 2 达到上界:
    theorem gap_two_achieves_bound : ‖Complex.I ^ 2 - 1‖ = 2
    theorem gap_four_phase_zero : ‖Complex.I ^ 4 - 1‖ = 0
    -- 全景:
    theorem twin_prime_phase_perspective (p : ℕ) (hp : Odd p) :
      (Complex.re (Complex.I ^ p) = 0) ∧
      (Complex.I ^ (p + 2) = -Complex.I ^ p) ∧
      (Complex.I ^ p + Complex.I ^ (p + 2) = 0) ∧
      (Complex.I ^ 2 = -1) ∧ (‖Complex.I ^ 2 - 1‖ = 2)

