statement:
  informal: |
    ★ 观点提出者: 用户 (2026-08-13)。6 视角坐标围绕基点变换 / 收敛
       到基点.

    ★ 唯一论点: ①围绕基点变换 = 视角轴旋转 (R177 机制) ②收敛到
       基点 = 收缩迭代 (R181/R188 机制) ③基点 = 6 坐标汇合点.

    ★ ① 围绕基点变换 = 视角轴旋转: R177 旋转基点 I (90°) 交换实/虚
       轴 = 交换奇偶槽. 推广: 6 视角轴围绕基点旋转 = 视角置换 σ
       (交换视角轴, 如代数↔拓扑), 坐标集合不变, 对象身份不变 (R195
       perspective_switch_identity) — 视角旋转 = 坐标置换.
    ★ ② 收敛到基点 = 收缩迭代: R181/R188 收缩 T_b(x) = b + c(x-b),
       0<c<1, 迭代 T^n(x) = b + c^n(x-b) → b. 推广: 6 个视角坐标各自
       收缩收敛到基点 b (每个坐标坍缩到基点 = 坐标的自然汇合点).
    ★ ③ 基点 = 6 视角坐标汇合点: 基点的 6 视角坐标: 形式化轴 =
       PROVED, 集合轴 = 单点集 {pat0}, 代数轴 = 平凡群, 拓扑轴 = 收
       敛极限, 序轴 = 维度格极小元, 范畴轴 = 终对象 — ★基点 = 6 坐标
       自然指向的汇合点 (每个轴坐标坍缩的目标都是基点).

  formal_math: |
    -- ① 6 视角轴围绕基点旋转 (R177 机制):
    theorem perspective_axes_rotate :
      (0 + 2) % 4 = 2 ∧ (1 + 2) % 4 = 3 ∧ (2 + 2) % 4 = 0 ∧ (3 + 2) % 4 = 1
    -- ② 6 视角坐标收敛到基点 (R181/R188 机制):
    theorem perspective_coords_converge (b c x : ℝ) (n : ℕ) :
      ((fun y : ℝ => b + c * (y - b))^[n]) x = b + c ^ n * (x - b)
    -- ③ 基点 = 6 视角坐标汇合点:
    theorem basepoint_six_coord_hub (θ : ℝ) :
      Complex.exp (θ * Complex.I) * Complex.exp (-(θ) * Complex.I) = 1
    -- 全景:
    theorem perspective_converge_perspective (b c x : ℝ) (n : ℕ) :
      ((fun y : ℝ => b + c * (y - b))^[n]) x = b + c ^ n * (x - b)

