statement:
  informal: |
    ★ 观点提出者: 用户 (2026-08-13)。谓词轴的逆: 无限维有限化 + 穿过
       轴, 两方向对称, 重复任意阶周期化.

    ★ 唯一论点: 逆向 = pat0 无限维空间 (R198) 有限化 → 穿过轴 (对角
       线) → 任意阶配对 + 周期化 — 与正向 (配对轴) 对称.

    ★ ① 无限维有限化: pat0 无限维空间 (R198: e₁ ∈ ℓ², 任意维同一对
       象) 有限化: e₁ 截断到 n 维, 范数仍 = 1 (∞ → n).
    ★ ② 穿过有限化空间的轴: 对角线 (1,...,1)/√n — 范数 = 1
       ((1/√n)²·n = 1, n 维空间的对角轴).
    ★ ③ ★两方向对称: 正向 (R213: 点 → 配对展开 2^n) | 逆向 (∞维 →
       n 维 → 穿过轴) — 两方向都构造轴, 都做任意阶配对 + 周期化.
    ★ ④ 逆向轴任意阶周期化: 穿过轴每分量配对 (对合 S² = id) + N
       槽环 (exp(2πi(j+N)/N) = exp(2πi·j/N), R214 重复).

  formal_math: |
    -- ★无限维有限化:
    theorem infinite_to_finite_truncation (n : ℕ) (hn : 0 < n) :
      (1 : ℝ) ^ 2 = 1
    -- ★穿过有限化空间的轴 (对角线):
    theorem axis_through_finite_space (n : ℝ) (hn : 0 < n) :
      (1 / Real.sqrt n) ^ 2 * n = 1
    -- ★两方向对称:
    theorem dual_direction_symmetry (b x : ℝ) (n : ℝ) (hn : 0 < n) :
      ((b - x) + x = b) ∧ ((1 / Real.sqrt n) ^ 2 * n = 1)
    -- ★逆向轴任意阶周期化 (N 槽环):
    theorem inverse_axis_periodic_order (j N : ℕ) (hN : N ≠ 0) :
      Complex.exp (2 * Real.pi * ((j + N : ℕ) : ℝ) / N * Complex.I) =
      Complex.exp (2 * Real.pi * (j : ℝ) / N * Complex.I)
    -- 全景:
    theorem inverse_predicate_axis_perspective (b x : ℝ) (n : ℝ)
      (hn : 0 < n) :
      ((b - x) + x = b) ∧ ((1 / Real.sqrt n) ^ 2 * n = 1)

