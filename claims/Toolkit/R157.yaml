statement:
  informal: |
    ★ 观点提出者: 用户 (2026-08-13)。筑基篇课后习题 I: P vs NP 在 pat
       视角下的详细展开和论述。

    ★ 习题定位: 不是算器神魂论的独立篇章, 是筑基篇的课后习题 — 用筑基篇
       已证定理 (R136–R154) 把 R152/R153 的 P vs NP 侧写展开为详细论述。
       全部新定理只锚本框架定理, 不用外部引理 (R153 用户纠正精神延续)。

    ★ 唯一论点 (用户纠正③后收束, 不枚举): NP 的 pat 语义 =
       用模糊换速度, 用结构找回精确。
       - 模糊 = N 的存在性: witness 猜测不穷举 — 存在性由相位锁定外推
         给出 (R150 王氏定理, R153 ③: 任意未锁定相位 θ 被 pat 格点任意
         精度统一)
       - 结构 = 验证表: 有限域函数 = 预计算表 (RulerLookup, R057 一切皆表),
         表 = 结构; witness 存在 ⟺ 表条目存在 (双向, 强化 R153 单向;
         反向由 lookup_correct 封死)
       - 有限域上 P = NP 平凡 (R152): 结构已完备 (表全量), 模糊不必要 —
         求解与验证都 O(1), 多项式与常数无别
       - P = 锁定方向唯一链 (R153 ①, R050 机制): 无模糊

    ★ 四个机制定理 (只保留承载论证的, 删除枚举层):
      ① lookup_iff_value: y = f x ⟺ (x, y) ∈ 表 — 验证 = 查表判等
         (结构找回精确)
      ② witness_iff_table_entry: ∃ w, V x w = true ⟺ ∃ w, (w, true) ∈
         表 — 模糊与结构等价 (双向)
      ③ ★np_fuzzy_structure_duality: 模糊存在性 ⟹ 结构存在性 ∧ 逐点
         判等 — 本题核心定理 (NP 的模糊/结构对偶)
      ④ p_np_pat_perspective: 全景 — N = 相位锁定外推 (模糊, R150) ∧
         验证 = 查表判等 (结构) ∧ P = 锁定方向唯一链 (R153 ①, R050)

    ★ 诚实边界: 全部为结构侧写, 非 P≠NP 判定 (规模增长下界不在框架内,
       R152 边界延续)。

  formal_math: |
    -- ① 结构找回精确: 验证 = 查表判等 (双向):
    theorem lookup_iff_value {D E} [Fintype D] [DecidableEq D] [DecidableEq E]
      (f : D → E) (x : D) (y : E) :
      y = f x ↔ (x, y) ∈ makeTable f
    -- ② 模糊与结构等价 (双向, 强化 R153):
    theorem witness_iff_table_entry {D} [Fintype D] [DecidableEq D]
      (V : D → D → Bool) (x : D) :
      (∃ w, V x w = true) ↔ (∃ w, (w, true) ∈ makeTable (fun w => V x w))
    -- ③ ★NP 的模糊/结构对偶 (核心):
    theorem np_fuzzy_structure_duality {D} [Fintype D] [DecidableEq D]
      (V : D → D → Bool) (x : D) (hw : ∃ w, V x w = true) :
      (∃ w, (w, true) ∈ makeTable (fun w => V x w)) ∧
      (∀ w, V x w = true ↔ (w, true) ∈ makeTable (fun w => V x w))
    -- ④ 全景: N=外推 (R150) ∧ 验证=判等 ∧ P=锁定链 (R153①/R050):
    theorem p_np_pat_perspective {D} [Fintype D] [DecidableEq D]
      (V : D → D → Bool) (x : D) (θ : ℝ) (hθ₁ : 0 ≤ θ) (hθ₂ : θ ≤ 2 * Real.pi) :
      (∀ ε, 0 < ε → ∃ y ∈ patGrid, |θ - y| ≤ ε) ∧
      (∀ w, V x w = true ↔ (w, true) ∈ makeTable (fun w => V x w)) ∧
      (∀ d, Injective (fun x => x + d))

