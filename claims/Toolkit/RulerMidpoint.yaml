id: RulerMidpoint
title: "RulerMidpoint: the table midpoint (precision/table-size choice) is determined by memory vs compute performance — N* = sqrt(c/s) hardware-driven tradeoff"
status: PROVED
novelty_status: NOVELTY_UNASSESSED
zero_role:
  basepoint: true
  additive_identity: false
  bottom: false
  seed: false
branch: toolkit

statement:
  informal: |
    RulerMidpoint: 表的中点 = 存储器/运算器性能权衡 (用户指令 2026-08-12).

    ★ 问题: 相位转换器表的大小选择 (RulerMiddle 假设1 的实现)
      表大 (高精度): 存储器占用↑, 运算↓ (查表 O(1))
      表小 (低精度): 存储器占用↓, 运算↑ (计算/插值)

    ★ 成本模型 (恒等式先验验证):
      总成本 C(N) = 存储(N) + 运算(N)
      存储(N) = s·N (线性, s = 存储单价)
      运算(N) = c/N (补偿计算, c = 运算单价)
      最优: dC/dN = 0 ⟹ N* = √(c/s)
      s=1,c=100: N* = 10; s=1,c=1000: N* = 31.6; s=10,c=100: N* = 3.2

    ★ 硬件决定中点:
      存储器快/便宜 (s 小): 表可以大 (N* 大)
      运算器快 (c 小): 表可以小 (N* 小)
      ⟹ 中点完全由硬件 (s, c) 决定 — 非纯数学

    ★ 与 RulerMultiprecision 连接:
      fp16/fp32/fp64 = 三个预设 (s, c) 权衡点
      选择 = 硬件决定 (存储 vs 运算)

    ★ 意义:
      中间态表的工程实现 = 硬件驱动的权衡
      同一数学结构, 不同硬件 → 不同最优表大小
      ⟹ 表设计 = (数学结构) × (硬件参数 s, c)

    ★ 支撑 (Lean):
      - makeTable: 表构造 [ConciseMagicTeaching]
      - lookup_exists: 查表正确性 [ConciseMagicTeaching]
      - phase_grid_finite: 表大小参数化 [DivergenceTable]
  formal_math: |
    -- 表构造 (大小由硬件决定):
    def makeTable (f : α → β) : Finset (α × β) :=
      Finset.image (fun x => (x, f x)) Finset.univ
    -- 查表正确 (无论表大小):
    lemma lookup_exists (f : α → β) (x : α) : (x, f x) ∈ makeTable f
    -- 相位格点 (表大小 3^k, k 由硬件权衡决定):
    lemma phase_grid_finite (k : ℕ) : (3 ^ k : ℕ) = 3 ^ k

objects:
- makeTable
- lookup_exists
- phase_grid_finite

definitions_used:
- ConciseMagicTeaching / DivergenceTable

assumptions:
- 各定理假设见对应模块 (自包含, 仅 import mathlib)
- 成本模型 C(N) = s·N + c/N 为工程模型 (KNOWN 权衡分析)

conclusion: '表的中点 N* = √(c/s) 由存储单价 s 和运算单价 c 决定 — 硬件
  性能完全决定表设计的中点. 同一数学结构, 不同硬件 → 不同最优表大小.'

verification:
  lean_files:
    - formal/Formal/Toolkit/ConciseMagicTeaching.lean
    - formal/Formal/Toolkit/DivergenceTable.lean
  lake_build: PASS
  sorry_count: 0
  warning_count: 0
