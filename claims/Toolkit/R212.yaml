statement:
  informal: |
    ★ 观点提出者: 用户 (2026-08-13)。谓词轴 ⊕ 偏移轴 = 偏移多重相位
       配对轴.

    ★ 唯一论点: 组合: 谓词轴 (R208 加法配对) ⊕ 偏移轴 (R211 乘性偏移
       配对) — 每点 x 双重配对, 双重守恒.

    ★ ① 谓词轴 (R208): S_pred(x) = b - x, 对和恒 = b (加法镜像).
    ★ ② 偏移轴 (R211): S_shift(x) = c^k·b/x, 对积恒 = c^k·b (乘性
       偏移镜像, 每种 k 一个偏移).
    ★ ③ ★组合: 每点 x 同时有两个配对镜像 — 加法配对 (b-x, 对和 =
       b) ∧ 乘性偏移配对 (c^k·b/x, 对积 = c^k·b) — 双重守恒: (b-x)
       + x = b ∧ (c^k·b/x)·x = c^k·b.
    ★ ④ log 统一 (R211): log(c^k·b/x) = log b - log x + k·log c =
       (加法配对 log) + 偏移.

  formal_math: |
    -- ★组合加法配对: 对和 = b:
    theorem combined_pair_sum (b x : ℝ) : (b - x) + x = b
    -- ★组合乘性偏移配对: 对积 = c^k·b:
    theorem combined_pair_shift_product (b c : ℝ) (k : ℤ) (x : ℝ)
      (hx : x ≠ 0) : (c ^ k * b / x) * x = c ^ k * b
    -- ★双重守恒:
    theorem combined_double_conservation (b c : ℝ) (k : ℤ) (x : ℝ)
      (hx : x ≠ 0) :
      ((b - x) + x = b) ∧ ((c ^ k * b / x) * x = c ^ k * b)
    -- 全景:
    theorem shifted_multi_phase_pair_perspective (b c : ℝ) (k : ℤ)
      (x : ℝ) (hx : x ≠ 0) :
      ((b - x) + x = b) ∧ ((c ^ k * b / x) * x = c ^ k * b)

