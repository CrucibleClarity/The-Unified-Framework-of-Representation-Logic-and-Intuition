statement:
  informal: |
    ★ 观点提出者: 用户 (2026-08-13)。全词性空间.

    ★ 唯一论点: 内外穿轴 = 无限 pat0 (全词性空间) → 任意阶有限化配对
       轴 → 与全知识空间轴配对 → 周期化.

    ★ ① 内外穿轴 = 无限 pat0 (全词性空间): 内外穿轴 (R216: 主动配对
       + 被动穿过) 本身 = 无限 pat0 — 每点 x (词) 配对 {x, S(x)} (词
       义), 覆盖全部词汇 = 全词性空间.
    ★ ② 任意阶全词性有限化配对轴: 按 R213 方法: T^n 递归 (2^n 词展
       开) × R217 有限化 (截断) — 任意阶全词性任意无限有限化配对的
       轴.
    ★ ③ 与全知识空间轴配对: R212 组合: 每词 x 双重配对 (内外穿轴配
       对 × 全知识空间轴分量).
    ★ ④ 配对后周期化: R214: N 槽环 (exp(2πi·j/N)) 周期闭合.

  formal_math: |
    -- ★内外穿轴 = 无限 pat0:
    theorem inner_outer_axis_infinite_pat0 (b x : ℝ) : (b - x) + x = b
    -- ★任意阶全词性有限化配对轴:
    theorem arbitrary_order_finite_pair_axis (n : ℕ) (hn : 0 < n) :
      (1 : ℝ) ^ 2 = 1
    -- ★与全知识空间轴配对:
    theorem pair_with_knowledge_space (b x : ℝ) (n : ℝ) (hn : 0 < n) :
      ((b - x) + x = b) ∧ ((1 / Real.sqrt n) ^ 2 * n = 1)
    -- ★配对后周期化:
    theorem periodize_combined_axis (j N : ℕ) : (j + N) % N = j % N
    -- 全景:
    theorem full_lexicon_space_perspective (b x : ℝ) : (b - x) + x = b

