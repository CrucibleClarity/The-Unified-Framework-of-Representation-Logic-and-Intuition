user_original_words: |
  ★★★ 用户原话 (2026-08-12, 原封不动保存, 未经改写):
  "你他妈的别写nat了好不好。咱们不用自然数了好不好，积点德，给后人留点活路，
  别再用同一个名字了好不好，谁能搞得清所指和能指的差别！这玩意叫王氏数的话
  我怕万一自己也没搞对，将来有人回来挖我坟，而且所有孩子学数学都他妈得记恨
  我一辈子。这个基点相位穿折越理论下，同轴同向的结构，本质上是相位一致对吧，
  就叫单相位数吧。然后记录，自然数的定义，在不同的语境、算符结构下，既包含
  单相位数，也包含多相位数，同时单相位数和多相位数的数值相同，位置漂移。"

statement:
  informal: |
    ★ 观点提出者: 用户 (2026-08-12)。术语确立 + 定义记录。

    ★ 术语: 单相位数 (monophase number)
      - 定义: 同轴同向的结构, 本质是相位一致 (每步方向相位相同)
      - 依据: 基点相位穿折越理论 (R063: 每步 (基点,方向) 重选; 同轴同向 =
        相位一致)
      - 替代: 不用 "nat/自然数" 作我们结构的名字 (所指/能指混淆, 用户指令:
        别再用同一个名字; 不留王氏数之名 — 怕误记招后人挖坟)

    ★ 定义记录: 自然数的定义, 在不同语境、算符结构下, 既包含单相位数,
      也包含多相位数; 单相位数与多相位数的数值相同, 位置漂移。

    ★ 数学内容 (验证):
      ① 单相位数: 同轴同向 (后继链 e → e+d → e+2d), 每步方向 d 相位一致
      ② 多相位数: 跨轴/混合构造, 每步方向相位不同
      ③ 数值相同: 合成位移相同 (单相位 e+2d vs 多相位 e+d₁+d₂ 且
         d₁+d₂=2d ⟹ 数值相同)
      ④ 位置漂移: 中间锚不同 (单相位中间锚 e+d vs 多相位 e+d₁, d≠d₁
         ⟹ 位置不同)

    ★ 机械验证 (R071_monophase_number.py, 枚举=证据):
      1. 单相位数 (后继链): 每步相位一致: PASS
      2. 多相位数 (跨轴): 相位不同: PASS
      3. 单/多相位数值相同 (合成位移相同): PASS
      4. 位置漂移: 单/多相位中间锚不同 (数值同, 位置漂移): PASS
      5. 术语: 单相位 = 同轴同向; 多相位 = 跨轴; 数值同位置漂移: PASS

    ★ 与既有 claim 的关系:
      - R063 (每步重选): 单相位数 = 每步相位一致的构造
      - R064 (后继≠加法): 单相位数 (后继轴) vs 多相位数 (加法轴合成)
      - R066 (观测): 数值观测 (同) vs 路径/方向观测 (异) — 本 claim 的
        数值同位置漂移
      - R067 (能指/所指): 不用 "nat" 名字的原因 — 所指混淆
      - C009 (Chain(e) ≅ ℕ): 表示定理 — 现改称: Chain(e) 是单相位数结构,
        ℕ 是其表示 (术语更新后: 表示目标不称 nat, 称单相位结构)
      结论: 单相位数 = 同轴同向相位一致的结构; 自然数定义含单/多相位两种;
      数值相同位置漂移。

    ★ 支撑 (Lean):
      - R063/R064/R066/R067 定理链
      - C009 NatSource (Chain/表示) — 术语待随本 claim 更新
  formal_math: |
    -- 单相位数: 同轴同向, 相位一致 (每步方向 d 相同):
    --   e ↦ e+d ↦ e+2d (中间锚 e+d, 相位 phase(d) 一致)
    -- 多相位数: 跨轴, 相位不同:
    --   e ↦ e+d₁ ↦ e+d₁+d₂ (d₁ ≠ d₂ ⟹ 相位不同)
    -- 数值相同 (合成位移相同): e+2d = e+d₁+d₂ (d₁+d₂=2d)
    -- 位置漂移 (中间锚不同): e+d ≠ e+d₁ (d≠d₁)

