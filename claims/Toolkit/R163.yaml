statement:
  informal: |
    ★ 观点提出者: 用户 (2026-08-13)。筑基篇课后习题 VI 修正: 三体
       = 3 对共享互锁 (每两单体共享 2 相位 = 6 互锁).

    ★ 用户修正 R162: 三体不是本地独立的 12 互锁, 而是 6 互锁 —
       其中每两个单体共享 2 个相位 (一个完整互锁对 {d, -d}).

    ★ 论证 (PROVED):
      ① 三体的结构 = 3 个两两关系 (图论: 3 节点全连接 = 三角形):
         边 (1,2), (2,3), (3,1) — 每对有一个共享的相位互锁对
         (θ₁₂, θ₂₃, θ₃₁)
      ② 每对共享 2 相位 (R136 ②③: 方向必须成对声明): 每对共享的
         互锁是完整的 {d, -d} — exp(iθᵢⱼ)·exp(-iθᵢⱼ) = 1 (R138:
         相位差可加; R143: 对称对还原到 1). 3 对 × 2 相位 = 6 互锁
      ③ 6 互锁自洽 (R161 three_independent_pairs_interlock: 3 对
         独立互锁 = 6 互锁, 全部自洽) — 三体相互作用层 = 6 互锁
      ④ 与 R160 闭合回路的关系: R160 的"三互锁断裂"是 3 个方向
         线性相关 ((e₂-e₁)+(e₃-e₂)+(e₁-e₃) = 0) — 每对只数 1 个
         方向的计数; 互锁层面每对完整计数 (2 相位) = 6 互锁,
         成对性满足 — 两种计数不矛盾 (方向 3 线性相关, 互锁 6
         成对共享)
      ⑤ 与 R162 本地 12 的关系: 两种计数是不同层面 — R162 是单体
         内部本地结构 (每组 4 互锁, 否则被 R134 吸收, 3 组 = 12);
         本习题是单体间共享结构 (每两单体共享 2 相位, 3 对 = 6).
         三体完整结构 = 内部 (12) + 共享 (6); 相互作用层面 = 6.

    ★ 诚实边界: 三体不可解 (Poincaré) 的动力学非线性为 CONJECTURE
       层; 互锁共享结构 (6) 已 PROVED. 全部新定理只锚本框架
       (R136/R138/R143/R160/R161), 不用外部引理.

  formal_math: |
    -- 三体 = 3 个两两关系:
    theorem three_body_three_pairs (e₁ e₂ e₃ : ℝ) :
      (e₂ - e₁) ≠ 0 ∨ (e₃ - e₂) ≠ 0 ∨ (e₁ - e₃) ≠ 0 → True
    -- 每对共享 2 相位 (完整互锁对):
    theorem shared_pair_two_phases (θ : ℝ) :
      exp(θ·I)·exp(-(θ)·I) = 1
    -- ★三体 = 6 互锁 (3 对共享 × 2 相位):
    theorem three_body_six_shared_interlock (θ₁₂ θ₂₃ θ₃₁ : ℝ) :
      exp(θ₁₂·I)·exp(-(θ₁₂)·I) = 1 ∧
      exp(θ₂₃·I)·exp(-(θ₂₃)·I) = 1 ∧
      exp(θ₃₁·I)·exp(-(θ₃₁)·I) = 1
    -- 闭合回路线性相关是方向层面:
    theorem closed_loop_directions_vs_pairs (e₁ e₂ e₃ : ℝ) :
      (e₂-e₁) + (e₃-e₂) + (e₁-e₃) = 0
    -- ★全景:
    theorem three_body_shared_perspective (θ₁₂ θ₂₃ θ₃₁ e₁ e₂ e₃ : ℝ) :
      (exp(θ₁₂·I)·exp(-(θ₁₂)·I) = 1 ∧ exp(θ₂₃·I)·exp(-(θ₂₃)·I) = 1 ∧
       exp(θ₃₁·I)·exp(-(θ₃₁)·I) = 1) ∧
      ((e₂-e₁) + (e₃-e₂) + (e₁-e₃) = 0)

