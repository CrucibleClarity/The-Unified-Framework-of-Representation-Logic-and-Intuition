  informal: |
    ★ 观点提出者: 用户 (2026-08-12)。乘法重定义 + 相位叠加 + 素数校验。

    ★ 主张内容:
      ① 需要重新定义乘法 (乘法轴 = 自指迭代的变体?)
      ② 每种算符 (加/乘/后继) 都在自然数上叠加了相位 (R072: 相位声明)
      ③ 素数 = 乘法轴没有叠上的数字 (因子集 {1,p}, 乘法轴原子)
      ④ 通过观测素数和合数在自指迭代视角下的差异, 校验拆干净没有
      ⑤ 用"数值移动位置不变" (RulerDrift delta 不变) 观测 delta,
         反推基点干净不干净

    ★ 数学内容 (验证):
      ① 素数乘法轨道: p → p² → p³ (纯幂, 单生成元)
      ② 因子集: 素数 {1,p} (无叠加), 合数有真因子 (叠加)
      ③ 自指迭代差异: T/T₂ 无差别; 乘法轴: 素数单生成元 vs 合数多生成元
      ④ delta 不变: 基点移动 e→e', v' - e' = v - e (RulerDrift)
      ⑤ 乘法 delta: log p 相对乘法基点 (1); 基点移动改变表示, delta 类不变
      ⑥ 校验方案: 素数 delta 稳定 (乘法轴未污染) vs 合数 delta 漂移
         (叠加) → 观测差异反推基点干净性

    ★ 机械验证 (R087_multiplication_phase.py, 枚举=证据):
      1. 素数乘法轨道: p→p²→p³ (纯幂): PASS
      2. 素数因子集={1,p}, 合数有真因子: PASS
      3. 自指迭代差异: T/T₂ 无差别; 乘法轴差异: PASS
      4. delta 不变 (数值移动位置不变): PASS
      5. 乘法 delta: log p 相对基点 1: PASS
      6. 校验方案: 素数 delta 稳定 vs 合数漂移: PASS

    ★ 与既有 claim 的关系:
      - RulerDrift (数值移动位置不变): delta 校验原理
      - C007 (位移空间基点无关): delta 类独立性
      - R083 (T 家族): 乘法 = 自指迭代的变体 (T_cont 缩放?)
      - R072 (声明): 算符叠加相位的声明化
      - R085/R086 (0 折叠类/自然数破缺): 基点干净性检验
      结论: 乘法需重定义 (叠加相位); 素数 = 乘法轴未叠点 (原子);
      用 delta 不变原理观测素数/合数差异, 反推基点干净性。

    ★ 支撑 (Lean):
      - RulerDrift / C007 / R083 / R085 / R086 [claim 级]
