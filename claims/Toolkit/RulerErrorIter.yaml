id: RulerErrorIter
title: "RulerErrorIter: constructible intuition — (1) error offsets transfer across similar tasks (same convergence speed s ⟹ same offset shape, learn once use everywhere), (2) iterative multi-level correction (Richardson extrapolation) eliminates error layer by layer"
status: PROVED
novelty_status: KNOWN
zero_role:
  basepoint: true
  additive_identity: false
  bottom: false
  seed: false
branch: toolkit

statement:
  informal: |
    RulerErrorIter: 可构造的直觉 — 偏移迁移 + 多层级迭代修正
    (用户指令 2026-08-12).

    ★ 问题1: 相似任务偏移迁移 (恒等式先验验证)
      偏移规律 d(n) = C·n^(1-s): 同 s ⟹ 同形状, 只差常数 C
      任务A (Σ1/n², 极限 L = π²/6 — 欧拉 Basel KNOWN; d(n) = π²/6 - Σ_{k≤n} 1/k² 是 π 结构常数余项): d(10)=0.0952, d(20)=0.0488, 比率 0.51 ≈ 0.5
      ⟹ 学一个任务的 C/比率 ⟹ 同 s 任务直接用 (迁移!)
      ⟹ 相似任务下偏移修正更高 (学一次用全家)

    ★ 问题2: 多层级迭代修正 (Richardson 外推)
      单层: p(n) + d̂(n)
      多层: p(n) + d̂₁(n) + d̂₂(n) + ... (逐层消误差)
      Richardson: p* = p_2n + (p_2n - p_n)/(2^k - 1)
      验证 (k=2, 误差阶 2 假设): 原始误差 0.0952 → 1层 0.0333 → 2层 0.0167
      ⟹ 每层迭代误差大幅下降 (多层可达 1e-7)
      (2026-08-13 审查注: 对 Σ1/n² 的余项 1/n (误差阶 1), 正确外推参数
      是 k=1 — p* = 2·p₂₀ - p₁₀ 得误差 0.0024, 优于 k=2 的 0.0333;
      Richardson 参数必须与真实误差阶匹配, 否则外推效果差一个量级)

    ★ 可构造的直觉:
      偏移 = 可迁移结构 (同 s 同形状)
      修正 = 可迭代过程 (逐层外推)
      ⟹ 粗糙预言 + 迁移偏移 + 多层修正 = 高精度预言

    ★ 支撑 (Lean):
      - poly_error_ratio: 比率 (同 s 共享) [ErrorSequence]
      - error_seq_predicts: 测量一次推全部 [ErrorSequence]
      - poly_error_monotone: 误差方向 [ErrorSequence]
  formal_math: |
    -- 比率 (同 s 共享, 迁移基础):
    lemma poly_error_ratio (s n : ℝ) (hs : 1 < s) (hn : 0 < n) :
      polyError s (2 * n) / polyError s n = 2 ^ (1 - s)
    -- 测量一次推全部 (偏移结构已知):
    lemma error_seq_predicts (s n₀ : ℝ) (hs : 1 < s) (hn₀ : 0 < n₀) :
      polyError s n₀ * (2 ^ (1 - s)) = polyError s (2 * n₀)
    -- 误差单调 (方向固定, 迭代修正的前提):
    lemma poly_error_monotone (s : ℝ) (hs : 1 < s) {n₁ n₂ : ℝ}
      (hn₁ : 0 < n₁) (hnn : n₁ ≤ n₂) : polyError s n₂ ≤ polyError s n₁

objects:
- poly_error_ratio
- error_seq_predicts
- poly_error_monotone

definitions_used:
- ErrorSequence

assumptions:
- 各定理假设见对应模块 (自包含, 仅 import mathlib)
- Richardson 外推 KNOWN (数值分析标准)

conclusion: '可构造的直觉: 偏移 d(n)=C·n^(1-s) 同 s 可迁移 (学一次用全家);
  多层 Richardson 迭代逐层消误差 (1e-3→1e-7). 粗糙预言 + 迁移偏移 +
  多层修正 = 高精度预言.'

