  ★★★ 用户原话 (2026-08-12, 原封不动保存, 未经改写):
  "哈，单相位数是天然的二进制。二进制以外的正整数都是投影结构了？"
  "记录下这个claim。然后我们就有了几个定义候选，要么是纯粹的二进制，要么是
  素数。但其实我并不想在这俩里二选一，因为这俩很可能是同一套单相位数在实数轴
  上的不同投影结构。而且说实话，我不太相信二进制，因为这里有个循环定义的问题，
  进制需要考虑幂运算啊，幂运算又是基于乘法和位序对齐的角度设计出来的，毕竟
  位序这玩意没被人搞乱过。"

statement:
  informal: |
    ★ 观点提出者: 用户 (2026-08-12)。单相位数的素数幂链定义 + 二进制批判。

    ★ 单相位数 = 素数幂链 (验证):
      ① 任意素数 p 的幂链 {p^k}: log 等差 (间隔 log p) = 单相位
      ② 二进制 {2^k}: p=2 的特例 (非唯一单相位链)
      ③ 非素数幂 (多素因子): log n = Σ k_i·log p_i = 多相位叠加
      ④ 正整数 = 素数幂单相位链的相位叠加 (算术基本定理的 log 形式)

    ★ 定义候选 (用户立场):
      候选 A: 纯粹二进制 {2^k}
      候选 B: 素数幂链 {p^k}
      用户不想二选一: 两者很可能是同一套单相位数在实数轴上的不同投影
      结构 (二进制 = 某特定投影; 素数幂 = 另一投影)

    ★ 二进制批判 (循环定义, 用户):
      进制 (位序) 需要考虑幂运算 (n 位 = 2^n)
      幂运算基于乘法 (2^k = 2·2·...·2)
      乘法又是基于位序对齐设计的 (乘法竖式/进位)
      ⟹ 二进制有循环: 位序 → 幂 → 乘法 → 位序
      位序"没被人搞乱过" = 位序概念从未被质疑/重新定义
      (与 0/1/复平面同类的未检视预设!)

    ★ 机械验证 (R097_prime_power_chain.py, 枚举=证据):
      1. 2^k 链: log 等差 (间隔 log2): PASS
      2. 3^k 链: log 等差 (间隔 log3): PASS
      3. 所有素数幂链 (2,3,5,7,11): log 等差: PASS
      4. 合数 log = 素因子相位叠加: PASS
      5. 结论: 单相位 = 素数幂链; 二进制是特例: PASS

    ★ 与既有 claim 的关系:
      - R096 (log 观测修正): 本 claim 的观测基础 (乘法 delta 单位)
      - R091 (单相位 = {n·d}): 素数幂链的 log 等差 = 单相位实例
      - R092 (正整数落投影位): 正整数 = 加法链投影
      - R072 (声明): ℙ⟨φ_p⟩{p^k} 单相位; ℙ⟨φ_2,φ_3⟩6 多相位
      - R082 (预设概念): 位序 = 未检视预设 (循环定义根源)
      结论: 单相位 = 素数幂链 {p^k} (二进制 p=2 特例); 二进制循环
      定义 (位序→幂→乘法→位序) ⟹ 不可信; 候选 = 同一结构不同投影。

    ★ 支撑 (Lean):
      - R096 / R091 / R092 / R072 [claim 级]
  formal_math: |
    -- 素数幂链: log(p^k) = k·log p (等差, 单相位)
    -- 合数: log(∏p_i^k_i) = Σ k_i·log p_i (多相位)
    -- 二进制循环: 位序 → 2^n → 乘法 → 位序

