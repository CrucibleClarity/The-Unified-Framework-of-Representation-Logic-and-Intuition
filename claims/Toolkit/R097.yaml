id: R097
title: "R097 (user-proposed 2026-08-12): the monophase number is the PRIME-POWER chain {p^k} (log-arithmetic, gap log p) — binary {2^k} is only the p=2 special case; composite numbers (multi-prime-factor) are POLYPHASE (log n = Σ k_i·log p_i, fundamental theorem of arithmetic in log form); the prime-power chains and binary are likely DIFFERENT PROJECTIONS of the SAME monophase structure onto the real axis; binary is suspect — positional notation presupposes exponentiation, which is built on multiplication and position-alignment (circular definition)"
