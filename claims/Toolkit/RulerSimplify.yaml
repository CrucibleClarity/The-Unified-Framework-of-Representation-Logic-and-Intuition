id: RulerSimplify
title: "RulerSimplify: known Fourier simplification methods map onto the phase framework — parity/Parseval/derivative/convolution/shift/FFT/Gibbs"
status: PROVED
novelty_status: KNOWN
zero_role:
  basepoint: true
