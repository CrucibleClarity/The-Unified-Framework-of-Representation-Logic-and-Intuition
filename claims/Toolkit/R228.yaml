statement:
  informal: |
    ★ 用户指令 (2026-08-14): ① 通过 DivergencePeriodGeometric (发散与周期 =
    同一反射对称性 S 的特征空间); ② 尝试 0 数字依赖证明 (箭头/范畴);
    ③ 对比各数域真实的 1 与丢失结构后的表现, 归纳出结构与信息的对称性。

    ★ 0 的数字依赖 (箭头/范畴语言):
    1. 0 = 反射 S 的不动点, 不动点集 = 实轴 — 0 依赖 S 存在 (R085 几何形式)
    2. 结构不可丢失: S 退化为 id ⟹ 1 = -1, 与 ℝ 事实矛盾
    3. 0 是互逆箭头对 (d,-d) 的中和点; 单箭头 (丢一半) 退化: d = -d ⟹ d = 0

    ★ 数域对比 (真实的 1 vs 丢失结构后):
    | 数域 | 1 的身份 | 依赖的结构 | 丢失结构后的表现 |
    |---|---|---|---|
    | ℕ | 后继链第一个 | 后继箭头 | 无后继 → 无 1 (R062) |
    | ℝ | 乘法单位 | 乘法结构 | 丢乘法 → 1 非单位, 0 是加法单位 |
    | ℂ | 乘法单位 | 乘法 + 虚轴 | 丢虚轴 → i 投影为 0 (周期丢失) |
    | ℍ | 乘法单位 | 非交换结构 | 丢非交换 → 退化 (i·j = -j·i 丢失) |

    ★ 归纳: 结构与信息的对称性 — 结构 (S 存在, 1 ≠ -1, 各域乘法单位)
    ⟺ 信息 (发散/周期/方向可区分, 各域 1 ≠ 0): 有结构 → 有信息;
    丢结构 → 坍缩/退化 → 无信息。T1 (信息 = 结构差异) 的对偶。

formal_math: |
    -- ① 0 依赖 S
    theorem zero_is_fixed : S (0, 0) = (0, 0)
    theorem fixed_set_is_real_axis (v) : S v = v ↔ v.2 = 0
    -- ② 结构不可丢失
    theorem id_symmetry_contradicts : ¬ ∃ h : ∀ v, S v = v
    -- ③ 0 依赖成对箭头 (单箭头退化)
    theorem single_arrow_collapses (d : ℝ) : d = -d → d = 0
    theorem zero_unique_reflexive (d : ℝ) : d = -d ↔ d = 0
    -- ④ 数域对比
    theorem nat_one_ne_zero / real_one_ne_zero / complex_one_ne_zero /
      quat_one_ne_zero : (1 : 数域) ≠ 0
    -- ⑤ 丢结构表现
    theorem imag_unit_projected_away : Complex.I.re = 0
    theorem quaternion_noncommutative : i·j ≠ j·i (ℍ)
    -- ⑥ 核心归纳
    theorem structure_information_symmetry : (六段合取)

objects:
- S (GeometricSynthesis)
- realAxis / imagAxis
- Quaternion ℝ

