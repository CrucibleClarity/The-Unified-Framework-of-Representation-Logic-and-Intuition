conclusion: "用户断言成立 (2026-08-14): 0 的数字定义依赖对称性 S (不动点)
  与成对箭头 (单箭头退化到 0); 各数域的 1 依赖各自的乘法/后继结构, 丢失
  结构后 1 失去身份、i 投影消失、ℍ 退化; 归纳: 结构与信息对称 —
  结构的存在 ⟺ 信息的可区分 (T1 对偶)。"

