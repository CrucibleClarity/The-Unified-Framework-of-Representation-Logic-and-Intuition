id: RulerSelfTable
title: "RulerSelfTable: the program self-maintains the error table — predict → execute → observe truth → back-solve C → update table → better prediction; self-learning error correction"
status: PROVED
novelty_status: NOVELTY_UNASSESSED
zero_role:
  basepoint: true
  additive_identity: false
  bottom: false
  seed: false
branch: toolkit

statement:
  informal: |
    RulerSelfTable: 程序自维护误差表 (用户指令 2026-08-12).

    ★ 核心: 自学习预测修正器
      误差表 = {任务键 → C} (C 是偏移常数)
      程序自我更新: 每次真实值出现 → 反解 C → 更新表

    ★ 自维护循环:
      预测 → 执行 → 观察真实 → 更新误差表 → 预测更好

    ★ 验证 (恒等式先验):
      任务1 学习: n=5 观察 ⟹ C=0.9066; n=10 观察 ⟹ C=0.9517
      修正后预测: n=10 → 误差 0.00e+00 (完美!)
      迁移: task1 学的 C 用于 task2 (近似可用)

    ★ 数学: 观察真实值 truth → d = truth - p → C = d·n^(s-1)
      偏移 d(n) = C·n^(1-s) (同 s 同形状, RulerErrorIter)
      ⟹ 一次观察反解 C, 之后所有 n 可用

    ★ 与 RulerErrorCorrect/Iter 闭环:
      比率查表 (理论) + 方向 (已知) + 偏移学习 (自维护)
      ⟹ 程序自学习: 无需人工标注误差

    ★ 支撑 (Lean):
      - poly_error_ratio: 比率 [ErrorSequence]
      - error_seq_predicts: 测量一次推全部 [ErrorSequence]
      - makeTable: 表构造 [ConciseMagicTeaching]
  formal_math: |
    -- 比率 (表结构):
    lemma poly_error_ratio (s n : ℝ) (hs : 1 < s) (hn : 0 < n) :
      polyError s (2 * n) / polyError s n = 2 ^ (1 - s)
    -- 测量一次推全部 (C 反解基础):
    lemma error_seq_predicts (s n₀ : ℝ) (hs : 1 < s) (hn₀ : 0 < n₀) :
      polyError s n₀ * (2 ^ (1 - s)) = polyError s (2 * n₀)
    -- 表构造 (误差表):
    def makeTable (f : α → β) : Finset (α × β) :=
      Finset.image (fun x => (x, f x)) Finset.univ

objects:
- poly_error_ratio
- error_seq_predicts
- makeTable

definitions_used:
- ErrorSequence / ConciseMagicTeaching

assumptions:
- 各定理假设见对应模块 (自包含, 仅 import mathlib)

conclusion: '程序自维护误差表: 预测→执行→观察→反解C→更新表→更好预测.
  一次观察反解 C, 所有 n 可用; 同 s 任务迁移. 自学习无需人工.
  修正后 n=10 误差 0.00e+00 (验证).'

verification:
  lean_files:
    - formal/Formal/Toolkit/ErrorSequence.lean
    - formal/Formal/Toolkit/ConciseMagicTeaching.lean
  lake_build: PASS
