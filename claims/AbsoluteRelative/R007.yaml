- E2 用点式 roundtrip 而非函数级 Equiv, 避免 funext (Quot.sound)
- 'E3 是 trusted vocabulary 纪律: 后续 theorem 不得利用 leaf/ruleOf 方向差异生成结构'
- 真正 emergence = 第一次出现两个无法被 equivalence/factorization 消去的 role
conclusion: 'R007 封死 R006: Derivation(R)≃R (完整等价, 强于 Nonempty 等价) + observer factorization
  显示 wrapper 零额外 observable capacity + trusted elimination 移除 Derivation 于下一阶段 trusted
  vocabulary。R005/R006 消掉一个假 distinction (Rule/Derivation-wrapper): 与 B≃(Unit→B) 擦掉
  nullary genesis presentation 同型 — presentation-equivalent 的两个 role 不允许利用语法差异生成结构。真正第一次
  emergence 留给 ''两个无法通过 equivalence/factorization 消去的 role'''
