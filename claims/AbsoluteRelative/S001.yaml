failure_modes:
- 给 Sealed 加构造器 = 破坏性措施, 三定理失效 (这正是封闭性的来源, 非缺陷)
- 定义等价于 Sealed 的类型 — 等价承认 Sealed 可被外部观测, 违反封闭, 禁止
- 用 opaque/PUnit/choice 让 L3 有内容 — 无构造器已排除
- '用 : True := trivial 当证据 — 三定理都有反事实力量 (cases s 在无构造器上闭合)'
evidence_for:
- 'no_sealed_inhabitant 零公理: rcases 拿到 s : Sealed 后 cases s 闭合 — 无构造器结构性无元素'
- 'sealed_no_data 零公理: 无字段 ⟹ 无数据位可写'
- 'sealed_unparseable 零公理: 对 Sealed 做 cases 无分支 — 无法消去/解析'
- 'l2_cannot_touch_l3: SandboxRaw 构造子 (token/pair) 不引用 Sealed'
- 'sandbox_architecture: 三层并存 — L1 有元素, L2 有元素, L3 无元素'
