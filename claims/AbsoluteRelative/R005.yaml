id: R005
title: Derivation Provenance Audit — derivability 由 audited rule set 生成, 非任意 Host
  predicate
status: OBSOLETE
novelty_status: NOVELTY_UNASSESSED
zero_role:
  basepoint: false
  additive_identity: false
  bottom: false
  seed: false
branch: absolute_relative
statement:
  informal: 'R004 后真正的 OPEN: D(o) 怎样才有资格叫 "L3 内部 derivation"? 不能靠

    Derivable : O → Prop 解决 (Host 随时可提供 D o proof)。

    R005 只研究 provenance, 不产生 first occurrence: 怎样区分 Host proof of

    D(o) 与 genuine L3 derivation of o?

    核心原则: Derivability must be generated by an audited rule set, not

    represented by an arbitrary Host predicate。

    关键预期: 初始 L3 无 rule/object/relation, 真正 derivation 必须由已有 L3

    rule 生成 ⟹ empty rule set ⟹ empty derivation set ⟹ first genuine

    occurrence 不能从普通 derivation mechanics 产生。这不是失败 — 它把问题

    压缩成: 首个 rule / 首个 derivation / 首个 occurrence 是否必须共同出现?

    (与 R055 role co-emergence 会合, 但沙箱来源干净很多。)

    '
  formal_math: "Derivation (Rule : Type) : Type where\n  leaf : Rule → Derivation\
    \ Rule    (每条 rule 是 derivation leaf; 无 first-occurrence constructor)\nno_rule_no_derivation\
    \ {Rule} : ¬Nonempty Rule ⟹ ¬Nonempty (Derivation Rule)\nsome_rule_some_derivation\
    \ : Nonempty (Derivation Unit)\nextension_rule_extension_derivation : Nonempty\
    \ (Derivation Bool)\ndistinct_rules_distinct_derivations : leaf true ≠ leaf false\n\
    derivability_depends_only_on_rule_set {Rule} :\n  (Nonempty (Derivation Rule)\
    \ → Nonempty Rule) ∧ (¬Nonempty Rule → ¬Nonempty (Derivation Rule))\nempty_rule_set_no_internal_occurrence\
    \ : ¬Nonempty (Derivation Empty)\nfirst_occurrence_requires_rule {Rule} : Nonempty\
    \ (Derivation Rule) → Nonempty Rule\n"
objects:
- Derivation
- Derivation.leaf
definitions_used:
- audited rule set
- derivation tree
- genuine L3 provenance
- role co-emergence (R055)
assumptions:
- derivation tree 的每个 constructor 必须对应此前已认证的 L3 rule (②)
- 如果当前没有 L3 rules, 则 derivation type 无 inhabitant (③)
- 增加 Host theorem/witness/registry 不能改变 derivability (④)
- 没有 first occurrence constructor (⑦)
- 初始 L3 无 rule/object/relation
- 'Derivable : O → Prop 只是接口变量, 不是 genuine provenance'
conclusion: 'R005 审计修正: no_rule_no_derivation 是可靠 sanity theorem (definition-driven,
  constructor inversion 直接结果) 非''结构性非定义驱动新结果''; first_occurrence_requires_rule 改名
  derivation_witness_requires_rule_witness (Derivation 无 conclusion/occurrence 索引,
  只证明 rule witness 被包装); 真正规则扩展 = rule_map_extends_derivation (显式映射 e:R₁→R₂ ⟹ Derivation
  R₁→Derivation R₂), Unit/Bool 反模型移入 TrustedTests; 双向 leaf/ruleOf + roundtrip + witness_existence_equiv
  (Nonempty (Derivation Rule)↔Nonempty Rule); ★R005 最准确结论: 普通 rule-generated derivation
  mechanics 不能解释 first rule 自己从哪来 — 已有 Rule⟹Derivation witness 没问题, 无 Rule→first Rule/Derivation/Occurrence
  完全 OPEN; R005 预设 Rule 先于 Derivation, 不能用于证明 co-emergence (post-rule observer model)'
known_special_cases:
- 'Rule = Empty: ¬Nonempty (Derivation Empty) — 空规则集无推导 (sanity)'
- 'Rule witness 存在 (Unit/Bool): 有推导 (反模型在 TrustedTests)'
closest_known_results:
- R004 First-Write Host Injection (HasInternalOccurrence 参数化); R006 Priority Audit
  (谁先不被公理决定, 本 claim 的后续)
literature_queries:
- derivation system rule set generated derivability
- proof provenance replayable verifier
counterexample_search:
  status: done
  search_space: Rule = Empty (无推导) vs 规则 witness 存在 (有推导); 双向 leaf/ruleOf roundtrip
  smallest_checked_size: null
  result: no_rule_no_derivation sanity 零公理; rule_map_extends_derivation 真正扩展; witness_existence_equiv
    双向
formalization:
  prover: Lean4
  file: formal/Formal/AbsoluteRelative/DerivationProvenance.lean (零 import) + TrustedTests.lean
    (Unit/Bool 反模型)
  theorem_name: AbsoluteRelative.DerivationProvenance.no_rule_no_derivation / .derivation_witness_requires_rule_witness
    / .rule_map_extends_derivation / .some_rule_some_derivation / .ruleOf / .roundtrip
    / .witness_existence_equiv / .empty_rule_set_no_internal_occurrence (已证, 无 sorry,
    全零公理, 零 import)
  status: in_progress
  sorry_free: true
failure_modes:
- 把 Derivation 写死为空 inductive (定义驱动) — 已改为规则 witness 索引
- 'Derivable : O → Prop 作为 genuine provenance (Host 可提供 proof) — 只是接口变量, OPEN'
- 给 first occurrence 补 constructor = Host 注入 — 禁止
- 用 opaque/PUnit/choice 让 derivation 凭空出现 — 禁止
evidence_for:
- 'Derivation 由规则 witness 索引: Derivation.leaf : Rule → Derivation Rule — 每个 constructor
  对应已认证 L3 rule'
- 'no_rule_no_derivation 零公理: 无规则 ⟹ 无推导 (结构性, 非定义驱动)'
- 'derivability_depends_only_on_rule_set: 派生只依赖规则集, Host 额外信息不影响'
- 'empty_rule_set_no_internal_occurrence: 无规则 ⟹ 无内部 occurrence'
- 'first_occurrence_requires_rule: 有 occurrence 必有规则 — 首个 occurrence 不能从 derivation
  mechanics 产生 (R055 会合)'
evidence_against: []
