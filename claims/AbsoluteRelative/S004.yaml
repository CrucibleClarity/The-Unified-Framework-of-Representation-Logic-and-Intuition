id: S004
title: Process–Content Non-Equivalence — 产生 1 bit 的过程 ≠ bit 承载的状态; direction 是对 bit-state
  symmetry 的破缺
status: CONJECTURE
novelty_status: NOVELTY_UNASSESSED
zero_role:
  basepoint: false
  additive_identity: false
  bottom: false
  seed: false
branch: absolute_relative
statement:
  informal: "S003 后用户分叉验证 (用户指令): \"产生 1 bit 的过程\" ≠ \"这个 bit 所承载的状态\"。\n且把 \"0→1\"\
    \ 理解成有方向过程时, 它严格比一个无标签 bit 多结构。\n\n1. 单一东西 {ω} 是 0 bit (无二选一, 无 contrast, 信息容量\
    \ 0)。\n   真正 1 bit = 两个可区别可能性 {a,b}, a≠b。\n   ⟹ first occurrence ≠ first bit;\
    \ first nonzero information =\n   first internally distinguishable alternative\
    \ space。\n2. \"0→1\" 不是 1 bit 本身: 裸 {a,b} 有交换对称 (a↔b 保持结构, Aut≅C₂);\n   有向 a⟶b\
    \ 指定 source/target, 交换得 b⟶a 是不同结构, 只剩 id。\n   ⟹ 0→1 = bit + 方向信息。\n3. 判据: 对称群。裸二元素\
    \ Aut≅C₂ (非平凡 σ(a)=b, σ(b)=a); 有向\n   transition 的保持者 h(a)=a, h(b)=b, 只剩 id。⟹\
    \ unlabelled bit ≄\n   oriented transition 作为结构。\n4. 非零信息必须存在至少两个可区别可能性。无 contrast\
    \ 无 bit。\n   first information emergence = undifferentiated → first distinguishability。\n\
    5. 首次交互才可能产生非平凡对称性 (非必然)。生成次序: first occurrence\n   → first interaction → two\
    \ distinguishable but role-equivalent\n   realizations → C₂ → symmetry breaking\
    \ → orientation。\n6. 第一 interaction 不能是箭头 (方向已产生)。应首先是无向 incidence:\n   两个 realization\
    \ 只在\"参与了同一次 interaction\"意义上出现, 交换保持\n   全部已认证事实 ⟹ 第一次真正的 C₂。\n7. Process–Content\
    \ Non-Equivalence 控制模型: UnlabelledPair (Aut≃C₂) vs\n   OrientedTransition (Aut≃1)\
    \ — direction 不属于 bit 的最小 information\n   content, 是对 bit-state symmetry 的进一步破缺。\n\
    8. first bit ≡ first nontrivial symmetry carrier (若两 realization 结构\n   等价); first\
    \ orientation = symmetry breaking of that carrier。\n"
  formal_math: "flip : Bool → Bool (false↔true, swap / C₂ 生成元)\nflip_involutive: ∀x,\
    \ flip (flip x) = x\nflip_nontrivial: flip false ≠ false\nswap_symmetry: (∀x,\
    \ flip(flip x)=x) ∧ (∃x, flip x≠x)  — Aut ⊇ {id,flip} ≅ C₂\noriented_stabilizer_identity:\
    \ ∀h, h false=false → h true=true → ∀x, h x=x\n                              —\
    \ OrientedTransition Aut ≃ {id}\nflip_breaks_orientation: flip false ≠ false \
    \ — swap 破坏方向\nsingleton_no_contrast: ∀ x y : Omega, x = y  — singleton 无 contrast\
    \ (0 bit)\ntwo_alternatives_contrast: ∃ a b : Bool, a ≠ b  — 二元素有 1 bit\nprocess_content_non_equivalence:\
    \ 无向对称(C₂) ∧ 有向退化({id}) ∧ singleton 无 contrast\nfirst_bit_is_first_symmetry_carrier:\
    \ (∃a b, a≠b) ∧ swap_symmetry\norientation_breaks_symmetry: oriented_stabilizer_identity\
    \ ∧ flip_breaks_orientation\n"
objects:
- Bool (二 realization 结构)
- flip (交换对称)
- Omega (单元素)
- oriented stabilizer
definitions_used:
- Process–Content Non-Equivalence
- Aut ≅ C₂
- Aut ≅ 1
- symmetry breaking
- contrast
- 无向 incidence
assumptions:
- Bool 作无向二 realization 结构 {a,b} (a≠b)
- 有向 transition = source/target 标定 (h false=false, h true=true)
- Omega 作单元素 {ω} (无 contrast)
- 零 import (只用 Lean 核心)
conclusion: 'Process–Content Non-Equivalence 成立: 产生 1 bit 的过程 (有向 0→1) ≠ 1 bit 承载的状态
  (无向 {a,b})。形式化: 无向二 realization 结构有非平凡交换对称 (Aut≃C₂, flip), 有向 transition 的 stabilizer
  退化到 {id} (任何保持 source/target 的自同构逐点恒等), singleton 无 contrast (0 bit)。⟹ direction
  不属于 bit 的最小 information content, 是对 bit-state symmetry 的进一步破缺 (C₂→{id})。first bit
  ≡ first nontrivial symmetry carrier (同一结构事实两种观察); first orientation = symmetry breaking
  of that carrier。真正要寻找的: 第一次 interaction 能不能在不预定义两个 index 的情况下产生一个无标签、可交换的二 realization
  structure。'
known_special_cases:
- 'singleton {ω}: 无 contrast, 0 bit, Aut 平凡'
- '二元素 {a,b}: 1 bit + C₂ 对称 (first bit ≡ first symmetry carrier)'
- '有向 a⟶b: bit + 方向, Aut 退化到 {id} (symmetry breaking)'
closest_known_results:
- S003 Index Injection Audit (back-reaction 可区分 ⟹ 预先存在 index distinction); S002 Type-Indexed
  Back-Reaction (1 bit typestate, 审计反例)
