failure_modes:
- 把 0→1 直接当 1 bit — 那是 bit + 方向 (方向预编码, S003 已证)
- 声称 first occurrence = first bit — singleton 无 contrast (0 bit), first occurrence
  ≠ first information
- 把有向 transition 当无向结构 — Aut 不同 (C₂ vs {id})
- 声称对称性必然产生 — 首次交互才可能产生非平凡对称 (非必然)
- '用 : True := trivial 当证据 — 定理有反事实力量'
evidence_for:
- 'swap_symmetry 零公理: flip 对合 + 非平凡 — 无向结构 Aut ≅ C₂'
- 'oriented_stabilizer_identity 零公理: 保持方向的自同构逐点恒等 — 有向结构 Aut ≃ {id}'
- 'singleton_no_contrast 零公理: ∀ x y : Omega, x = y — 无 contrast, 0 bit'
- 'process_content_non_equivalence 零公理: 无向对称 ∧ 有向退化 ∧ singleton 无 contrast'
- 'first_bit_is_first_symmetry_carrier 零公理: 二 realization 同时是 1 bit 空间与非平凡 C₂ 载体'
