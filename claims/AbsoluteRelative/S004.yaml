notes: '2026-08-09 用户指令 (S003 后分叉): S003 把问题逼得很尖锐 — ''产生 1 bit 的过程'' ≠ ''这个 bit 所承载的状态'';
  把 0→1 理解成有方向过程时严格比无标签 bit 多结构。① 单一东西 {ω} 甚至不是 1 bit (无二选一, 信息容量 0); 真正 bit = 两个可区别可能性
  {a,b} (a≠b); first occurrence ≠ first bit, first nonzero information = first internally
  distinguishable alternative space。② 0→1 已不是裸 bit: 无标签 {a,b} 天然有 C₂ 对称 (a↔b 保持结构),
  有向 a⟶b 指定 source/target, 交换得 b⟶a 是不同结构; 有向 transition = 二状态 distinction + orientation;
  0→1 = bit + 方向信息。③ 判据是对称群: 裸 X={a,b} 有 Aut≅C₂ (σ(a)=b, σ(b)=a), 有向 transition 的保持者
  h(a)=a, h(b)=b 只剩 id; unlabelled bit ≄ oriented transition 作为结构。④ 非零信息必须存在至少两个可区别可能性;
  无 contrast 无 bit; first information emergence = undifferentiated→first distinguishability
  (比''首个 object''更基础)。⑤ 首次交互才可能产生非平凡对称性 (非必然); 生成次序: first occurrence→first interaction→two
  distinguishable but role-equivalent realizations→C₂→symmetry breaking→orientation。⑥
  第一 interaction 不能是箭头 (方向已产生); 应首先是无向 incidence — 两个 realization 只在''参与了同一次 interaction''意义上出现,
  交换保持全部已认证事实 ⟹ 第一次真正 C₂; 把其中一个解释成 source/target 才是 symmetry breaking。⑦ S003 更强后续:
  Process–Content Non-Equivalence — 证 UnlabelledPair (Aut≃C₂) vs OrientedTransition
  (Aut≃1), 形式化 direction 不属于 bit 的最小 information content。⑧ first bit ≡ first nontrivial
  symmetry carrier (若两 realization 结构等价), first orientation = symmetry breaking of
  that carrier。整理链: first occurrence≠first information; first nonzero information
  = first distinguishable alternative space; 若两 realization 结构等价则 first bit ≡ first
  nontrivial symmetry carrier; first orientation = symmetry breaking of that carrier
  — 比 ''0→1 就产生 1 bit'' 干净。S003 已证任何把首次变化直接写成 0→1 的模型都把 bit 和方向提前写进去; 真正该寻找的是第一次 interaction
  能否在不预定义两个 index 的情况下产生无标签可交换的二 realization structure。 [2026-08-09 S005 概念修正: ① bit
  carrier ≠ bit value — S004 拿来与有向过程比较的是裸二元素 carrier (1-bit capacity), 不是 bit 实际承载内容
  (internally distinguishable bit value, 需 ∃O, O a≠O b); ② first bit ≡ first nontrivial
  symmetry carrier 太强, 改 first binary carrier ≈ first candidate carrier of nontrivial
  symmetry (S005); ③ 两个 symmetric realizations 未必有内部 1 bit (全 invariant ⟹ 无内部区分, S005
  transitive_invariant_no_distinction); ④ 生成顺序修正: occurrence→interaction→symmetric
  binary carrier→internal distinction→bit value/orientation; ⑤ S004 的 flip_involutive/flip_nontrivial
  只证存在非平凡 involutive symmetry, 未证完整 Aut(Bool)≅C₂ — S005 bool_automorphism_classification
  已补 (Aut(Bool)={id,flip}); ledger 写: unlabelled two-state carrier admits a nontrivial
  C₂-symmetry; fixing source/target kills that symmetry; ⑥ Pointed ≃ Orientation (S005
  pointing_equiv_orientation) 在已存在二元素 carrier 上成立, 但 carrier 已先存在, 不能解释第一 pair 来源。]'
