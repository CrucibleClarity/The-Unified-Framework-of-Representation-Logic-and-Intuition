statement:
  informal: "R005 预设 Rule 先于 Derivation (leaf : Rule → Derivation Rule 构造层明确\nRule⟶Derivation),\
    \ 不能用于证明 co-emergence。R006 修正定位为清场结果\n(用户评审 2026-08-09): 不是 rule/derivation co-emergence\
    \ 的证据。\n\n① 当前真正证明的是: Derivation Rule 没增加信息 (zero-information wrapper)。\n   Derivation(R)\
    \ ≃ R (R007 E1 完整等价, 比 Nonempty 等价强得多)。\n   当前 Derivation: 无 premises / 无 conclusion\
    \ / 无 occurrence /\n   无 proof tree / 无多步 composition; 只是 Rule 的 zero-information\
    \ wrapper。\n② \"谁先不被公理决定\" 说得太强: Rule→Derivation 与 Derivation→Rule 不是\n   两个独立模型,\
    \ 是同一个 datatype 的 constructor 和 destructor —\n   forward/reverse 是同一份 datum 的两种读取方向。\n\
    \   能证明: Rule→Derivation 箭头没增加信息, 不能被解释成 genuine genesis。\n   不能证明: 在真正同时拥有 rule/derivation\
    \ 两个独立 role 的理论里,\n   二者优先级具有 model-theoretic independence。\n③ \"priority\" 目前根本还不是内部可表达命题:\
    \ signature 中没有\n   Prior(Rule,Derivation), 没有时间, 没有 dependency order, 没有\n  \
    \ genesis relation。与其说 priority=false / undecidable, 更准确是:\n   priority 目前不属于\
    \ object theory 的 vocabulary。\n   Host 看见 constructor leaf : Rule → Derivation\
    \ Rule 自然读成 \"Rule 先\",\n   但 R006 证明了这个方向可以通过 equivalence 擦掉。\n   最强结论: R005\
    \ 中的 Rule-first orientation 是可消去的 presentation artifact。\n④ Occurrence 完全没有进入\
    \ R006:\n   ledger: \"Rule/Derivation representation collapse 已证\" +\n       \
    \    \"Rule/Derivation/Occurrence co-emergence 仍完全 OPEN\"。\n"
  formal_math: 'Derivation (Rule) : leaf : Rule → Derivation Rule   (R005, 复用)

    ruleOf : Derivation Rule → Rule                     (destructor, 同一 inductive
    给出)

    roundtrip {Rule} (r) : ruleOf (Derivation.leaf r) = r

    same_datum_two_readings: (∀r, Nonempty (Derivation Rule)) ∧ (∀d, ∃r, ruleOf d
    = r)

    witness_existence_equiv: Nonempty (Derivation Rule) ↔ Nonempty Rule

    priority_audit_conclusion: roundtrip ∧ witness_existence_equiv

    完整等价 Derivation(R) ≃ R 见 R007 E1 (derivationEquivRule)。

    '
