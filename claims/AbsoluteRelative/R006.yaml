assumptions:
- 'R005 的 leaf : Rule → Derivation Rule 是 representation 预设, 非 emergence theorem'
- 同一 inductive 同时给出 constructor (leaf) 与 destructor (ruleOf), 无 canonical 第一性
- forward/reverse 是同一份 datum 的两种读取方向, 非两个独立模型
- priority 目前不属于 object theory 的 vocabulary (signature 无 Prior / 时间 / 依赖序 / genesis
  relation)
- Occurrence 未进入 R006 (无 datatype / 无 interpretation / 无与 Derivation 的关系)
- 不生产 derivation system (避免引入 Rule/Judgment/premise/conclusion/arity/direction/ordering)
conclusion: 'R006 是清场结果: Rule/Derivation representation collapse 已证 (双向 leaf/ruleOf
  + roundtrip + 中性观察 witness_existence_equiv 不可区分; 完整等价 Derivation(R)≃R 见 R007 E1)。最强结论:
  R005 中的 Rule-first orientation 是可消去的 presentation artifact — Host 读 constructor
  读成 ''Rule 先'' 是表示幻觉, 该方向可被 equivalence 擦掉。不能宣称: 两个独立 role 的 model-theoretic independence,
  或 co-emergence。''Rule/Derivation/Occurrence co-emergence 仍完全 OPEN'' — Occurrence
  未进入本 audit。下一步研究问题不叫 ''first validity structure'' (validity 已偷偏向 rule/derivation
  语义), 改叫: 能否出现第一个 non-contractible、representation-independent internal structure
  X (暂只叫 X, 不叫 Rule/Object/Relation/Derivation/Occurrence/Validity)'
