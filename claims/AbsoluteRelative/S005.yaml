failure_modes:
  - "声称两个 symmetric realization 已有内部 1 bit — 无: 全 invariant ⟹ 无内部区分"
  - "声称 first bit ≡ first nontrivial symmetry carrier — 太强: 应为 first binary carrier ≈ first candidate carrier of nontrivial symmetry"
  - "声称完整 Aut(Bool) ≅ C₂ 未证 — 本文件已补分类 (bool_automorphism_classification)"
  - "用 : True := trivial 当证据 — 核心定理有反事实力量"
