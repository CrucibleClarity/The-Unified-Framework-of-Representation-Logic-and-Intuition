id: S005
title: "Symmetry / Information Separation Audit — transitive symmetry + invariant observation ⟹ no internal distinction; bit carrier ≠ bit value"
status: CONJECTURE
novelty_status: NOVELTY_UNASSESSED
zero_role:
  basepoint: false
  additive_identity: false
  bottom: false
  seed: false
branch: absolute_relative

statement:
  informal: |
    S004 概念修正后 (用户指令): bit carrier ≠ bit value。拆三层:
      ① raw multiplicity:        两个 realization 存在 (a ≠ b) — Host 视角的两种可能性
      ② symmetric binary capacity: 无标签二元素 carrier, 交换保持结构 (Aut ≃ C₂),
                                  未选中任何值 ⟹ 1-bit capacity 而非 bit value
      ③ internally distinguishable bit value: 存在内部 observable O, O a ≠ O b

    核心定理: transitive symmetry + invariant observation ⟹ no internal
    distinction。若一个 group 对两个 realization 传递作用 (swap 可互相到达),
    而所有内部 observable 都 invariant (O(flip x) = O x), 则所有 observable
    在两个 realization 上取相同结果 ⟹ 内部无区分。⟹ 对称 carrier 本身不是
    bit value。

    关键张力: 两 realization 完全 role-equivalent (a↔b) ⟹ 有 symmetry 但内部
    无法说自己现在是 a 还是 b; 内部首次获得 observable (O a ≠ O b) ⟹ 真正
    binary information 出现, 但此时 a↔b 已不保持全部结构。
    ⟹ accessible bit value 的产生本身就是 symmetry breaking。

    生成顺序 (用户指令):
      occurrence → interaction → symmetric binary carrier → internal
      distinction → bit value / orientation
    这比 "first bit ≡ first C₂" 干净。

    技术修正 (用户指令): S004 的 flip_involutive/flip_nontrivial 只证存在
    非平凡 involutive symmetry, 没证完整 Aut(Bool) ≅ C₂ (需分类所有
    automorphism 为 id 或 flip)。ledger 写: unlabelled two-state carrier
    admits a nontrivial C₂-symmetry; fixing source/target kills that symmetry。
    本文件补完整分类 bool_automorphism_classification。

    Pointed ≃ Orientation (待测): 在已存在二元素 carrier 上, 选 bit value
    (pointed) 与选 source (orientation) 都是二选一, 都把 C₂ 压到 {id}。
    形式化: Pointed ≃ OrientedPair (对 Bool)。但二元素 carrier 已先存在,
    此等价不能解释"第一 pair 从哪里来"。
  formal_math: |
    flip : Bool → Bool (false↔true)
    raw_multiplicity: ∃ a b : Bool, a ≠ b
    swap_involutive: ∀x, flip (flip x) = x
    swap_transitive: ∀x y, x = y ∨ flip x = y
    symmetric_capacity: (∀x, flip(flip x)=x) ∧ (∀x y, x=y ∨ flip x=y) ∧ (∃x, flip x≠x)
    transitive_invariant_no_distinction {V} (O) (hinv: ∀x, O(flip x)=O x): ∀x y, O x = O y
    symmetry_carrier_is_not_bit_value: swap_transitive ∧ (∀O, invariant ⟹ 无内部区分)
    distinguishability_breaks_symmetry: O false ≠ O true ⟹ O (flip true) ≠ O true
    OrientedPair (source ≠ target)
    pointedOrientationEquiv : Bijection Bool OrientedPair (Pointed ≃ Orientation)
    bool_automorphism_classification: 满射 h ⟹ (∀x, h x=x) ∨ (∀x, h x=flip x) — Aut(Bool) ≅ C₂

objects: ["Bool (二 realization 结构)", "flip (swap)", "observable O", "OrientedPair", "Pointed", "subsingleton invariant observation"]
definitions_used: ["raw multiplicity", "symmetric binary capacity", "internally distinguishable bit value", "observational equivalence", "transitive symmetry", "symmetry breaking", "bit carrier ≠ bit value"]

assumptions:
  - "Bool 作二 realization 结构 (raw multiplicity)"
  - "swap 传递 + 对合 = symmetric binary capacity"
  - "observable invariant ⟹ 无内部区分 (核心)"
  - "zero import (仅 BoundaryGenesis 的 Bijection, 零公理)"
conclusion: "三层概念严格不同: raw multiplicity (∃a≠b) ≠ symmetric binary capacity (传递 swap, 1-bit capacity 非 bit value) ≠ internally distinguishable bit value (∃O, O a≠O b)。核心: 传递对称 + 全 observable invariant ⟹ 无内部区分 — 对称 carrier 本身不是 bit value。可区分 ⟹ symmetry breaking (internal_distinction_is_symmetry_breaking)。Pointed ≃ Orientation (在已存在二元素 carrier 上, 同一 binary choice)。完整分类 Aut(Bool) ≅ C₂ (补 S004 声称)。生成顺序: occurrence → interaction → symmetric binary carrier → internal distinction → bit value / orientation。"

known_special_cases:
