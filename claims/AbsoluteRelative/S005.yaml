next_action: "S005 完成: 三层概念分离 (raw multiplicity / symmetric capacity / internal bit value) + 核心定理 (传递对称 + invariant ⟹ 无内部区分) + Pointed ≃ Orientation + Aut(Bool) ≅ C₂ 分类。真正要寻找的 (用户指令): 第一次 interaction 能不能在不预定义两个 index 的情况下产生一个无标签、可交换的二 realization structure (symmetric binary carrier) — 这是 emergence 的真正候选, 尚未形式化。下一步 (用户判断): ① 建模无向 incidence (两 realization 只在'参与同一次 interaction'意义上出现, 交换保持全部已认证事实) ② 或证明完整生成次序 (occurrence→interaction→symmetric binary carrier→internal distinction→bit value/orientation) ③ 或 lean4checker 验证 + Agda 第二实现。"

notes: "2026-08-09 用户评审 (S004 概念混淆修正): ① bit carrier ≠ bit value — S004 拿来与有向过程比较的是裸二元素 carrier, 不是 bit 实际承载内容。② 拆三层: raw multiplicity (∃a≠b) / symmetric binary capacity (无标签 carrier, Aut≃C₂, 1-bit capacity 非 bit value) / internally distinguishable bit value (∃O, O a≠O b)。③ 更重要: 两个 symmetric realizations 未必有内部 1 bit — 若所有内部 observable 保持 swap symmetry (O a=O b), 内部根本区分不了; 定义 observational equivalence x~y ⟺ ∀O, O x=O y, 即使 Host 看见 |X|=2, 内部可能只有 |X/~|=1; two realizations ≠ one internally accessible bit。④ first bit ≡ first nontrivial symmetry carrier 太强, 改 first binary carrier ≈ first candidate carrier of nontrivial symmetry; 真正内部 bit 要求内部出现两个 observational classes。⑤ 张力: 完全 role-equivalent (a↔b) ⟹ 有 symmetry 但内部无法说自己是 a 还是 b; 内部首次获得 observable (O a≠O b) ⟹ binary information 出现但 swap 已不保持全部结构; accessible bit value 的产生本身就是 symmetry breaking。⑥ 生成顺序: occurrence→interaction→symmetric binary carrier→internal distinction→bit value/orientation (比 first bit≡first C₂ 干净)。⑦ S004 Lean 两处降级: flip_involutive/flip_nontrivial 只证存在非平凡 involutive symmetry, 未证 Aut(Bool)≅C₂ (需分类所有 automorphism 为 id 或 flip) — S005 已补; oriented_stabilizer_identity 充分 (fixing source/target kills swap symmetry)。ledger 写: unlabelled two-state carrier admits a nontrivial C₂-symmetry; fixing source/target kills that symmetry。⑧ 下一步 S005 Symmetry / Information Separation Audit, 验证 raw multiplicity / symmetric binary capacity / internally distinguishable bit value 严格不同; 核心 theorem: transitive symmetry + invariant observation ⟹ no internal distinction (group 对两 realization 传递作用 + 全 observable invariant ⟹ 所有 observable 在两 realization 取相同结果); 再测 chosen point ≃ orientation 在已存在二元素 carrier 上是否真等价 — 若成立, '0→1 的方向' 与 'bit 具体取值' 是同一次 symmetry breaking 的两种 presentation, 真正不等价的是它们和那个未选边的 symmetric binary carrier。"
