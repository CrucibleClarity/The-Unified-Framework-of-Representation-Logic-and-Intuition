notes: '2026-08-09 用户指令 (S001 后): 真正架构 L0⊃L1⊃L2⊃L3|L4。关键变化: 首次写入不是 L4 内部 operation,
  而是 L3→L4 的边界事件。① 解决根本错误: 之前混层 (L3∅→L3ω 需问怎么存/读/parse/equality/stage — 问题本身就说明混层);
  下沉到 L4 后 write/direction/measurement 都属 L3, L4 不需要拥有这些, 甚至不需要知道''我被写过''。② L3 不需要''读取
  L4'': 只观察自己执行跨边界动作后自身变化 (比较 L3_before 与 L3_after), 不可消去变化 = boundary back-reaction,
  无 read:L4→L3 通道。③ 关键限制: 不能自动声称''L3 变化映射 L4 内容'' — residual τ 最多是 L3-side residual,
  要得 τ=L4 content 编码需另证 L4₁≠L4₂⟹τ₁≠τ₂ (injective)。④ L4 首次写入前甚至不是 Lean State: 只作为''被侵入目标位置''存在于
  L3 边界协议; 首次写入是 signature extension Σ∅⇝Σ₁ (对象语言第一次扩张, 非修改 runtime value)。⑤ 破坏性写入更易定义:
  改变 L4 可接受结构的 signature 本身, 一旦发生不能假装没发生。⑥ L3 真正角色是 transducer (proposal→boundary
  intervention→L3-side residual), 不是 sandbox。⑦ 实验 cut: L3=允许有结构的测量仪器, L4=被研究的绝对对象;
  观察者结构不得免费成为被观察对象结构; 接受此 cut 无需 L5。⑧ 首次 relation 存在于 L3|L4 boundary (e:L3⇝L4), 不能因此声称
  L4 内已有 relation; 若 L4 内部首次出现 relation 必须证明是 boundary coupling 的不可避免 consequence。⑨
  下一步完全换成 Boundary-Genesis Audit, 不再构造 L4State/Occurrence/Stage/Content, 只研究抽象一次性
  intervention I:L3⇝L4, 验证五条 (No read channel / No L4 parser / residual minimality
  / No automatic reflection / Boundary effect criterion)。 [2026-08-09 用户评审修正: ① intervene
  原实现 (_c↦{fired:=true}) 没作用到 L4, L4 没出现在类型里, back-reaction 只因写死 fired 成立 — 改为索引类型
  L3Config:Bool→Type + intervene:L3Config false→L3Config true, residual 由类型结构保证; ②
  capability 层是描述性非 enforcement, 任何代码可直接调 intervene — 诚实标注; ③ one-time 原未实现 (可无限调用)
  — 索引类型使连调不可表达; ④ residual_minimality 名不副实 (extensional 是前提, 类型无 provenance) — 改名
  residual_respects_extensional_equality; ⑤ 编号漂移 (综合定理把④从 No automatic reflection
  变 back-reaction) — 修正: 综合只证 ③+back-reaction, ④⑤ 未证; ⑥ Sandbox.lean 整体退役 (见 S001):
  Sealed 无 inhabitant≠无 eliminator, sealed_no_data 伪强, SandboxRaw 预装结构, L2/L3 兄弟 namespace,
  addConstructor 是 meta 叙述。] [2026-08-09 S003 用户评审 (最终定位): ① S002 没消除 fired, 只是从 value
  层搬到 type-index 层 — Bool→false/true 已把结论写进模型, intervene 是规定 ''合法 intervene 必须从 false
  fiber 去 true fiber'' 不是发现''侵入→不可逆变化''; ② 审计证书 Σ b, L3Config b ≃ Bool Lean 通过 — S002
  完整 state 恰好 1 bit, 是 Host 预置一比特 typestate 然后翻转; ③ back_reaction_structural 是 representation-driven
  (结构性强制≠结构自然涌现, 结构是 Host 给的); ④ forget_discards_residual 基本是 codomain 写死; ⑤ no_l4_parser
  可保留 (L4 没进语言) 但模型预置 L3 two-state observation; ⑥ 定位: Type-Indexed Back-Reaction Control
  Model, 不删 (好审计反例), 加上 Σ L3Config ≃ Bool 作审计证书; ⑦ 真正下一步 S003 Index Injection Audit。]'
