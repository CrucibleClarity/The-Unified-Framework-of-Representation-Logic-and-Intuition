statement:
  informal: '新分支 (R059 后): 在 Lean 内构造三层沙箱 (Lean Host ⊃ Audit Kernel ⊃ Pure Sandbox),

    把真正的 Pure {} 实验迁到 L2 (deep-embedded 对象语言, 实验对象看不到 Lean 的

    Type/Prop/function/relation)。核心目标不变: 研究 pre-distinction {} 的第一种

    distinction 如何/是否出现, 但改为 capability-monotonic 实验 — L2 每次能力升级

    必须有 machine-checkable certificate, 没有证书的能力 L2 拿不到。

    本 claim = R001: 搭完整 L2 microkernel + 迁移 R037 (weak_no_go) 作为第一个

    L2 内表达并验证的定理。

    '
  formal_math: "L2 对象语言 PureRaw (deep embedding):\n  atom | merge | app | eq | rel\
    \    (app/eq/rel 是语法节点, 非 Lean 能力)\nCapability-Stage: stage0 (atom/merge) ⊂ stage1\
    \ (+app) ⊂ stage2 (+eq) ⊂ stage3 (+rel)\nChecker: isStage0Raw : PureRaw → Bool\
    \ (L1 外部判定, L2 内部不可见)\nCertificate: stage0→stage1 需 EmergenceClaim 证明 (当前未证明,\
    \ 无法升级)\n迁移测试: R037 weak_no_go 的 L2 表达 (S : B→B, S b = b 在等变下) 含\n  app 节点 (stage1)\
    \ + eq 节点 (stage2) ⟹ R037 不是 stage0 可表达 ⟹\n  R037 是 post-relation 结果, 需要 L2 能力升级\n"
