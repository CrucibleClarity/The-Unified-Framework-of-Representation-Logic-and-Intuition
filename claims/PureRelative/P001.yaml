statement:
  informal: |
    现有 λ 核不干净: 即便允许 self-application (λx.xx), 仍预设两层外部机制
    ① λ abstraction 作为语法机制 (不是 term 中的 base), ② Apply 作为
    B×B→B primitive。写作 lambda(base,base) 显式化 "存在独立于 base 的
    lambda 角色", 与 Church numeral 预设 (n,f,x 三角色 + fⁿ 迭代元记号)
    同类不干净。设计目标 base(base,base): 同一 primitive 占据 operator /
    operand / basepoint 位置, operator/operand/result 是对象在关系中的 role,
    非 object type。本 claim 记录 pure-relative 方向的二元地基层 + 自交互 (已实现)。
  formal_math: |
    PureBase := { B : Type u; Rel : B → B → Prop; symm : Rel a b → Rel b a }
    View M := { base : M.B };  zeroOf(v) := v.base
    neighborhood(v,b) := Rel v.base b
    IsRelAutomorphism T := injective ∧ surjective ∧ Rel-preserving
    RelClosed(e,C) := e ∈ C ∧ ∀ {a b}, b ∈ C → Rel a b → a ∈ C
    Chain(e) := ⋂ {C | RelClosed e C}
    SelfBase := { B : Type u; interact : B → B → B; comm : interact a b = interact b a }
    base_self a := interact a a          (base(base,base) 物化)
    base_self_self a := base_self (base_self a)
    SelfClosed(e,C) := e ∈ C ∧ ∀ x, x ∈ C → base_self x ∈ C
    SelfChain(e) := ⋂ {C | SelfClosed e C}
    定理: chain_teleport (T 保 Rel ∧ T e = f ⟹ T '' Chain e = Chain f)
          selfChain_teleport (T 保 interact ∧ T e = f ⟹ T '' SelfChain e = SelfChain f)
    负结果: AbsolutelyBare = { B : Type u } (仅 equality) 无结构 ⟹ 无非平凡 arithmetic

objects: ["B : Type u", "Rel : B → B → Prop", "symm", "View M", "zeroOf", "neighborhood", "IsRelAutomorphism", "RelClosed", "Chain", "SelfBase", "interact", "base_self", "base_self_self", "SelfChain", "SelfRef", "inv", "PermSet", "orientationFiber", "realizes", "SelfClosure", "IsEquivariant", "IsSymmetricState", "AbsolutelyBare"]
